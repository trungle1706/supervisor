# Starter template of the agent factory (WP-F2) for the supply_chain dimension. The checklist follows
# docs/phase12/research/regulation-structure.md section 2. It is a starting point for the owner
# group, not legal advice (bank counsel confirms). Strict keys: supervisor.factory.templates.
template_id: supply_chain
version: 1
label_en: Supply chain assessment
name: Supply chain assessment agent
description: 'Assesses supply chain risk of one AI system: libraries, datasets, pre-trained models, component
  inventory and integrity.'
owner_group: platform
dimension_id: supply_chain
policy_refs:
- doc_id: VN-TT53-2026
  source: regkb
  version: 1
  sections:
  - Art.14(3)(g)
  - Art.19(1)
  - Art.19(2)
  - Art.19(3)
  - Art.19(5)
checklist:
- id: SC-01
  question: Is there a component inventory of libraries, datasets and pre-trained models?
  evidence:
  - fact
  - system_record
  severity: high
  pass_rule: Model, dataset and tool facts are all in the inventory (Art.19(2)).
- id: SC-02
  question: Is the integrity of each external component checked (hash or signature)?
  evidence:
  - system_record
  - fact
  severity: high
  pass_rule: A control names the integrity check (Art.19(3)).
- id: SC-03
  question: Was the component list reviewed in the last twelve months for a high-risk system?
  evidence:
  - system_record
  severity: medium
  pass_rule: The review date is within 365 days (Art.19(5)).
- id: SC-04
  question: Are pre-trained models taken only from approved sources?
  evidence:
  - fact
  - system_record
  severity: medium
  pass_rule: Each model fact names an approved source.
evidence_rules:
  allowed_sources:
  - fact
  - regkb
  - system_record
  must_cite: true
  max_age_days: 365
tools:
- tool_id: read_facts
  mode: read
  scope: system:own
- tool_id: read_regkb
  mode: read
  scope: regkb:VN-TT53-2026
- tool_id: read_system_record
  mode: read
instructions: Answer each checklist item (SC-01, SC-02, SC-03, SC-04) from the evidence only. Cite the
  evidence for every pass or fail. Use question when the evidence is missing. Give a short reason for
  each answer.
harness:
  context:
    sources:
    - facts_v1
    - system_record
    - regkb_rows
    budget_tokens: 12000
    max_document_chars: 8000
  memory:
    system_memory: false
  hitl:
    approval_points:
    - kind: verdict
      ref: question
    permissions: []
  verification:
    verifier: rules
    validators: []
  loop:
    mode: single_pass
guardians:
- pii_mask_v2
- tool_scope_guard
- citation_required
eval_pack: supply-chain-golden-v1
