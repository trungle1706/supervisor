# Starter template of the agent factory (WP-F2) for the ethics dimension. The checklist follows
# docs/phase12/research/regulation-structure.md section 2. It is a starting point for the owner
# group, not legal advice (bank counsel confirms). Strict keys: supervisor.factory.templates.
template_id: ethics
version: 1
label_en: Ethics and bias assessment
name: Ethics and bias assessment agent
description: 'Assesses ethics risk of one AI system: data, model and operational bias, vulnerable groups,
  fairness, transparency and discrimination.'
owner_group: ethics
dimension_id: ethics
policy_refs:
- doc_id: VN-TT53-2026
  source: regkb
  version: 1
  sections:
  - Art.14(3)(dd)
  - Art.17(1)
  - Art.17(2)
  - Art.13(1)(b)
checklist:
- id: ET-01
  question: Are data bias, model bias and operational bias each considered in a document?
  evidence:
  - document
  - system_record
  severity: high
  pass_rule: A document addresses all three kinds of bias (Art.17(1)).
- id: ET-02
  question: Are vulnerable customer groups identified and their treatment described?
  evidence:
  - document
  severity: high
  pass_rule: Vulnerable groups are named and a safeguard is described.
- id: ET-03
  question: Is the risk of discrimination assessed for decisions about customers?
  evidence:
  - document
  - system_record
  severity: high
  pass_rule: An assessment of discrimination risk exists for each customer-facing decision.
- id: ET-04
  question: Can a customer get an explanation or a human review of a decision?
  evidence:
  - system_record
  - fact
  severity: medium
  pass_rule: A human approval point fact or a record field provides review.
evidence_rules:
  allowed_sources:
  - fact
  - document
  - regkb
  - system_record
  must_cite: true
  max_age_days: 365
tools:
- tool_id: read_facts
  mode: read
  scope: system:own
- tool_id: read_regkb
  mode: read
  scope: regkb:VN-TT53-2026
- tool_id: read_system_record
  mode: read
- tool_id: search_documents
  mode: read
  scope: documents:internal
instructions: Answer each checklist item (ET-01, ET-02, ET-03, ET-04) from the evidence only. Cite the
  evidence for every pass or fail. Use question when the evidence is missing. Give a short reason for
  each answer.
harness:
  context:
    sources:
    - facts_v1
    - system_record
    - regkb_rows
    - document_sections
    budget_tokens: 12000
    max_document_chars: 8000
  memory:
    system_memory: false
  hitl:
    approval_points:
    - kind: verdict
      ref: question
    permissions: []
  verification:
    verifier: rules
    validators: []
  loop:
    mode: single_pass
guardians:
- pii_mask_v2
- tool_scope_guard
- citation_required
eval_pack: ethics-golden-v1
