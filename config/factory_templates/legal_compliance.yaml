# Starter template of the agent factory (WP-F2) for the legal_compliance dimension. The checklist follows
# docs/phase12/research/regulation-structure.md section 2. It is a starting point for the owner
# group, not legal advice (bank counsel confirms). Strict keys: supervisor.factory.templates.
template_id: legal_compliance
version: 1
label_en: Legal compliance assessment
name: Legal compliance assessment agent
description: Assesses legal compliance of one AI system against the laws that bind it, including personal
  data duties.
owner_group: legal
dimension_id: legal_compliance
policy_refs:
- doc_id: VN-TT53-2026
  source: regkb
  version: 1
  sections:
  - Art.14(3)(d)
  - Art.3(1)
  - Art.7(1)
  - Art.13(1)(c)
checklist:
- id: LC-01
  question: Is the legal basis for the use case stated in the record?
  evidence:
  - system_record
  - regkb
  severity: high
  pass_rule: A legal basis and an instrument id are named (Art.3(1)).
- id: LC-02
  question: Is a personal-data impact assessment on file where personal data is used?
  evidence:
  - document
  - system_record
  severity: high
  pass_rule: A DPIA reference exists, or the record says no personal data is used (Art.13(1)(c)).
- id: LC-03
  question: Do the duties that apply to the system have an owner and a status?
  evidence:
  - regkb
  - system_record
  severity: medium
  pass_rule: Each applicable obligation row has an owner.
- id: LC-04
  question: Are customers told when they deal with an AI system?
  evidence:
  - document
  - system_record
  severity: medium
  pass_rule: A notice text or a record field states the customer notice.
evidence_rules:
  allowed_sources:
  - document
  - regkb
  - system_record
  must_cite: true
  max_age_days: 365
tools:
- tool_id: read_facts
  mode: read
  scope: system:own
- tool_id: read_regkb
  mode: read
  scope: regkb:VN-TT53-2026
- tool_id: read_system_record
  mode: read
- tool_id: search_documents
  mode: read
  scope: documents:internal
instructions: Answer each checklist item (LC-01, LC-02, LC-03, LC-04) from the evidence only. Cite the
  evidence for every pass or fail. Use question when the evidence is missing. Give a short reason for
  each answer.
harness:
  context:
    sources:
    - facts_v1
    - system_record
    - regkb_rows
    - document_sections
    budget_tokens: 12000
    max_document_chars: 8000
  memory:
    system_memory: false
  hitl:
    approval_points:
    - kind: verdict
      ref: question
    permissions: []
  verification:
    verifier: rules
    validators: []
  loop:
    mode: single_pass
guardians:
- pii_mask_v2
- tool_scope_guard
- citation_required
eval_pack: legal-compliance-golden-v1
