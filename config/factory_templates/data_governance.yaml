# Starter template of the agent factory (WP-F2) for the data_governance dimension. The checklist follows
# docs/phase12/research/regulation-structure.md section 2. It is a starting point for the owner
# group, not legal advice (bank counsel confirms). Strict keys: supervisor.factory.templates.
template_id: data_governance
version: 1
label_en: Data governance assessment
name: Data governance assessment agent
description: 'Assesses data governance of one AI system: provenance, quality, poisoning, leakage and least
  privilege.'
owner_group: data
dimension_id: data_governance
policy_refs:
- doc_id: VN-TT53-2026
  source: regkb
  version: 1
  sections:
  - Art.14(3)(b)
  - Art.7(2)
  - Art.7(3)
  - Art.7(4)
checklist:
- id: DG-01
  question: Is the provenance of every dataset the system uses recorded?
  evidence:
  - fact
  - system_record
  severity: high
  pass_rule: Each dataset fact has a named source in the record (Art.7(2)).
- id: DG-02
  question: Is synthetic data used and is it labelled as such?
  evidence:
  - system_record
  - document
  severity: low
  pass_rule: Synthetic data, if used, is stated in the record.
- id: DG-03
  question: Is there a data quality check and a check against manipulation or poisoning?
  evidence:
  - document
  - pack
  severity: high
  pass_rule: A quality control and a poisoning control are named (Art.7(3)).
- id: DG-04
  question: Does the system read only the data fields it needs (least privilege)?
  evidence:
  - fact
  - system_record
  severity: high
  pass_rule: Data facts match the declared fields; no extra table is read (Art.7(4)).
- id: DG-05
  question: Is leakage of personal data from the data store guarded?
  evidence:
  - pack
  - fact
  severity: high
  pass_rule: A privacy pack passed and no secret or personal field appears in the facts.
evidence_rules:
  allowed_sources:
  - fact
  - document
  - regkb
  - pack
  - system_record
  must_cite: true
  max_age_days: 365
tools:
- tool_id: read_facts
  mode: read
  scope: system:own
- tool_id: read_regkb
  mode: read
  scope: regkb:VN-TT53-2026
- tool_id: read_pack_results
  mode: read
  scope: system:own
- tool_id: read_system_record
  mode: read
- tool_id: search_documents
  mode: read
  scope: documents:internal
instructions: Answer each checklist item (DG-01, DG-02, DG-03, DG-04, DG-05) from the evidence only. Cite
  the evidence for every pass or fail. Use question when the evidence is missing. Give a short reason
  for each answer.
harness:
  context:
    sources:
    - facts_v1
    - pack_results
    - system_record
    - regkb_rows
    - document_sections
    budget_tokens: 12000
    max_document_chars: 8000
  memory:
    system_memory: false
  hitl:
    approval_points:
    - kind: verdict
      ref: question
    permissions: []
  verification:
    verifier: rules
    validators: []
  loop:
    mode: single_pass
guardians:
- pii_mask_v2
- tool_scope_guard
- citation_required
eval_pack: data-governance-golden-v1
