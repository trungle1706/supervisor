# Draft topics for the judge_moderation detector (WP-D4, docs/detectors.md section 3e).
#
# These are EDITABLE DRAFTS, in the bank's own hands. None is enabled: this file is a menu, the
# detector never reads it. To use a topic, copy its `name` and `definition` (in the language of
# your traffic) into `detectors.judge_moderation.settings.topics` in config/detectors.yaml, or
# into the per-agent override (agents.<id>.detectors.settings.judge_moderation.topics).
#
# Rules for the detector: at most 5 topics per detector, a name up to 120 characters and unique,
# a definition up to 400 characters. The DEFINITION is what the judge scores; the name is only
# the label of the finding (moderation.topic:<name>).
#
# How to write a definition: one plain sentence that says what belongs to the topic. Do not name
# a neighbouring topic to rule it out. Do not paste example messages. Write it in the language
# of most of your traffic. A draft that you never edit is still the wording that is scored, so
# test it on sample messages with the harness before you turn it on.
version: 1
topics:
  - key: financial_advice
    enabled: false
    en:
      name: Financial advice
      definition: >-
        Personal recommendations about what to invest in, buy, sell or borrow, or predictions
        about the return of shares, funds, gold, currencies or crypto assets.
    vi:
      name: Tư vấn tài chính
      definition: >-
        Khuyến nghị cá nhân về nên đầu tư, mua, bán hay vay gì, hoặc dự đoán lợi nhuận của cổ
        phiếu, quỹ, vàng, ngoại tệ và tài sản tiền mã hóa.
  - key: legal_advice
    enabled: false
    en:
      name: Legal advice
      definition: >-
        Opinions on how a law applies to a person's own situation, what to claim or sign in a
        dispute, or how to win a case, contract or complaint.
    vi:
      name: Tư vấn pháp lý
      definition: >-
        Ý kiến về việc luật áp dụng thế nào cho hoàn cảnh riêng của một người, nên khiếu nại
        hay ký gì khi có tranh chấp, hoặc cách thắng một vụ kiện, hợp đồng hay khiếu nại.
  - key: politics
    enabled: false
    en:
      name: Politics
      definition: >-
        Political parties, elections, politicians, government policy debates, protests and
        other questions of political power.
    vi:
      name: Chính trị
      definition: >-
        Đảng phái, bầu cử, chính trị gia, tranh luận về chính sách của nhà nước, biểu tình và
        các vấn đề quyền lực chính trị khác.
  - key: religion
    enabled: false
    en:
      name: Religion
      definition: >-
        Faith, worship, scripture, religious leaders, rituals and the comparison of beliefs.
    vi:
      name: Tôn giáo
      definition: >-
        Đức tin, thờ cúng, kinh sách, chức sắc tôn giáo, nghi lễ và việc so sánh các tín
        ngưỡng.
  - key: competitor_products
    enabled: false
    en:
      name: Competitor products
      definition: >-
        Rates, fees, features or quality of the accounts, cards and loans of other banks and
        financial companies, or advice to switch to them.
    vi:
      name: Sản phẩm của đối thủ
      definition: >-
        Lãi suất, phí, tính năng hoặc chất lượng của tài khoản, thẻ và khoản vay của ngân
        hàng và công ty tài chính khác, hoặc lời khuyên chuyển sang dùng các sản phẩm đó.
  - key: internal_project_names
    enabled: false
    en:
      name: Internal projects
      definition: >-
        Unreleased plans, code names or staff details of internal bank projects. EDIT THIS:
        add the code names that must stay inside the bank, for example FILL-ME-PROJECT-NAMES.
    vi:
      name: Dự án nội bộ
      definition: >-
        Kế hoạch chưa công bố, tên mã hoặc thông tin nhân sự của các dự án nội bộ ngân hàng.
        HÃY SỬA: thêm các tên mã cần giữ trong nội bộ, ví dụ FILL-ME-PROJECT-NAMES.
  - key: medical_advice
    enabled: false
    en:
      name: Medical advice
      definition: >-
        Diagnosis of symptoms, choice or dose of medicines, and treatment recommendations for
        an illness or injury.
    vi:
      name: Tư vấn y tế
      definition: >-
        Chẩn đoán triệu chứng, chọn thuốc hoặc liều dùng, và khuyến nghị điều trị cho bệnh
        hoặc chấn thương.
  - key: illegal_activity
    enabled: false
    en:
      name: Illegal activity
      definition: >-
        Ways to commit or hide a crime, such as fraud, laundering money, evading tax, forging
        papers, hacking accounts or buying banned goods.
    vi:
      name: Hoạt động bất hợp pháp
      definition: >-
        Cách thực hiện hoặc che giấu tội phạm, như lừa đảo, rửa tiền, trốn thuế, làm giả giấy
        tờ, xâm nhập tài khoản hoặc mua hàng cấm.
  - key: adult_content
    enabled: false
    en:
      name: Adult content
      definition: >-
        Sexually explicit material, erotic stories and requests for sexual content.
    vi:
      name: Nội dung người lớn
      definition: >-
        Tài liệu khiêu dâm, truyện gợi dục và yêu cầu về nội dung tình dục.
  - key: code_generation
    enabled: false
    en:
      name: Code generation
      definition: >-
        Requests to write, complete or fix source code, scripts, formulas or SQL queries.
    vi:
      name: Viết mã nguồn
      definition: >-
        Yêu cầu viết, hoàn thiện hoặc sửa mã nguồn, tập lệnh, công thức hoặc câu truy vấn SQL.
