# Dev users for the reviewer console on the laptop (AUTH_KIND=dev_header, the laptop default).
# NOT a real identity (ADR D04): anyone at the keyboard can pick a user. The Databricks App
# uses SSO headers instead (config/auth.yaml). Synthetic names only.
#
# Roles: viewer | reviewer | approver | owner | auditor | admin | operator
# (the full role x permission table is in docs/console.md, "Role matrix")
#   viewer    read-only console pages
#   operator  views + run case intake + verify the chain + acknowledge alerts
#   reviewer  assign, triage, contain, close, comment, ITSM ref, sign-off, record report sent,
#             pause, resume (reviewer half), intake, start onboarding, verify, export
#   approver  sign-off (approver half), record report sent, comment, pause, verify, export
#   owner     agent owner: resume (owner half), comment, pause, start onboarding, verify
#   auditor   read pages, verify case and chain, mark inbox read, audit-pack and chain export
#   admin     everything a reviewer can do + quarantine / release
#
# Groups (docs/factory.md "Groups of a user"): every user has an explicit `groups:` list of ids of
# config/factory_groups.yaml. A user with groups belongs to exactly those groups. An empty list
# means no group; then the role mapping of the group applies (the fallback, kept for users
# without a `groups:` key, for example in a user file of an older install).
#
# Resume needs the agent owner (agent.owner_user) and a reviewer listed in
# policies/baseline.yaml (reviewers:). The ids below match those files.

default_user: reviewer.an

users:
  reviewer.an:
    name: "Nguyễn Văn An"
    roles: [reviewer]
    groups: [model_risk, data, cyber, legal, third_party, ethics]
  reviewer.binh:
    name: "Trần Thị Bình"
    roles: [reviewer, approver]
    groups: [model_risk, data, cyber, legal, third_party, ethics]
  approver.em:
    name: "Phạm Minh Em"
    roles: [approver]
    groups: [model_risk, legal]
  auditor.dung:
    name: "Lê Thu Dung"
    roles: [auditor]
    groups: []
  admin.chi:
    name: "Hoàng Văn Chí"
    roles: [admin, reviewer]
    groups: [model_risk, data, cyber, legal, third_party, ethics, platform]
  viewer.hoa:
    name: "Đặng Thu Hoa"
    roles: [viewer]
    groups: []
  operator.khanh:
    name: "Vũ Quốc Khánh"
    roles: [operator]
    groups: []
  payops-lead@example.invalid:
    name: "Payments Ops lead (owner)"
    roles: [owner]
    groups: []
  cc-lead@example.invalid:
    name: "Customer Care lead (owner)"
    roles: [owner]
    groups: []
  lending-lead@example.invalid:
    name: "Consumer Lending lead (owner)"
    roles: [owner]
    groups: []
  # Agent factory leads (WP-F3). Each belongs to exactly one factory group (config/factory_groups.yaml)
  # whatever the role mapping says. `platform` is the second line for the approval of a high-tier agent.
  lead.model:
    name: "Bùi Quang Minh"
    roles: [approver]
    groups: [model_risk]
  lead.cyber:
    name: "Ngô Thị Lan"
    roles: [approver]
    groups: [cyber]
  second.line:
    name: "Đỗ Văn Sơn"
    roles: [approver]
    groups: [platform]
  # Data Office lead (showcase, WP-D3): owner lead of the data group (data agents and guardians).
  lead.data:
    name: "Lý Thanh Tâm"
    roles: [approver]
    groups: [data]
