[project]
name = "supervisor"
version = "0.1.0"
description = "Supervisor: onboard and watch AI agents at a bank (gateway, judges, evidence chain, console)."
readme = "CLAUDE.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "cryptography>=42",
    "apscheduler>=3.10,<4",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "httpx>=0.27",
    "truststore>=0.9",
]

[project.optional-dependencies]
databricks = ["databricks-sdk>=0.40"]
monitors = ["fairlearn>=0.10", "scikit-learn>=1.4", "pandas>=2.1"]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
mlflow = ["mlflow-skinny>=2.17"]
llm = ["openai>=1.40"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    # Unit tests for the databricks_rest adapter use the real SDK dataclasses with a fake transport.
    "databricks-sdk>=0.40",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supervisor", "src/supervisor_agents"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "databricks: live test against a real Databricks workspace (needs RUN_DATABRICKS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess is confined to sandbox.py by an AST test
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"src/supervisor/cli.py" = ["T20"]
"src/supervisor/preflight.py" = ["T20"]
# Identifiers come only from schema/model.yaml (regex-checked); values are bound parameters.
"src/supervisor/adapters/sql/store.py" = ["S608"]
"src/supervisor/jobs/**" = ["T20"]
"schema/generate.py" = ["T20"]
