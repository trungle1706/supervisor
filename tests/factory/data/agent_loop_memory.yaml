schema_version: "1.0"
id: cyber-assessor
name: Cybersecurity Assessment Agent
description: Loop agent that re-reads weak spots and pack results until every checklist item has evidence.
owner_group: cyber
dimension_id: cybersecurity
policy_refs:
  - {doc_id: SBV-TT50-2024, version: 2, sections: ["Art.7"]}
checklist:
  - id: CY-01
    question: Is every secret use in the code a reference to a vault, never a literal?
    evidence: [fact]
    severity: high
    pass_rule: No secret_use fact has a literal value.
  - id: CY-02
    question: Did the injection packs pass at the current agent version?
    evidence: [pack]
    severity: high
    pass_rule: Every required injection pack has a pass result.
evidence_rules:
  allowed_sources: [fact, pack, regkb]
  must_cite: true
  max_age_days: 180
tools:
  - {tool_id: read_facts, mode: read}
  - {tool_id: read_pack_results, scope: "pack:owasp_llm_top10", mode: read}
instructions: Check the secret facts first, then the pack results.
harness:
  context:
    sources: [facts_v1, pack_results, regkb_rows]
    budget_tokens: 16000
    max_document_chars: 0
  memory:
    system_memory: true
    retention_days: 90
    fields: [prior_verdicts, open_questions]
    cross_run: "off"
  hitl:
    approval_points:
      - {kind: checklist, ref: CY-01}
    permissions:
      - {tool_id: read_facts, mode: read}
  verification:
    verifier: rules+judge
    validators: [evidence_age]
  loop:
    mode: loop
    max_iterations: 4
    stop_when: [all_answered, evaluator_done]
    loop_evaluator: judge
    min_score: 70
    budget_tokens: 80000
output_schema: {type: assessment_report_v1}
guardians: [pii_mask_v2, tool_scope_guard, citation_required, rate_limit_guard]
eval_pack: cyber-golden-v1
lifecycle: {state: tested, version: "0.4.1", approvals: []}
