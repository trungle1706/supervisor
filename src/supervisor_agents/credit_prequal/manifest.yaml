# Agent manifest (synthetic demo agent).
id: credit_prequal
name: Loan pre-qualification agent
version: "1.0.0"
owner: Consumer Lending
owner_user: lending-lead@example.invalid
risk_tier: high
model_family: qwen
model_id: qwen3:4b
host_type: python_inprocess
plug_point: gate_hook
description: >
  Pre-qualifies consumer loan applications. Fetches the application, looks up a credit
  score, requests missing documents, and records a pre-qualification decision
  (approve / refer / decline). Final credit approval stays with a human underwriter.
limits:
  max_prequal_amount_minor: 2000000000   # VND
capture:                 # WP4 recorder: digest | masked | raw (raw needs raw_allowed: true)
  level: masked
  raw_allowed: false
tools:
  - name: fetch_application
    risk_class: pii_export
    description: Read a loan application by application_id (applicant attributes, income, documents on file).
    args: {application_id: string}
  - name: credit_score_lookup
    risk_class: read_only
    description: Look up the internal credit score (0-1000) for a customer_id.
    args: {customer_id: string}
  - name: decide_prequal
    risk_class: credit
    description: Record a pre-qualification decision. decision in approve|refer|decline.
    args: {application_id: string, decision: string, amount_minor: integer, reason: string}
  - name: request_documents
    risk_class: read_only
    description: Ask the applicant for missing documents.
    args: {application_id: string, documents: array}
