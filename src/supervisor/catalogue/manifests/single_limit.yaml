# Capability manifest (schema: supervisor.catalogue.model.CapabilityManifest).
id: single_limit
name: Per-call amount limit
kind: gate_rule
lane: fast
description: >
  Blocks a money or credit call whose integer amount is above the limit that the agent
  manifest declares for that tool (for example transfer_max_minor).
signals_needed: [tool_call.args.amount_minor, agent_manifest.limits]
checks: [amount_minor is at most the declared per-call limit]
default_thresholds: {}
cost_estimate: {llm_tokens_per_1k_events: 0, compute_ms_per_1k_events: 10, storage_bytes_per_1k_events: 0}
applies_to: [money, credit]
requires: [amount_arg, declared_limit]
plug_points: [gate_hook, mcp_proxy]
regulation_refs: ["Internal limit - single agent-initiated transaction"]
owner: Supervisor Platform
module: supervisor.gateway.engine
can_block: true
