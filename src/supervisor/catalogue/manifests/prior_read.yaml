# Capability manifest (schema: supervisor.catalogue.model.CapabilityManifest).
id: prior_read
name: Decision needs the record read first
kind: gate_rule
lane: fast
description: >
  A decision call is blocked when the same agent did not read the same record (same id
  argument) earlier in the window. Proves the decision was made on the file.
signals_needed: [gateway_events.allowed, tool_call.args.record_id]
checks: [a read of the same record by the same agent within the window]
default_thresholds: {within_s: 86400}
cost_estimate: {llm_tokens_per_1k_events: 0, compute_ms_per_1k_events: 30, storage_bytes_per_1k_events: 0}
applies_to: [credit]
requires: [decision_tool, prior_read]
plug_points: [gate_hook, mcp_proxy]
regulation_refs: ["Credit policy - documented decision"]
owner: Supervisor Platform
module: supervisor.gateway.engine
can_block: true
