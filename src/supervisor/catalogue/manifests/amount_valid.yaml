# Capability manifest (schema: supervisor.catalogue.model.CapabilityManifest).
id: amount_valid
name: Complete and valid amount
kind: gate_rule
lane: fast
description: >
  A money call must state amount_minor as a positive integer (VND has no minor unit).
  Missing or non-positive amounts are blocked.
signals_needed: [tool_call.args.amount_minor]
checks: [amount_minor present, amount_minor greater than zero]
default_thresholds: {}
cost_estimate: {llm_tokens_per_1k_events: 0, compute_ms_per_1k_events: 5, storage_bytes_per_1k_events: 0}
applies_to: [money]
requires: [amount_arg]
plug_points: [gate_hook, mcp_proxy]
regulation_refs: ["Internal payment control - complete instruction"]
owner: Supervisor Platform
module: supervisor.gateway.engine
can_block: true
