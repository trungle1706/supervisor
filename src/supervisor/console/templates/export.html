{% extends "base.html" %}
{% block title %}{{ t('export') }}{% endblock %}
{% block content %}
<h1>{{ t('export') }}</h1>
<section class="panel">
  <p>{{ t('export_help') }}</p>
  <button hx-post="/console/export" hx-target="#export-result" hx-indicator="#export-busy">{{ t('build_pack') }}</button>
  <span id="export-busy" class="htmx-indicator muted">...</span>
  <div id="export-result">{% include "_export_result.html" %}</div>
</section>
<section class="panel">
  <h2>{{ t('download') }}</h2>
  {% for p in packs %}
    <div><a class="mono" href="/console/exports/{{ p.name }}" download>{{ p.name }}</a> <span class="muted">{{ p.size }} bytes</span></div>
  {% else %}<p class="muted">-</p>{% endfor %}
</section>
{% endblock %}
