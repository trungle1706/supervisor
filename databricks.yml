# Databricks Asset Bundle for the Supervisor app (WP10).
#
# Per-workspace values are FILL-ME placeholders. Edit them INLINE in your local copy only.
# Do not commit real values. No bundle variables, no --var flags, no secret scopes:
# that is the pattern that deploys at the bank (docs/BANK_DEPLOY_GUIDE.md section 5.1).
#
# Commands (Windows cmd, from the repo folder; see docs/RUNBOOK.md section 7):
#   databricks bundle validate -t dev --profile FILL-ME-profile
#   databricks bundle deploy   -t dev --profile FILL-ME-profile
#   databricks bundle run supervisor -t dev --profile FILL-ME-profile
#
# v0.5.0: the phase 4 and 5 environment variables (governance, actions, bindings, MCP server,
# document intake, guard model, scan v2) are in app.yaml, not here: a bundle app reads its
# environment from app.yaml. Scan v2 is off ("0") until live test kit item 12 has passed.
#
# App names: lowercase letters, digits and hyphens, at most 30 characters.
# Suffix the name with your user name to avoid collisions in the workspace.
bundle:
  name: supervisor

sync:
  # Gitignore syntax. A leading / anchors to the repo root: a bare `data` would also drop
  # src/supervisor/data/ (a test checks that no source file is excluded).
  exclude:
    - /.venv
    - /data
    - /runs
    - /tests
    - /docs/handoff
    - /docs/BANK_DEPLOY_GUIDE.md
    - /.env
    - /uv.toml
    - "*.db"
    - "**/__pycache__"

resources:
  apps:
    supervisor:
      name: supervisor-FILL-ME-username
      description: "Supervisor - onboard and watch AI agents (Onboard + Watch)"
      source_code_path: ./
      # On-behalf-of user SQL: the signed-in user's token arrives in X-Forwarded-Access-Token.
      user_api_scopes:
        - sql
        # WP-P4, sandbox-only (LLM_USER_TOKEN_FORWARD=1): the judges call the model service with
        # the signed-in user's token. The exact scope name for the AI Gateway is NOT confirmed.
        # Try serving.serving-endpoints; if the token is refused (403), ask the workspace admin
        # which scope the gateway needs.
        # - serving.serving-endpoints
      resources:
        # app.yaml reads these with valueFrom: sql-warehouse -> warehouse id,
        # llm-endpoint -> serving endpoint name.
        - name: sql-warehouse
          description: "SQL warehouse for the Supervisor tables (Statement Execution API)"
          sql_warehouse:
            id: FILL-ME-warehouse-id
            permission: CAN_USE
        # Model is a Unity Catalog model service (AI Gateway)? Remove this resource and use the
        # commented LLM_BASE_URL / LLM_MODEL / LLM_API_SHAPE block in app.yaml.
        - name: llm-endpoint
          description: "Existing model-serving endpoint for the judges (OpenAI-compatible)"
          serving_endpoint:
            name: FILL-ME-serving-endpoint-name
            permission: CAN_QUERY
        # v0.5.0, optional: an existing serving endpoint for the guard model (phase 5 detector,
        # NO-GO until a real model run, docs/guard-model-decision.md). Uncomment it, fill in the
        # name, and put the same endpoint URL in GUARD_MODEL_URL in app.yaml. The App cannot
        # create endpoints: it only gets CAN_QUERY on one that exists.
        # - name: guard-model-endpoint
        #   description: "Existing serving endpoint for the guard model (optional)"
        #   serving_endpoint:
        #     name: FILL-ME-guard-endpoint-name
        #     permission: CAN_QUERY

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://FILL-ME-workspace-host
    resources:
      apps:
        supervisor:
          name: supervisor-FILL-ME-username
  prod:
    mode: production
    workspace:
      host: https://FILL-ME-workspace-host
      root_path: /Workspace/Users/FILL-ME-user-email/.bundle/supervisor/prod
    resources:
      apps:
        supervisor:
          name: supervisor-prd-FILL-ME-username
