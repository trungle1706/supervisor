# Databricks App runtime (WP10). No package index at runtime: dependencies install at BUILD
# from requirements.txt (exported from uv.lock). Start with plain python -m uvicorn, never uv run.
# One worker: the evidence chain has a single writer in one process.
#
# FILL-ME values: edit INLINE in your local copy only. Never commit real values.
# The platform injects DATABRICKS_HOST, DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET
# (the App service principal). Do not set them here. Never set DATABRICKS_TOKEN.
command:
  - python
  - -m
  - uvicorn
  - supervisor.app:app
  - --host
  - "0.0.0.0"
  - --port
  - "8000"
  - --workers
  - "1"
env:
  - name: PYTHONPATH
    value: "src"
  - name: SUPERVISOR_MODE
    value: "databricks_app"
  # The App container has no bank TLS appliance in front of it.
  - name: SSL_OS_TRUSTSTORE
    value: "0"
  - name: SCHEDULER_ENABLED
    value: "1"
  # Gate time budgets. Every store round trip is a Statement Execution call (1 to 3 s), so
  # the 2 s local default is too short here. The agent SDK timeout must be larger than this.
  - name: GATE_DECISION_TIMEOUT_S
    value: "20"
  - name: POLICY_REFRESH_S
    value: "60"
  - name: STATE_CACHE_TTL_S
    value: "30"
  - name: GATE_RECORD_ASYNC
    value: "1"
  # /tmp is wiped on every restart. Durable files go to a Unity Catalog Volume.
  - name: DATA_DIR
    value: "/Volumes/FILL-ME-catalog/FILL-ME-schema/FILL-ME-volume/supervisor/data"
  # Evidence signing key: write-once object on the Volume (Files API). Never on /tmp.
  - name: SIGNER_KIND
    value: "uc_volume"
  - name: SIGNER_KEY_PATH
    value: "/Volumes/FILL-ME-catalog/FILL-ME-schema/FILL-ME-volume/supervisor/keys/evidence_ed25519.pem"
  - name: SPOOL_DIR
    value: "/Volumes/FILL-ME-catalog/FILL-ME-schema/FILL-ME-volume/supervisor/spool"
  - name: ANCHOR_KIND
    value: "uc_volume"
  - name: ANCHOR_PATH
    value: "/Volumes/FILL-ME-catalog/FILL-ME-schema/FILL-ME-volume/supervisor/anchors"
  # Durable state: Delta tables in this schema (Statement Execution API).
  - name: DATABRICKS_CATALOG
    value: "FILL-ME-catalog"
  - name: DATABRICKS_SCHEMA
    value: "FILL-ME-schema"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # The chat model is a Unity Catalog model service behind the Databricks AI Gateway (WP-P3), not
  # a classic serving endpoint, so there is no `llm-endpoint` resource in databricks.yml. The App
  # service principal needs EXECUTE (or the equivalent) on the model service in Unity Catalog.
  # The model family (glm) is derived from the 3-part name. Set LLM_API_SHAPE=chat if the gateway
  # only accepts /chat/completions.
  - name: LLM_BASE_URL
    value: "https://FILL-ME-workspace-host/ai-gateway/mlflow/v1"
  - name: LLM_MODEL
    value: "FILL-ME-catalog.FILL-ME-schema.FILL-ME-model-service"
  - name: LLM_API_SHAPE
    value: "responses"

  # ---- LLM-empowered features (WP-L1). Every one uses the model above. All of them ADVISE only:
  # no model answer blocks or pauses a call, and only deterministic rules do that. Set a value to
  # "0" (or empty for a model name) to switch the feature off. Details: docs/llm-features.md.
  # Judge (Tier 1, Tier 2, challenger): reads masked traces and writes an opinion; may open a case.
  - name: JUDGE_ENABLED
    value: "1"
  # Same model as the chat model; the judge family (glm) must differ from every agent family.
  # Single-model workspace: uncomment to let the judge run when it shares the agents' model family
  # (verdicts then carry independence "reduced"). See docs/llm-features.md.
  # - name: JUDGE_FAMILY_CONFLICT_ALLOW
  #   value: "1"
  # WP-P3 live-run hardening (both default off). SCHEMA_SELFCHECK: compare the tables of
  # schema/model.yaml with the warehouse at start; /console/admin/schema shows the SQL to run.
  # HEALTHZ_MODEL_PROBE: /healthz adds model_resource from a small call to the model gateway.
  # - name: SCHEMA_SELFCHECK
  #   value: "1"
  # - name: HEALTHZ_MODEL_PROBE
  #   value: "1"
  - name: JUDGE_T1_MODEL
    value: "FILL-ME-catalog.FILL-ME-schema.FILL-ME-model-service"
  # Detectors that call the model at the gate (judge_advisory, judge_moderation, guard_model) are
  # switched on in this file; they only report findings and never fail closed.
  - name: DETECTORS_CONFIG
    value: "config/detectors.databricks.yaml"
  # Guard model through the same chat adapter and gateway: scores jailbreak text; findings only.
  - name: GUARD_MODEL_ADAPTER
    value: "chat"
  # Decision 33: the model fills a draft of the classification answers; a person applies them.
  - name: CLASSIFIER_AI_PREFILL
    value: "1"
  # Integration advisor (reads a repo and suggests wiring) and compliance advisor (suggests a
  # compliance matrix), as onboarding stages and as console tabs. Suggestions only.
  - name: ONBOARD_ADVISOR_ENABLED
    value: "1"
  - name: ONBOARD_COMPLIANCE_ENABLED
    value: "1"
  - name: CONSOLE_INTEGRATION_ENABLED
    value: "1"
  - name: CONSOLE_COMPLIANCE_ENABLED
    value: "1"
  # Red team attacker: the model writes the attack turns of the multi-turn test; the template
  # attacker is the fallback. Test traffic only.
  - name: REDTEAM_ATTACKER_MODEL
    value: "FILL-ME-catalog.FILL-ME-schema.FILL-ME-model-service"
  # SANDBOX ONLY (WP-P4): judge calls run under the signed-in user's identity (forwarded token)
  # when the request carries one; else the App service principal. Needs a serving scope in
  # user_api_scopes (databricks.yml). Do not use in production.
  # - name: LLM_USER_TOKEN_FORWARD
  #   value: "1"
  # SANDBOX ONLY (WP-P5): every SQL statement inside a request that carries the user token runs
  # as the signed-in user (needs the sql scope in user_api_scopes). Startup, scheduler, jobs and
  # the chain writer still use the App service principal. Do not use in production.
  # - name: SQL_USER_TOKEN_FORWARD
  #   value: "1"

  # ---- Phase 4 and 5 (v0.5.0). Every switch is off in the code; "1" here turns it on for the
  # sandbox. Set a switch to "0" to switch the feature off again. Nothing below needs a secret.
  # Governance: AI systems, assignment rules, Decision 33 classification, lifecycle (docs/governance.md).
  - name: GOVERNANCE_ENABLED
    value: "1"
  - name: CONSOLE_SYSTEMS_ENABLED
    value: "1"
  # Sidebar with the Governance and Supervisor sections.
  - name: CONSOLE_NAV_SECTIONS
    value: "1"
  - name: CONSOLE_NAV_V3
    value: "1"
  - name: CONSOLE_CATALOG_ENABLED
    value: "1"
  # Risk of a system inherits over the inventory graph.
  - name: INVENTORY_ENABLED
    value: "1"
  # Events map to actions: incident, notify, raise risk, re-evaluate, review (docs/governance-actions.md).
  - name: GOVERNANCE_ACTIONS_ENABLED
    value: "1"
  # Per-system guardian switches with the mandatory floor (docs/guardian-bindings.md).
  - name: GUARDIAN_BINDINGS_ENABLED
    value: "1"
  # POST /mcp and GET /v1/kpis on the same port (docs/mcp-server.md).
  - name: MCP_SERVER_ENABLED
    value: "1"
  # Done, Waive, Request move, Approve, Reject and Move as console buttons (docs/console.md, WP-P1).
  # Needs GOVERNANCE_ENABLED, CONSOLE_SYSTEMS_ENABLED and CONTROLS_ENABLED. Off until the owner turns it on.
  # - name: CONSOLE_WORKFLOW_ACTIONS
  #   value: "1"
  # The stub marks outbound events delivered; it sends nothing.
  - name: WEBHOOKS_ENABLED
    value: "0"
  - name: TRANSPARENCY_ENABLED
    value: "1"
  # Scan v2 of the workspace (serving endpoints, model versions, Genie, jobs, Vector Search, UC
  # functions, UC connections): OFF until live test kit item 12 has passed. Autoregister: OFF.
  - name: INVENTORY_SCAN_V2
    value: "0"
  - name: INVENTORY_AUTOREGISTER
    value: "0"
  # catalog.schema,catalog.schema whose tables and functions the scan lists (needs scan v2 for functions).
  - name: INVENTORY_SCAN_SCHEMAS
    value: "FILL-ME-catalog.FILL-ME-schema"
  # Phase 7: Navigator-style My overview with the candidate triage table, the My agents tab with
  # the Register and Guardians tabs of the agent page, and the six-step register workflow
  # (docs/phase7/BUILD_PLAN_PHASE7.md, docs/triage.md, docs/register-v2.md).
  - name: CONSOLE_OVERVIEW_V4
    value: "1"
  - name: CONSOLE_MY_AGENTS
    value: "1"
  - name: CONSOLE_REGISTER_V2
    value: "1"
  # Phase 8 WP-L2: Duties step (step 4 of 7) in the register workflow: the compliance matrix on the
  # draft answers, open questions as fields, obligation_status rows and gap tasks on submit.
  # Needs CONSOLE_REGISTER_V2 and GOVERNANCE_ENABLED. Off by default (docs/register-v2.md).
  # - name: CONSOLE_REGISTER_DUTIES
  #   value: "1"
  # Phase 8 WP-L3: Duties tab on the system page (close, waive, re-evaluate), gap closure score,
  # risk line of kind duties_gap and the My overview dimension. Needs GOVERNANCE_ENABLED and
  # CONSOLE_SYSTEMS_ENABLED. Off by default (docs/risk-register.md "Duties (WP-L3)").
  # - name: RISK_DUTIES
  #   value: "1"
  # - name: RISK_DUTIES_SWEEP_S   # weekly reminder task for duties due within 30 days; 0 = off
  #   value: "21600"
  # Phase 12 WP-C2: the eight risk types of Circular 53 Art. 14(3) as a status row per AI system
  # (Risk assessment tab, /v1/systems/{id}/risk-dimensions). Needs GOVERNANCE_ENABLED. Off by
  # default (docs/risk-dimensions.md).
  # - name: RISK_DIMENSIONS
  #   value: "1"
  # Phase 12 WP-F4: the onboarding orchestrator (Run assessment button on the Risk assessment tab,
  # /v1/systems/{id}/orchestrate). Needs GOVERNANCE_ENABLED, RISK_DIMENSIONS, CLASSIFICATION_V2.
  # Off by default (docs/orchestrator.md).
  # - name: ONBOARD_ORCHESTRATOR
  # Phase 12B WP-F2: the agent factory (catalogue /console/factory, editor, three helper agents that
  # need LLM_BASE_URL). Needs GOVERNANCE_ENABLED. Off by default (docs/factory.md).
  # - name: AGENT_FACTORY
  #   value: "1"
  # Phase 8 WP-L4: live evidence per control for the duties of a system, auto-close of a full
  # coverage duty whose controls all work, signed regulator pack (JSON and HTML) per system.
  # Needs GOVERNANCE_ENABLED and RISK_DUTIES. Off by default (docs/regulator-pack.md).
  # - name: REGULATOR_PACK
  #   value: "1"
  # - name: DUTY_EVIDENCE_SWEEP_S   # sweep over every system; 0 = off, else 300 or more
  #   value: "21600"
  # Phase 8 WP-P2: Request / Approve RUNNING on the agent page (two people), Decision 33 apply
  # (the system owner cannot apply; 20-character justification), guardian switch-off (reason; a
  # second person on a production or high-risk system). Off by default (docs/console.md).
  # - name: CONSOLE_STATE_ACTIONS
  #   value: "1"
  # Phase 9 WP-O1: candidate source intake (Source panel: zip upload or https git URL, scrubbed,
  # numbered attempts under DATA_DIR/intake). Off by default (docs/onboard.md "Intake").
  # - name: ONBOARD_INTAKE
  #   value: "1"
  # - name: ONBOARD_INTAKE_MAX_MB
  #   value: "20"
  # - name: ONBOARD_GIT_HOSTS   # comma list; empty = git intake off
  #   value: "FILL-ME-git-host"
  # Phase 9 WP-O2: facts card (what we know about this agent) built from a stored intake attempt;
  # needs ONBOARD_INTAKE. Off by default (docs/onboard.md "Facts card").
  # - name: ONBOARD_FACTS
  #   value: "1"
  # Phase 12 WP-C1: classification tree (not a system, prohibited, high, medium, low) with a second
  # person to approve; needs GOVERNANCE_ENABLED. Off by default (docs/classification.md).
  # - name: CLASSIFICATION_V2
  #   value: "1"
  # Phase 9 WP-O3: pre-deploy assessment (verdict GO / NO-GO / QUESTIONS from the facts, readiness,
  # required assurance packs, multi-turn red team and duties); needs ONBOARD_INTAKE. Off by default.
  # - name: ONBOARD_PREDEPLOY
  #   value: "1"
  # Phase 9 WP-O4: Attach tab and panel (wiring picture, guardians on the plug point, last
  # evidence, How to attach env lines). Read only. Off by default.
  # - name: ONBOARD_ATTACH_VIEW
  #   value: "1"
  # Phase 9 WP-O3b: the pre-deploy packs that need a running agent send synthetic turns to the
  # candidate's HTTP chat endpoint (the candidate in SHADOW; the Supervisor's own service principal
  # signs in; https only). Needs ONBOARD_PREDEPLOY. Off by default; an empty host list is off too.
  # Comma list of host names, exact or "*.suffix". Limits: PREDEPLOY_HTTP_TIMEOUT_S (30),
  # PREDEPLOY_HTTP_MAX_TURNS (300 per pack, at most 500), PREDEPLOY_HTTP_BUDGET_S (600 in total).
  # - name: PREDEPLOY_HTTP_TARGET
  #   value: "1"
  # - name: PREDEPLOY_HTTP_ALLOWED_HOSTS
  #   value: "FILL-ME-candidate-app-host.example"
  # Phase 9 WP-O5: Post-deploy tab and panel (SHADOW or RUNNING statistics, judge verdicts, drift,
  # incidents, pack re-runs on traces, timeline) and the agent log of every onboarding step. Read
  # only except the log rows. Off by default.
  # - name: ONBOARD_POSTDEPLOY
  #   value: "1"
  # Guardian detectors (phase 5).
  - name: DETECTORS_ENABLED
    value: "1"
  - name: DOCUMENT_INTAKE_ENABLED
    value: "1"
  # URL fetch for documents: HTTPS only, allow list only. The App has no internet by default.
  - name: URL_FETCH_ENABLED
    value: "0"
  - name: URL_FETCH_ALLOWLIST
    value: "FILL-ME-allowed-domain"
  # Guard model: NO-GO until a real model run (docs/guard-model-decision.md). The chat adapter is
  # set in the WP-L1 block above. To use a classifier endpoint instead, set GUARD_MODEL_ADAPTER to
  # "classifier" there and set these three (uncomment and fill in):
  # - name: GUARD_MODEL_URL
  #   value: "https://FILL-ME-workspace-host/serving-endpoints/FILL-ME-guard-endpoint/invocations"
  # - name: GUARD_MODEL_NAME
  #   value: "FILL-ME-guard-model-id"
  # - name: GUARD_MODEL_VERSION
  #   value: "FILL-ME-guard-model-revision"
  - name: GUARD_MODEL_FAIL_CLOSED_APPROVED
    value: "0"
  # The candidate agents run as separate Apps and call this App with their service principal
  # (docs/deploy/LAUNCH_DATABRICKS.md section 7, docs/ingress-auth.md "Databricks App setup").
  # Turn this on after live test kit item 11 shows which identity headers arrive, and after you
  # map each service principal to its agent id in config/agent_identities.yaml (local copy).
  # - name: INGRESS_AUTH_ENABLED
  #   value: "1"
  # - name: INGRESS_CREDENTIAL_KIND
  #   value: "databricks_proxy"
  # - name: INGRESS_IDENTITIES_FILE
  #   value: "config/agent_identities.yaml"
  # Law agent (WP-L1): drafts duties from the stored official text; a person confirms each draft
  # on /console/regkb/<instrument>/drafts. The CLI runs the agent:
  # python -m supervisor.regkb.lawagent --instrument VN-DEC142-2026. Needs the model settings above.
  # LAWAGENT_MODEL empty = LLM_MODEL. The table regkb_draft comes from bootstrap_schema.
  # - name: LAWAGENT_ENABLED
  #   value: "1"
  # - name: LAWAGENT_MODEL
  #   value: ""
  # Phase 11 WP-W3: internal documents in RegKB (upload, masked text to the gateway model, a person
  # confirms rows). Needs LAWAGENT_ENABLED. Files sit under DATA_DIR/regkb/internal (a persistent
  # volume is needed on Databricks). Off by default (docs/regulations.md).
  # - name: REGKB_INTERNAL
  #   value: "1"
