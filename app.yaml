# Databricks App runtime (WP10). No package index at runtime: dependencies install at BUILD
# from requirements.txt (exported from uv.lock). Start with plain python -m uvicorn, never uv run.
# One worker: the evidence chain has a single writer in one process.
#
# FILL-ME values: edit INLINE in your local copy only. Never commit real values.
# The platform injects DATABRICKS_HOST, DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET
# (the App service principal). Do not set them here. Never set DATABRICKS_TOKEN.
command:
  - python
  - -m
  - uvicorn
  - supervisor.app:app
  - --host
  - "0.0.0.0"
  - --port
  - "8000"
  - --workers
  - "1"
env:
  - name: PYTHONPATH
    value: "src"
  - name: SUPERVISOR_MODE
    value: "databricks_app"
  # The App container has no bank TLS appliance in front of it.
  - name: SSL_OS_TRUSTSTORE
    value: "0"
  - name: SCHEDULER_ENABLED
    value: "1"
  # /tmp is wiped on every restart. Durable files go to a Unity Catalog Volume.
  - name: DATA_DIR
    value: "/Volumes/FILL-ME-catalog/FILL-ME-schema/FILL-ME-volume/supervisor/data"
  # Evidence signing key: write-once object on the Volume (Files API). Never on /tmp.
  - name: SIGNER_KIND
    value: "uc_volume"
  - name: SIGNER_KEY_PATH
    value: "/Volumes/FILL-ME-catalog/FILL-ME-schema/FILL-ME-volume/supervisor/keys/evidence_ed25519.pem"
  - name: SPOOL_DIR
    value: "/Volumes/FILL-ME-catalog/FILL-ME-schema/FILL-ME-volume/supervisor/spool"
  - name: ANCHOR_KIND
    value: "uc_volume"
  - name: ANCHOR_PATH
    value: "/Volumes/FILL-ME-catalog/FILL-ME-schema/FILL-ME-volume/supervisor/anchors"
  # Durable state: Delta tables in this schema (Statement Execution API).
  - name: DATABRICKS_CATALOG
    value: "FILL-ME-catalog"
  - name: DATABRICKS_SCHEMA
    value: "FILL-ME-schema"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Serving endpoint name. LLM_BASE_URL is derived: https://<DATABRICKS_HOST>/serving-endpoints
  # (the workspace's own endpoint, so LLM_ALLOW_REMOTE is implied for that URL only).
  - name: LLM_ENDPOINT
    valueFrom: llm-endpoint
  # ALTERNATIVE (WP-P3): the chat model is a Unity Catalog model service (AI Gateway), not a
  # classic serving endpoint. Then REMOVE the `llm-endpoint` resource in databricks.yml, drop
  # the LLM_ENDPOINT lines above, and use these three lines instead. The App service principal
  # needs EXECUTE (or the equivalent) on the model service in Unity Catalog.
  # - name: LLM_BASE_URL
  #   value: "https://FILL-ME-workspace-host/ai-gateway/mlflow/v1"
  # - name: LLM_MODEL
  #   value: "FILL-ME-catalog.FILL-ME-schema.FILL-ME-model-service"
  # - name: LLM_API_SHAPE
  #   value: "responses"

  # ---- Phase 4 and 5 (v0.5.0). Every switch is off in the code; "1" here turns it on for the
  # sandbox. Set a switch to "0" to switch the feature off again. Nothing below needs a secret.
  # Governance: AI systems, assignment rules, Decision 33 classification, lifecycle (docs/governance.md).
  - name: GOVERNANCE_ENABLED
    value: "1"
  - name: CONSOLE_SYSTEMS_ENABLED
    value: "1"
  # Sidebar with the Governance and Supervisor sections.
  - name: CONSOLE_NAV_SECTIONS
    value: "1"
  - name: CONSOLE_NAV_V3
    value: "1"
  - name: CONSOLE_CATALOG_ENABLED
    value: "1"
  # Risk of a system inherits over the inventory graph.
  - name: INVENTORY_ENABLED
    value: "1"
  # Events map to actions: incident, notify, raise risk, re-evaluate, review (docs/governance-actions.md).
  - name: GOVERNANCE_ACTIONS_ENABLED
    value: "1"
  # Per-system guardian switches with the mandatory floor (docs/guardian-bindings.md).
  - name: GUARDIAN_BINDINGS_ENABLED
    value: "1"
  # POST /mcp and GET /v1/kpis on the same port (docs/mcp-server.md).
  - name: MCP_SERVER_ENABLED
    value: "1"
  # The stub marks outbound events delivered; it sends nothing.
  - name: WEBHOOKS_ENABLED
    value: "0"
  - name: CLASSIFIER_AI_PREFILL
    value: "0"
  - name: TRANSPARENCY_ENABLED
    value: "1"
  # Scan v2 of the workspace (serving endpoints, model versions, Genie, jobs, Vector Search, UC
  # functions, UC connections): OFF until live test kit item 12 has passed. Autoregister: OFF.
  - name: INVENTORY_SCAN_V2
    value: "0"
  - name: INVENTORY_AUTOREGISTER
    value: "0"
  # catalog.schema,catalog.schema whose tables and functions the scan lists (needs scan v2 for functions).
  - name: INVENTORY_SCAN_SCHEMAS
    value: "FILL-ME-catalog.FILL-ME-schema"
  # Guardian detectors (phase 5).
  - name: DETECTORS_ENABLED
    value: "1"
  - name: DOCUMENT_INTAKE_ENABLED
    value: "1"
  # URL fetch for documents: HTTPS only, allow list only. The App has no internet by default.
  - name: URL_FETCH_ENABLED
    value: "0"
  - name: URL_FETCH_ALLOWLIST
    value: "FILL-ME-allowed-domain"
  # Guard model: NO-GO until a real model run (docs/guard-model-decision.md). Stays the labelled
  # mock until you serve a model and set these three (uncomment and fill in):
  - name: GUARD_MODEL_ADAPTER
    value: "auto"
  # - name: GUARD_MODEL_URL
  #   value: "https://FILL-ME-workspace-host/serving-endpoints/FILL-ME-guard-endpoint/invocations"
  # - name: GUARD_MODEL_NAME
  #   value: "FILL-ME-guard-model-id"
  # - name: GUARD_MODEL_VERSION
  #   value: "FILL-ME-guard-model-revision"
  - name: GUARD_MODEL_FAIL_CLOSED_APPROVED
    value: "0"
  # The candidate agents run as separate Apps and call this App with their service principal
  # (docs/deploy/LAUNCH_DATABRICKS.md section 7, docs/ingress-auth.md "Databricks App setup").
  # Turn this on after live test kit item 11 shows which identity headers arrive, and after you
  # map each service principal to its agent id in config/agent_identities.yaml (local copy).
  # - name: INGRESS_AUTH_ENABLED
  #   value: "1"
  # - name: INGRESS_CREDENTIAL_KIND
  #   value: "databricks_proxy"
  # - name: INGRESS_IDENTITIES_FILE
  #   value: "config/agent_identities.yaml"
