  risk_dimension_status: {table: risk_dimension_status, label: "Status of the eight risk types of Circular 53 Art. 14(3) per system, with evidence pointers and a second person for a waiver (flag RISK_DIMENSIONS)", doc: "docs/risk-dimensions.md | Status rows"}
  incident_record: {table: incident, label: "Governance incidents with status and closer", doc: "docs/incidents.md | Table"}
  incident_clock: {module: supervisor.cases.incident_clock, label: "Report due times of a case: 72 h or 5 working days, then 15 days (Decree 142 Art. 19)", doc: "docs/judge-mrm.md | Incident clock"}
  transparency_report: {table: transparency_report, label: "Transparency report rows per agent and variant", doc: "docs/transparency-report.md | Variants"}
  assurance_results: {table: eval_result, label: "Assurance pack results (OWASP, red team, fairness, SBOM, licence, pin and hash packs)", doc: "docs/assurance.md | How results flow"}
  risk_register: {table: risk, label: "Risk register with bands and evidence", doc: "docs/risk-register.md | Model"}
  control_catalogue: {table: control, label: "Control catalogue with owner, review date and evidence status", doc: "docs/controls.md | The control"}
  task_record: {table: task, label: "Lifecycle tasks with stage, role, evidence and waiver record", doc: "docs/controls.md | Tasks and sizing"}
