# RegKB control vocabulary (WP13). control_mapping entries resolve as follows:
#   kind catalogue -> id of a manifest in src/supervisor/catalogue/manifests/*.yaml (test reads them)
#   kind rule      -> rule id in policies/baseline.yaml (test reads it)
#   kind monitor   -> module name in src/supervisor/monitors/ listed under monitors below
#   kind console   -> console screen name below; its path must exist in src/supervisor/console/routes.py
#   kind evidence  -> evidence artefact below; its module or table must exist
#   kind process   -> bank process below (owned by the bank, Supervisor only records evidence of it)
# Entries added in WP-L5 carry an optional doc: "<file> | <heading text>" that names the doc section
# describing the control (a test checks the file and the heading). Console entries are assumed present for
# every supervised product (advisory.compliance.facts.standard_controls); a label that names a flag
# is live only when the deployment sets that flag.
# coverage on a mapping: full = the control alone meets the duty; partial = it helps, more is needed;
# none = no Supervisor control; the bank must act (used with kind process).
schema_version: 1
monitors:
  drift: {module: supervisor.monitors.drift, label: Behaviour drift band per agent}
  fairness: {module: supervisor.monitors.fairness, label: Fairness slices by customer segment}
  multiagent: {module: supervisor.monitors.multiagent, label: Cross-agent pattern checks}
  oversight: {module: supervisor.monitors.oversight, label: Oversight metrics (dwell time, approval rate, chain_ok)}
  quality: {module: supervisor.monitors.quality, label: Quality and groundedness sampling}
  sweeps: {module: supervisor.monitors.sweeps, label: Periodic sweeps over recorded events}
console:
  home: {path: /home, label: Overview}
  cases: {path: /cases, label: Case queue}
  case_detail: {path: "/cases/{case_id}", label: Case file view}
  case_signoff: {path: "/cases/{case_id}/signoff", label: Human sign-off on a case}
  case_verify: {path: "/cases/{case_id}/verify", label: Verify a case against the chain}
  agents: {path: /agents, label: Agent registry and pause or resume switch}
  agent_action: {path: "/agents/{agent_id}/{action}", label: Pause, resume or retire an agent}
  metrics: {path: /metrics, label: Oversight metrics panel}
  evidence: {path: /evidence, label: Evidence chain screen}
  chain_verify: {path: /chain/verify, label: Verify the evidence chain}
  export: {path: /export, label: Audit export}
  onboard: {path: /onboard, label: Onboarding runs}
  inbox: {path: /inbox, label: Notices to reviewers}
  health: {path: /health, label: System health}
  systems: {path: "/systems/{system_id}", label: "AI system page (register, lifecycle, tasks, Decision 33 class, reports)", doc: "docs/console.md | Systems pages"}
  incidents: {path: /incidents, label: "Incident list and transitions (governance incidents)", doc: "docs/incidents.md | Console"}
  transparency: {path: /transparency, label: "Transparency report per agent (regulator, customer, internal variants)", doc: "docs/transparency-report.md | Variants"}
  assurance: {path: /assurance, label: "Assurance pack runs and results", doc: "docs/assurance.md | Catalogue"}
  workflow_actions: {path: "/systems/{system_id}/tasks/{task_id}/done", label: "Task and stage buttons with a second person (flag CONSOLE_WORKFLOW_ACTIONS)", doc: "docs/console.md | Tasks and stage approvals as buttons"}
  state_actions: {path: "/agents/{agent_id}/running/{step}", label: "Request and approve RUNNING by a second person (flag CONSOLE_STATE_ACTIONS)", doc: "docs/decision33.md | Separation of duties"}
  attach_view: {path: "/attach/{node_id}", label: "Guardian attach view with last-7-day evidence (flag ONBOARD_ATTACH_VIEW)", doc: "docs/guardian-bindings.md | Attach view"}
  law_agent_drafts: {path: "/regkb/{instrument_id}/drafts", label: "Law agent drafts confirmed or dropped by a person (flag LAWAGENT_ENABLED)", doc: "docs/regulations.md | Law agent (WP-L1)"}
  duties_actions: {path: "/systems/{system_id}/duties/close", label: "Duties tab: close, waive, re-evaluate (flag RISK_DUTIES)", doc: "docs/console.md | Duties tab"}
  schema_selfcheck: {path: /admin/schema, label: "Start-up schema check with the SQL plan (flag SCHEMA_SELFCHECK)", doc: "docs/console.md | Schema check"}
evidence:
  evidence_chain: {module: supervisor.evidence.chain, label: Hash-chained evidence lanes with signed roots}
  chain_verify_report: {module: supervisor.evidence.verify, label: Offline chain verification report}
  anchor: {module: supervisor.evidence.anchor, label: External anchor of signed roots}
  case_file: {module: supervisor.evidence.casefile, label: Case file (json, html, pdf)}
  audit_pack: {module: supervisor.console.auditpack, label: Audit export pack}
  agent_event_log: {table: agent_event, label: Recorded agent events (tool calls, gate decisions)}
  verdict_log: {table: verdict, label: Judge verdicts with model and prompt version}
  signoff_record: {table: signoff, label: Human sign-off records}
  oversight_metric: {table: oversight_metric, label: Daily oversight metrics per agent}
  fairness_slice: {table: fairness_slice, label: Fairness slice results}
  agent_registry: {table: agent, label: Agent inventory with owner, risk tier, model family}
