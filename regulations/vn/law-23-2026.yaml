- id: VN-LAW23-2026-A2.06-01
  article_ref: Art. 2(6) (amends AML Law Art. 19(1))
  text_vi: '1. Đối tượng báo cáo phải ban hành và thực hiện đầy đủ các chính sách, quy trình để nhận diện
    và đánh giá mức độ rủi ro về rửa tiền trước khi cung cấp sản phẩm, dịch vụ mới; sản phẩm, dịch vụ
    hiện có áp dụng công nghệ đổi mới nhằm mục đích sau đây: a) Phát hiện, ngăn chặn việc sử dụng sản
    phẩm, dịch vụ mới; sản phẩm, dịch vụ hiện có áp dụng công nghệ đổi mới để rửa tiền; b) Quản lý rủi
    ro về rửa tiền khi thiết lập giao dịch với khách hàng sử dụng sản phẩm, dịch vụ mới; sản phẩm, dịch
    vụ hiện có áp dụng công nghệ đổi mới.'
  summary_en: The reporting entity must issue and fully carry out policies and processes to identify and
    assess money-laundering risk before offering new products or services, or existing ones that use new
    technology.
  duties:
  - risk_management_system
  - lifecycle_management
  - fraud_monitoring
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: evidence
    id: predeploy_report
    coverage: partial
    note: 'Pre-deploy report before go-live. Missing: AML risk assessment.'
  - kind: process
    id: go_live_decision
    coverage: partial
    note: 'Manual step: the AML function assesses the risk of each AI product and follows up that the
      process is carried out in full.'
  evidence_needed:
  - AML risk assessment per AI product
  - proof that the process was carried out
