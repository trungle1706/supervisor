- id: VN-LAW23-2026-A2.08-01
  article_ref: Art. 2(8) (replaces AML Law Art. 26(1)-(2))
  text_vi: 1. Đối tượng báo cáo có trách nhiệm báo cáo giao dịch đáng ngờ cho Ngân hàng Nhà nước Việt
    Nam khi có cơ sở hợp lý để nghi ngờ tài sản trong giao dịch là tài sản do phạm tội mà có. Việc xác
    định cơ sở hợp lý để nghi ngờ được thực hiện dựa trên phân tích, đánh giá thông tin khách hàng và
    giao dịch, bao gồm dấu hiệu đáng ngờ quy định tại các điều 27, 28, 29, 30, 31, 32, 33 và 33a của Luật
    này và các dấu hiệu khác do đối tượng báo cáo xác định. 2. Khi phát hiện dấu hiệu đáng ngờ ngoài các
    dấu hiệu quy định tại các điều 27, 28, 29, 30, 31, 32, 33 và 33a của Luật này, đối tượng báo cáo,
    các Bộ, ngành có liên quan thông báo cho Ngân hàng Nhà nước Việt Nam.
  summary_en: The reporting entity reports a suspicious transaction to SBV when it has reasonable grounds
    to suspect that the asset in the transaction comes from crime; the grounds come from analysis of customer
    and transaction information and the signs in the law and other signs that the entity itself defines.
  duties:
  - fraud_monitoring
  - regulatory_reporting
  - explainability
  applies_to:
    agent_class:
    - payment
    - customer_facing
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: split_payment
    coverage: partial
    note: 'Flags splitting. Missing: the grounds analysis and the SBV report.'
  - kind: evidence
    id: case_file
    coverage: partial
    note: 'Case file shows the grounds for a flag. Missing: the report.'
  - kind: process
    id: regulator_notification
    coverage: partial
    note: 'Manual step: the bank defines its own signs (for example from AI model flags), documents the
      grounds and files the report.'
  evidence_needed:
  - definition of own suspicious signs
  - grounds analysis per report
