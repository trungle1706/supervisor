- id: VN-LAW23-2026-A2.03-01
  article_ref: Art. 2(3) (amends AML Law Art. 9(2)(c))
  text_vi: c) Khi nghi ngờ khách hàng hoặc giao dịch của khách hàng hoặc các bên liên quan đến giao dịch,
    kể cả trường hợp giao dịch chưa hoàn thành, có liên quan đến rửa tiền;
  summary_en: A financial institution identifies the customer when it suspects that the customer, the
    transaction or related parties are linked to money laundering, including a transaction that is not
    completed.
  duties:
