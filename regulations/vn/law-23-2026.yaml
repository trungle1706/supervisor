  notes: Added by WP-W0 on 2026-10-28. Amends three laws; only the AML Law amendments touch an AI system
    (new-technology risk assessment, customer identification on suspicion, suspicious transaction reporting
    basis). Art. 1 (SBV Law) and Art. 3 (Law on Credit Institutions, a collateral agent for corporate
    bonds) were read and add no duty for a bank AI system. Not legal advice; bank counsel must confirm.
