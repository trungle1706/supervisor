- id: VN-CPL-2023-A18-01
  article_ref: Art. 18(1), (3)-(4)
  text_vi: '1. Trước khi tổ chức, cá nhân kinh doanh thay đổi mục đích, phạm vi sử dụng thông tin đã thông
    báo cho người tiêu dùng thì phải thông báo lại và được người tiêu dùng đồng ý về việc thay đổi. ...
    3. Tổ chức, cá nhân kinh doanh phải sử dụng thông tin của người tiêu dùng chính xác, phù hợp với mục
    đích, phạm vi đã thông báo và phải được người tiêu dùng đồng ý, trừ các trường hợp sau đây: ... 4.
    Tổ chức, cá nhân kinh doanh thu thập, sử dụng thông tin của người tiêu dùng phải có cơ chế để người
    tiêu dùng lựa chọn việc cho phép hoặc không cho phép thực hiện các hành vi sau đây: ... b) Sử dụng
    thông tin của người tiêu dùng để quảng cáo, giới thiệu sản phẩm, hàng hóa, dịch vụ và hoạt động có
    tính chất thương mại khác.'
  summary_en: Consumer information must be used accurately and only for the notified purpose and scope,
    with new notice and agreement before any change. The consumer must be able to opt out of sharing with
    third parties and of use for advertising. Using chat data to train or tune models, or to market, needs
    this agreement.
