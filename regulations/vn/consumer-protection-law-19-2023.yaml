    tổ chức, cá nhân kinh doanh không được quy định các điều khoản sau đây: ... 1. Hạn chế, loại trừ trách
    nhiệm được pháp luật quy định của tổ chức, cá nhân kinh doanh đối với người tiêu dùng, trừ trường
    hợp pháp luật liên quan quy định trách nhiệm đó được hạn chế, loại trừ; ... 2. Hạn chế, loại trừ quyền
    khiếu nại, khởi kiện của người tiêu dùng; ... 3. Cho phép tổ chức, cá nhân kinh doanh đơn phương thay
    đổi quy định của hợp đồng đã giao kết với người tiêu dùng; ... 15. Quy định trái với nguyên tắc thiện
    chí theo quy định của pháp luật về dân sự, dẫn đến mất cân bằng về quyền và nghĩa vụ của các bên theo
    hướng bất lợi cho người tiêu dùng.'
  summary_en: Consumer contracts and general terms must not exclude the business's legal liability, limit
    the consumer's right to complain or sue, allow the business to change the contract alone, or create
    a bad-faith imbalance. The full list has 15 items. An agent must not offer or accept terms outside
    the approved template.
