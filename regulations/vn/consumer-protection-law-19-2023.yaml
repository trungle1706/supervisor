  confidence: medium
- id: VN-CPL-2023-A10.1A-01
  article_ref: Art. 10(1)(a)
  text_vi: '1. Tổ chức, cá nhân kinh doanh bị nghiêm cấm thực hiện các hành vi sau đây: ... a) Lừa dối
    hoặc gây nhầm lẫn cho người tiêu dùng thông qua việc cung cấp thông tin sai lệch, không đầy đủ, không
    chính xác về một trong các nội dung sau đây: sản phẩm, hàng hóa, dịch vụ mà tổ chức, cá nhân kinh
    doanh bán, cung cấp; uy tín, khả năng kinh doanh, khả năng cung cấp sản phẩm, hàng hóa, dịch vụ của
    tổ chức, cá nhân kinh doanh; nội dung, đặc điểm giao dịch giữa người tiêu dùng với tổ chức, cá nhân
    kinh doanh; hình ảnh, giấy tờ, tài liệu chứng nhận của cơ quan nhà nước có thẩm quyền về sản phẩm,
    hàng hóa, dịch vụ hoặc tổ chức, cá nhân kinh doanh;'
  summary_en: A business must not deceive or mislead consumers by false, incomplete or inaccurate information
    about its products, its capability, the transaction terms or official certificates. An agent that
    invents a fee, rate or policy breaks this rule on behalf of the bank.
  duties:
  - consumer_information
  - fair_treatment
  applies_to:
    agent_class:
    - customer_facing
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: groundedness
    coverage: partial
    note: samples free-text replies against tool results to catch invented fees, terms or promises; advisory
      only
  - kind: catalogue
    id: tier1_monitor
    coverage: partial
    note: scores every trace for suspicion; advisory
  - kind: catalogue
    id: tier2_judge
    coverage: partial
    note: deeper judge on escalated traces
  - kind: process
    id: customer_disclosure
    coverage: none
    note: bank owns the customer-facing notices and terms
  evidence_needed:
  - groundedness results
  - review of escalated misleading-statement cases
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/161263
    title: Luat Bao ve quyen loi nguoi tieu dung so 19/2023/QH15 (vbpl.vn full text)
