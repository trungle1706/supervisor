- id: VN-CPL-2023-A19.1-01
  article_ref: Art. 19(1)-(2)
  text_vi: '1. Tổ chức, cá nhân kinh doanh phải bảo đảm an toàn, an ninh thông tin của người tiêu dùng
    mà họ thu thập, lưu trữ, sử dụng và có biện pháp ngăn ngừa các hành vi sau đây: ... a) Đánh cắp hoặc
    tiếp cận thông tin trái phép; ... b) Sử dụng thông tin trái phép; ... c) Chỉnh sửa, cập nhật, hủy
    bỏ thông tin trái phép. ... 2. Tổ chức, cá nhân kinh doanh phải tiếp nhận và giải quyết phản ánh,
    yêu cầu, khiếu nại của người tiêu dùng liên quan đến việc thông tin bị thu thập trái phép, sử dụng
    sai mục đích, phạm vi đã thông báo.'
  summary_en: The business must keep consumer information safe and prevent theft or unauthorised access,
    use, edit or deletion, and must receive and resolve consumer complaints about unlawful collection
    or misuse of information.
