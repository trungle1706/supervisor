  - kind: catalogue
    id: groundedness
    coverage: partial
    note: samples free-text replies against tool results to catch invented fees, terms or promises; advisory
      only
  - kind: rule
    id: SVC-01
    coverage: partial
    note: caps a single fee waiver an agent can grant
  - kind: rule
    id: SVC-02
    coverage: partial
    note: limits waivers per account per day
  - kind: process
    id: legal_review
    coverage: none
    note: decide the position on agent promises that exceed policy
