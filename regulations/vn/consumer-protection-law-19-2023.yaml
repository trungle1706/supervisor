  - kind: catalogue
    id: pii_bulk_read
    coverage: partial
    note: flags bulk reads of personal data
  - kind: rule
    id: PII-02
    coverage: partial
    note: caps loan application reads per agent per hour
  - kind: process
    id: record_of_processing
