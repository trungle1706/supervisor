    local_path: regulations/sources/VN-CPL-2023/law-19-2023-qh15.txt
  confidence: high
  notes: Prohibition applies to the business; no AI exception exists.
- id: VN-CPL-2023-A10.1B-01
  article_ref: Art. 10(1)(b)
  text_vi: '1. Tổ chức, cá nhân kinh doanh bị nghiêm cấm thực hiện các hành vi sau đây: ... b) Quấy rối
    người tiêu dùng thông qua hành vi tiếp xúc trực tiếp hoặc gián tiếp trái với ý muốn của người tiêu
    dùng để giới thiệu về sản phẩm, hàng hóa, dịch vụ, tổ chức, cá nhân kinh doanh, đề nghị giao kết hợp
    đồng hoặc có hành vi khác gây cản trở công việc, sinh hoạt bình thường của người tiêu dùng;'
  summary_en: A business must not harass consumers by direct or indirect contact against their will to
    offer products or contracts, or in other ways that disturb their normal life. Outbound or repeated
    agent contact for sales or collection can fall here.
  duties:
  - fair_treatment
  applies_to:
    agent_class:
    - customer_facing
  addressee: bank
  control_mapping:
  - kind: process
    id: customer_disclosure
    coverage: none
    note: contact preference and opt-out handling are bank processes
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: shows how often an agent contacted a customer
  evidence_needed:
  - contact frequency limits
  - opt-out register
  verification: VERIFIED_PRIMARY
  sources:
