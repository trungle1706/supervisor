  confidence: medium
  notes: Rules SVC-01 and SVC-02 limit what the demo customer service agent can commit; they do not stop
    it from stating a wrong promise in text.
- id: VN-CPL-2023-A10.1M-01
  article_ref: Art. 10(1)(m)
  text_vi: '1. Tổ chức, cá nhân kinh doanh bị nghiêm cấm thực hiện các hành vi sau đây: ... m) Thu thập,
    lưu trữ, sử dụng, chỉnh sửa, cập nhật, hủy bỏ thông tin của người tiêu dùng trái quy định của pháp
    luật.'
  summary_en: A business must not collect, store, use, edit, update or destroy consumer information against
    the law. For agents this limits what customer data they read and what they keep.
  duties:
  - purpose_limitation
  - data_minimisation
  - lawful_basis
