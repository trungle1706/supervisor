- id: VN-CPL-2023-A20-01
  article_ref: Art. 20(1)-(3)
  text_vi: 1. Người tiêu dùng có quyền yêu cầu tổ chức, cá nhân kinh doanh thực hiện việc kiểm tra, chỉnh
    sửa, cập nhật, hủy bỏ, chuyển giao hoặc ngừng chuyển giao thông tin của mình cho bên thứ ba. ... 2.
    Tổ chức, cá nhân kinh doanh có trách nhiệm thực hiện yêu cầu của người tiêu dùng theo quy định tại
    khoản 1 Điều này hoặc cung cấp cho người tiêu dùng công cụ, thông tin để tự thực hiện theo quy định
    của pháp luật. ... 3. Tổ chức, cá nhân kinh doanh phải hủy bỏ thông tin của người tiêu dùng khi hết
    thời hạn lưu trữ theo quy định tại điểm c khoản 1 Điều 16 của Luật này hoặc quy định khác của pháp
    luật có liên quan.
  summary_en: Consumers may ask to check, correct, update, delete, transfer, or stop transfer of their
    information. The business must act or give a self-service tool, and must delete the data when the
    retention period ends.
