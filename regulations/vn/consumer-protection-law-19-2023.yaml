- id: VN-CPL-2023-A55.1-01
  article_ref: Art. 55(1)
  text_vi: 1. Cơ quan, tổ chức, cá nhân có liên quan có trách nhiệm cung cấp đầy đủ, chính xác và kịp
    thời thông tin, tài liệu theo yêu cầu của cơ quan nhà nước có thẩm quyền, tổ chức xã hội tham gia
    bảo vệ quyền lợi người tiêu dùng trong quá trình giải quyết tranh chấp giữa người tiêu dùng và tổ
    chức, cá nhân kinh doanh theo quy định của pháp luật.
  summary_en: In a consumer dispute, relevant parties must give full, accurate and timely information
    and documents when the competent authority or a consumer organisation asks. The bank must be able
    to produce the record of an agent interaction on request.
  duties:
  - record_keeping
  - complaint_handling
  applies_to:
