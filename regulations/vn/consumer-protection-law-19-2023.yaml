- id: VN-CPL-2023-A17-01
  article_ref: Art. 17(1)-(2)
  text_vi: 1. Tổ chức, cá nhân kinh doanh phải thông báo rõ ràng, công khai, bằng hình thức phù hợp với
    người tiêu dùng về mục đích, phạm vi thu thập, sử dụng thông tin, thời hạn lưu trữ thông tin của người
