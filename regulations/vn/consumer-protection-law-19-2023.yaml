- id: VN-CPL-2023-A39.4-01
  article_ref: Art. 39(4)(c)
  text_vi: '4. Tổ chức thiết lập, vận hành nền tảng số lớn phải thực hiện quy định tại khoản 3 Điều này
    và có trách nhiệm sau đây: ... c) Đánh giá định kỳ việc thực hiện quy định xử lý tài khoản giả, việc
    sử dụng trí tuệ nhân tạo, các giải pháp tự động toàn bộ hoặc tự động một phần.'
  summary_en: A large digital platform must review periodically its handling of fake accounts and its
    use of artificial intelligence and fully or partly automated solutions. Decree 55/2024 Art. 23(2)(d)
    requires it to report this use on request through an online reporting account within 5 working days
    (Art. 23(3)). This is the only AI-specific text in the Law.
  duties:
  - performance_monitoring
  - regulatory_reporting
  - risk_management_system
  applies_to:
    agent_class:
    - customer_facing
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: tier1_monitor
    coverage: partial
    note: continuous scoring of agent traces
  - kind: monitor
    id: oversight
    coverage: partial
    note: oversight metrics per agent
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: export of agent events and metrics for an authority report
  - kind: process
    id: regulator_notification
    coverage: none
    note: online reporting account and 5-day response
  evidence_needed:
  - periodic review report on AI and automated solutions
  - reporting account access
