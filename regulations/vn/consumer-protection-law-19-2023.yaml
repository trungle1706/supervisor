- id: VN-CPL-2023-A23-01
  article_ref: Art. 23(2)-(3)
  text_vi: '2. Ngôn ngữ, hình thức của hợp đồng giao kết với người tiêu dùng, hợp đồng theo mẫu, điều
    kiện giao dịch chung trong trường hợp bằng văn bản phải được thể hiện rõ ràng, dễ hiểu. ... Ngôn ngữ
    sử dụng trong hợp đồng giao kết với người tiêu dùng, hợp đồng theo mẫu, điều kiện giao dịch chung
    là tiếng Việt. Các bên có thể thỏa thuận sử dụng thêm tiếng dân tộc khác của Việt Nam hoặc tiếng nước
    ngoài. Trong trường hợp có sự khác biệt giữa bản tiếng Việt với bản tiếng dân tộc khác của Việt Nam
    hoặc bản tiếng nước ngoài, bản có lợi hơn cho người tiêu dùng được ưu tiên áp dụng. ... 3. Hợp đồng
    theo mẫu phải có các nội dung cơ bản sau đây:'
  summary_en: Consumer contracts, standard-form contracts and general terms must be clear and easy to
    understand, and in Vietnamese (other languages may be added; the version more favourable to the consumer
