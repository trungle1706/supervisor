    trong quá trình cung cấp sản phẩm, hàng hóa, dịch vụ cho người tiêu dùng; ... k) Quy trình xử lý việc
    đổi, trả sản phẩm, hàng hóa, dịch vụ hoặc chấm dứt thực hiện hợp đồng đã giao kết; ... l) Quy trình
    tiếp nhận và giải quyết phản ánh, yêu cầu, khiếu nại của người tiêu dùng. ... 2. Trường hợp giao dịch
