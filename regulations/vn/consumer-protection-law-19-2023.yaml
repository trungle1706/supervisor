    local_path: regulations/sources/VN-CPL-2023/law-19-2023-qh15.txt
  confidence: high
  notes: The bank is a 'to chuc, ca nhan kinh doanh' (Art. 3(2)) when it sells financial services to individuals
    for personal use. Sector rules on banking consumer protection may add duties (not covered in this
    file).
- id: VN-CPL-2023-A8.2-01
  article_ref: Art. 8(2)(c)
  text_vi: c) Khi người tiêu dùng dễ bị tổn thương có yêu cầu được bảo vệ kèm theo chứng cứ, tài liệu
    chứng minh mình là người tiêu dùng dễ bị tổn thương và về việc quyền lợi của mình bị xâm phạm, tổ
    chức, cá nhân kinh doanh phải ưu tiên tiếp nhận, xử lý và không chuyển yêu cầu của người tiêu dùng
    cho bên thứ ba giải quyết, trừ trường hợp bên thứ ba đó có nghĩa vụ liên quan. Trường hợp từ chối
    giải quyết yêu cầu của người tiêu dùng dễ bị tổn thương, tổ chức, cá nhân kinh doanh phải trả lời
    bằng văn bản, trong đó nêu rõ căn cứ pháp lý và sự không phù hợp với nội dung chính sách đã công bố
    theo quy định tại khoản 3 Điều này;
  summary_en: When a vulnerable consumer (for example elderly, disabled, child, poor household member)
    asks for protection with evidence, the business must handle the request with priority, must not pass
    it to a third party to resolve (unless that party has a related duty), and must refuse only in writing
    with legal grounds. If an AI agent triages complaints, it must not deflect these requests.
  duties:
  - fair_treatment
  - complaint_handling
  - right_to_human_review
  applies_to:
    agent_class:
    - customer_facing
  addressee: bank
  control_mapping:
  - kind: process
    id: complaint_handling
    coverage: none
    note: bank owns the complaint procedure
  - kind: process
    id: customer_disclosure
    coverage: none
    note: published policy for vulnerable consumers (Art. 8(3)(e))
  - kind: monitor
    id: fairness
    coverage: partial
    note: fairness slices can show worse outcomes for flagged segments if the segment data exists
  evidence_needed:
  - priority handling procedure
  - written refusal template with legal grounds
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/161263
    title: Luat Bao ve quyen loi nguoi tieu dung so 19/2023/QH15 (vbpl.vn full text)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 6a5b7ad27a893e3e8ed0f96f660d328b50373f190ede2d99d7c8fc70b3d2a1ce
    local_path: regulations/sources/VN-CPL-2023/law-19-2023-qh15.txt
  confidence: high
  notes: Late or refused priority handling makes the business liable for damages (Art. 8(2)(d)). A Supervisor
    case queue can route a case to a human reviewer but cannot know a customer is vulnerable unless that
    data is given.
- id: VN-CPL-2023-A8.3-01
  article_ref: Art. 8(3)(c)-(e)
  text_vi: '3. Khi giao dịch với người tiêu dùng dễ bị tổn thương, tổ chức, cá nhân kinh doanh có trách
    nhiệm sau đây: ... c) Không được từ chối giải quyết yêu cầu được bảo vệ của người tiêu dùng dễ bị
    tổn thương quy định tại điểm c khoản 2 Điều này do khác biệt về tiếng nói, chữ viết, phong tục, tập
    quán; ... d) Chống kỳ thị, phân biệt đối xử, lợi dụng yếu tố dễ bị tổn thương để xâm phạm quyền, lợi
    ích hợp pháp của người tiêu dùng trong quá trình thực hiện giao dịch; ... đ) Xây dựng, ban hành trình
    tự, thủ tục, phương thức hoặc biện pháp phù hợp với từng đối tượng người tiêu dùng dễ bị tổn thương
    để bảo đảm quyền khiếu nại, yêu cầu giải quyết tranh chấp và các quyền khác của người tiêu dùng dễ
    bị tổn thương; ... e) Xây dựng, cập nhật, công khai cho người tiêu dùng dễ bị tổn thương các nội dung
    quy định tại khoản này theo hình thức niêm yết tại trụ sở, địa điểm kinh doanh hoặc đăng tải trên
    trang thông tin điện tử, phần mềm ứng dụng (nếu có) và đào tạo, tập huấn cho người lao động của mình
    về các nội dung đó.'
  summary_en: When dealing with vulnerable consumers the business must not refuse a request because of
    language or custom, must prevent stigma and discrimination and not exploit the vulnerability, must
    have suitable complaint procedures per group, must publish them and train staff. The duty to publish
    and train does not apply to micro and small businesses unless they run remote or special transactions.
  duties:
  - fair_treatment
  - bias_monitoring
  - complaint_handling
  - staff_competence
  applies_to:
    agent_class:
    - customer_facing
  addressee: bank
  control_mapping:
  - kind: monitor
    id: fairness
    coverage: partial
    note: fairness slices by customer segment; need segment labels from the bank
  - kind: catalogue
    id: fairness_slices
    coverage: partial
    note: slice results per segment
  - kind: process
    id: complaint_handling
    coverage: none
    note: bank owns the complaint procedure
  - kind: process
    id: staff_training
    coverage: none
    note: training records for staff and agent operators
  evidence_needed:
  - published policy for vulnerable consumers
  - training records
  - fairness slice report
  verification: VERIFIED_PRIMARY
