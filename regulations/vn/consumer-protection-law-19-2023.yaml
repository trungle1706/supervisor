obligations:
- id: VN-CPL-2023-A4.2-01
  article_ref: Art. 4(2)
  text_vi: 2. Được cung cấp hóa đơn, chứng từ, tài liệu liên quan đến giao dịch; thông tin kịp thời, chính
    xác, đầy đủ về sản phẩm, hàng hóa, dịch vụ, nội dung giao dịch, nguồn gốc, xuất xứ sản phẩm, hàng
    hóa, dịch vụ và về tổ chức, cá nhân kinh doanh.
  summary_en: A consumer has the right to timely, accurate and complete information about the product,
    service, transaction terms and the business. A customer-facing agent must not give wrong or partial
    information on fees, rates or terms.
  duties:
  - consumer_information
  applies_to:
    agent_class:
    - customer_facing
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: groundedness
    coverage: partial
    note: samples free-text replies against tool results to catch invented fees, terms or promises; advisory
      only
  - kind: catalogue
    id: tier1_monitor
    coverage: partial
    note: scores every trace for suspicion; advisory
  - kind: process
    id: customer_disclosure
    coverage: none
    note: bank owns the customer-facing notices and terms
  evidence_needed:
  - groundedness sampling results
  - approved product information source for the agent
  verification: VERIFIED_PRIMARY
  sources:
