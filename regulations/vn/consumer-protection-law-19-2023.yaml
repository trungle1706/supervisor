  confidence: medium
  notes: Supervisor has no rule on outbound contact frequency in the baseline policy.
- id: VN-CPL-2023-A10.1E-01
  article_ref: Art. 10(1)(e)
  text_vi: '1. Tổ chức, cá nhân kinh doanh bị nghiêm cấm thực hiện các hành vi sau đây: ... e) Không đền
    bù, trả lại tiền hoặc đổi lại sản phẩm, hàng hóa, dịch vụ cho người tiêu dùng do sản phẩm, hàng hóa,
    dịch vụ không đúng với đăng ký, thông báo, công bố, niêm yết, quảng cáo, giới thiệu, giao kết, cam
    kết của tổ chức, cá nhân kinh doanh;'
  summary_en: A business must not refuse compensation, refund or exchange when a product or service does
    not match what it announced, advertised, agreed or promised. If an agent promises a benefit, waiver
    or price, the bank may have to honour it.
  duties:
  - fair_treatment
  - consumer_information
  applies_to:
    agent_class:
    - customer_facing
  addressee: bank
