    tin; ... c) Thời hạn lưu trữ thông tin; ... d) Biện pháp bảo vệ thông tin, bảo đảm an toàn thông tin
    của người tiêu dùng. ... 2. Nội dung quy định tại khoản 1 Điều này phải được tổ chức, cá nhân kinh
    doanh công khai theo hình thức niêm yết ở vị trí dễ nhìn thấy tại trụ sở, địa điểm kinh doanh và đăng
    tải trên trang thông tin điện tử, phần mềm ứng dụng (nếu có), tạo điều kiện để người tiêu dùng tiếp
    cận trước hoặc tại thời điểm thu thập thông tin.'
