  confidence: high
  notes: Consumer-information rules in Arts 15-20 sit beside the personal data law (VN-PDPL-2025).
- id: VN-CPL-2023-A15-01
  article_ref: Art. 15(1)-(2)
  text_vi: 1. Tổ chức, cá nhân kinh doanh tự mình hoặc ủy quyền, thuê bên thứ ba thực hiện việc thu thập,
    lưu trữ, sử dụng, chỉnh sửa, cập nhật, hủy bỏ thông tin của người tiêu dùng phải bảo đảm an toàn,
    an ninh thông tin của người tiêu dùng theo quy định của Luật này và quy định khác của pháp luật có
    liên quan. ... 2. Trường hợp tổ chức, cá nhân kinh doanh ủy quyền hoặc thuê bên thứ ba thực hiện việc
    thu thập, lưu trữ, sử dụng, chỉnh sửa, cập nhật, hủy bỏ thông tin của người tiêu dùng thì phải được
    sự đồng ý của người tiêu dùng. Việc ủy quyền hoặc thuê bên thứ ba phải được thực hiện bằng văn bản,
    trong đó quy định rõ phạm vi, trách nhiệm của mỗi bên trong việc bảo vệ thông tin của người tiêu dùng
    theo quy định của Luật này và quy định khác của pháp luật có liên quan.
  summary_en: If a business has a third party collect, store, use or edit consumer information, it needs
    the consumer's agreement and a written authorisation that sets the scope and each side's duty, and
    it must keep the information safe. Sending consumer data to an external model vendor or judge falls
    under this.
  duties:
  - processor_contract
  - consent
  - outsourcing_oversight
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
