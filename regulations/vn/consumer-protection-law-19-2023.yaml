  text_vi: 'Tổ chức, cá nhân kinh doanh có trách nhiệm sau đây: ... 1. Cung cấp thông tin chính xác, đầy
    đủ về các nội dung sau đây: ... a) Sản phẩm, hàng hóa, dịch vụ, bao gồm: đo lường, số lượng, khối
