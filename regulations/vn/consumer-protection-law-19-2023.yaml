- id: VN-CPL-2023-A19.3-01
  article_ref: Art. 19(3)
  text_vi: 3. Trong trường hợp hệ thống thông tin bị tấn công làm phát sinh nguy cơ mất an toàn, an ninh
    thông tin của người tiêu dùng, tổ chức, cá nhân kinh doanh hoặc bên lưu trữ thông tin liên quan phải
    thông báo cho cơ quan quản lý nhà nước có thẩm quyền trong thời hạn 24 giờ kể từ thời điểm phát hiện
    hệ thống thông tin bị tấn công và thực hiện các biện pháp cần thiết để bảo đảm an toàn, an ninh thông
    tin của người tiêu dùng theo quy định của pháp luật về an ninh mạng, an toàn thông tin mạng, giao
    dịch điện tử và quy định khác của pháp luật có liên quan.
  summary_en: If an information system is attacked and consumer information is at risk, the business or
    the storing party must notify the competent authority within 24 hours of discovery and take the measures
    needed to protect the information.
