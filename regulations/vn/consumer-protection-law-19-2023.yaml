  text_vi: '1. Khi giao dịch từ xa với người tiêu dùng, tổ chức, cá nhân kinh doanh có trách nhiệm xây
    dựng công cụ và thực hiện biện pháp bảo đảm sau đây: ... a) Cung cấp chính xác, đầy đủ nội dung hợp
    đồng để người tiêu dùng nghiên cứu trước khi giao kết hợp đồng; ... b) Người tiêu dùng trao đổi, làm
    rõ nội dung hợp đồng và xác nhận đồng ý giao kết hợp đồng; ... c) Người tiêu dùng xem lại và tải về
    hợp đồng đã có xác nhận ký kết của người tiêu dùng. ... 3. Trường hợp tổ chức, cá nhân kinh doanh
    cung cấp không chính xác hoặc không đầy đủ thông tin quy định tại khoản 1 Điều 37 của Luật này, người
    tiêu dùng có quyền sau đây: ... b) Trong thời hạn 30 ngày kể từ ngày giao kết hợp đồng, đơn phương
    chấm dứt thực hiện hợp đồng đã giao kết và thông báo cho tổ chức, cá nhân kinh doanh. Người tiêu dùng
    không phải trả bất kỳ chi phí nào dưới mọi hình thức để chấm dứt thực hiện hợp đồng, trừ chi phí đối
    với phần sản phẩm, hàng hóa, dịch vụ đã sử dụng;'
  summary_en: In remote contracts the business must build tools so the consumer can read the full contract,
    discuss and clarify it, confirm agreement, and review and download the signed contract. If the required
    information was wrong or incomplete, the consumer may end the contract within 30 days without cost
    except for use already made.
  duties:
  - consumer_information
  - fair_treatment
  - record_keeping
  applies_to:
    agent_class:
    - customer_facing
  addressee: bank
