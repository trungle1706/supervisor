  notes: 'LEAD REVIEW 2026-10-15: all claims tagged VERIFIED_SECONDARY because the only text read is a commercial reproduction (luatvietnam.vn), not an official copy; the stored file is kept for reference. STATUS: treated as superseded in substance by Circular 50/2024/TT-NHNN (effective 2025-01-01),
    which restates the same A-D transaction types and the same 10 million / 20 million VND biometric thresholds
    (Appendices 01-02). Source for supersession: div.gov.vn (secondary). The Circular''s own repeal list
    (Art. 22(5)-(6)) names Circulars 35/2016, 35/2018 and Art. 25 of Circular 09/2020 but NOT Decision
    2345; no formal repeal of the Decision was found and the SBV 2024/2025 lists of expired documents
    were not read (Decision 157/QD-NHNN 2025 lists only titles without login). So ''formally repealed''
    is NOT verified. Treat Circular 50/2024 as the operative text; keep this file for the history of the
    biometric rule. The Decision is an administrative decision of the Governor, not listed on vbpl.vn
    (vbpl keyword search found nothing); full text is a reproduction from luatvietnam.vn (the thuvienphapluat.vn
    page returns no body to scripts). The Decision replaced Decision 630/QD-NHNN of 2017-03-31. SBV dispatch
    5262/NHNN-CNTT (2024-06-26) gave implementation guidance (summary only, not stored). Not legal advice;
    bank counsel must confirm.'
obligations:
- id: VN-QD2345-2023-APP1-01
  article_ref: Art. 1 with Appendix 01 group I.3 and Appendix 02 type C (individuals)
  text_vi: |-
    Giao dịch thỏa mãn một trong các trường hợp sau: 1. Trường hợp 1: Giao dịch thỏa mãn các điều kiện: (i) G ≤ 10 triệu VND. (ii) G + Tksth > 20 triệu VND. (iii) G + T ≤ 1,5 tỷ VND. 2. Trường hợp 2: Giao dịch thỏa mãn các điều kiện; (i) G > 10 triệu VND. (ii) G ≤ 500 triệu VND. (iii) G + T ≤ 1,5 tỷ VND. Giao dịch thỏa mãn một trong các trường hợp sau:
    ...
    - Bằng dấu hiệu nhận dạng sinh trắc học của khách hàng: (i) khớp đúng với dữ liệu sinh trắc học được lưu trong chip của thẻ căn cước công dân (CCCD) của khách hàng do cơ quan Công an cấp4; (ii) hoặc thông qua xác thực tài khoản định danh điện tử của khách hàng do hệ thống định danh và xác thực điện tử tạo lập5. - Hoặc bằng dấu hiệu nhận dạng sinh trắc học của khách hàng khớp đúng với dữ liệu sinh trắc học được lưu trong cơ sở dữ liệu (CSDL) sinh trắc học về khách hàng đã thu thập và kiểm tra6, khuyến khích kết hợp với phương thức xác thực OTP gửi qua SMS/Voice hoặc Soft OTP/Token OTP.
  summary_en: Biometric match is required for an individual's online transfer to another account holder,
    bank or e-wallet when one transfer is above 10 million VND, or the day total of earlier type A and
    B transfers plus this one is above 20 million VND (type C, up to 1.5 billion VND per day and 500 million
    VND per transfer; above that type D). The biometric match is against the CCCD chip or VNeID, or the
    bank's collected biometric database, and is advised together with an OTP.
  duties:
  - biometric_verification
  - transaction_authentication
  - transaction_limits
  applies_to: &id002
    agent_class:
    - payment
    data_classes:
    - financial
  addressee: bank
  control_mapping:
  - kind: rule
    id: PAY-02
    coverage: partial
    note: Supervisor blocks a single transfer above 100,000,000 VND; it does NOT authenticate the customer,
      the bank channel does
  - kind: rule
    id: PAY-03
    coverage: partial
    note: Supervisor flags daily transfers from one account above 150,000,000 VND; not the legal G + Tksth
      rule
  - kind: catalogue
    id: single_limit
    coverage: partial
    note: amount cap per tool call from the agent manifest
  - kind: catalogue
    id: daily_aggregate
    coverage: partial
    note: daily sum or count per account
  - kind: process
    id: security_assessment
    coverage: none
    note: the bank's channel performs the biometric match; Supervisor gates do not
  evidence_needed:
  - Channel configuration showing biometric step above 10 million VND per transfer or 20 million VND per
    day
  verification: VERIFIED_SECONDARY
  sources: &id003
  - *id001
  confidence: high
  notes: Carried on in Circular 50/2024 (see VN-TT50-2024-APP02-01). Note the original here advised OTP
    with biometric as 'encouraged'; Circular 50 makes OTP plus biometric the minimum for type C.
- id: VN-QD2345-2023-A1-01
  article_ref: Art. 1
  text_vi: 'Điều 1. Các tổ chức tín dụng, chi nhánh ngân hàng nước ngoài, tổ chức cung ứng dịch vụ trung
    gian thanh toán căn cứ phân loại giao dịch tại Phụ lục 01 đính kèm, triển khai áp dụng các biện pháp
    xác thực trong thanh toán trực tuyến trên Internet (Internet Banking, Mobile Banking) như sau:'
  summary_en: Banks and payment intermediaries must classify online transactions into types A to D (Appendix
    01) and apply at least the authentication measure of that type (Appendix 02). Other measures need
    a written report to the SBV 3 months before use.
  duties:
  - transaction_authentication
  - transaction_limits
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: rule
    id: PAY-02
    coverage: partial
    note: Supervisor blocks a single transfer above 100,000,000 VND; it does NOT authenticate the customer,
      the bank channel does
  - kind: rule
    id: PAY-03
    coverage: partial
    note: Supervisor flags daily transfers from one account above 150,000,000 VND; not the legal G + Tksth
      rule
  - kind: catalogue
    id: single_limit
    coverage: partial
    note: amount cap per tool call from the agent manifest
  - kind: catalogue
    id: daily_aggregate
    coverage: partial
    note: daily sum or count per account
  evidence_needed:
  - Rules per transaction type in the channel
  verification: VERIFIED_SECONDARY
  sources: *id003
  confidence: high
  notes: Superseded in substance by Circular 50/2024 Art. 10(1) and Appendices.
- id: VN-QD2345-2023-A2.1-01
  article_ref: Art. 2(1)
  text_vi: '1. Đối với khách hàng cá nhân, trước khi thực hiện giao dịch lần đầu bằng ứng dụng Mobile
    Banking hoặc trước khi thực hiện giao dịch trên thiết bị khác với thiết bị thực hiện giao dịch Mobile
    Banking lần gần nhất thì phải xác thực khách hàng:'
  summary_en: Before an individual's first Mobile Banking transaction, or the first on a different device
    from the last one, the customer must be authenticated by biometric match (CCCD chip or VNeID, or the
    bank's collected biometrics together with an OTP).
  duties:
  - biometric_verification
  - transaction_authentication
  applies_to:
    agent_class:
    - payment
    - customer_facing
    data_classes:
    - financial
    - personal
  addressee: bank
  control_mapping:
  - kind: process
    id: security_assessment
    coverage: none
    note: bank channel function
  evidence_needed:
  - Test showing the new-device biometric step
  verification: VERIFIED_SECONDARY
  sources: *id003
  confidence: high
  notes: Now Art. 8(6) of Circular 50/2024, with SMS/Voice OTP also allowed.
- id: VN-QD2345-2023-A2.3-01
  article_ref: Art. 2(3)
  text_vi: 3. Lưu trữ thông tin về thiết bị thực hiện các giao dịch trực tuyến của khách hàng và nhật
    ký (log) xác thực giao dịch tối thiểu trong vòng 3 tháng.
  summary_en: The bank must keep device identity data and transaction authentication logs for at least
    3 months. Logs hold the method, time, transaction id and customer id.
  duties:
  - logging
  - record_keeping
  - retention
  applies_to:
    agent_class:
    - payment
    - customer_facing
    data_classes:
    - financial
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: evidence_chain
    coverage: partial
    note: hash-chained record of agent actions
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: recorded tool calls
  - kind: process
    id: records_retention
    coverage: none
    note: channel logs are the bank's
  evidence_needed:
  - Retention setting of at least 3 months for device and authentication logs
  verification: VERIFIED_SECONDARY
  sources: *id003
  confidence: high
  notes: Circular 50/2024 Art. 7(7) now requires 3 months online and 1 year backup.
- id: VN-QD2345-2023-A3-01
  article_ref: Art. 3
  text_vi: |-
    1. Thông báo giao dịch qua tin nhắn SMS hoặc thư điện tử.
    2. Thiết lập hạn mức giao dịch trong ngày.
    3. Thiết lập tính năng cho phép/ không cho phép thanh toán trực tuyến.
    4. Thiết lập hạn mức thanh toán thẻ trực tuyến trong ngày.
    5. Thiết lập tính năng cho phép/ không cho phép thanh toán ở nước ngoài (ngoại trừ các giao dịch trực tuyến).
    6. Triển khai giải pháp xác thực 3D Secure (hoặc tương đương) cho việc thanh toán trực tuyến với thẻ quốc tế.
  summary_en: A card payment provider must send transaction notices by SMS or email, set daily transaction
    and daily online payment limits, let the customer switch online and foreign payments on or off, and
    use 3D Secure (or equal) for international cards online.
  duties:
  - transaction_limits
  - fraud_monitoring
  - consumer_information
  applies_to:
    agent_class:
    - payment
    - customer_facing
    data_classes:
    - financial
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: single_limit
    coverage: partial
    note: amount cap per tool call from the agent manifest
  - kind: catalogue
    id: daily_aggregate
    coverage: partial
    note: daily sum or count per account
  - kind: process
    id: customer_disclosure
    coverage: none
    note: customer notices and card controls are the issuer's
  evidence_needed:
  - Card control settings
  - Notice templates
  verification: VERIFIED_SECONDARY
  sources: *id003
  confidence: high
  notes: Now Art. 7(9) and Appendices 03-04 of Circular 50/2024.
