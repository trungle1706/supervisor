- id: VN-DEC142-2026-A16.03-01
  article_ref: Art. 16(3)
  text_vi: Nhà cung cấp và bên triển khai phải giải trình khi có yêu cầu bằng văn bản của cơ quan nhà
    nước có thẩm quyền theo quy định tại Điều 14 và Điều 15 của Luật Trí tuệ nhân tạo.
  summary_en: Provider and deployer must explain the system when the authority asks in writing. Scope
    and time limit depend on the party's role and the system's risk.
  duties:
  - regulatory_reporting
  - explainability
  - record_keeping
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: 'Audit export pack. Missing: no intake or tracking of a written request from the authority; the
      answer is written by people.'
  - kind: evidence
    id: case_file
    coverage: partial
    note: Case file export can hold the facts for a report; Supervisor does not file the report.
  - kind: evidence
    id: transparency_report
    coverage: partial
    note: Transparency report (regulator variant) is a ready explanation of identity, class and controls.
  - kind: console
    id: transparency
    coverage: partial
    note: Console page that builds the report per agent.
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: counsel receives the written request, sets the scope and time limit, and approves
      the answer; source code and trade secrets stay protected (Art. 16(4)).'
  evidence_needed:
  - response procedure for written requests
  verification: VERIFIED_PRIMARY
