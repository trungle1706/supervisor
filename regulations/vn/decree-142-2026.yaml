  article_ref: Art. 18(1)
  text_vi: Bên triển khai phải thông báo rõ ràng khi cung cấp ra công cộng nội dung do hệ thống trí tuệ nhân tạo tạo ra hoặc chỉnh sửa có khả năng gây nhầm lẫn về tính xác thực của sự kiện, nhân vật hoặc nguồn gốc nội dung
  summary_en: The deployer must clearly notify when it releases to the public AI-made or AI-edited content that could be mistaken for authentic events, persons or origin.
  duties:
  - content_labelling
  - ai_disclosure
  applies_to:
    agent_class:
    - customer_facing
    role:
    - deployer
  addressee: deployer
  control_mapping:
