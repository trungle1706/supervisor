- id: VN-DEC142-2026-A46.01-01
  article_ref: Art. 46(1)
  text_vi: Trường hợp Cổng thông tin điện tử một cửa về trí tuệ nhân tạo chưa được Bộ Khoa học và Công
    nghệ công bố vận hành chính thức, việc thực hiện các thủ tục thông báo, báo cáo theo quy định của
    Nghị định này được thực hiện thông qua hệ thống thông tin điện tử, dịch vụ công trực tuyến hoặc phương
    thức tiếp nhận do Bộ Khoa học và Công nghệ công bố
  summary_en: Until the one-stop portal is officially live, notices and reports go through an interim
    electronic channel announced by the Ministry of Science and Technology. Such filings have equal legal
    value.
  duties:
  - registration
  - regulatory_reporting
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - kind: process
    id: ai_registration
    coverage: partial
    note: 'Manual step: check which interim channel the Ministry announced and record it before the first
      filing. No Supervisor control: the announcement is outside knowledge and Supervisor is offline by
      design (a watcher is planned in Phase 11).'
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: counsel confirms whether the portal is live and which channel applies.'
  evidence_needed:
  - check which channel MST announced
  verification: VERIFIED_PRIMARY
