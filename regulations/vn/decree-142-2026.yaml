  article_ref: Art. 19(6)
  text_vi: Cơ quan nhà nước có thẩm quyền tiếp nhận báo cáo, tổ chức xác minh và hướng dẫn xử lý sự cố nghiêm trọng; khi cần thiết, có quyền yêu cầu tạm dừng hoạt động, thu hồi hoặc đánh giá lại hệ thống trí tuệ nhân tạo
  summary_en: The authority can verify an incident and order a pause, recall or re-assessment of the system.
