- id: VN-DEC142-2026-A16.06-01
  article_ref: Art. 16(6)
  text_vi: Trường hợp hệ thống trí tuệ nhân tạo tích hợp mô hình trí tuệ nhân tạo của tổ chức, cá nhân
    khác, nhà cung cấp phải thỏa thuận với tổ chức, cá nhân cung cấp mô hình để bảo đảm việc phối hợp
    cung cấp thông tin kỹ thuật cần thiết
  summary_en: A provider that builds on another party's AI model must agree with that party on supplying
    the technical information needed for transparency and accountability.
  duties:
  - outsourcing_oversight
  - technical_documentation
  applies_to:
    agent_class:
    - any
    role:
    - provider
  addressee: provider
  control_mapping:
  - kind: process
    id: vendor_management
    coverage: partial
    note: 'Manual step: put a clause in the contract with the model vendor that it supplies the technical
      information needed for transparency and accountability. No Supervisor control: the duty is a contract
      term; Supervisor cannot see contracts.'
  evidence_needed:
  - contract clause on technical information from the model vendor
  verification: VERIFIED_PRIMARY
  sources:
