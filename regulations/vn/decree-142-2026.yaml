- id: VN-DEC142-2026-A19.03-01
  article_ref: Art. 19(3)
  text_vi: 'Nhà cung cấp hoặc bên triển khai phải báo cáo sơ bộ sự cố nghiêm trọng cho cơ quan nhà nước
    có thẩm quyền theo Mẫu AI01a đối với tổ chức hoặc Mẫu AI01b đối với cá nhân tại Phụ lục ban hành kèm
    theo Nghị định này thông qua Cổng thông tin điện tử một cửa về trí tuệ nhân tạo trong thời hạn như
    sau: a) Đối với các sự cố nghiêm trọng có tính khẩn cấp quy định tại điểm a, điểm d khoản 1 Điều này
    và trường hợp không thể kiểm soát đối với quy định tại điểm c khoản 1 Điều này: thực hiện báo cáo
    sơ bộ trong thời hạn 72 giờ kể từ thời điểm xác nhận sự cố; b) Đối với các sự cố nghiêm trọng còn
    lại: thực hiện báo cáo sơ bộ trong thời hạn 05 ngày làm việc kể từ thời điểm xác nhận sự cố;'
  summary_en: 'Provider or deployer must send a preliminary serious-incident report (form AI01a for organisations)
    through the portal: within 72 hours of confirming the incident for urgent cases (loss of life or serious
    injury, serious disruption of essential services or national security, uncontrollable serious rights
    breaches), and within 5 working days for all others. If the deployer cannot reach the provider, the
    deployer reports.'
  duties:
  - incident_report
  - incident_report_72h
  - regulatory_reporting
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: deployer
  control_mapping:
  - kind: evidence
    id: incident_clock
    coverage: partial
    note: 'Case clock computes the due time of the preliminary report (72 hours if urgent, else 5 working
      days) and records ''report sent''. Missing: Supervisor does not fill form AI01a or send it; the confirmation
      time is taken as the case detection time and urgency is guessed from severity (ASSUMED in incident_clock.py).'
  - kind: evidence
    id: case_file
    coverage: partial
    note: Case file export can hold the facts for a report; Supervisor does not file the report.
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: Hash-chained record of gate decisions and verdicts; the bank still owns retention and access.
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: Recorded tool calls and gate decisions per agent.
  - kind: process
    id: regulator_notification
    coverage: partial
    note: 'Manual step: fill form AI01a and send it through the portal; the case clock only tells when.'
  - kind: process
    id: incident_management
    coverage: partial
    note: 'Manual step: a named person confirms the incident (Art. 19(3)(c)) and decides urgent or not.'
  evidence_needed:
  - incident clock started at confirmation
  - preliminary report on form AI01a
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/5/18/469480-1778814202_v1_1779067280_signed.pdf
    title: Nghị định số 142/2026/NĐ-CP (Công báo số 278 ngày 18-05-2026), text extracted from the gazette
      PDF
    fetched_at: '2026-10-15'
    kind: primary
    sha256: b8e0be6bc8ff2396a6a6c1fb894e3a7e1531e85c06518ad25a869b6062ea536b
    local_path: regulations/sources/VN-DEC142-2026/142-2026-nd-cp.txt
  - url: https://media.chinhphu.vn/ban-hanh-nghi-dinh-quy-dinh-chi-tiet-mot-so-dieu-va-bien-phap-thi-hanh-luat-tri-tue-nhan-tao-102260508162952667.htm
