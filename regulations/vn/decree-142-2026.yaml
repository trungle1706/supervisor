- id: VN-DEC142-2026-A15.05-01
  article_ref: Art. 15(5)
  text_vi: 'Trong quá trình triển khai và vận hành, bên triển khai thực hiện các biện pháp quản lý rủi
    ro sau đây: a) Vận hành hệ thống đúng mục đích sử dụng, điều kiện sử dụng và giới hạn sử dụng do nhà
    cung cấp xác định; b) Tổ chức giám sát hoạt động của hệ thống nhằm phát hiện sai lệch, rủi ro hoặc
    sự cố có thể phát sinh; c) Thiết lập và duy trì cơ chế giám sát và can thiệp của con người trong quá
    trình sử dụng hệ thống theo quy định của pháp luật; d) Áp dụng biện pháp hạn chế hoặc kiểm soát rủi
    ro trong phạm vi quyền kiểm soát của mình khi phát hiện hệ thống hoạt động không đúng mục đích sử
    dụng hoặc phát sinh rủi ro mới; đ) Phối hợp với nhà cung cấp trong việc rà soát, cập nhật biện pháp
    quản lý rủi ro khi hệ thống có thay đổi đáng kể hoặc khi phát sinh sự cố.'
  summary_en: 'Deployer measures: operate within the provider''s purpose and limits; monitor for deviation,
    risk and incidents; set up and keep human monitoring and intervention; restrict or control risk when
    the system acts outside purpose; help the provider update controls.'
  duties:
  - performance_monitoring
  - human_oversight
  - excessive_agency_limits
  - risk_management_system
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
  addressee: deployer
  control_mapping:
  - kind: monitor
    id: drift
    coverage: partial
    note: 'Behaviour drift band per agent. Missing: the provider''s purpose and limits are not read in;
      a test of the human intervention path is not recorded; the written usage limits are the bank''s.'
  - kind: catalogue
    id: drift_band
    coverage: partial
    note: Behaviour drift band.
  - kind: monitor
    id: quality
    coverage: partial
    note: Quality and groundedness sampling.
  - kind: console
    id: agents
    coverage: partial
    note: Agent registry screen with the pause switch.
  - kind: console
    id: agent_action
    coverage: partial
    note: Pause, resume or retire switch stops an agent after it acts; it is not human approval before execution.
  - kind: monitor
    id: oversight
    coverage: partial
    note: Dwell time, approval rate and chain_ok metrics show whether the human step is real.
  - kind: catalogue
    id: approved_tools
    coverage: partial
    note: Tool allow-list keeps the agent inside its purpose.
  - kind: console
    id: attach_view
    coverage: partial
    note: Attach view shows which guardians are plugged in and gave evidence in the last 7 days (flag ONBOARD_ATTACH_VIEW).
  - kind: evidence
    id: facts_card
    coverage: partial
    note: Facts card shows the purpose and limits found in the code, with file and line (flag ONBOARD_FACTS).
  evidence_needed:
  - monitoring in place
  - human intervention path tested
  - provider's usage limits written down
  verification: VERIFIED_PRIMARY
