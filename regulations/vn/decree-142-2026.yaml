  control_mapping:
  - kind: evidence
    id: policy_baseline
    coverage: partial
    note: 'Versioned policy baseline (the rules enforced at the gate). Missing: the written procedure for
      each high-risk agent and its approval are the bank''s; the provider''s technical guidance is not read
      in.'
  - kind: evidence
    id: coverage_rows
    coverage: partial
    note: Capability coverage per agent.
  - kind: evidence
    id: risk_register
    coverage: partial
    note: Risk register holds risks per system with bands, owners and runtime evidence.
  - kind: evidence
    id: control_catalogue
    coverage: partial
