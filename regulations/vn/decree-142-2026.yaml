    kind: secondary
  confidence: high
  notes: High-risk status depends on the Decision 33 classification (VN-QD33-2026) and the thresholds
    in Circular 53/2026/TT-NHNN. Art. 13(1) of the Decree puts the assessment on the provider; Art. 5(4)
    names both. The bank should hold the provider's result and fill gaps for its own deployment.
- id: VN-DEC142-2026-A6.04-01
  article_ref: Art. 6(4)
  text_vi: Trường hợp bên triển khai sửa đổi, tích hợp, thay đổi chức năng hoặc mục đích sử dụng của hệ
    thống so với công bố ban đầu của nhà cung cấp làm phát sinh rủi ro mới hoặc rủi ro cao hơn, bên triển
    khai có trách nhiệm phối hợp với nhà cung cấp để rà soát, phân loại lại mức độ rủi ro.
  summary_en: If the deployer changes, integrates or re-purposes a system beyond the provider's original
    statement and risk rises, the deployer must help re-classify it.
  duties:
  - risk_classification
  - change_control
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: deployer
  control_mapping:
  - kind: evidence
    id: agent_version
    coverage: partial
    note: 'A new version row marks a change of model, tools or policy beyond the first statement. Missing:
      no automatic comparison with the provider''s original statement of purpose; no change record linked
      to a re-classification outcome.'
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: Registry keeps the risk tier now in use for the agent.
  - kind: evidence
    id: classification_record
    coverage: partial
    note: Decision 33 classification rows give the class before and after a change.
  - kind: console
    id: duties_actions
    coverage: partial
    note: Re-evaluate runs the duties matrix again on the stored answers (flag RISK_DUTIES).
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: deployer helps the provider re-classify; counsel confirms ''beyond the provider''s
      original statement'' and records the outcome.'
  evidence_needed:
  - change record and re-classification outcome
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/5/18/469480-1778814202_v1_1779067280_signed.pdf
