- id: VN-DEC142-2026-A11.05-01
  article_ref: Art. 11(5)
  text_vi: Trường hợp hệ thống trí tuệ nhân tạo phải phân loại lại thành rủi ro cao theo quy định tại
    điểm a khoản 1 Điều này, nhà cung cấp, bên triển khai áp dụng thời gian chuyển tiếp tối đa 12 tháng
    kể từ ngày quyết định sửa đổi, bổ sung Danh mục hệ thống trí tuệ nhân tạo có rủi ro cao của Thủ tướng
    Chính phủ có hiệu lực để hoàn thiện hồ sơ và thủ tục đánh giá sự phù hợp theo quy định của Luật Trí
    tuệ nhân tạo. Trong thời hạn chuyển tiếp, hệ thống được phép tiếp tục hoạt động nhưng nhà cung cấp,
    bên triển khai phải thiết lập và duy trì cơ chế giám sát thực chất của con người. Người thực hiện
    giám sát phải được bảo đảm đủ thông tin, thẩm quyền để đánh giá độc lập, can thiệp hoặc bác bỏ kết
    quả của hệ thống; đồng thời, nhà cung cấp, bên triển khai phải lưu trữ đầy đủ nhật ký vận hành và
    các quyết định can thiệp để phục vụ công tác thanh tra, kiểm tra.
  summary_en: A system re-classified to high risk after a significant change gets up to 12 months from
    the list change taking effect to finish conformity work. Meanwhile it may run, but real human oversight
    and full logs of operation and interventions are mandatory.
  duties:
  - human_oversight
  - logging
  - record_keeping
  - conformity_assessment
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
  addressee: any
  control_mapping:
  - kind: console
    id: agents
    coverage: partial
    note: 'Agent registry screen with the pause switch. Missing: a reviewer can reject a result before it
      takes effect only if the agent waits for the sign-off; the 12-month plan and the conformity file are
      the bank''s.'
  - kind: console
    id: agent_action
    coverage: partial
    note: Pause, resume or retire switch stops an agent after it acts; it is not human approval before execution.
  - kind: console
    id: case_signoff
    coverage: partial
    note: Records a named human decision on a case; counts as pre-execution approval only if the agent code
      waits for it.
  - kind: monitor
    id: oversight
    coverage: partial
    note: Dwell time, approval rate and chain_ok metrics show whether the human step is real.
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: Hash-chained record of gate decisions and verdicts; the bank still owns retention and access.
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: Recorded tool calls and gate decisions per agent (the operation log of the transition).
  - kind: evidence
    id: guardian_off_approval
    coverage: partial
    note: A guardian cannot be switched off without a reason and, on production or high-risk systems, a
      second person (flag CONSOLE_STATE_ACTIONS).
  - kind: process
    id: conformity_assessment_file
    coverage: partial
    note: 'Manual step: finish the conformity file within 12 months of the list change taking effect.'
  evidence_needed:
  - human can review independently and reject results
  - logs of operation and every intervention kept
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/5/18/469480-1778814202_v1_1779067280_signed.pdf
