- id: VN-DEC142-2026-A15.04-01
  article_ref: Art. 15(4)
  text_vi: Bên triển khai hệ thống trí tuệ nhân tạo có rủi ro cao phải tổ chức quản lý rủi ro trong quá trình triển khai và vận hành hệ thống phù hợp với mục đích sử dụng, phạm vi triển khai, mức độ rủi ro của hệ thống và hướng dẫn kỹ thuật của nhà cung cấp.
  summary_en: The deployer of a high-risk system must run risk management during deployment and operation that fits purpose, scope, risk level and the provider's technical instructions.
  duties:
  - risk_management_system
  - governance_accountability
  applies_to: *id007
  addressee: deployer
  control_mapping:
  - kind: evidence
    id: policy_baseline
    coverage: partial
    note: versioned policy baseline
  - kind: evidence
    id: coverage_rows
    coverage: partial
    note: capability coverage per agent
  - kind: process
    id: board_governance
    coverage: none
    note: board or committee oversight of AI
  - kind: process
    id: internal_policy_issuance
    coverage: none
    note: bank issues the internal policy
  evidence_needed:
  - risk management procedure for each high-risk agent
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: 'High-risk status depends on the Decision 33 classification (VN-QD33-2026) and the thresholds in Circular 53/2026/TT-NHNN. '
- id: VN-DEC142-2026-A15.05-01
  article_ref: Art. 15(5)
  text_vi: 'Trong quá trình triển khai và vận hành, bên triển khai thực hiện các biện pháp quản lý rủi ro sau đây: a) Vận hành hệ thống đúng mục đích sử dụng, điều kiện sử dụng và giới hạn sử dụng do nhà cung cấp xác định; b) Tổ chức giám sát hoạt động của hệ thống nhằm phát hiện sai lệch, rủi ro hoặc sự cố có thể phát sinh; c) Thiết lập và duy trì cơ chế giám sát và can thiệp của con người trong quá trình sử dụng hệ thống theo quy định của pháp luật; d) Áp dụng biện pháp hạn chế hoặc kiểm soát rủi ro trong phạm vi quyền kiểm soát của mình khi phát hiện hệ thống hoạt động không đúng mục đích sử dụng hoặc phát sinh rủi ro mới; đ) Phối hợp với nhà cung cấp trong việc rà soát, cập nhật biện pháp quản lý rủi ro khi hệ thống có thay đổi đáng kể hoặc khi phát sinh sự cố.'
  summary_en: 'Deployer measures: operate within the provider''s purpose and limits; monitor for deviation, risk and incidents; set up and keep human monitoring and intervention; restrict or control risk when the system acts outside purpose; help the provider update controls.'
  duties:
  - performance_monitoring
  - human_oversight
  - excessive_agency_limits
  - risk_management_system
  applies_to: *id007
  addressee: deployer
  control_mapping:
