- id: VN-DEC142-2026-A12.06-01
  article_ref: Art. 12(6)
  text_vi: Nhà cung cấp, bên triển khai có trách nhiệm lưu trữ hồ sơ phân loại trong suốt thời gian hệ
    thống hoạt động.
  summary_en: Provider and deployer must keep the classification file for as long as the system runs.
  duties:
  - record_keeping
  - retention
  - risk_classification
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: 'Registry holds the identity, owner and tier of the system. Missing: the classification file of
      Art. 12(2) (provider documents a-d) is not generated as one file; retention for the life of the system
      is the bank''s.'
  - kind: evidence
    id: onboard_profile
    coverage: partial
    note: Onboarding profile is a seed for the classification file.
  - kind: evidence
    id: classification_record
    coverage: partial
    note: Decision 33 classification rows are kept with the system.
  - kind: evidence
    id: transparency_report
    coverage: partial
    note: Transparency report (regulator variant) puts identity, class, controls and evidence state in one
      document.
  - kind: evidence
    id: facts_card
    coverage: partial
    note: Facts card lists tools, models and data with file and line (flag ONBOARD_FACTS).
  - kind: process
    id: records_retention
    coverage: partial
    note: 'Manual step: keep the classification file for the whole life of the system, in the bank''s retention
      schedule.'
  evidence_needed:
  - classification file retained for the life of the system
  verification: VERIFIED_PRIMARY
