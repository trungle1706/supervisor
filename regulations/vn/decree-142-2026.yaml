  article_ref: Art. 14(1)
  text_vi: Nhà cung cấp hệ thống trí tuệ nhân tạo có rủi ro trung bình và hệ thống trí tuệ nhân tạo có rủi ro cao phải thông báo kết quả phân loại rủi ro cho Bộ Khoa học và Công nghệ thông qua Cổng thông tin điện tử một cửa về trí tuệ nhân tạo trước khi đưa hệ thống vào sử dụng.
  summary_en: The provider of a medium or high-risk system must notify the Ministry of Science and Technology of the classification through the one-stop portal before use. The portal returns a system identifier.
