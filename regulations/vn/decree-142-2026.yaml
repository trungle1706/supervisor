- id: VN-DEC142-2026-A19.03-01
  article_ref: Art. 19(3)
  text_vi: 'Nhà cung cấp hoặc bên triển khai phải báo cáo sơ bộ sự cố nghiêm trọng cho cơ quan nhà nước có thẩm quyền theo Mẫu AI01a đối với tổ chức hoặc Mẫu AI01b đối với cá nhân tại Phụ lục ban hành kèm theo Nghị định này thông qua Cổng thông tin điện tử một cửa về trí tuệ nhân tạo trong thời hạn như sau: a) Đối với các sự cố nghiêm trọng có tính khẩn cấp quy định tại điểm a, điểm d khoản 1 Điều này và trường hợp không thể kiểm soát đối với quy định tại điểm c khoản 1 Điều này: thực hiện báo cáo sơ bộ trong thời hạn 72 giờ kể từ thời điểm xác nhận sự cố; b) Đối với các sự cố nghiêm trọng còn lại: thực hiện báo cáo sơ bộ trong thời hạn 05 ngày làm việc kể từ thời điểm xác nhận sự cố;'
  summary_en: 'Provider or deployer must send a preliminary serious-incident report (form AI01a for organisations) through the portal: within 72 hours of confirming the incident for urgent cases (loss of life or serious injury, serious disruption of essential services or national security, uncontrollable serious rights breaches), and within 5 working days for all others. If the deployer cannot reach the provider, the deployer reports.'
  duties:
  - incident_report
  - incident_report_72h
  - regulatory_reporting
  applies_to: *id005
  addressee: deployer
  control_mapping:
  - *id013
  - *id012
  - *id014
  - *id016
  - *id015
  evidence_needed:
  - incident clock started at confirmation
  - preliminary report on form AI01a
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: Confirmation time is when there is enough initial information that the incident really happened and likely stems from the AI system (Art. 19(3)(c)). A report is not an admission of fault. A report under cybersecurity or personal-data law may run in parallel (Art. 19(5)). The 24-hour period in the SBV draft circular did not survive into Circular 53/2026/TT-NHNN, which refers back to this rule.
