- id: VN-DEC142-2026-A16.02-01
  article_ref: Art. 16(2)
  text_vi: 'Nhà cung cấp và bên triển khai phải thực hiện các nghĩa vụ sau đây: a) Thông báo, đánh dấu
    kỹ thuật và gắn nhãn hiển thị đối với hệ thống trí tuệ nhân tạo và nội dung do hệ thống tạo ra theo
    quy định của pháp luật; b) Cung cấp thông tin về mục đích sử dụng, phạm vi áp dụng, điều kiện sử dụng
    và các hạn chế của hệ thống trí tuệ nhân tạo; c) Lưu trữ thông tin, tài liệu phục vụ việc kiểm tra,
    giám sát theo quy định của pháp luật.'
  summary_en: 'Provider and deployer must: notify, mark and label per the law; give information on purpose,
    scope, conditions and limits of the system; and store information and documents for checks.'
  duties:
  - ai_disclosure
  - content_labelling
  - record_keeping
  - consumer_information
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: 'Hash-chained record of gate decisions and verdicts; the bank still owns retention and access.
      Missing: the AI notice and label in the customer channel; Supervisor stores information for inspectors
      but does not display notices.'
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: Audit export for inspectors.
  - kind: evidence
    id: transparency_report
    coverage: partial
    note: 'Transparency report: purpose, class, controls, limits; variants for regulator, customer and internal
      readers.'
  - kind: console
    id: transparency
    coverage: partial
    note: Console page that builds the report per agent.
  - kind: process
    id: customer_disclosure
    coverage: partial
    note: 'Manual step: show the AI notice and the statement of limits to customers in the bank channel.'
  evidence_needed:
  - AI notice
  - statement of limits
  - document store for inspectors
  verification: VERIFIED_PRIMARY
