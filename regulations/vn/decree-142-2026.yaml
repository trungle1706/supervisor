- id: VN-DEC142-2026-A5.04-01
  article_ref: Art. 5(4)
  text_vi: Nhà cung cấp và bên triển khai phải thực hiện đánh giá sự phù hợp đối với hệ thống trí tuệ
    nhân tạo có rủi ro cao theo quy định của Luật Trí tuệ nhân tạo và Nghị định này.
  summary_en: Provider AND deployer must carry out the conformity assessment of a high-risk system.
  duties:
  - conformity_assessment
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
  addressee: any
  control_mapping:
  - kind: evidence
    id: launch_report
    coverage: partial
    note: 'Launch sandbox report (catch rate, false alarms, GO or NO-GO) is test evidence for the dossier;
      it is not a conformity assessment. Missing: the conformity result itself (registered body or provider
      self-assessment) and the deployer''s part of it.'
  - kind: evidence
    id: predeploy_report
    coverage: partial
    note: Pre-deploy report lists facts, readiness, required packs and duties with pointers (flag ONBOARD_PREDEPLOY).
  - kind: evidence
    id: assurance_results
    coverage: partial
    note: Pack results (red team, injection, fairness, SBOM) can be attached as technical evidence.
  - kind: process
    id: conformity_assessment_file
    coverage: partial
    note: 'Manual step: keep the provider''s certificate or technical file and the deployer''s own part
      of the assessment; Supervisor stores no certificate.'
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: counsel confirms that the system is high risk under the list and which route applies.'
  evidence_needed:
  - conformity dossier or provider's certificate on file
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/5/18/469480-1778814202_v1_1779067280_signed.pdf
    title: Nghị định số 142/2026/NĐ-CP (Công báo số 278 ngày 18-05-2026), text extracted from the gazette
