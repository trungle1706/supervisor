- id: VN-DEC142-2026-A15.06-01
  article_ref: Art. 15(6)
  text_vi: Trường hợp phát hiện hệ thống có nguy cơ gây thiệt hại nghiêm trọng đến tính mạng, sức khỏe
    con người, quyền con người, tài sản, an ninh mạng, trật tự, an toàn xã hội hoặc lợi ích công cộng,
    bên triển khai phải kịp thời áp dụng biện pháp hạn chế rủi ro trong phạm vi quyền kiểm soát của mình
    và thông báo cho nhà cung cấp và cơ quan nhà nước có thẩm quyền theo quy định của pháp luật.
  summary_en: If the deployer finds a risk of serious harm, it must promptly limit the risk within its
    control and notify the provider and the authority.
  duties:
  - incident_response
  - incident_report
  - serious_incident_suspension
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: deployer
  control_mapping:
  - kind: console
    id: agent_action
    coverage: partial
    note: 'Pause, resume or retire switch stops an agent after it acts; it is not human approval before
      execution. Missing: the decision that harm is serious, the notice to the provider and the notice to
      the authority.'
  - kind: console
    id: agents
    coverage: partial
    note: Agent registry screen with the pause switch.
  - kind: evidence
    id: case_file
    coverage: partial
    note: Case file export can hold the facts for a report; Supervisor does not file the report.
  - kind: evidence
    id: incident_record
    coverage: partial
    note: Incident rows record the event and who closed it.
  - kind: evidence
    id: incident_clock
    coverage: partial
    note: Case clock computes the report due times; it does not send anything.
  - kind: process
    id: regulator_notification
    coverage: partial
    note: 'Manual step: the bank notifies the provider and the authority through the portal or SBV.'
  - kind: process
    id: incident_management
    coverage: partial
    note: 'Manual step: a named person decides that the risk is serious and orders the restriction.'
  evidence_needed:
  - pause or restriction applied
  - notice to provider and authority
  verification: VERIFIED_PRIMARY
