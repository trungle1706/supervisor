- id: VN-DEC142-2026-A13.01-01
  article_ref: Art. 13(1)
  text_vi: Nhà cung cấp hệ thống trí tuệ nhân tạo có rủi ro cao phải thực hiện đánh giá sự phù hợp trước
    khi đưa hệ thống vào sử dụng theo quy định tại khoản 1 Điều 13 của Luật Trí tuệ nhân tạo.
  summary_en: The provider of a high-risk system must complete the conformity assessment before the system
    is used, and repeat it after significant changes (model, architecture, data source, integration, purpose).
  duties:
  - conformity_assessment
  - change_control
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - provider
  addressee: provider
  control_mapping:
  - kind: evidence
    id: agent_version
    coverage: partial
    note: 'Version history helps decide ''significant change'' (model, tools, configuration). Missing: a
      model or configuration change does not start a new conformity assessment by itself; the result is
      not held in Supervisor.'
  - kind: evidence
    id: lifecycle_approval
    coverage: partial
    note: The lifecycle has a re-evaluation stage; the move needs an approver at high level.
  - kind: evidence
    id: launch_report
    coverage: partial
    note: Launch report is sandbox evidence for the assessment after a change.
  - kind: process
    id: conformity_assessment_file
    coverage: partial
    note: 'Manual step: provider completes and repeats the conformity assessment; the bank keeps the result
      and the change assessment log.'
  evidence_needed:
  - conformity result
  - change assessment log
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/5/18/469480-1778814202_v1_1779067280_signed.pdf
