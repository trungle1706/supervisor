obligations:
- id: VN-DEC142-2026-A5.03-01
  article_ref: Art. 5(3)
  text_vi: Bên triển khai phải phối hợp với nhà cung cấp để rà soát, phân loại lại hệ thống trí tuệ nhân tạo khi việc triển khai, sửa đổi, tích hợp hoặc thay đổi chức năng hoặc mục đích sử dụng làm phát sinh rủi ro mới hoặc rủi ro cao hơn của hệ thống đã được phân loại.
  summary_en: The deployer must work with the provider to review and re-classify the system when deployment, changes, integration or a new function or purpose creates new or higher risk.
  duties:
  - risk_classification
  - change_control
  applies_to: &id005
    agent_class:
    - any
    role:
    - deployer
  addressee: deployer
  control_mapping:
  - &id006
    kind: evidence
    id: agent_registry
    coverage: partial
    note: agent inventory with owner, risk tier and model family
  - kind: evidence
    id: agent_version
    coverage: partial
    note: version history shows functional change
  - &id004
    kind: process
    id: legal_review
    coverage: none
    note: bank counsel confirms scope and reading
  evidence_needed:
  - re-classification record linked to each functional change
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
- id: VN-DEC142-2026-A5.04-01
  article_ref: Art. 5(4)
  text_vi: Nhà cung cấp và bên triển khai phải thực hiện đánh giá sự phù hợp đối với hệ thống trí tuệ nhân tạo có rủi ro cao theo quy định của Luật Trí tuệ nhân tạo và Nghị định này.
  summary_en: Provider AND deployer must carry out the conformity assessment of a high-risk system.
  duties:
  - conformity_assessment
  applies_to: &id007
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
  addressee: any
  control_mapping:
  - kind: process
    id: conformity_assessment_file
    coverage: none
    note: conformity dossier
  - *id004
  evidence_needed:
  - conformity dossier or provider's certificate on file
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: High-risk status depends on the Decision 33 classification (VN-QD33-2026) and the thresholds in Circular 53/2026/TT-NHNN. Art. 13(1) of the Decree puts the assessment on the provider; Art. 5(4) names both. The bank should hold the provider's result and fill gaps for its own deployment.
- id: VN-DEC142-2026-A6.04-01
  article_ref: Art. 6(4)
  text_vi: Trường hợp bên triển khai sửa đổi, tích hợp, thay đổi chức năng hoặc mục đích sử dụng của hệ thống so với công bố ban đầu của nhà cung cấp làm phát sinh rủi ro mới hoặc rủi ro cao hơn, bên triển khai có trách nhiệm phối hợp với nhà cung cấp để rà soát, phân loại lại mức độ rủi ro.
  summary_en: If the deployer changes, integrates or re-purposes a system beyond the provider's original statement and risk rises, the deployer must help re-classify it.
  duties:
  - risk_classification
  - change_control
  applies_to: *id005
  addressee: deployer
  control_mapping:
  - *id006
  - kind: evidence
    id: agent_version
    coverage: partial
    note: version history
  - *id004
  evidence_needed:
  - change record and re-classification outcome
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
- id: VN-DEC142-2026-A8.02B-01
  article_ref: Art. 8(2)(b)
  text_vi: Có cơ chế kỹ thuật và quy trình vận hành bảo đảm sự giám sát thực chất của con người, theo đó người có thẩm quyền có khả năng xem xét độc lập, can thiệp, từ chối hoặc thay đổi quyết định của hệ thống trước khi quyết định đó có hiệu lực;
  summary_en: 'A system can stay off the high-risk list proposal when a technical mechanism and process give real human oversight: an authorised person can review independently, intervene, reject or change the decision BEFORE it takes effect.'
  duties:
  - human_oversight
  - pre_execution_approval
  - risk_classification
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - &id009
    kind: console
    id: case_signoff
    coverage: partial
    note: records a named human decision on a case; counts as pre-execution approval only if the agent code waits for it
  - &id010
    kind: monitor
    id: oversight
    coverage: partial
    note: dwell time, approval rate and chain_ok metrics show whether the human step is real
  - kind: evidence
    id: signoff_record
    coverage: partial
    note: signoff records show a named human decision
  - &id008
    kind: console
    id: agent_action
    coverage: partial
    note: pause, resume or retire switch stops an agent after it acts; it is not human approval before execution
  evidence_needed:
  - code path where the agent waits for a named human before the action takes effect
  - dwell time and override rate
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: This is the criterion for DRAFTING the list (aimed at ministries), not a self-service exemption. Decision 33 (VN-QD33-2026) Appendix IV applies when no human check, approval or control happens before execution. Supervisor pause acts after the action and does not meet 'before the decision takes effect'. Supervisor can only evidence a human gate that exists in code.
- id: VN-DEC142-2026-A11.01-01
  article_ref: Art. 11(1)
  text_vi: 'Nhà cung cấp phải thực hiện rà soát và phân loại lại mức độ rủi ro của hệ thống trí tuệ nhân tạo khi phát sinh một trong các sự kiện pháp lý sau đây: a) Hệ thống có sự thay đổi đáng kể về chức năng, mục đích sử dụng hoặc ngữ cảnh triển khai làm ảnh hưởng đến tiêu chí phân loại rủi ro ban đầu của hệ thống; b) Hệ thống xảy ra sự cố nghiêm trọng chứng minh mức độ rủi ro thực tế cao hơn mức đã được phân loại; c) Có quyết định của Thủ tướng Chính phủ về việc sửa đổi, bổ sung Danh mục hệ thống trí tuệ nhân tạo có rủi ro cao làm thay đổi mức độ rủi ro của hệ thống; d) Có yêu cầu bằng văn bản của cơ quan quản lý nhà nước có thẩm quyền theo quy định tại khoản 6 Điều 10 của Luật Trí tuệ nhân tạo.'
  summary_en: The provider must review and re-classify the risk level on a significant functional change, a serious incident showing higher risk, a Prime Minister list change, or a written authority request.
  duties:
  - risk_classification
  - change_control
  applies_to:
    agent_class:
    - any
    role:
    - provider
  addressee: provider
  control_mapping:
  - *id006
  - *id004
  evidence_needed:
  - trigger log for re-classification
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
- id: VN-DEC142-2026-A11.03A-01
  article_ref: Art. 11(3)(a)
  text_vi: Trường hợp kết quả phân loại lại xác định mức độ rủi ro của hệ thống cao hơn mức đã phân loại, nhà cung cấp, bên triển khai phải thực hiện thông báo kết quả phân loại lại cho cơ quan nhà nước có thẩm quyền trong thời hạn 15 ngày làm việc kể từ ngày hoàn thành việc rà soát và phải áp dụng ngay các biện pháp quản lý rủi ro tương ứng với mức độ rủi ro mới;
  summary_en: If re-classification raises the risk level, provider and deployer must notify the authority within 15 working days after the review and apply the matching risk controls at once.
  duties:
  - risk_classification
  - regulatory_reporting
  - registration
  applies_to: *id005
  addressee: any
  control_mapping:
  - kind: process
    id: ai_registration
    coverage: none
    note: portal notice
  - *id006
  - *id004
  evidence_needed:
  - notice sent within 15 working days
  - controls for the new level switched on
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
- id: VN-DEC142-2026-A11.05-01
  article_ref: Art. 11(5)
  text_vi: Trường hợp hệ thống trí tuệ nhân tạo phải phân loại lại thành rủi ro cao theo quy định tại điểm a khoản 1 Điều này, nhà cung cấp, bên triển khai áp dụng thời gian chuyển tiếp tối đa 12 tháng kể từ ngày quyết định sửa đổi, bổ sung Danh mục hệ thống trí tuệ nhân tạo có rủi ro cao của Thủ tướng Chính phủ có hiệu lực để hoàn thiện hồ sơ và thủ tục đánh giá sự phù hợp theo quy định của Luật Trí tuệ nhân tạo. Trong thời hạn chuyển tiếp, hệ thống được phép tiếp tục hoạt động nhưng nhà cung cấp, bên triển khai phải thiết lập và duy trì cơ chế giám sát thực chất của con người. Người thực hiện giám sát phải được bảo đảm đủ thông tin, thẩm quyền để đánh giá độc lập, can thiệp hoặc bác bỏ kết quả của hệ thống; đồng thời, nhà cung cấp, bên triển khai phải lưu trữ đầy đủ nhật ký vận hành và các quyết định can thiệp để phục vụ công tác thanh tra, kiểm tra.
  summary_en: A system re-classified to high risk after a significant change gets up to 12 months from the list change taking effect to finish conformity work. Meanwhile it may run, but real human oversight and full logs of operation and interventions are mandatory.
  duties:
  - human_oversight
  - logging
  - record_keeping
  - conformity_assessment
  applies_to: *id007
  addressee: any
  control_mapping:
  - &id011
    kind: console
    id: agents
    coverage: partial
    note: agent registry screen with the pause switch
  - *id008
  - *id009
  - *id010
  - &id012
    kind: evidence
    id: evidence_chain
    coverage: partial
    note: hash-chained record of gate decisions and verdicts; the bank still owns retention and access
  - &id014
    kind: evidence
    id: agent_event_log
    coverage: partial
    note: recorded tool calls and gate decisions per agent
  evidence_needed:
  - human can review independently and reject results
  - logs of operation and every intervention kept
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: 'High-risk status depends on the Decision 33 classification (VN-QD33-2026) and the thresholds in Circular 53/2026/TT-NHNN. The Decree says ''real oversight'' (giám sát thực chất): the overseer must have enough information and authority to judge independently, intervene or reject.'
- id: VN-DEC142-2026-A12.06-01
  article_ref: Art. 12(6)
  text_vi: Nhà cung cấp, bên triển khai có trách nhiệm lưu trữ hồ sơ phân loại trong suốt thời gian hệ thống hoạt động.
  summary_en: Provider and deployer must keep the classification file for as long as the system runs.
  duties:
  - record_keeping
  - retention
  - risk_classification
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - *id006
  - kind: process
    id: records_retention
    coverage: none
    note: retention schedule
  - kind: evidence
    id: onboard_profile
    coverage: partial
    note: onboarding profile is a seed for the file
  evidence_needed:
  - classification file retained for the life of the system
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
- id: VN-DEC142-2026-A13.01-01
  article_ref: Art. 13(1)
  text_vi: Nhà cung cấp hệ thống trí tuệ nhân tạo có rủi ro cao phải thực hiện đánh giá sự phù hợp trước khi đưa hệ thống vào sử dụng theo quy định tại khoản 1 Điều 13 của Luật Trí tuệ nhân tạo.
  summary_en: The provider of a high-risk system must complete the conformity assessment before the system is used, and repeat it after significant changes (model, architecture, data source, integration, purpose).
  duties:
  - conformity_assessment
  - change_control
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - provider
  addressee: provider
  control_mapping:
  - kind: process
    id: conformity_assessment_file
    coverage: none
    note: dossier
  - kind: evidence
    id: agent_version
    coverage: partial
    note: version history helps decide 'significant change'
  evidence_needed:
  - conformity result
  - change assessment log
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: 'High-risk status depends on the Decision 33 classification (VN-QD33-2026) and the thresholds in Circular 53/2026/TT-NHNN. '
- id: VN-DEC142-2026-A13.02-01
  article_ref: Art. 13(2)
  text_vi: 'Nhà cung cấp phải thực hiện đánh giá sự phù hợp với yêu cầu của Điều 14 của Luật Trí tuệ nhân tạo theo các phương thức sau đây: a) Đối với hệ thống trí tuệ nhân tạo có rủi ro cao thuộc Danh mục hệ thống trí tuệ nhân tạo phải chứng nhận sự phù hợp trước khi đưa vào sử dụng, nhà cung cấp phải thực hiện đánh giá sự phù hợp thông qua tổ chức đánh giá sự phù hợp quy định tại khoản 4 Điều này; b) Đối với hệ thống trí tuệ nhân tạo có rủi ro cao không thuộc trường hợp quy định tại điểm a khoản này, nhà cung cấp có quyền tự thực hiện đánh giá sự phù hợp hoặc sử dụng dịch vụ của tổ chức đánh giá sự phù hợp quy định tại khoản 4 Điều này. Trường hợp tự thực hiện đánh giá sự phù hợp, nhà cung cấp phải lập hồ sơ kỹ thuật và chịu trách nhiệm trước pháp luật về kết quả đánh giá.'
  summary_en: 'Two routes: items on the mandatory-certification list need a registered conformity assessment body; other high-risk items can be self-assessed (with a technical file and legal responsibility) or assessed by a body.'
  duties:
  - conformity_assessment
  - technical_documentation
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - provider
  addressee: provider
  control_mapping:
  - kind: process
    id: conformity_assessment_file
    coverage: none
    note: dossier
  - kind: evidence
    id: launch_report
    coverage: partial
    note: launch report is sandbox evidence, not a legal assessment
  evidence_needed:
  - route chosen and evidence
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: High-risk status depends on the Decision 33 classification (VN-QD33-2026) and the thresholds in Circular 53/2026/TT-NHNN. In Decision 33 the two banking entries are marked under the 'point b' column (not the mandatory third-party certification column), based on the table layout of the gazette PDF. Counsel should confirm.
