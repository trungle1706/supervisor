- id: VN-DEC142-2026-A17.01-01
  article_ref: Art. 17(1)
  text_vi: Nhà cung cấp hệ thống trí tuệ nhân tạo phải áp dụng giải pháp kỹ thuật để nội dung đầu ra là
    âm thanh, hình ảnh hoặc video được đánh dấu ở định dạng máy đọc theo quy định tại khoản 2 Điều 11
    của Luật Trí tuệ nhân tạo. Nhà cung cấp không bắt buộc phải thực hiện đánh dấu kỹ thuật ở định dạng
    máy đọc đối với nội dung đầu ra là văn bản, trừ trường hợp pháp luật có quy định khác.
  summary_en: The provider must apply a technical mark in machine-readable form to AI audio, image and
    video output. Text output does not need a machine-readable mark unless another law says so.
  duties:
  - content_labelling
  applies_to:
    agent_class:
    - customer_facing
    role:
    - provider
  addressee: provider
  control_mapping:
  - kind: process
    id: media_marking
    coverage: none
    note: 'No control: Supervisor agents answer in text, and Art. 17(1) does not ask for a machine-readable
      mark on text; the duty is the provider''s. If the bank builds an agent that makes audio, image or
      video, the generator must add the mark and this row needs a bank process.'
  evidence_needed:
  - watermark or metadata mark on generated media
  verification: VERIFIED_PRIMARY
  sources:
