    id: drift
    coverage: partial
    note: behaviour drift band per agent
  - kind: catalogue
    id: drift_band
    coverage: partial
    note: behaviour drift band
  - kind: monitor
    id: quality
    coverage: partial
    note: quality and groundedness sampling
  - *id011
  - *id008
  - *id010
  - kind: catalogue
    id: approved_tools
    coverage: partial
    note: tool allow-list keeps the agent inside its purpose
  evidence_needed:
  - monitoring in place
  - human intervention path tested
  - provider's usage limits written down
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: 'High-risk status depends on the Decision 33 classification (VN-QD33-2026) and the thresholds in Circular 53/2026/TT-NHNN. '
- id: VN-DEC142-2026-A15.06-01
  article_ref: Art. 15(6)
  text_vi: Trường hợp phát hiện hệ thống có nguy cơ gây thiệt hại nghiêm trọng đến tính mạng, sức khỏe con người, quyền con người, tài sản, an ninh mạng, trật tự, an toàn xã hội hoặc lợi ích công cộng, bên triển khai phải kịp thời áp dụng biện pháp hạn chế rủi ro trong phạm vi quyền kiểm soát của mình và thông báo cho nhà cung cấp và cơ quan nhà nước có thẩm quyền theo quy định của pháp luật.
  summary_en: If the deployer finds a risk of serious harm, it must promptly limit the risk within its control and notify the provider and the authority.
  duties:
  - incident_response
  - incident_report
  - serious_incident_suspension
  applies_to: *id005
  addressee: deployer
  control_mapping:
  - *id008
  - *id011
  - &id013
    kind: evidence
    id: case_file
    coverage: partial
    note: case file export can hold the facts for a report; Supervisor does not file the report
  - &id016
    kind: process
    id: regulator_notification
    coverage: none
    note: the bank files the report on the national AI portal or with SBV
  - &id015
    kind: process
    id: incident_management
    coverage: none
    note: bank incident procedure
  evidence_needed:
  - pause or restriction applied
  - notice to provider and authority
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
- id: VN-DEC142-2026-A16.02-01
  article_ref: Art. 16(2)
  text_vi: 'Nhà cung cấp và bên triển khai phải thực hiện các nghĩa vụ sau đây: a) Thông báo, đánh dấu kỹ thuật và gắn nhãn hiển thị đối với hệ thống trí tuệ nhân tạo và nội dung do hệ thống tạo ra theo quy định của pháp luật; b) Cung cấp thông tin về mục đích sử dụng, phạm vi áp dụng, điều kiện sử dụng và các hạn chế của hệ thống trí tuệ nhân tạo; c) Lưu trữ thông tin, tài liệu phục vụ việc kiểm tra, giám sát theo quy định của pháp luật.'
  summary_en: 'Provider and deployer must: notify, mark and label per the law; give information on purpose, scope, conditions and limits of the system; and store information and documents for checks.'
  duties:
  - ai_disclosure
  - content_labelling
  - record_keeping
  - consumer_information
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - kind: process
    id: customer_disclosure
    coverage: none
    note: customer-facing notices
  - *id012
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: audit export
  evidence_needed:
  - AI notice
  - statement of limits
  - document store for inspectors
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
- id: VN-DEC142-2026-A16.03-01
  article_ref: Art. 16(3)
  text_vi: Nhà cung cấp và bên triển khai phải giải trình khi có yêu cầu bằng văn bản của cơ quan nhà nước có thẩm quyền theo quy định tại Điều 14 và Điều 15 của Luật Trí tuệ nhân tạo.
  summary_en: Provider and deployer must explain the system when the authority asks in writing. Scope and time limit depend on the party's role and the system's risk.
  duties:
