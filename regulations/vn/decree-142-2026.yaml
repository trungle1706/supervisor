- id: VN-DEC142-2026-A13.06-01
  article_ref: Art. 13(6)
  text_vi: Nhà cung cấp có hệ thống trí tuệ nhân tạo có rủi ro cao đã được đánh giá sự phù hợp phải duy
    trì sự phù hợp và công khai thông tin về kết quả đánh giá sự phù hợp trên Cổng thông tin điện tử một
    cửa về trí tuệ nhân tạo
  summary_en: The provider must keep the system conformant and publish the conformity result (system name
    and version, method, body, conclusion, dates) on the national AI portal.
