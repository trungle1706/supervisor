- id: VN-DEC142-2026-A13.02-01
  article_ref: Art. 13(2)
  text_vi: 'Nhà cung cấp phải thực hiện đánh giá sự phù hợp với yêu cầu của Điều 14 của Luật Trí tuệ nhân
    tạo theo các phương thức sau đây: a) Đối với hệ thống trí tuệ nhân tạo có rủi ro cao thuộc Danh mục
    hệ thống trí tuệ nhân tạo phải chứng nhận sự phù hợp trước khi đưa vào sử dụng, nhà cung cấp phải
    thực hiện đánh giá sự phù hợp thông qua tổ chức đánh giá sự phù hợp quy định tại khoản 4 Điều này;
    b) Đối với hệ thống trí tuệ nhân tạo có rủi ro cao không thuộc trường hợp quy định tại điểm a khoản
    này, nhà cung cấp có quyền tự thực hiện đánh giá sự phù hợp hoặc sử dụng dịch vụ của tổ chức đánh
    giá sự phù hợp quy định tại khoản 4 Điều này. Trường hợp tự thực hiện đánh giá sự phù hợp, nhà cung
    cấp phải lập hồ sơ kỹ thuật và chịu trách nhiệm trước pháp luật về kết quả đánh giá.'
  summary_en: 'Two routes: items on the mandatory-certification list need a registered conformity assessment
    body; other high-risk items can be self-assessed (with a technical file and legal responsibility)
    or assessed by a body.'
  duties:
  - conformity_assessment
  - technical_documentation
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - provider
  addressee: provider
  control_mapping:
  - kind: evidence
    id: launch_report
    coverage: partial
    note: 'Launch report is sandbox evidence, not a legal assessment. Missing: route choice, the technical
      file and the certificate or self-assessment result.'
  - kind: evidence
    id: predeploy_report
    coverage: partial
    note: Pre-deploy report shows which duties and packs the system still lacks (flag ONBOARD_PREDEPLOY).
  - kind: process
    id: conformity_assessment_file
    coverage: partial
    note: 'Manual step: record the route chosen (registered body for a mandatory-certification item, self-assessment
      or body for the others) and keep the technical file.'
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: counsel confirms which route applies to the Decision 33 entry.'
  evidence_needed:
  - route chosen and evidence
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/5/18/469480-1778814202_v1_1779067280_signed.pdf
