- id: VN-DEC142-2026-A8.02B-01
  article_ref: Art. 8(2)(b)
  text_vi: Có cơ chế kỹ thuật và quy trình vận hành bảo đảm sự giám sát thực chất của con người, theo
    đó người có thẩm quyền có khả năng xem xét độc lập, can thiệp, từ chối hoặc thay đổi quyết định của
    hệ thống trước khi quyết định đó có hiệu lực;
  summary_en: 'A system can stay off the high-risk list proposal when a technical mechanism and process
    give real human oversight: an authorised person can review independently, intervene, reject or change
    the decision BEFORE it takes effect.'
  duties:
  - human_oversight
  - pre_execution_approval
  - risk_classification
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - kind: console
    id: case_signoff
    coverage: partial
    note: 'Records a named human decision on a case; counts as pre-execution approval only if the agent
      code waits for it. Missing: a technical block that holds the action until a named human approves exists
      only if the agent code waits for the sign-off.'
  - kind: monitor
    id: oversight
    coverage: partial
    note: Dwell time, approval rate and chain_ok metrics show whether the human step is real.
  - kind: evidence
    id: signoff_record
    coverage: partial
    note: Sign-off records show a named human decision.
  - kind: console
    id: agent_action
    coverage: partial
    note: Pause, resume or retire switch stops an agent after it acts; it is not human approval before execution.
  - kind: console
    id: state_actions
    coverage: partial
    note: 'Request RUNNING and Approve RUNNING by a second person (flag CONSOLE_STATE_ACTIONS): a person
      decides before enforcement starts.'
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: counsel decides whether the bank relies on this criterion; it is for drafting the
      list, not a self-service exemption.'
  evidence_needed:
  - code path where the agent waits for a named human before the action takes effect
  - dwell time and override rate
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/5/18/469480-1778814202_v1_1779067280_signed.pdf
    title: Nghị định số 142/2026/NĐ-CP (Công báo số 278 ngày 18-05-2026), text extracted from the gazette
      PDF
