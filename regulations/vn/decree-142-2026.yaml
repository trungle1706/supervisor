- id: VN-DEC142-2026-A19.02A-01
  article_ref: Art. 19(2)(a)
  text_vi: Bên triển khai và người sử dụng phải kịp thời ghi nhận sự cố, thực hiện các biện pháp cần thiết để hạn chế hậu quả và thông báo cho nhà cung cấp để phối hợp khắc phục;
  summary_en: On a serious incident the deployer and user must record it in time, limit the damage and tell the provider so they can fix it together.
