- id: VN-DEC142-2026-A15.04-01
  article_ref: Art. 15(4)
  text_vi: Bên triển khai hệ thống trí tuệ nhân tạo có rủi ro cao phải tổ chức quản lý rủi ro trong quá
    trình triển khai và vận hành hệ thống phù hợp với mục đích sử dụng, phạm vi triển khai, mức độ rủi
    ro của hệ thống và hướng dẫn kỹ thuật của nhà cung cấp.
  summary_en: The deployer of a high-risk system must run risk management during deployment and operation
    that fits purpose, scope, risk level and the provider's technical instructions.
