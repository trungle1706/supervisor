- id: VN-DEC142-2026-A18.01-01
  article_ref: Art. 18(1)
  text_vi: Bên triển khai phải thông báo rõ ràng khi cung cấp ra công cộng nội dung do hệ thống trí tuệ
    nhân tạo tạo ra hoặc chỉnh sửa có khả năng gây nhầm lẫn về tính xác thực của sự kiện, nhân vật hoặc
    nguồn gốc nội dung
  summary_en: The deployer must clearly notify when it releases to the public AI-made or AI-edited content
    that could be mistaken for authentic events, persons or origin.
  duties:
  - content_labelling
  - ai_disclosure
  applies_to:
    agent_class:
    - customer_facing
    role:
    - deployer
  addressee: deployer
  control_mapping:
  - kind: process
    id: customer_disclosure
    coverage: partial
    note: 'Manual step: put a clear notice on AI-made content the bank releases to the public when it could
      be mistaken for real events, persons or sources. No Supervisor control: Supervisor does not see what
      the bank publishes and its agents answer in text.'
  evidence_needed:
  - notice or label on public AI content
  verification: VERIFIED_PRIMARY
