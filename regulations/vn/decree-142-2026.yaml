- id: VN-DEC142-2026-A19.02A-01
  article_ref: Art. 19(2)(a)
  text_vi: Bên triển khai và người sử dụng phải kịp thời ghi nhận sự cố, thực hiện các biện pháp cần thiết
    để hạn chế hậu quả và thông báo cho nhà cung cấp để phối hợp khắc phục;
  summary_en: On a serious incident the deployer and user must record it in time, limit the damage and
    tell the provider so they can fix it together.
  duties:
  - incident_response
  - incident_report
  - logging
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: deployer
  control_mapping:
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: 'Hash-chained record of gate decisions and verdicts; the bank still owns retention and access.
      Missing: the notice to the provider; a serious incident of Art. 19(1) is a legal test that a person
      applies.'
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: Recorded tool calls and gate decisions per agent.
  - kind: console
    id: agent_action
    coverage: partial
    note: Pause, resume or retire switch limits the damage after the agent acts.
  - kind: evidence
    id: case_file
    coverage: partial
    note: Case file export can hold the facts for a report; Supervisor does not file the report.
  - kind: evidence
    id: incident_record
    coverage: partial
    note: Incident rows record the event, the status and who closed it.
  - kind: process
    id: incident_management
    coverage: partial
    note: 'Manual step: record the serious incident, limit the damage and tell the provider so both fix
      it.'
  evidence_needed:
  - incident record
  - notice to provider
  verification: VERIFIED_PRIMARY
  sources:
