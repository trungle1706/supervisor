- id: VN-DEC142-2026-A19.06-01
  article_ref: Art. 19(6)
  text_vi: Cơ quan nhà nước có thẩm quyền tiếp nhận báo cáo, tổ chức xác minh và hướng dẫn xử lý sự cố
    nghiêm trọng; khi cần thiết, có quyền yêu cầu tạm dừng hoạt động, thu hồi hoặc đánh giá lại hệ thống
    trí tuệ nhân tạo
  summary_en: The authority can verify an incident and order a pause, recall or re-assessment of the system.
  duties:
  - serious_incident_suspension
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - kind: console
    id: agent_action
    coverage: full
    note: 'Pause and quarantine stop the agent at the gate at once; the state change is a chain record.
      This is the whole technical need: the ability to stop an agent on order.'
  - kind: console
    id: agents
    coverage: partial
    note: Agent registry screen shows the gate state of every agent.
  - kind: process
    id: regulator_notification
    coverage: partial
    note: 'Manual step: a named person receives the authority''s order and triggers the pause.'
  evidence_needed:
  - ability to stop an agent on order
  verification: VERIFIED_PRIMARY
