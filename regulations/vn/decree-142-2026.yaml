    title: Luat Viet An - summary of Decree 142/2026/ND-CP
    fetched_at: '2026-10-15'
    kind: secondary
  confidence: high
  notes: This is the criterion for DRAFTING the list (aimed at ministries), not a self-service exemption.
    Decision 33 (VN-QD33-2026) Appendix IV applies when no human check, approval or control happens before
    execution. Supervisor pause acts after the action and does not meet 'before the decision takes effect'.
    Supervisor can only evidence a human gate that exists in code.
- id: VN-DEC142-2026-A11.01-01
  article_ref: Art. 11(1)
  text_vi: 'Nhà cung cấp phải thực hiện rà soát và phân loại lại mức độ rủi ro của hệ thống trí tuệ nhân
    tạo khi phát sinh một trong các sự kiện pháp lý sau đây: a) Hệ thống có sự thay đổi đáng kể về chức
    năng, mục đích sử dụng hoặc ngữ cảnh triển khai làm ảnh hưởng đến tiêu chí phân loại rủi ro ban đầu
    của hệ thống; b) Hệ thống xảy ra sự cố nghiêm trọng chứng minh mức độ rủi ro thực tế cao hơn mức đã
    được phân loại; c) Có quyết định của Thủ tướng Chính phủ về việc sửa đổi, bổ sung Danh mục hệ thống
    trí tuệ nhân tạo có rủi ro cao làm thay đổi mức độ rủi ro của hệ thống; d) Có yêu cầu bằng văn bản
    của cơ quan quản lý nhà nước có thẩm quyền theo quy định tại khoản 6 Điều 10 của Luật Trí tuệ nhân
    tạo.'
  summary_en: The provider must review and re-classify the risk level on a significant functional change,
    a serious incident showing higher risk, a Prime Minister list change, or a written authority request.
  duties:
  - risk_classification
  - change_control
  applies_to:
    agent_class:
    - any
    role:
    - provider
  addressee: provider
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: 'Registry keeps the risk tier now in use for the agent. Missing: the duty is the provider''s;
      Supervisor sees only the triggers inside the bank; a change of the Prime Minister''s list is not watched
      yet (Phase 11).'
  - kind: evidence
    id: agent_version
    coverage: partial
    note: Version rows record the significant functional changes the bank makes (trigger a).
  - kind: evidence
    id: incident_record
    coverage: partial
    note: Incident rows record serious incidents that may show a higher risk (trigger b).
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: counsel logs the triggers the bank sees (change, serious incident, list change by
      the Prime Minister, written request of the authority) and tells the provider.'
  evidence_needed:
  - trigger log for re-classification
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/5/18/469480-1778814202_v1_1779067280_signed.pdf
