- id: VN-DEC142-2026-A11.03A-01
  article_ref: Art. 11(3)(a)
  text_vi: Trường hợp kết quả phân loại lại xác định mức độ rủi ro của hệ thống cao hơn mức đã phân loại,
    nhà cung cấp, bên triển khai phải thực hiện thông báo kết quả phân loại lại cho cơ quan nhà nước có
    thẩm quyền trong thời hạn 15 ngày làm việc kể từ ngày hoàn thành việc rà soát và phải áp dụng ngay
    các biện pháp quản lý rủi ro tương ứng với mức độ rủi ro mới;
  summary_en: If re-classification raises the risk level, provider and deployer must notify the authority
    within 15 working days after the review and apply the matching risk controls at once.
  duties:
  - risk_classification
  - regulatory_reporting
  - registration
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: any
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: 'Registry keeps the risk tier; a raised tier is the fact that starts the 15 working days. Missing:
      no 15-working-day clock for a re-classification, no filing, no check that the controls of the new
      level are switched on.'
  - kind: evidence
    id: classification_record
    coverage: partial
    note: Decision 33 classification rows show the new class and the date it was applied.
  - kind: evidence
    id: task_record
    coverage: partial
    note: A task with a due date can carry the 15 working days; it is created by a person.
  - kind: process
    id: ai_registration
    coverage: partial
    note: 'Manual step: send the notice on the national AI portal (or the interim channel of Art. 46(1))
      within 15 working days of finishing the review, and keep the receipt.'
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: counsel confirms who files (provider or deployer) and the date the review was completed.'
  evidence_needed:
  - notice sent within 15 working days
  - controls for the new level switched on
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://congbaocdn.chinhphu.vn/180507251028987904/2026/5/18/469480-1778814202_v1_1779067280_signed.pdf
