    local_path: regulations/sources/VN-DEC142-2026/142-2026-nd-cp.txt
  - url: https://media.chinhphu.vn/ban-hanh-nghi-dinh-quy-dinh-chi-tiet-mot-so-dieu-va-bien-phap-thi-hanh-luat-tri-tue-nhan-tao-102260508162952667.htm
