  confidence: high
  notes: Confirmation time is when there is enough initial information that the incident really happened
    and likely stems from the AI system (Art. 19(3)(c)). A report is not an admission of fault. A report
    under cybersecurity or personal-data law may run in parallel (Art. 19(5)). The 24-hour period in the
    SBV draft circular did not survive into Circular 53/2026/TT-NHNN, which refers back to this rule.
- id: VN-DEC142-2026-A19.04-01
  article_ref: Art. 19(4)
  text_vi: Nhà cung cấp và bên triển khai phải duy trì, lưu giữ nhật ký hệ thống, dữ liệu và thông tin
    liên quan đến sự cố để phục vụ việc xác minh, đánh giá và khắc phục sự cố; đồng thời gửi báo cáo chính
    thức về kết quả khắc phục sự cố cho cơ quan nhà nước có thẩm quyền trong thời hạn 15 ngày kể từ ngày
    nộp báo cáo sơ bộ.
  summary_en: Provider and deployer must keep the system logs, data and information on the incident, and
    send a formal remediation report to the authority within 15 days of the preliminary report.
  duties:
  - incident_report
  - incident_response
  - logging
  - record_keeping
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: deployer
  control_mapping:
  - kind: evidence
    id: incident_clock
    coverage: partial
    note: 'Case clock computes the due time of the formal report (15 days after the preliminary report).
      Missing: the formal report itself and its sending; how long the bank keeps the logs is the bank''s
      schedule.'
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: Hash-chained record of gate decisions and verdicts; the bank still owns retention and access.
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: Recorded tool calls and gate decisions per agent.
  - kind: evidence
    id: case_file
    coverage: partial
    note: Case file export can hold the facts for a report; Supervisor does not file the report.
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: Audit export.
  - kind: process
    id: regulator_notification
    coverage: partial
    note: 'Manual step: write and send the formal remediation report to the authority within 15 days.'
  evidence_needed:
  - incident logs retained
  - formal report filed within 15 days
  verification: VERIFIED_PRIMARY
  sources:
