  article_ref: Art. 19(4)
  text_vi: Nhà cung cấp và bên triển khai phải duy trì, lưu giữ nhật ký hệ thống, dữ liệu và thông tin liên quan đến sự cố để phục vụ việc xác minh, đánh giá và khắc phục sự cố; đồng thời gửi báo cáo chính thức về kết quả khắc phục sự cố cho cơ quan nhà nước có thẩm quyền trong thời hạn 15 ngày kể từ ngày nộp báo cáo sơ bộ.
  summary_en: Provider and deployer must keep the system logs, data and information on the incident, and send a formal remediation report to the authority within 15 days of the preliminary report.
  duties:
