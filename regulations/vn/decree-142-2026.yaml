  last_checked: '2026-10-15'
  notes: 'This is the Government decree guiding Law 134/2025/QH15; it was issued on 2026-04-30, so there
    is no pending draft (the draft VN-AIDEC-DRAFT file was not needed). Full text of 46 articles read
    from the gazette PDF. Covers: portal (Art. 4), classification (Art. 5-12), conformity assessment (Art.
    13), notification (Art. 14), high-risk management (Art. 15), transparency (Art. 16-18), serious incidents
    (Art. 19), state-agency impact assessment (Art. 20), sandbox (Art. 21-27), infrastructure and data
    (Art. 28-40). Sandbox and infrastructure articles were not turned into obligations because they do
    not bind a bank deploying an agent. The decree has NO fine amounts. Decision 33/2026/QD-TTg is issued
    under Art. 7 and Art. 8. Not legal advice; bank counsel must confirm.'
obligations:
- id: VN-DEC142-2026-A5.03-01
  article_ref: Art. 5(3)
  text_vi: Bên triển khai phải phối hợp với nhà cung cấp để rà soát, phân loại lại hệ thống trí tuệ nhân
    tạo khi việc triển khai, sửa đổi, tích hợp hoặc thay đổi chức năng hoặc mục đích sử dụng làm phát
    sinh rủi ro mới hoặc rủi ro cao hơn của hệ thống đã được phân loại.
  summary_en: The deployer must work with the provider to review and re-classify the system when deployment,
    changes, integration or a new function or purpose creates new or higher risk.
  duties:
  - risk_classification
  - change_control
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: deployer
  control_mapping:
  - kind: evidence
    id: agent_version
    coverage: partial
    note: 'A new version row marks a change of model, tools or policy; it is the prompt to ask ''new or
      higher risk?''. Missing: no automatic link from a change to a new classification record; the bank
      decides what is a significant change; the exchange with the provider is outside Supervisor.'
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: Registry keeps the risk tier now in use for the agent.
  - kind: evidence
    id: classification_record
    coverage: partial
    note: Decision 33 classification rows (proposal, answers, class) per system; a new proposal can be started
      after a change.
  - kind: console
    id: duties_actions
    coverage: partial
    note: Re-evaluate runs the duties matrix again on the stored answers (flag RISK_DUTIES).
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: bank and provider review the change together, record the new class, and counsel
      confirms what counts as new or higher risk.'
  evidence_needed:
  - re-classification record linked to each functional change
  verification: VERIFIED_PRIMARY
  sources:
