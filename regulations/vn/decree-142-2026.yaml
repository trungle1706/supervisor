  - *id003
  confidence: medium
  notes: 'Art. 18(4)(c): no visible label duty for content used only inside the organisation and not given to the public.'
- id: VN-DEC142-2026-A18.02-01
  article_ref: Art. 18(2)
  text_vi: 'Bên triển khai phải gắn nhãn dễ nhận biết đối với âm thanh, hình ảnh hoặc video được tạo ra hoặc chỉnh sửa bằng hệ thống trí tuệ nhân tạo trong các trường hợp sau đây: a) Mô phỏng hoặc giả lập ngoại hình, giọng nói của người thật; b) Tái hiện sự kiện thực tế để phân biệt với nội dung thật, trừ trường hợp pháp luật có quy định khác.'
  summary_en: The deployer must label AI audio, image or video that imitates a real person's looks or voice or recreates real events.
