- id: VN-TT83-2025-A58-01
  article_ref: Art. 58(1)-(2)
  text_vi: '1. Định kỳ tối thiểu hằng năm hoặc đột xuất, ngân hàng có báo cáo nội bộ về rủi ro mô hình
    theo quy định tại khoản 2 Điều này. 2. Báo cáo nội bộ về rủi ro mô hình tối thiểu bao gồm: a) Danh
    mục mô hình cần quản lý của ngân hàng, bao gồm: Mô hình có rủi ro cao (mô hình sử dụng trong phương
    pháp xếp hạng nội bộ, mô hình khác có rủi ro cao), mô hình có rủi ro trung bình, mô hình có rủi ro
    thấp; b) Danh mục mô hình được điều chỉnh, mô hình đã ngừng sử dụng trong kỳ báo cáo; c) Tình hình
    xây dựng (bao gồm cả hoạt động thuê ngoài đối với mô hình), triển khai, sử dụng mô hình (bao gồm cả
    mua mô hình); d) Kết quả kiểm định mô hình định kỳ hoặc đột xuất (nếu có); đ) Đề xuất, kiến nghị về
    quản lý rủi ro mô hình với cấp nhận báo cáo; e) Kết quả xử lý, khắc phục theo yêu cầu, kiến nghị của
    kiểm toán nội bộ, Ngân hàng Nhà nước, tổ chức kiểm toán độc lập, cơ quan có thẩm quyền khác (nếu có).'
  summary_en: 'At least yearly (and ad hoc) the bank issues an internal model risk report: model list
