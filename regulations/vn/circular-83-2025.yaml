      backup providers and service location of the vendor.'
  - kind: process
    id: vendor_management
    coverage: partial
    note: 'Manual step: the bank keeps the outsourcing register with the Art. 40(3)(a) fields and reports
      risk to the competent level.'
  evidence_needed:
  - outsourcing register with materiality, substitutability, backup providers, data shared, service location
