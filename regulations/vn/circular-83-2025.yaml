- id: VN-TT83-2025-A40.02C-01
  article_ref: Art. 40(2)(c)-(e)
  text_vi: 'c) Thẩm định năng lực của bên thứ ba trong việc đáp ứng các yêu cầu, mục tiêu đề ra của hoạt
    động thuê ngoài trước khi ký hợp đồng thuê ngoài; đánh giá khả năng thực hiện hợp đồng của bên thứ
    ba trong suốt quá trình thực hiện hợp đồng; d) Hợp đồng thuê ngoài phải đảm bảo chặt chẽ, đầy đủ,
    bảo vệ quyền sở hữu, bảo mật cơ sở dữ liệu, thông tin khách hàng, quyền chấm dứt hợp đồng thuê ngoài
    của ngân hàng. Hợp đồng thuê ngoài tối thiểu bao gồm: mức độ và phạm vi hoạt động thuê ngoài; quyền,
    nghĩa vụ cụ thể của ngân hàng và bên thứ ba; điều khoản xử lý tranh chấp theo quy định của pháp luật;
    đ) Lập hoặc yêu cầu bên thứ ba lập kế hoạch duy trì hoạt động liên tục cho hoạt động thuê ngoài theo
    Điều 43 Thông tư này; e) Thiết lập cơ chế giám sát của ngân hàng đối với bên thứ ba trong thời gian
    thực hiện thuê ngoài.'
  summary_en: 'Outsourcing management: assess the third party before signing and during the contract;
    the contract protects ownership, database and customer information confidentiality and the bank right
    to terminate; plan business continuity for the outsourced activity; monitor the third party.'
