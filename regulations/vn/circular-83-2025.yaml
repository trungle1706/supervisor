- id: VN-TT83-2025-A43.02-01
  article_ref: Art. 43(2)
  text_vi: '2. Kế hoạch duy trì hoạt động liên tục phải đáp ứng tối thiểu các yêu cầu sau đây: a) Xác
    định rõ thẩm quyền kích hoạt kế hoạch duy trì hoạt động liên tục và vai trò, trách nhiệm của cá nhân,
    bộ phận có liên quan trong việc thực hiện kế hoạch này; b) Phù hợp với tính chất, quy mô hoạt động
    của ngân hàng; c) Xác định các hoạt động quan trọng, sản phẩm, dịch vụ và quy trình nghiệp vụ trọng
    yếu cần được ưu tiên duy trì; d) Có hệ thống dự phòng về nhân sự, địa điểm làm việc thay thế, hệ thống
    thông tin và hạ tầng thiết yếu; đ) Đảm bảo khả năng phối hợp, trao đổi thông tin kịp thời, hiệu quả
    trong nội bộ và với cơ quan quản lý, khách hàng, đối tác quan trọng trong tình huống gián đoạn; e)
    Có các biện pháp giảm thiểu tổn thất và tác động bất lợi từ sự cố hoặc ngừng hoạt động; g) Đảm bảo
    khôi phục hoạt động kinh doanh bị gián đoạn về trạng thái bình thường trong thời hạn yêu cầu; h) Được
    rà soát và thử nghiệm hoặc diễn tập định kỳ tối thiểu hằng năm hoặc khi có thay đổi trọng yếu về môi
    trường hoạt động, công nghệ hoặc tổ chức nhằm đánh giá hiệu quả của kế hoạch duy trì hoạt động liên
    tục và điều chỉnh (nếu cần thiết).'
  summary_en: The business continuity plan names who triggers it, covers critical activities, has backup
    systems, communication and recovery targets, and is tested or exercised at least yearly or when technology
    changes materially.
