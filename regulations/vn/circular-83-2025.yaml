  notes: 'Added by WP-W0 on 2026-10-28. From 2026-07-01 this Circular repeals Circular 13/2018/TT-NHNN,
    Circular 40/2018/TT-NHNN and Art. 3 of Circular 09/2024/TT-NHNN (Art. 74(6)). It does not name AI.
    The model risk section (Art. 56-58) and the rules on outsourcing (Art. 40), technology use (Art. 41)
    and electronic credit approval (Art. 15(3)) are read as binding on an AI system in a bank; this reading
    is the KB, not the law. vbpl.vn metadata shows status Con hieu luc. Not covered as rows: Art. 4 and
