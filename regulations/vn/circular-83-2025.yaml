- id: VN-TT83-2025-A21.02-01
  article_ref: Art. 21(2)
  text_vi: '2. Kế hoạch cung cấp sản phẩm mới, hoạt động trong thị trường mới phải được bộ phận quản lý
    rủi ro thẩm định về rủi ro, biện pháp quản lý rủi ro và xác định cụ thể, tối thiểu bao gồm: a) Quy
    mô, thời gian thử nghiệm cung cấp sản phẩm mới, hoạt động trong thị trường mới trên cơ sở đánh giá
    rủi ro có thể phát sinh từ việc cung cấp sản phẩm mới, hoạt động trong thị trường mới, tác động đối
    với vốn tự có và thu nhập để đảm bảo phù hợp khả năng kiểm soát rủi ro của ngân hàng; b) Thời gian
    chính thức cung cấp sản phẩm mới, hoạt động trong thị trường mới trên cơ sở đánh giá kết quả thử nghiệm
    so với các chỉ tiêu đề ra về quản lý rủi ro của ngân hàng.'
  summary_en: The plan for a new product or market is appraised by the risk function. It sets pilot size
    and duration from the assessed risk and impact on capital and income, and the date of official launch
    after pilot results meet the bank risk targets.
  duties:
  - risk_management_system
  - lifecycle_management
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: evidence
    id: predeploy_report
    coverage: partial
    note: 'Pre-deploy report gives GO, NO-GO or QUESTIONS before launch. Missing: the risk-function appraisal
      and the impact on capital and income.'
  - kind: evidence
    id: launch_report
    coverage: partial
    note: 'Launch sandbox report with catch rate and false alarms supports pilot results. Missing: bank
      risk targets for the new product.'
  - kind: process
    id: go_live_decision
    coverage: partial
    note: 'Manual step: the risk function appraises the plan and the competent level decides pilot scope
      and the official launch date.'
  evidence_needed:
  - risk appraisal of the new product plan
  - pilot scope and result against risk targets
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: Applies where an AI agent is a new product or a new way to provide a banking activity; bank counsel
    must confirm.
- id: VN-TT83-2025-A11.07-01
  article_ref: Art. 11(7)
  text_vi: 7. Ngân hàng phải có quy định về hoạt động kiểm soát đối với các hoạt động được thực hiện bằng
    phương tiện điện tử đảm bảo đáp ứng các quy định tại Thông tư này và các quy định của pháp luật có
    liên quan.
  summary_en: The bank must have a rule for control activities carried out by electronic means.
  duties:
  - internal_policy
  - human_oversight
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: evidence
    id: policy_baseline
    coverage: partial
    note: 'Versioned policy baseline for the gateway rules. Missing: the bank control rule for electronic
      activities as a whole.'
  - kind: process
    id: internal_policy_issuance
    coverage: partial
    note: 'Manual step: the bank issues a control rule that covers activities done by AI agents.'
  evidence_needed:
  - internal rule on controls for electronic activities
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
- id: VN-TT83-2025-A24-01
  article_ref: Art. 24
  text_vi: 'Dữ liệu rủi ro được sử dụng để thực hiện hoạt động quản lý rủi ro theo quy định tại Chương
    này. Ngân hàng quản lý dữ liệu rủi ro theo quy định nội bộ, tối thiểu đảm bảo các yêu cầu sau: 1.
    Dữ liệu rủi ro phải chính xác (accuracy) và toàn vẹn (integrity) trong đó đảm bảo nhất quán các khái
    niệm về dữ liệu, có kênh báo cáo nội bộ và kế hoạch khắc phục về tình trạng dữ liệu kém chất lượng
    (nếu có). 2. Ngân hàng phải thu thập và tổng hợp được dữ liệu rủi ro, tối thiểu bao gồm toàn bộ dữ
    liệu rủi ro từ các rủi ro trọng yếu. 3. Ngân hàng có khả năng tổng hợp dữ liệu rủi ro phục vụ cho
    hoạt động quản lý rủi ro một cách nhanh chóng, kịp thời. 4. Ngân hàng có khả năng tổng hợp dữ liệu
    rủi ro đáp ứng yêu cầu các loại báo cáo quản lý rủi ro khác nhau.'
  summary_en: Risk data must be accurate and complete in definition, with a channel and plan to fix poor
    data; the bank must collect and aggregate risk data for all material risks quickly and for different
    report types.
  duties:
  - data_quality
  - record_keeping
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: 'Recorded agent events and the chain provide consistent, hashed operational data. Missing: bank-wide
      risk data definitions and aggregation across risk types.'
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: 'Audit export. Missing: aggregation of all material risks.'
  - kind: process
    id: internal_policy_issuance
    coverage: partial
    note: 'Manual step: the bank sets risk data definitions, a data quality escalation channel and aggregation
      capability.'
  evidence_needed:
  - risk data definitions
  - data quality issue log and remediation plan
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: 'Applies from 2028-01-01 at the latest (Art. 74(2)(b)). The link to AI is indirect: risk data
    feed the risk reports that cover AI.'
  dates:
    compliance_deadline:
      date: '2028-01-01'
      source: https://vbpl.vn/van-ban/chi-tiet/186792
      verification: VERIFIED_PRIMARY
      note: 'Art. 74(2)(b): risk data management at the latest from 2028-01-01.'
