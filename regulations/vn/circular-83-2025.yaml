  article_ref: Art. 41(1)(b)
  text_vi: 'b) Nhận dạng, đo lường, theo dõi và kiểm soát rủi ro hoạt động phát sinh trong ứng dụng công
    nghệ theo quy định tại Điều 39 Thông tư này tối thiểu đảm bảo: (i) Nhận dạng nguy cơ phát sinh rủi
    ro hoạt động liên quan hệ thống mạng kết nối nội bộ và bên ngoài, phần cứng, phần mềm, ứng dụng, giao
