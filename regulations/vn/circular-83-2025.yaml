obligations:
- id: VN-TT83-2025-A56.01-01
  article_ref: Art. 56(1)
  text_vi: 1. Ngân hàng xác định danh mục mô hình cần quản lý theo quy định nội bộ; định kỳ xếp hạng,
    phân loại thành mô hình có rủi ro cao, trung bình, thấp dựa trên các yếu tố (như tính trọng yếu (materiality),
    tính phức tạp (complexity), mục đích sử dụng của mô hình, chất lượng mô hình (quality)...) theo quy
    định nội bộ của ngân hàng. Kể từ thời điểm ngân hàng thực hiện giai đoạn chuyển đổi sang phương pháp
    xếp hạng nội bộ theo quy định của Ngân hàng Nhà nước về tỷ lệ an toàn vốn đối với ngân hàng, mô hình
    được sử dụng trong phương pháp xếp hạng nội bộ phải được xác định là mô hình có rủi ro cao.
  summary_en: 'The bank keeps a list of the models it must manage and rates them high, medium or low risk
    by materiality, complexity, purpose and quality, reviewed periodically. Applied to AI: the AI inventory
    and risk tier.'
  duties:
  - model_inventory
  - risk_classification
  - governance_accountability
  applies_to: &id002
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: 'Agent registry holds owner, risk tier and model family per agent. Missing: the bank rating
      criteria (materiality, complexity, purpose, quality) and the periodic re-rating are bank policy;
      models that are not agents are outside the registry.'
  - kind: evidence
    id: ai_system_record
    coverage: partial
    note: 'AI system record names components and a risk level. Missing: a high / medium / low rating by
      the Art. 56(1) factors.'
  - kind: process
    id: ai_inventory_review
    coverage: partial
    note: 'Manual step: the second line reviews and re-rates the model list at set intervals and records
      the decision.'
  evidence_needed:
  - model list with rating (high, medium, low) and rating criteria
  - record of the last periodic rating
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: Art. 3(23) defines "model" as a quantitative method or system that turns input data into output
    used in the bank (statistics, economics, expert judgement). Whether an AI or LLM agent is a "model"
    is a reading of this KB; bank counsel must confirm. The Art. 56 duties apply from 2028-01-01 at the
    latest (Art. 74(3)(c)).
  dates: &id003
    compliance_deadline:
      date: '2028-01-01'
      source: https://vbpl.vn/van-ban/chi-tiet/186792
      verification: VERIFIED_PRIMARY
      note: 'Art. 74(3)(c): model risk management at the latest from 2028-01-01 (models used in the internal
        ratings-based approach earlier, Art. 74(3)(a)-(b)).'
- id: VN-TT83-2025-A56.02-01
  article_ref: Art. 56(2)-(3)
  text_vi: 2. Ngân hàng thực hiện quản lý rủi ro mô hình theo quy định tại Mục này, tối thiểu bao gồm
    các mô hình có rủi ro cao tại khoản 1 Điều này. 3. Ngân hàng thực hiện quản lý rủi ro mô hình có rủi
    ro thấp, trung bình theo quy định nội bộ của ngân hàng.
  summary_en: Model risk management under Section 8 covers at least the high-risk models; low and medium
    risk models follow the bank internal rules.
  duties:
  - risk_management_system
  - internal_policy
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: process
    id: internal_policy_issuance
    coverage: partial
    note: 'Manual step: the bank issues an internal rule that sets the model risk scope and the lighter
      regime for low and medium risk models. No Supervisor control: scope of the model risk regime is
      a bank policy decision.'
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: 'Registry risk tier can show which agents fall in the high band. Missing: the policy that sets
      the line.'
  evidence_needed:
  - internal model risk policy with scope by rating
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: Art. 3(23) defines "model" as a quantitative method or system that turns input data into output
    used in the bank (statistics, economics, expert judgement). Whether an AI or LLM agent is a "model"
    is a reading of this KB; bank counsel must confirm. The Art. 56 duties apply from 2028-01-01 at the
    latest (Art. 74(3)(c)).
  dates: *id003
- id: VN-TT83-2025-A56.04A-01
  article_ref: Art. 56(4)(a)
  text_vi: a) Trong giai đoạn xây dựng mô hình, ngân hàng phải xác định mục đích sử dụng, phạm vi sử dụng
    dự kiến và đánh giá chất lượng dữ liệu đầu vào của mô hình (tối thiểu về tính chính xác, tính đầy
    đủ) theo quy định nội bộ của ngân hàng;
  summary_en: When the bank builds a model (or has it built by a vendor), it states the intended use and
    scope and checks the accuracy and completeness of the input data.
  duties:
  - lifecycle_management
  - data_quality
  - technical_documentation
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: evidence
    id: onboard_profile
    coverage: partial
    note: 'Onboarding profile records declared purpose and data classes. Missing: an input-data quality
      check of accuracy and completeness for the model.'
  - kind: evidence
    id: predeploy_report
    coverage: partial
    note: 'Pre-deploy report lists facts and open questions with pointers. Missing: data quality assessment
      of training or reference data.'
  - kind: process
    id: model_validation
    coverage: partial
    note: 'Manual step: the model owner writes the intended use, scope and data quality check into the
      model file before build is approved.'
  evidence_needed:
  - statement of intended use and scope
  - input data quality check (accuracy, completeness)
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: Art. 3(23) defines "model" as a quantitative method or system that turns input data into output
    used in the bank (statistics, economics, expert judgement). Whether an AI or LLM agent is a "model"
    is a reading of this KB; bank counsel must confirm. The Art. 56 duties apply from 2028-01-01 at the
    latest (Art. 74(3)(c)).
  dates: *id003
- id: VN-TT83-2025-A56.04B-01
  article_ref: Art. 56(4)(b)
  text_vi: b) Trong giai đoạn triển khai mô hình (bao gồm cả việc kiểm thử chấp nhận người dùng (user
    acceptance testing)), ngân hàng phải đảm bảo triển khai thống nhất với kết quả xây dựng mô hình đã
    được phê duyệt; trường hợp phát sinh thay đổi không thống nhất thì phải được cấp có thẩm quyền của
    ngân hàng phê duyệt lại và lưu giữ trong hồ sơ mô hình;
  summary_en: The deployed model must match the approved development result (including user acceptance
    testing); any inconsistent change needs new approval by the competent level and is kept in the model
    file.
  duties:
  - change_control
  - lifecycle_management
  - record_keeping
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_version
    coverage: partial
    note: 'Agent version history with hashes shows what changed and when. Missing: the link to the approved
      development result and the approver of an inconsistent change.'
  - kind: evidence
    id: lifecycle_approval
    coverage: partial
    note: 'Stage approvals need a second person to move a system. Missing: the approval record for a change
      that differs from the approved result.'
  - kind: process
    id: change_management
    coverage: partial
    note: 'Manual step: a change that differs from the approved model result goes through re-approval
      by the competent level and is filed in the model file.'
  evidence_needed:
  - deployment record that matches the approved result
  - re-approval record for each inconsistent change
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: Art. 3(23) defines "model" as a quantitative method or system that turns input data into output
    used in the bank (statistics, economics, expert judgement). Whether an AI or LLM agent is a "model"
    is a reading of this KB; bank counsel must confirm. The Art. 56 duties apply from 2028-01-01 at the
    latest (Art. 74(3)(c)).
  dates: *id003
- id: VN-TT83-2025-A56.04C-01
  article_ref: Art. 56(4)(c)
  text_vi: 'c) Trong quá trình sử dụng mô hình, ngân hàng phải đảm bảo: (i) Mô hình được sử dụng đúng
    mục đích, phạm vi; (ii) Việc ghi đè (override) đối với dữ liệu đầu vào và kết quả đầu ra của mô hình
    (như trường hợp nhập dữ liệu đầu vào, kết quả đầu ra bị bỏ qua, thay đổi hoặc đảo ngược…) phải được
    quản lý, tối thiểu bao gồm trường hợp được ghi đè, trường hợp thực hiện ghi đè phải được cấp có thẩm
    quyền phê duyệt, lưu giữ thông tin và đánh giá việc ghi đè; (iii) Các phản hồi của cá nhân, bộ phận
    sử dụng (nếu có) phải được xử lý;'
  summary_en: In use, the model stays within its purpose and scope; every override of an input or output
    (ignored, changed or reversed) is controlled with approval, record and review; user feedback is handled.
  duties:
  - human_oversight
  - record_keeping
  - excessive_agency_limits
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: approved_tools
    coverage: partial
    note: 'Gateway allow-list keeps an agent to approved tools. Missing: purpose and scope of the model
      as a business concept; overrides of model output by staff are not seen.'
  - kind: console
    id: case_signoff
    coverage: partial
    note: 'A reviewer signs off a case with a reason; the sign-off is recorded. Missing: a general override
      log for model outputs used outside agent cases.'
  - kind: evidence
    id: signoff_record
    coverage: partial
    note: 'Sign-off records name the person, the time and the decision. Missing: review of override patterns.'
  - kind: process
    id: three_lines_model
    coverage: partial
    note: 'Manual step: the first line lists who may override a model result, the approver and the periodic
      review of overrides.'
  evidence_needed:
  - list of permitted overrides and approvers
  - override log with approval
  - record of user feedback handled
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: Art. 3(23) defines "model" as a quantitative method or system that turns input data into output
    used in the bank (statistics, economics, expert judgement). Whether an AI or LLM agent is a "model"
    is a reading of this KB; bank counsel must confirm. The Art. 56 duties apply from 2028-01-01 at the
    latest (Art. 74(3)(c)).
  dates: *id003
- id: VN-TT83-2025-A56.04D-01
  article_ref: Art. 56(4)(d)
  text_vi: d) Ngân hàng phải theo dõi, giám sát mô hình, trong đó đánh giá về hiệu quả của việc sử dụng
    mô hình;
  summary_en: The bank monitors the model and assesses how well its use works.
  duties:
  - performance_monitoring
  - lifecycle_management
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: monitor
    id: drift
    coverage: partial
    note: 'Behaviour drift band per agent against a baseline. Missing: business effectiveness of the model
      (outcome quality against the original goal).'
  - kind: monitor
    id: quality
    coverage: partial
    note: 'Quality and groundedness sampling. Missing: effectiveness measured by business results.'
  - kind: evidence
    id: oversight_metric
    coverage: partial
    note: 'Daily oversight metrics per agent. Missing: a periodic effectiveness assessment signed by the
      model owner.'
  - kind: process
    id: model_validation
    coverage: partial
    note: 'Manual step: the model owner records a periodic assessment of use effectiveness.'
  evidence_needed:
  - monitoring results per model
  - periodic effectiveness assessment
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: Art. 3(23) defines "model" as a quantitative method or system that turns input data into output
    used in the bank (statistics, economics, expert judgement). Whether an AI or LLM agent is a "model"
    is a reading of this KB; bank counsel must confirm. The Art. 56 duties apply from 2028-01-01 at the
    latest (Art. 74(3)(c)).
  dates: *id003
- id: VN-TT83-2025-A56.04E-01
  article_ref: Art. 56(4)(đ)
  text_vi: 'đ) Ngân hàng phải kiểm định mô hình tối thiểu bao gồm: Kiểm định trước khi sử dụng, kiểm định
    khi mô hình có những thay đổi trọng yếu được xác định theo quy định nội bộ của ngân hàng, kiểm định
    định kỳ tối thiểu hằng năm. Kết quả kiểm định mô hình phải bao gồm báo cáo đánh giá về khả năng đáp
    ứng mục tiêu ban đầu và hiệu quả sử dụng thực tế của mô hình.'
  summary_en: The bank validates the model before use, after a material change and at least yearly. The
    result includes a report on whether the model meets its original goal and how well it works in practice.
  duties:
  - independent_validation
  - change_control
  - performance_monitoring
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: evidence
    id: predeploy_report
    coverage: partial
    note: 'Pre-deploy test result (GO, NO-GO, QUESTIONS) before use. Missing: independence of the validator
      and the yearly cycle.'
  - kind: evidence
    id: assurance_results
    coverage: partial
    note: 'Assurance pack results (security, fairness, pin and hash packs) are stored per run. Missing:
      a validation report in the form the bank sets, signed by the second line.'
  - kind: evidence
    id: launch_report
    coverage: partial
    note: 'Launch sandbox report with catch rate and false alarms. Missing: the formal annual validation
      report.'
  - kind: process
    id: model_validation
    coverage: partial
    note: 'Manual step: the second line validates before use, after a material change and yearly, and
      signs a report against the original goal.'
  evidence_needed:
  - validation report before first use
  - validation report after each material change
  - annual validation report
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: Art. 3(23) defines "model" as a quantitative method or system that turns input data into output
    used in the bank (statistics, economics, expert judgement). Whether an AI or LLM agent is a "model"
    is a reading of this KB; bank counsel must confirm. The Art. 56 duties apply from 2028-01-01 at the
    latest (Art. 74(3)(c)).
  dates: *id003
- id: VN-TT83-2025-A56.05-01
  article_ref: Art. 56(5)
  text_vi: '5. Trường hợp ngân hàng mua mô hình (bao gồm cả trường hợp sử dụng mô hình từ ngân hàng mẹ),
    ngân hàng phải có biện pháp quản lý tối thiểu đảm bảo các yêu cầu sau: a) Yêu cầu bên bán hoặc ngân
    hàng mẹ cung cấp thông tin liên quan về mô hình để phục vụ việc đánh giá, sử dụng mô hình; b) Đánh
    giá hiệu quả của việc sử dụng mô hình theo quy định của ngân hàng.'
  summary_en: For a bought model (including one from the parent bank) the bank asks the seller for the
    information it needs to assess and use the model, and assesses how well it works.
  duties:
  - outsourcing_oversight
  - supply_chain_security
  - technical_documentation
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: evidence
    id: ai_system_record
    coverage: partial
    note: 'AI system record lists components (model, provider) of a system. Missing: the information obtained
      from the vendor and the vendor request itself.'
  - kind: process
    id: vendor_management
    coverage: partial
    note: 'Manual step: the bank asks the vendor or parent bank for model information (design, data, limits,
      tests) and files the answer. No Supervisor control: vendor correspondence and contract terms are
      outside Supervisor.'
  evidence_needed:
  - vendor model information file
  - effectiveness assessment of the bought model
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: Art. 3(23) defines "model" as a quantitative method or system that turns input data into output
    used in the bank (statistics, economics, expert judgement). Whether an AI or LLM agent is a "model"
    is a reading of this KB; bank counsel must confirm. The Art. 56 duties apply from 2028-01-01 at the
    latest (Art. 74(3)(c)). Relevant to a third-party LLM used through an API.
  dates: *id003
- id: VN-TT83-2025-A56.06-01
  article_ref: Art. 56(6)
  text_vi: 6. Ngân hàng phải lập, quản lý hồ sơ mô hình đối với tối thiểu các mô hình quy định tại khoản
    2 Điều này (bao gồm cả mô hình đang sử dụng, mô hình được điều chỉnh, mô hình đã ngừng sử dụng).
  summary_en: 'The bank creates and manages a model file for each managed model: models in use, adjusted
    and retired.'
  duties:
  - technical_documentation
  - model_inventory
  - record_keeping
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_version
    coverage: partial
    note: 'Version history of each agent (config, model, hash). Missing: validation reports, approvals
      and retirement record in one file.'
  - kind: evidence
    id: case_file
    coverage: partial
    note: 'Case files hold evidence per incident. Missing: a per-model dossier.'
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: 'Audit export pack can collect records for a period. Missing: a model file structure as the
      bank defines it.'
  - kind: process
    id: model_validation
    coverage: partial
    note: 'Manual step: the model owner keeps one model file per model through its life, including after
      retirement.'
  evidence_needed:
  - model file per model (in use, adjusted, retired)
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: Art. 3(23) defines "model" as a quantitative method or system that turns input data into output
    used in the bank (statistics, economics, expert judgement). Whether an AI or LLM agent is a "model"
    is a reading of this KB; bank counsel must confirm. The Art. 56 duties apply from 2028-01-01 at the
    latest (Art. 74(3)(c)).
  dates: *id003
- id: VN-TT83-2025-A56.07-01
  article_ref: Art. 56(7)
  text_vi: '7. Đối với việc quản lý rủi ro mô hình, ngân hàng có 03 tuyến bảo vệ độc lập như sau: a) Tuyến
    bảo vệ thứ nhất là bộ phận hoặc cá nhân thực hiện chức năng xây dựng, triển khai, sử dụng mô hình,
    nhận dạng, thực hiện các biện pháp kiểm soát, theo dõi, giảm thiểu rủi ro; b) Tuyến bảo vệ thứ hai
    là bộ phận hoặc cá nhân thực hiện chức năng kiểm định mô hình, xây dựng chính sách quản lý rủi ro,
    quy định nội bộ về quản lý rủi ro; theo dõi, kiểm soát rủi ro toàn ngân hàng và tuân thủ quy định
    của pháp luật; c) Tuyến bảo vệ thứ ba là bộ phận hoặc cá nhân thực hiện chức năng kiểm toán nội bộ.'
  summary_en: 'Model risk has three independent lines: builders and users (first), validation and risk
    policy (second), internal audit (third).'
  duties:
  - governance_accountability
  - independent_validation
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: console
    id: case_signoff
    coverage: partial
    note: 'Separation of duties inside Supervisor: reviewer sign-off and second-person approvals. Missing:
      the bank organisation of the three lines and their independence.'
  - kind: process
    id: three_lines_model
    coverage: partial
    note: 'Manual step: the bank names the first, second and third line roles for model risk and keeps
      them independent.'
  evidence_needed:
