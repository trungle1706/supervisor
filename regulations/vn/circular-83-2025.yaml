- id: VN-TT83-2025-A40.03-01
  article_ref: Art. 40(3)
  text_vi: '3. Ngân hàng thực hiện quản lý rủi ro bên thứ ba từ hoạt động thuê ngoài tối thiểu đảm bảo:
    a) Ngân hàng theo dõi các hợp đồng thuê ngoài tối thiểu bao gồm các nội dung sau: mức độ trọng yếu
    của thỏa thuận, khả năng thay thế cho dịch vụ bên thứ ba đang cung cấp (substitutability), danh sách
    các nhà cung cấp dự phòng (contingent providers), việc có hay không chia sẻ thông tin mật hoặc thông
    tin độc quyền, địa điểm cung cấp dịch vụ; b) Ngân hàng thực hiện đánh giá tổng thể các rủi ro có khả
    năng phát sinh từ hoạt động thuê ngoài trước khi ký kết hợp đồng; c) Ngân hàng giám sát các rủi ro
    phát sinh từ hoạt động thuê ngoài, định kỳ báo cáo cấp có thẩm quyền theo quy định nội bộ của ngân
    hàng; d) Ngân hàng xây dựng và định kỳ rà soát, cập nhật kế hoạch duy trì hoạt động liên tục bao gồm
    các biện pháp phục hồi đảm bảo không bị gián đoạn vận hành khi hoạt động thuê ngoài xảy ra sự cố.'
