    vệ an ninh mạng có thẩm quyền;

    ...

    c) Chủ trì, phối hợp với lực lượng chuyên trách bảo vệ an ninh mạng có thẩm quyền trong việc thường
    xuyên thực hiện giám sát an ninh mạng; xây dựng cơ chế tự cảnh báo và tiếp nhận cảnh báo về nguy cơ
    đe dọa an ninh mạng; đề ra phương án ứng phó, khắc phục khẩn cấp;

    ...

