- id: VN-CYBER-2025-A9.3-01
  article_ref: Art. 9(2)(g), 9(3)
  text_vi: 'g) Hệ thống thông tin quốc gia thuộc lĩnh vực năng lượng, tài chính, ngân hàng, viễn thông,
    giao thông vận tải, nông nghiệp, tài nguyên và môi trường, hóa chất, y tế, văn hóa;

    ...

    3. Hệ thống thông tin quan trọng về an ninh quốc gia phải được thẩm định an ninh mạng, chứng nhận
    đủ điều kiện về an ninh mạng trước khi đưa vào vận hành, sử dụng; thường xuyên kiểm tra an ninh mạng,
    giám sát an ninh mạng trong quá trình sử dụng và kịp thời ứng phó, khắc phục sự cố an ninh mạng.'
  summary_en: National-level systems in energy, finance, banking, telecoms, transport and other fields
    can be listed as systems important to national security. A listed system must pass cybersecurity appraisal
    and get a certificate before operation, and be checked and monitored continuously.
