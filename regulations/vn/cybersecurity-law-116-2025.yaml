- id: VN-CYBER-2025-A8.1-03
  article_ref: Decree 331/2026 Art. 30(8)
  text_vi: '8. Trường hợp hệ thống thông tin cấp độ 3, cấp độ 4 được triển khai dưới hình thức thuê dịch
    vụ công nghệ thông tin tại Trung tâm dữ liệu hoặc Điện toán đám mây, thiết kế hệ thống phải đáp ứng
    các yêu cầu sau:

    a) Phải được thiết kế tách riêng, độc lập với các hệ thống khác về lô-gic và có biện pháp quản lý
    truy cập giữa các hệ thống;

    b) Các vùng mạng trong hệ thống phải được thiết kế tách riêng, độc lập với nhau về lô-gic và có biện
    pháp quản lý truy cập giữa các vùng mạng;

    c) Có phân vùng lưu trữ được phân tách độc lập về lô-gic.'
  summary_en: A level 3 or 4 system hosted as rented IT service in a data centre or cloud must be designed
    logically separate from other systems, with separate network zones and a separate logical storage
    partition.
