- id: VN-CYBER-2025-A8.1-02
  article_ref: Decree 331/2026 Art. 12-13
  text_vi: 'Hệ thống thông tin cấp độ 2 là hệ thống thông tin có một trong các tiêu chí cụ thể sau:

    1. Hệ thống thông tin phục vụ hoạt động nội bộ của cơ quan, tổ chức và có xử lý thông tin riêng, thông
    tin cá nhân của người sử dụng nhưng không xử lý thông tin bí mật nhà nước.

    2. Hệ thống thông tin phục vụ người dân, doanh nghiệp thuộc một trong các loại hình như sau:

    a) Cung cấp dịch vụ trực tuyến không thuộc danh mục ngành, nghề đầu tư kinh doanh có điều kiện;

    b) Cung cấp dịch vụ trực tuyến khác có xử lý thông tin riêng, thông tin cá nhân của dưới 100.000 chủ
    thể dữ liệu đối với dữ liệu cá nhân cơ bản hoặc dưới 10.000 chủ thể dữ liệu đối với dữ liệu cá nhân
    nhạy cảm.

    3. Hệ thống cơ sở hạ tầng thông tin phục vụ hoạt động của một cơ quan, tổ chức.

    4. Hệ thống thông tin khác do Thủ tướng Chính phủ quyết định hoặc được đánh giá rủi ro an ninh mạng
    theo Khung quản lý rủi ro an ninh mạng.

    ...

    Hệ thống thông tin cấp độ 3 là hệ thống có một trong các tiêu chí sau:

    1. Hệ thống xử lý thông tin bí mật nhà nước hoặc hệ thống phục vụ quốc phòng, an ninh khi bị phá hoại
    sẽ làm tổn hại tới an ninh quốc gia.

    2. Hệ thống thông tin phục vụ người dân, doanh nghiệp thuộc một trong các loại hình như sau:

    a) Cung cấp dịch vụ trực tuyến thuộc danh mục ngành, nghề đầu tư kinh doanh có điều kiện;

    b) Hệ thống thông tin giải quyết thủ tục hành chính;

    c) Cung cấp dịch vụ trực tuyến khác có xử lý thông tin riêng, thông tin cá nhân của từ 100.000 chủ
    thể dữ liệu đối với dữ liệu cá nhân cơ bản trở lên hoặc từ 10.000 chủ thể dữ liệu đối với dữ liệu
    cá nhân nhạy cảm trở lên.

    3. Hệ thống cơ sở hạ tầng thông tin phục vụ hoạt động của các cơ quan, tổ chức trong phạm vi một bộ,
    một ngành, một tỉnh hoặc một số tỉnh.

    4. Hệ thống thông tin điều khiển công nghiệp trực tiếp phục vụ điều khiển, vận hành hoạt động bình
    thường của các công trình xây dựng cấp II, cấp III hoặc cấp IV theo phân cấp của pháp luật về xây
    dựng.

    5. Hệ thống thông tin khác do Thủ tướng Chính phủ quyết định hoặc được đánh giá rủi ro an ninh mạng
    theo Khung quản lý rủi ro an ninh mạng.'
  summary_en: Under Decree 331/2026, an online service system in a conditional-business sector (assumed,
    counsel to confirm, that a licensed bank is one) or with personal data of 100,000+ people (10,000+
    sensitive) is at least level 3. A system with fewer subjects and no conditional sector is level 2.
    Higher criteria give the higher level.
