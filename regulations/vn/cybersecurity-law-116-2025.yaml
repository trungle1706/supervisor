- id: VN-CYBER-2025-A10.4-01
  article_ref: Art. 10(2), 10(4)
  text_vi: '4. Chủ quản hệ thống thông tin thuộc Cấp độ 3, Cấp độ 4 không thuộc danh mục hệ thống thông
    tin quan trọng về an ninh quốc gia thực hiện đầy đủ các nhiệm vụ quy định tại khoản 1 Điều này, các
    biện pháp quy định tại các điểm a, d, đ, e, g và h khoản 2 Điều này và theo nhu cầu, khả năng thực
    tế lựa chọn áp dụng biện pháp quy định tại điểm b và điểm c khoản 2 Điều này.

    ...

    2. Biện pháp bảo vệ an ninh mạng đối với hệ thống thông tin bao gồm:

    a) Ban hành quy định về bảo đảm an ninh mạng trong thiết kế, xây dựng, quản lý, vận hành, sử dụng,
    nâng cấp, hủy bỏ hệ thống thông tin;

    b) Thẩm định an ninh mạng đối với hồ sơ, thiết kế của hệ thống thông tin;

    c) Đánh giá điều kiện an ninh mạng đối với hệ thống thông tin;

    d) Áp dụng biện pháp quản lý theo tiêu chuẩn, quy chuẩn kỹ thuật về an ninh mạng, nghiên cứu xây dựng
    hệ thống tường lửa quốc gia để phòng, chống nguy cơ, khắc phục sự cố an ninh mạng;

    đ) Tổ chức triển khai các biện pháp lưu trữ, sao lưu bảo vệ an ninh thông tin mạng và an ninh của
    các thành tố cấu thành hệ thống thông tin;

    e) Kiểm tra, giám sát việc tuân thủ quy định và đánh giá hiệu quả của các biện pháp quản lý và kỹ
    thuật được áp dụng;

    g) Thực hiện giám sát an ninh mạng;

    h) Ứng phó, khắc phục sự cố an ninh mạng đối với hệ thống thông tin.'
  summary_en: Owners of level 3 or 4 systems (not on the national security list) must do all Art. 10(1)
    tasks and apply security rules in the life cycle, technical standards, backup, compliance checks,
    security monitoring, and incident response.
