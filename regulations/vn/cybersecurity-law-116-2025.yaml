- id: VN-CYBER-2025-A42.2-01
  article_ref: Art. 42(2)
  text_vi: 2. Có trách nhiệm bảo mật thông tin đăng ký, mở, quản lý, sử dụng tài khoản số của mình. Trường
    hợp sử dụng tài khoản số để thực hiện hành vi vi phạm pháp luật, tùy theo tính chất, mức độ của hành
    vi vi phạm, chủ tài khoản số, người sử dụng tài khoản số bị xử lý kỷ luật, xử phạt vi phạm hành chính
    hoặc bị truy cứu trách nhiệm hình sự; nếu gây thiệt hại đến lợi ích của Nhà nước, quyền và lợi ích
    hợp pháp của tổ chức, cá nhân thì phải bồi thường thiệt hại theo quy định pháp luật.
  summary_en: Organisations and persons must protect the information used to register, open, manage and
    use their digital accounts. Account holders carry the consequences of misuse. For an AI agent this
    supports named, controlled service accounts.
