- id: VN-CYBER-2025-A25.3-01
  article_ref: Art. 25(3)
  text_vi: '3. Doanh nghiệp trong nước và ngoài nước cung cấp dịch vụ trên mạng viễn thông, mạng Internet,
    các dịch vụ gia tăng trên không gian mạng tại Việt Nam có hoạt động thu thập, khai thác, phân tích,
    xử lý dữ liệu về thông tin cá nhân, dữ liệu về mối quan hệ của người sử dụng dịch vụ, dữ liệu do người
    sử dụng dịch vụ tại Việt Nam tạo ra phải áp dụng các biện pháp bảo vệ dữ liệu theo quy định của pháp
    luật và lưu trữ dữ liệu này tại Việt Nam trong thời gian theo quy định của Chính phủ.

    Doanh nghiệp ngoài nước quy định tại khoản này phải đặt chi nhánh hoặc văn phòng đại diện tại Việt
    Nam.'
  summary_en: Domestic and foreign firms providing services in cyberspace in Vietnam that collect, analyse
    or process personal data, relationship data or user-generated data of users in Vietnam must protect
    it and store it in Vietnam for the period set by the Government. Foreign firms must have a branch
    or representative office in Vietnam.
  duties:
  - data_localisation
  - data_minimisation
  applies_to:
    agent_class:
