- id: VN-CYBER-2025-A41.2-01
  article_ref: Art. 41(2)-(3)
  text_vi: '2. Cảnh báo khả năng mất an ninh mạng trong việc sử dụng dịch vụ trên không gian mạng do mình
    cung cấp và hướng dẫn biện pháp phòng ngừa đối với người sử dụng dịch vụ; xây dựng phương án ứng cứu
    khẩn cấp bảo đảm an ninh mạng để chủ động xử lý điểm yếu, rủi ro và sự cố an ninh mạng.

    ...

    3. Khi xảy ra sự cố an ninh mạng, ngay lập tức triển khai phương án ứng cứu khẩn cấp bảo đảm an ninh
    mạng, đồng thời báo cáo ngay với lực lượng chuyên trách bảo vệ an ninh mạng theo quy định của Luật
    này.'
  summary_en: Firms providing services in cyberspace must warn users of security risks and advise on prevention,
    keep an emergency plan, run it at once when an incident occurs, and report to the specialised force
    straight away.
