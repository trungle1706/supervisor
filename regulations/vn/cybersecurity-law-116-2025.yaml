- id: VN-CYBER-2025-A26.2-01
  article_ref: Art. 26(2)
  text_vi: '2. Nội dung bảo đảm an ninh dữ liệu bao gồm:

    a) Xây dựng chính sách, thiết lập quy trình về bảo đảm an ninh dữ liệu;

    b) Áp dụng biện pháp, tiêu chuẩn, quy chuẩn kỹ thuật theo quy định của pháp luật về an ninh mạng;

    c) Sử dụng mật mã cơ yếu, mật mã dân sự để bảo đảm an ninh dữ liệu;

    d) Triển khai cơ chế kiểm soát chặt chẽ nhân sự trực tiếp tham gia xử lý dữ liệu;

    đ) Kiểm tra, đánh giá rủi ro định kỳ nhằm phát hiện, ngăn chặn và xử lý kịp thời các nguy cơ đe dọa
    an ninh dữ liệu;

    e) Kiểm tra, đánh giá việc chuyển dữ liệu xuyên biên giới; điều kiện bảo đảm an ninh dữ liệu trong
    hệ thống thông tin quan trọng về an ninh quốc gia, các cơ sở dữ liệu, trung tâm dữ liệu, hệ thống
    lưu trữ dữ liệu;

    g) Các nội dung khác theo quy định của pháp luật.'
  summary_en: 'Data security covers: policy and process; technical standards; cryptography; strict control
    of staff who process data; periodic risk checks; and checks of cross-border transfers and of security
    conditions of critical systems, databases and data centres.'
  duties:
  - risk_management_system
  - robustness_security
  - encryption
  - access_control
  - cross_border_notice
