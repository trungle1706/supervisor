- id: VN-CYBER-2025-A25.3-02
  article_ref: Decree 333/2026 Art. 19(1)-(2), 19(5), 20(1)
  text_vi: '1. Dữ liệu phải lưu trữ tại Việt Nam:

    a) Thông tin cá nhân của người sử dụng dịch vụ tại Việt Nam;

    b) Dữ liệu do người sử dụng dịch vụ tại Việt Nam tạo ra: Tên tài khoản sử dụng dịch vụ, thời gian
    sử dụng dịch vụ, thông tin thẻ tín dụng, địa chỉ thư điện tử, địa chỉ mạng (IP) đăng nhập, đăng xuất
    gần nhất, số điện thoại đăng ký được gắn với tài khoản hoặc dữ liệu.

    ...

    2. Doanh nghiệp trong nước lưu trữ dữ liệu quy định tại khoản 1 Điều này tại Việt Nam.

    ...

    5. Hình thức lưu trữ dữ liệu tại Việt Nam do doanh nghiệp tự quyết định, đảm bảo khả năng truy xuất,
    cung cấp kịp thời khi có yêu cầu của cơ quan có thẩm quyền và đảm bảo an toàn thông tin theo tiêu
    chuẩn, quy chuẩn kỹ thuật quốc gia.

    ...

    1. Thời gian lưu trữ dữ liệu theo quy định tại Điều 19 Nghị định này bắt đầu từ khi doanh nghiệp nhận
    được yêu cầu lưu trữ dữ liệu đến khi kết thúc yêu cầu. Thời gian lưu trữ tối thiểu là 24 tháng.'
  summary_en: 'Data to be stored in Vietnam: personal data of service users in Vietnam, and data they
    create (account name, usage time, credit card info, email, last login/logout IP, registered phone
    number). Domestic firms store it in Vietnam; the form of storage is theirs but it must be retrievable
    on request. Minimum storage period is 24 months from the date of the request.'
  duties:
  - data_localisation
  - retention
  - record_keeping
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
    - financial
  addressee: bank
