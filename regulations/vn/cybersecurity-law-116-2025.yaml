  notes: 'Official text read (vbpl.vn). Number 116/2025/QH15, passed 10 Dec 2025, effective 1 Jul 2026
    confirmed. The text has 45 articles in 8 chapters (a press report says 58 articles; the vbpl text
    ends at Art. 45; trust the stored text). Art. 44(2): the Network Information Security Law 86/2015/QH13
    (as amended by 35/2018/QH14) and the Cybersecurity Law 24/2018/QH14 cease on 1 Jul 2026. Local storage:
    Art. 25(3) (store in Vietnam for the period the Government sets; foreign firms need a branch or office).
    The 2018 law''s ''on request'' wording is gone from the Law but Decree 333/2026 Art. 19-20 keeps the
    24-month minimum counted from the storage request; domestic firms store the listed data in Vietnam
    (Art. 19(2)); no bank-specific carve-out or rule exists. Incident reporting: Art. 40(1)(c), 41(3);
    timing from Decree 331/2026 Art. 31(2)(d): 24 h initial for serious incidents, 72 h report. Security
    levels: Art. 8, five levels, criteria in Decree 331/2026 (which replaces the level system of Decree
    85/2016 in substance; 331 has no express repeal clause in the text read, vbpl still shows 85/2016
    as ''Con hieu luc'': status of 85/2016 and of Circular 12/2022/TT-BTTTT after 19 Aug 2026 is UNVERIFIED).
    Critical systems: Art. 9 (national security important systems, PM list). AI: only Art. 7(2)(g) (deepfake
    ban). Guiding decrees signed 19 Aug 2026 per vbpl: 327 (illegal info), 328 (fake news), 329 (cyber
    forces), 330 (administrative penalties for cybersecurity and personal data protection; the ''330/2026,
    19 Aug 2026'' report is CONFIRMED by the vbpl index: not read), 331 (system security), 332 (cyber
    products/services), 333 (details). Penalty decree 330 was not read, so no sanction amounts are stored.
    The Law has no sector-specific bank rule; SBV circulars on information-system safety were not covered
    here.'
obligations:
- id: VN-CYBER-2025-A8.1-01
  article_ref: Art. 8(1)-(2)
  text_vi: '1. Hệ thống thông tin được phân loại theo 5 cấp độ căn cứ vào mức độ tổn hại tới an ninh quốc
    gia, trật tự, an toàn xã hội, quyền, lợi ích hợp pháp của tổ chức, cá nhân, lợi ích công cộng khi
    bị sự cố hoặc có hành vi vi phạm pháp luật về an ninh mạng như sau:

    a) Cấp độ 1 có thể làm tổn hại tới quyền và lợi ích hợp pháp của tổ chức, cá nhân;

    b) Cấp độ 2 có thể làm tổn hại nghiêm trọng tới quyền và lợi ích hợp pháp của tổ chức, cá nhân hoặc
    làm tổn hại tới lợi ích công cộng;

    c) Cấp độ 3 có thể làm tổn hại đặc biệt nghiêm trọng tới quyền và lợi ích hợp pháp của tổ chức, cá
    nhân; tổn hại nghiêm trọng tới lợi ích công cộng; tổn hại hoặc tổn hại nghiêm trọng tới trật tự, an
    toàn xã hội hoặc làm tổn hại tới an ninh quốc gia;

    d) Cấp độ 4 có thể làm tổn hại đặc biệt nghiêm trọng tới lợi ích công cộng, trật tự, an toàn xã hội
    hoặc làm tổn hại nghiêm trọng tới an ninh quốc gia;

    đ) Cấp độ 5 có thể làm tổn hại đặc biệt nghiêm trọng tới an ninh quốc gia.

    ...

    2. Chính phủ quy định chi tiết tiêu chí xác định cấp độ hệ thống thông tin; quy định thẩm quyền, trình
    tự, thủ tục xác định cấp độ hệ thống thông tin và biện pháp, trách nhiệm, nghĩa vụ bảo đảm an ninh
    mạng theo từng cấp độ của hệ thống thông tin.'
  summary_en: Every information system is classified into one of five security levels by the harm a failure
    would cause (level 1 harm to rights of persons; level 3 very serious harm to rights or serious harm
    to public interest; level 5 very serious harm to national security). The Government sets criteria
    and procedure.
