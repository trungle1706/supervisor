- id: VN-CYBER-2025-A10.1-01
  article_ref: Art. 10(1)
  text_vi: '1. Nhiệm vụ bảo vệ an ninh mạng đối với hệ thống thông tin bao gồm:

    a) Xác định cấp độ an ninh mạng của hệ thống thông tin và hệ thống thông tin quan trọng về an ninh
    quốc gia;

    b) Đánh giá và quản lý rủi ro an ninh mạng hệ thống thông tin;

    c) Đôn đốc, giám sát, kiểm tra công tác bảo vệ an ninh mạng hệ thống thông tin;

    d) Tổ chức triển khai các biện pháp bảo vệ an ninh mạng hệ thống thông tin;

    đ) Thực hiện chế độ báo cáo theo quy định;

    e) Tổ chức tuyên truyền, nâng cao nhận thức về an ninh mạng.'
  summary_en: 'System owners must: set the security level, assess and manage cyber risk, supervise and
    check protection, apply protection measures, report as required, and raise awareness.'
