- id: VN-DATA-2024-A18.2-01
  article_ref: Art. 18(2)
  text_vi: '2. Tổ chức, cá nhân phải cung cấp dữ liệu cho cơ quan nhà nước khi có yêu cầu của cơ quan
    có thẩm quyền mà không cần chủ thể dữ liệu đồng ý trong các trường hợp sau đây:

    a) Ứng phó với tình trạng khẩn cấp;

    b) Khi có nguy cơ đe dọa an ninh quốc gia nhưng chưa đến mức ban bố tình trạng khẩn cấp;

    c) Thảm họa;

    d) Phòng, chống bạo loạn, khủng bố.'
  summary_en: On a competent authority's request the bank must hand over data to state agencies, without
    data-subject consent, in an emergency, a threat to national security, a disaster, or riot/terror prevention.
    The bank must be able to find and produce the data.
  duties:
  - record_keeping
  - regulatory_reporting
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: audit export can package agent events and case files
  - kind: process
    id: regulator_notification
    coverage: none
    note: handling of authority data requests (Decree 165 Art. 8)
  - kind: process
    id: legal_review
    coverage: none
  evidence_needed:
  - log of authority requests and handovers (minutes)
  verification: VERIFIED_PRIMARY
