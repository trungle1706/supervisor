- id: VN-DATA-2024-A27.1-01
  article_ref: Art. 27(1)
  text_vi: '1. Biện pháp bảo vệ dữ liệu được áp dụng trong toàn bộ quá trình xử lý dữ liệu, bao gồm:

    a) Xây dựng và tổ chức thực hiện chính sách, quy định bảo vệ dữ liệu;

    b) Quản lý hoạt động xử lý dữ liệu;

    c) Xây dựng và triển khai các giải pháp kỹ thuật;

    d) Đào tạo, bồi dưỡng, phát triển, quản lý nguồn nhân lực;

    đ) Các biện pháp bảo vệ dữ liệu khác theo quy định của pháp luật.'
  summary_en: 'Data protection measures must cover the whole processing life: policy and rules, management
    of processing, technical solutions, and training and management of staff.'
