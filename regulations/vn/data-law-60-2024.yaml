- id: VN-DATA-2024-A25.3-01
  article_ref: Art. 25(3)
  text_vi: 3. Chủ quản dữ liệu không thuộc quy định tại khoản 2 Điều này tự đánh giá, xác định rủi ro
    và thực hiện các biện pháp để bảo vệ dữ liệu; kịp thời khắc phục rủi ro phát sinh và thông báo cho
    chủ thể dữ liệu, cơ quan, tổ chức, cá nhân có liên quan.
  summary_en: Data controllers outside the state sector assess and find data risks themselves, apply protection
    measures, fix risks quickly and notify the data subjects and parties concerned.
  duties:
  - risk_management_system
  - incident_response
  - breach_notification_subject
