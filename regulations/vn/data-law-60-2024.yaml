- id: VN-DATA-2024-A26.1-01
  article_ref: Art. 26(1)
  text_vi: 1. Chủ thể dữ liệu có quyền yêu cầu chủ sở hữu dữ liệu, chủ quản dữ liệu thu hồi, xóa hoặc
    hủy dữ liệu của mình đã cung cấp, trừ trường hợp pháp luật có quy định khác. Chủ quản dữ liệu có trách
    nhiệm thiết lập quy trình, triển khai các biện pháp, phương thức thu hồi, xóa hoặc hủy dữ liệu theo
    yêu cầu của chủ thể dữ liệu.
  summary_en: 'A data subject may ask the owner or controller to recall, delete or destroy the data they
    supplied, unless the law says otherwise. The controller must have a process to do it (Decree 165 Art.
    13: within 72 hours).'
  duties:
  - data_subject_rights
  - retention
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
  addressee: controller
  control_mapping:
  - kind: process
    id: data_subject_request
    coverage: none
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: shows where an agent copied or used a customer's data
  evidence_needed:
