- id: VN-DATA-2024-A15.4-01
  article_ref: Art. 15(1), 15(4)
  text_vi: '4. Chủ sở hữu dữ liệu, chủ quản dữ liệu là tổ chức, cá nhân không thuộc quy định tại khoản
    3 Điều này căn cứ vào điều kiện thực tế thực hiện quản trị, quản lý dữ liệu do mình thu thập, tạo
    lập, sở hữu.

    ...

    1. Quản trị dữ liệu bao gồm: xây dựng chính sách, kế hoạch, chương trình, quy trình, tiêu chuẩn về
    dữ liệu của chủ sở hữu dữ liệu, chủ quản dữ liệu để quản lý dữ liệu một cách liên tục, hiệu quả, bảo
    đảm tính đầy đủ, chính xác, toàn vẹn, nhất quán, thống nhất, được chuẩn hóa, an toàn, bảo mật, kịp
    thời của dữ liệu.'
  summary_en: Data owners and controllers outside the state sector govern and manage their data (policy,
    plan, process, standard) in line with their real conditions, so data stays complete, accurate, consistent
    and secure.
  duties:
  - internal_policy
  - data_quality
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: process
    id: internal_policy_issuance
    coverage: none
  - kind: evidence
    id: policy_baseline
    coverage: partial
    note: versioned policy baseline for agent behaviour, not data governance as a whole
  evidence_needed:
  - data governance policy
  - data quality controls
