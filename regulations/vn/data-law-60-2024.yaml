  last_checked: '2026-10-15'
  notes: 'Number, issue date (30/11/2024) and effective date (1/7/2025) confirmed from the official text
    and the vbpl.vn record. Definitions: Art. 3(6) important data and 3(7) core data are data that can
    affect defence, security, foreign affairs, macro-economy, social stability, public health and safety,
    listed in a catalogue issued by the Prime Minister. Criteria are in Decree 165/2025 Art. 3-4; no PM
    catalogue was found in the sources checked on 2026-10-15 (not verified either way). Localisation:
    the Law has no explicit in-country storage duty for core data held by private organisations; Art.
    14(2) only points to Art. 27(3), and Art. 14(3)-(4) apply to state databases. Cross-border handling
    of core/important data is governed by Art. 23 and Decree 165 Art. 12 (assessment; approval for core
    data; 15-day prior filing for important data). Risk assessment: Art. 25(4). Data products/services:
    Art. 39-43 (obligations A40-A43 apply only if the bank offers such services). AI is named as a technology
    platform in Art. 24(2) but the Law has no AI-specific duty. Art. 4 says later laws that differ must
    say so; the Personal Data Protection Law 91/2025 and Cybersecurity Law 116/2025 sit alongside it (see
    Decree 165 Art. 16(2): core/important data that is personal data follows Decree 165 and is exempt
    from the PDPL impact assessment).'
obligations:
- id: VN-DATA-2024-A13.2-01
  article_ref: Art. 13(1)(b), 13(2)
  text_vi: '2. Chủ sở hữu dữ liệu, chủ quản dữ liệu không thuộc quy định tại khoản 1 Điều này phải phân
    loại dữ liệu theo quy định tại điểm b khoản 1 Điều này và được phân loại dữ liệu theo các tiêu chí
    khác.

    ...

    b) Phân loại theo tính chất quan trọng của dữ liệu gồm: dữ liệu cốt lõi, dữ liệu quan trọng, dữ liệu
    khác;'
  summary_en: A data owner or controller that is not a state agency must classify its data as core, important
    or other. The bank must know which of its data (and which data its agents touch) falls in the Prime
    Minister's core / important lists.
  duties:
  - data_classification
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: process
    id: internal_policy_issuance
    coverage: none
    note: bank data classification policy
  - kind: evidence
    id: onboard_profile
    coverage: partial
    note: onboarding profile records the data classes declared for the agent; the classification itself
      is the bank's
  - kind: process
    id: legal_review
    coverage: none
    note: map bank datasets to the PM core/important data lists
  evidence_needed:
  - data classification register
  - per-agent declared data classes
  verification: VERIFIED_PRIMARY
  sources:
