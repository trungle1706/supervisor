- id: VN-DATA-2024-A23.2-01
  article_ref: Art. 23(2)
  text_vi: '2. Chuyển, xử lý dữ liệu cốt lõi, dữ liệu quan trọng xuyên biên giới bao gồm:

    a) Chuyển dữ liệu đang lưu trữ tại Việt Nam tới hệ thống lưu trữ dữ liệu đặt ngoài lãnh thổ nước Cộng
    hòa xã hội chủ nghĩa Việt Nam;

    b) Cơ quan, tổ chức, cá nhân Việt Nam chuyển dữ liệu cho tổ chức, cá nhân nước ngoài;

    c) Cơ quan, tổ chức, cá nhân Việt Nam sử dụng nền tảng ở ngoài lãnh thổ nước Cộng hòa xã hội chủ nghĩa
    Việt Nam để xử lý dữ liệu.'
  summary_en: 'Cross-border handling of core or important data includes: moving stored data to a system
    outside Vietnam, giving data to a foreign party, and using a platform outside Vietnam to process data.
    An AI agent that sends such data to a foreign-hosted model or tool is in scope.'
  duties:
  - cross_border_notice
  - data_localisation
  applies_to:
    agent_class:
    - any
    data_classes:
    - core_data
    - important_data
    cross_border: true
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: pii_masking
    coverage: partial
    note: masking before a judge call lowers data exposure but does not classify core/important data
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: calls and destinations can be logged
  - kind: process
    id: transfer_impact_assessment
    coverage: none
    note: impact assessment file (Decree 165 Art. 12)
  - kind: process
    id: data_localisation_setup
    coverage: none
  evidence_needed:
  - cross-border data inventory
  - region and host of each model/tool call
  - assessment dossier (Decree 165 Art. 12)
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/174877
    title: Luat Du lieu 60/2024/QH15 (vbpl.vn, full text)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 39fb4a228bbd45781f70f6ef68513083152b9be1350cbb3d3fe39ddaea1cfb18
    local_path: regulations/sources/VN-DATA-2024/luat-60-2024-qh15.txt
  confidence: high
  notes: Use of a foreign cloud model counts as 'using a platform outside Vietnam to process data' (Art.
    23(2)(c)). Law 60 does not itself require core data to stay in Vietnam; the control is the Art. 23
    / Decree 165 Art. 12 assessment and approval.
- id: VN-DATA-2024-A23.3-01
  article_ref: Art. 23(3)
  text_vi: 3. Việc chuyển, xử lý dữ liệu quy định tại khoản 1 và khoản 2 Điều này phải bảo đảm quốc phòng,
    an ninh, bảo vệ lợi ích quốc gia, lợi ích công cộng, quyền và lợi ích hợp pháp của chủ thể dữ liệu,
    chủ sở hữu dữ liệu theo quy định của pháp luật Việt Nam và các điều ước quốc tế mà nước Cộng hòa xã
    hội chủ nghĩa Việt Nam là thành viên.
  summary_en: Any cross-border transfer or processing must protect national defence, security, public
    interest and the rights of data subjects and owners under Vietnamese law and treaties.
  duties:
  - cross_border_notice
  applies_to:
    agent_class:
    - any
    cross_border: true
  addressee: bank
  control_mapping:
  - kind: process
    id: transfer_impact_assessment
    coverage: none
  - kind: process
    id: legal_review
    coverage: none
  evidence_needed:
  - documented legality and necessity analysis per transfer
  verification: VERIFIED_PRIMARY
