- id: VN-DATA-2024-A10.1-01
  article_ref: Art. 10(1)-(2)
  text_vi: '1. Lợi dụng việc xử lý dữ liệu, quản trị dữ liệu, phát triển, kinh doanh, lưu hành sản phẩm,
    dịch vụ về dữ liệu để xâm phạm đến lợi ích quốc gia, dân tộc, quốc phòng, an ninh, trật tự, an toàn
    xã hội, lợi ích công cộng, quyền và lợi ích hợp pháp của cơ quan, tổ chức, cá nhân.

    ...

    2. Cản trở hoặc ngăn chặn trái pháp luật quá trình xử lý dữ liệu, quản trị dữ liệu hoặc tấn công,
    chiếm đoạt, phá hoại cơ sở dữ liệu, hệ thống thông tin phục vụ quản lý, xử lý, quản trị, bảo vệ dữ
    liệu.'
  summary_en: 'Banned: abusing data processing or data products to harm national interest, security, public
    order or others'' lawful rights; obstructing data processing; attacking or seizing databases and information
