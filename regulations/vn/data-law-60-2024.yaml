- id: VN-DATA-2024-A25.1-01
  article_ref: Art. 25(1)
  text_vi: '1. Rủi ro phát sinh trong xử lý dữ liệu bao gồm: rủi ro quyền riêng tư, rủi ro an ninh mạng,
    rủi ro nhận dạng và quản lý truy cập, rủi ro khác trong xử lý dữ liệu.'
  summary_en: Data processing risks include privacy risk, cybersecurity risk, and identity and access
    management risk. The bank's risk register for an agent should cover all three.
  duties:
  - risk_management_system
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: rule
    id: PII-02
    coverage: partial
    note: limits personal-data reads by the agent
  - kind: process
    id: security_assessment
    coverage: none
  evidence_needed:
  - risk register entries for privacy, cyber and IAM risk
  verification: VERIFIED_PRIMARY
