- id: VN-DATA-2024-A25.4-01
  article_ref: Art. 25(4)
  text_vi: 4. Chủ quản dữ liệu cốt lõi, dữ liệu quan trọng phải định kỳ tiến hành đánh giá rủi ro đối
    với các hoạt động xử lý dữ liệu đó theo quy định và thông báo tới đơn vị chuyên trách về an ninh mạng,
    an toàn thông tin thuộc Bộ Công an, Bộ Quốc phòng và cơ quan có liên quan để phối hợp thực hiện việc
    bảo vệ an toàn, an ninh dữ liệu.
  summary_en: Controllers of core or important data must run periodic risk assessments of that processing
    and tell the cybersecurity / information-security unit of the Ministry of Public Security or Ministry
    of National Defence and other relevant bodies.
  duties:
  - risk_management_system
  - regulatory_reporting
