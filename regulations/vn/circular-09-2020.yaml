- id: VN-TT09-2020-A46-01
  article_ref: Art. 46(1)-(3)
  text_vi: '1. Lập danh sách sự cố an toàn thông tin và phương án xử lý sự cố đối với các hệ thống thông
    tin từ cấp độ 3 trở lên và các hệ thống thông tin có xử lý thông tin cá nhân của khách hàng; tối thiểu
    6 tháng một lần thực hiện rà soát, cập nhật danh sách, phương án ứng cứu sự cố.

    ...

    2. Báo cáo ngay đến cấp có thẩm quyền và những người có liên quan khi phát sinh sự cố an toàn thông
    tin để có biện pháp khắc phục trong thời gian sớm nhất.

    ...

    3. Trong quá trình kiểm tra, xử lý, khắc phục sự cố thu thập, ghi chép, bảo vệ chứng cứ và lưu trữ
    tại tổ chức.'
  summary_en: For level-3+ and customer-data systems the bank must list incident types and response plans
    (review at least every 6 months), report an incident at once to the competent level, and collect and
    protect evidence during handling.
  duties:
