- id: VN-TT09-2020-A54.2-01
  article_ref: Art. 54(2) with Art. 33(3)
  text_vi: 2. Báo cáo đánh giá rủi ro theo quy định tại khoản 3 Điều 33 Thông tư này gửi trực tiếp hoặc
    qua đường bưu điện về Ngân hàng Nhà nước (Cục Công nghệ thông tin) khi thuê ngoài toàn bộ công việc
    quản trị hệ thống thông tin từ cấp độ 3 trở lên và các hệ thống thông tin xử lý thông tin khách hàng
    trước thời điểm triển khai tối thiểu 10 ngày làm việc.
  summary_en: If the bank outsources the whole administration of a level-3+ or customer-data system, it
