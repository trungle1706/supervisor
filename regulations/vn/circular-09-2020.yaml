- id: VN-TT09-2020-A54.1-01
  article_ref: Art. 54(1)
  text_vi: 1. Báo cáo sự cố an toàn thông tin (theo Phụ lục 01 kèm theo Thông tư này) trong vòng 24 giờ
    kể từ thời điểm sự cố được phát hiện và Báo cáo hoàn thành khắc phục sự cố (theo Phụ lục 02 kèm theo
    Thông tư này) trong vòng 05 ngày làm việc sau khi hoàn thành khắc phục sự cố. Báo cáo gửi về địa chỉ
    thư điện tử antt@sbv.gov.vn.
  summary_en: The bank must report an information-security incident to the SBV (Information Technology
    Department) within 24 hours of detection, and a completion report within 5 working days after the
    fix.
