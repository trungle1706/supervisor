  confidence: high
- id: VN-TT09-2020-A28.1C-01
  article_ref: Art. 28(1)(c)
  text_vi: c) Đối với tài khoản để các ứng dụng, dịch vụ kết nối tự động, phải được giao cho một cá nhân
    quản lý và được giới hạn quyền truy cập theo mục đích sử dụng; cá nhân được giao quản lý không được
    phép sử dụng tài khoản này cho các mục đích khác;
  summary_en: An account that an application or service uses to connect automatically (a service account,
    which includes an AI agent credential) must have one named manager and rights limited to its purpose.
  duties:
  - access_control
  - excessive_agency_limits
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: approved_tools
    coverage: partial
    note: an agent may call only tools approved for its flows
  - kind: rule
    id: PAY-07
    coverage: partial
    note: payments agent may call approved tools only
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: agent inventory names an owner
  - kind: process
    id: access_management
    coverage: partial
    note: service-account owner and rights in IAM
  evidence_needed:
  - Service-account register with owner and scope for each agent credential
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/144532
    title: Circular 09/2020/TT-NHNN full text (vbpl.vn)
