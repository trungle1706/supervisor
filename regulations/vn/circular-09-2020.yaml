- id: VN-TT09-2020-A42-01
  article_ref: Art. 42(1)(d), (2), (3)
  text_vi: 'd) Kiểm tra thử nghiệm cấp độ an toàn mạng (Penetration Test), bắt buộc phải thực hiện đối
    với các hệ thống thông tin có kết nối và cung cấp thông tin, dịch vụ ra Internet, kết nối với khách
    hàng và bên thứ ba;

    ...

    2. Tổ chức thực hiện kiểm tra, đánh giá an toàn thông tin đối với hệ thống thông tin từ cấp độ 3 trở
    lên và các hệ thống thông tin có xử lý thông tin cá nhân của khách hàng theo các nội dung quy định
    tại khoản 1 Điều này trước khi đưa vào vận hành chính thức.

    ...

    3. Trong quá trình vận hành hệ thống thông tin, tổ chức thực hiện kiểm tra, đánh giá an toàn thông
    tin theo quy định tại khoản 1 Điều này định kỳ tối thiểu như sau:

    a) Sáu tháng một lần đối với hệ thống thông tin cấp độ 5;

    b) Một năm một lần đối với các hệ thống thông tin cấp độ 4, cấp độ 3 và các trang thiết bị giao tiếp
    trực tiếp với môi trường bên ngoài như Internet, kết nối với bên thứ ba;

    c) Hai năm một lần thực hiện kiểm tra, đánh giá an toàn thông tin và quản lý rủi ro an toàn thông
    tin tổng thể trong hoạt động của tổ chức.'
  summary_en: Level-3+ systems and systems with customer data need a security check, including a penetration
    test for internet-facing or customer-linked systems, before go-live. Repeat at least yearly (level
    3 and 4, and all devices that face the outside) or every 6 months (level 5).
  duties:
  - security_testing
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: evidence
    id: launch_report
    coverage: partial
    note: Supervisor launch report is not a penetration test
  - kind: process
    id: security_assessment
    coverage: none
    note: penetration test by the bank or its vendor
  evidence_needed:
