  confidence: medium
- id: VN-TT09-2020-A5.1-01
  article_ref: Art. 5(1), (8), (9)
  text_vi: '1. Đối với hệ thống thông tin cung cấp dịch vụ trực tuyến cho khách hàng, các tổ chức thực
    hiện phân loại theo quy định tại Nghị định số 85/2016/NĐ-CP ngày 01/7/2016 của Chính phủ quy định
    về bảo đảm an toàn hệ thống thông tin theo cấp độ. Đối với các hệ thống thông tin khác, thực hiện
    phân loại theo quy định tại khoản 2, 3, 4, 5, 6, 7 Điều này.

    ...

    8. Tổ chức thực hiện phân loại hệ thống thông tin theo cấp độ quy định tại khoản 1, 2, 3, 4, 5, 6,
    7 Điều này. Hồ sơ, thủ tục thẩm định, phê duyệt hệ thống thông tin theo cấp độ tuân thủ quy định tại
    Nghị định số 85/2016/NĐ-CP. Đối với hồ sơ đề xuất các hệ thống thông tin cấp độ 4, 5, tổ chức gửi
    hồ sơ cho Ngân hàng Nhà nước (Cục Công nghệ thông tin) để lấy ý kiến.

    ...

    9. Danh sách hệ thống thông tin theo cấp độ phải được lập và rà soát, cập nhật sau khi hệ thống được
    triển khai và định kỳ hàng năm.'
  summary_en: Each information system must be classified by security level (1 to 5), approved under the
    level decree, and kept on a list reviewed after go-live and every year. Systems with customer data
    of 10 million or more customers, or 24/7 customer service, rank high (level 3 or 4). The agent platform
    and the gateway are part of the classified system.
  duties:
  - system_classification
  - risk_classification
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: agent inventory with owner and risk tier; not the legal security level
  - kind: process
    id: security_assessment
    coverage: none
    note: bank classifies and gets the level approved
  evidence_needed:
  - System list with security levels and approvals
  - Annual review record
  verification: VERIFIED_PRIMARY
  sources:
