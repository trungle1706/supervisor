- id: VN-TT09-2020-A32-01
  article_ref: Art. 32
  text_vi: 'Khi sử dụng dịch vụ công nghệ thông tin của bên thứ ba, tổ chức bảo đảm các nguyên tắc sau
    đây:

    1. Không làm suy giảm khả năng cung cấp dịch vụ liên tục của tổ chức cho khách hàng.

    2. Không làm suy giảm việc kiểm soát quy trình nghiệp vụ của tổ chức.

    3. Không làm thay đổi trách nhiệm của tổ chức trong việc bảo đảm an toàn thông tin.

    4. Dịch vụ công nghệ thông tin của bên thứ ba phải đáp ứng các quy định về bảo đảm an toàn thông tin
    của tổ chức.'
  summary_en: When the bank uses a third party for IT services, the service must not weaken continuity,
    control of business processes or the bank's own responsibility for security. The bank stays responsible.
  duties:
  - outsourcing_oversight
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: process
    id: vendor_management
    coverage: none
    note: bank manages third parties; Supervisor does not replace this
  evidence_needed:
  - Vendor register with responsibility split
  verification: VERIFIED_PRIMARY
  sources:
