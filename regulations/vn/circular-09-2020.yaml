  confidence: high
- id: VN-TT09-2020-A6-01
  article_ref: Art. 6(1), (3)
  text_vi: '1. Tổ chức xây dựng quy chế an toàn thông tin phù hợp với hệ thống thông tin, cơ cấu tổ chức,
    yêu cầu quản lý và hoạt động của tổ chức. Quy chế an toàn thông tin phải được người đại diện hợp pháp
    ký ban hành và triển khai thực hiện trong toàn tổ chức.

    ...

    3. Tổ chức rà soát quy chế an toàn thông tin tối thiểu mỗi năm một lần, bảo đảm sự đầy đủ của quy
    chế theo các quy định tại Thông tư này. Khi phát hiện những bất cập, bất hợp lý gây ra mất an toàn
    thông tin hoặc theo yêu cầu của cơ quan có thẩm quyền, tổ chức tiến hành chỉnh sửa, bổ sung ngay quy
    chế an toàn thông tin đã ban hành.'
  summary_en: The bank must issue an information-security regulation signed by its legal representative
    and review it at least once a year.
  duties:
  - internal_policy
  - governance_accountability
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: process
    id: internal_policy_issuance
    coverage: none
    note: bank issues and reviews the regulation
  evidence_needed:
  - Signed regulation with annual review record
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/144532
    title: Circular 09/2020/TT-NHNN full text (vbpl.vn)
