  confidence: high
  notes: Art. 35(6) adds cloud terms (annual independent IT audit report, data-centre locations outside
    Vietnam disclosed, data segregation).
- id: VN-TT09-2020-A36-01
  article_ref: Art. 36(2), (5), (8)
  text_vi: '2. Có quy trình và bố trí nguồn lực để giám sát, kiểm soát các dịch vụ do bên thứ ba cung
    cấp bảo đảm chất lượng dịch vụ theo thỏa thuận đã ký kết. Đối với dịch vụ điện toán đám mây, phải
    giám sát, kiểm soát chất lượng dịch vụ.

    ...

    5. Áp dụng các biện pháp giám sát chặt chẽ và giới hạn quyền truy cập của bên thứ ba khi cho phép
    bên thứ ba truy cập vào hệ thống thông tin của tổ chức.

    ...

    8. Đối với hệ thống thông tin từ cấp độ 3 trở lên, các hệ thống thông tin xử lý thông tin khách hàng
    hoặc hệ thống thông tin sử dụng dịch vụ điện toán đám mây, phải đánh giá sự tuân thủ các quy định
    về bảo đảm an toàn thông tin của bên thứ ba theo đúng thỏa thuận đã ký kết. Thực hiện đánh giá sự
    tuân thủ định kỳ hàng năm hoặc đột xuất khi có nhu cầu. Việc đánh giá tuân thủ có thể sử dụng kết
    quả kiểm toán công nghệ thông tin của tổ chức kiểm toán độc lập.'
  summary_en: The bank must monitor the service quality of third parties, supervise and limit their access
    to bank systems, and for level-3+ or customer-data systems assess their compliance at least once a
    year.
  duties:
  - outsourcing_oversight
  - performance_monitoring
  - access_control
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
    - financial
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: proxy_log
    coverage: partial
    note: records calls to external model endpoints seen by the gateway
  - kind: evidence
    id: verdict_log
    coverage: partial
    note: judge verdicts with model and prompt version show vendor model behaviour
  - kind: process
    id: vendor_management
    coverage: none
    note: annual compliance assessment
  evidence_needed:
  - Annual third-party assessment
  - Third-party access list and logs
  verification: VERIFIED_PRIMARY
