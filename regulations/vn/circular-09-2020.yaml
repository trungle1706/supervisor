  confidence: high
- id: VN-TT09-2020-A28.1D-01
  article_ref: Art. 28(1)(d)
  text_vi: 'd) Đối với hệ thống thông tin từ cấp độ 3 trở lên và các hệ thống thông tin có xử lý thông
    tin cá nhân của khách hàng phải giới hạn và kiểm soát các truy cập sử dụng tài khoản có quyền quản
    trị: (i) Thiết lập cơ chế kiểm soát việc tạo tài khoản có quyền quản trị để bảo đảm không một tài
    khoản nào sử dụng được khi chưa được cấp có thẩm quyền phê duyệt; (ii) Phải có biện pháp giám sát
    việc sử dụng tài khoản có quyền quản trị; (iii) Việc sử dụng tài khoản có quyền quản trị phải được
    giới hạn trong khoảng thời gian đủ để thực hiện công việc và phải được thu hồi ngay sau khi kết thúc
    công việc; (iv) Việc kết nối quản trị hệ thống phải qua các máy chủ trung gian hoặc các hệ thống quản
    trị tập trung, không thực hiện trực tiếp từ máy trạm của người quản trị;'
  summary_en: For systems of level 3 or above, and systems with customer personal data, admin accounts
    need approval, monitoring, time-limited use revoked after the task, and access through a jump server.
  duties:
  - access_control
  - security_monitoring
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
    - financial
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: records admin actions on the agent platform if routed through it
  - kind: process
    id: access_management
    coverage: partial
    note: privileged access management is a bank process
  evidence_needed:
  - Privileged-access records and approvals
  verification: VERIFIED_PRIMARY
  sources:
