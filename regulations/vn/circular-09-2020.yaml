  confidence: high
- id: VN-TT09-2020-A26.1-01
  article_ref: Art. 26(1)
  text_vi: '1. Ghi và lưu trữ nhật ký về hoạt động của hệ thống thông tin và người sử dụng, các lỗi phát
    sinh, các sự cố an toàn thông tin nếu hệ thống hỗ trợ, tối thiểu bao gồm:

    a) Thông tin kết nối mạng (firewall log);

    b) Thông tin đăng nhập;

    c) Thông tin thay đổi cấu hình;

    d) Thông tin truy cập dữ liệu và dịch vụ quan trọng (nếu có);

    đ) Thông tin các lỗi phát sinh trong quá trình hoạt động;

    e) Thông tin cảnh báo từ các thiết bị;

    g) Thông tin hiệu năng hoạt động của thiết bị (đối với hệ thống thông tin từ cấp độ 3 trở lên).'
  summary_en: 'For systems of level 2 and above, the bank must log system and user activity: firewall,
    logins, configuration changes, access to key data and services, errors and alerts (device performance
    from level 3).'
  duties:
  - logging
  - security_monitoring
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: evidence_chain
    coverage: partial
    note: hash-chained record of every gate decision, verdict and state change
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: recorded tool calls and gate decisions per agent
  - kind: catalogue
    id: proxy_log
    coverage: partial
    note: gateway proxy log for agents that emit no traces
  evidence_needed:
  - Log sources list per system
  - Sample of agent event records with timestamps
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/144532
    title: Circular 09/2020/TT-NHNN full text (vbpl.vn)
    fetched_at: '2026-10-15'
