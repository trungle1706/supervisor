- id: VN-TT09-2020-A37.2-01
  article_ref: Art. 37(2)
  text_vi: 2. Xây dựng phương án kiểm tra, xác minh hệ thống được triển khai tuân thủ theo đúng tài liệu
    thiết kế và yêu cầu bảo đảm an toàn thông tin trước khi nghiệm thu. Kết quả kiểm tra phải lập thành
    báo cáo và được cấp có thẩm quyền phê duyệt trước khi đưa vào vận hành chính thức.
  summary_en: Before a new or upgraded system (level 2 or above) goes live, the bank must test that it
    follows its security design and get the report approved by a competent level.
  duties:
  - security_testing
  - change_control
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: evidence
    id: launch_report
    coverage: partial
    note: launch sandbox report (catch rate, false alarms, GO or NO-GO) for the Supervisor controls only
  - kind: process
    id: security_assessment
    coverage: none
    note: bank approves the security test report
  evidence_needed:
  - Security test report with approval before go-live
  verification: VERIFIED_PRIMARY
