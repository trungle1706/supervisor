- id: VN-TT09-2020-A30.3-01
  article_ref: Art. 30(3)
  text_vi: '3. Quản lý và phân quyền truy cập thông tin và ứng dụng bảo đảm nguyên tắc cấp quyền vừa đủ
    để thực hiện nhiệm vụ được giao của người sử dụng:

    a) Phân quyền truy cập đến từng thư mục, chức năng của chương trình;

    b) Phân quyền đọc, ghi, xóa, thực thi đối với thông tin, dữ liệu, chương trình.'
  summary_en: 'Access to information and applications must follow least privilege: rights per folder and
    function, and separate read, write, delete and execute rights.'
