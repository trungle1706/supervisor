  confidence: high
- id: VN-TT09-2020-A33.1-01
  article_ref: Art. 33(1)
  text_vi: '1. Đánh giá rủi ro công nghệ thông tin, rủi ro hoạt động tối thiểu bao gồm các nội dung sau:

    a) Nhận diện rủi ro, phân tích, ước lượng cấp độ tổn hại, mối đe dọa đến an toàn thông tin;

    b) Khả năng kiểm soát các quy trình nghiệp vụ, khả năng cung cấp dịch vụ liên tục, khả năng thực hiện
    nghĩa vụ cung cấp thông tin cho các cơ quan nhà nước;

    c) Xác định rõ vai trò, trách nhiệm của các bên liên quan trong việc bảo đảm chất lượng dịch vụ;

    d) Xây dựng các biện pháp nhằm giảm thiểu rủi ro, biện pháp phòng ngừa, ứng cứu, khắc phục sự cố;

    đ) Rà soát và điều chỉnh chính sách quản lý rủi ro (nếu có).'
  summary_en: 'Before using a third-party service for a level-3+ system or a system with customer personal
    data, the bank must assess IT and operational risk: threats, control of processes, continuity, roles,
    and mitigation. A model vendor or hosted AI platform handling customer data falls here.'
  duties:
  - outsourcing_oversight
  - risk_management_system
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
    - financial
  addressee: bank
  control_mapping:
  - kind: process
    id: vendor_management
    coverage: none
    note: pre-contract risk assessment is a bank process
  - kind: evidence
    id: onboard_profile
    coverage: partial
    note: onboarding profile records data and tools an agent uses; useful input only
  evidence_needed:
  - Risk assessment per third-party service
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/144532
    title: Circular 09/2020/TT-NHNN full text (vbpl.vn)
    fetched_at: '2026-10-15'
