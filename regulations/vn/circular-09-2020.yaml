    local_path: regulations/sources/VN-TT09-2020/tt-09-2020-nhnn.txt
  confidence: high
- id: VN-TT09-2020-A26.2-01
  article_ref: Art. 26(2)
  text_vi: 2. Dữ liệu nhật ký của các hệ thống thông tin cấp độ 2 phải được lưu trực tuyến tối thiểu 1
    tháng và sao lưu tối thiểu 6 tháng. Dữ liệu nhật ký của các hệ thống thông tin từ cấp độ 3 trở lên
    phải được lưu trực tuyến tối thiểu 3 tháng theo hình thức tập trung và sao lưu tối thiểu một năm.
  summary_en: Logs of level-2 systems must be kept online at least 1 month and backed up at least 6 months.
    Logs of level-3 and higher systems must be kept online at least 3 months, centrally, and backed up
    at least 1 year.
  duties:
  - logging
  - retention
  - record_keeping
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: evidence_chain
    coverage: partial
    note: hash-chained record of every gate decision, verdict and state change
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: recorded tool calls and gate decisions per agent
  - kind: process
    id: records_retention
    coverage: none
    note: bank sets online and backup periods for agent logs
  evidence_needed:
  - 'Retention settings: 3 months online and 1 year backup for level 3 or above'
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/144532
    title: Circular 09/2020/TT-NHNN full text (vbpl.vn)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 1445a15c8884bbdfc979ecca68351fde87c7308c79e06c1d8525e8035ee19ae7
    local_path: regulations/sources/VN-TT09-2020/tt-09-2020-nhnn.txt
  confidence: high
  notes: Supervisor stores events; the retention period is set by the bank's deployment, not by Supervisor.
- id: VN-TT09-2020-A26.4-01
  article_ref: Art. 26(4)
  text_vi: 4. Bảo vệ các chức năng ghi nhật ký và thông tin nhật ký, chống giả mạo, thay đổi và truy cập
    trái phép; bảo đảm người quản trị hệ thống và người sử dụng không thể xóa hay sửa đổi nhật ký hệ thống
    ghi lại các hoạt động của chính họ.
  summary_en: Logging functions and log data must be protected from forgery, change and unauthorised access.
    Administrators and users must not be able to delete or change logs of their own actions.
  duties:
  - electronic_record_integrity
  - logging
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: evidence_chain
    coverage: partial
    note: SHA-256 hash chain with signed roots makes change detectable
  - kind: evidence
    id: chain_verify_report
    coverage: partial
    note: offline verification of the chain
  - kind: evidence
    id: anchor
    coverage: partial
    note: external anchor of signed roots
  - kind: process
    id: access_management
    coverage: partial
    note: bank must stop admins from editing the store itself
  evidence_needed:
  - Chain verification report
  - Admin rights review of the log store
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/144532
    title: Circular 09/2020/TT-NHNN full text (vbpl.vn)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 1445a15c8884bbdfc979ecca68351fde87c7308c79e06c1d8525e8035ee19ae7
    local_path: regulations/sources/VN-TT09-2020/tt-09-2020-nhnn.txt
  confidence: high
  notes: The chain detects tampering; it does not by itself prevent deletion by a database administrator.
- id: VN-TT09-2020-A28.1B-01
  article_ref: Art. 28(1)(b)
  text_vi: b) Mỗi tài khoản truy cập hệ thống phải được gán cho một người sử dụng duy nhất; trường hợp
    chia sẻ tài khoản dùng chung để truy cập hệ thống thông tin thì phải được phê duyệt bởi cấp có thẩm
    quyền và xác định được trách nhiệm cá nhân tại mỗi thời điểm sử dụng;
  summary_en: Each account must belong to one user only. A shared account needs approval by a competent
    level and personal responsibility must stay identifiable at every time of use.
  duties:
  - access_control
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: process
    id: access_management
    coverage: partial
    note: named accounts are the bank's IAM duty; Supervisor reviewer sign-offs carry the reviewer id
  - kind: evidence
    id: signoff_record
    coverage: partial
    note: sign-off records name the human reviewer
  evidence_needed:
  - Account inventory with an owner for every account
  - Approval record for any shared account
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/144532
    title: Circular 09/2020/TT-NHNN full text (vbpl.vn)
