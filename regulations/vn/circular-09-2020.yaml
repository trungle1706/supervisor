  confidence: high
- id: VN-TT09-2020-A35-01
  article_ref: Art. 35(1), (4)
  text_vi: '1. Cam kết của bên thứ ba về bảo đảm an toàn thông tin bao gồm:

    a) Không sao chép, thay đổi, sử dụng hay cung cấp dữ liệu của tổ chức sử dụng dịch vụ cho cá nhân,
    tổ chức khác, trừ trường hợp có yêu cầu của cơ quan nhà nước có thẩm quyền theo quy định của pháp
    luật; trong trường hợp này, bên thứ ba phải thông báo cho tổ chức sử dụng dịch vụ trước khi cung cấp
    dữ liệu, trừ khi việc thông báo sẽ vi phạm pháp luật Việt Nam;

    b) Phổ biến cho nhân sự của bên thứ ba tham gia thực hiện hợp đồng các quy định về bảo đảm an toàn
    thông tin của tổ chức, thực hiện các biện pháp giám sát bảo đảm tuân thủ.

    ...

    4. Dữ liệu phát sinh trong quá trình sử dụng dịch vụ là tài sản của tổ chức. Khi chấm dứt sử dụng
    dịch vụ:

    a) Bên thứ ba thực hiện trả lại hoặc hỗ trợ chuyển toàn bộ dữ liệu triển khai và dữ liệu phát sinh
    trong quá trình sử dụng dịch vụ về cho tổ chức;

    b) Bên thứ ba cam kết hoàn thành việc xóa toàn bộ dữ liệu của tổ chức trong một khoảng thời gian xác
    định.'
  summary_en: 'A contract with a third party for level-3+ or customer-data systems must include: no copy
    or disclosure of bank data (except lawful state request, with notice), staff security rules, subcontractor
    liability, data as bank property, return and deletion at exit.'
  duties:
  - outsourcing_oversight
  - processor_contract
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
    - financial
  addressee: bank
  control_mapping:
  - kind: process
    id: vendor_management
    coverage: none
    note: contract terms are negotiated by the bank
  evidence_needed:
  - Contract clauses mapped to Art. 35
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/144532
