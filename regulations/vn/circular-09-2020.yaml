    local_path: regulations/sources/VN-TT09-2020/tt-09-2020-nhnn.txt
  confidence: high
- id: VN-TT09-2020-A33.2-01
  article_ref: Art. 33(2)
  text_vi: '2. Trong trường hợp sử dụng dịch vụ điện toán đám mây, ngoài các yêu cầu tại khoản 1 Điều
    này, tổ chức thực hiện:

    a) Phân loại hoạt động, nghiệp vụ dự kiến triển khai trên điện toán đám mây dựa trên đánh giá tác
    động của hoạt động, nghiệp vụ đó với hoạt động của tổ chức;

    b) Xây dựng phương án dự phòng đối với các cấu phần của hệ thống thông tin từ cấp độ 3 trở lên. Phương
    án dự phòng phải được kiểm thử và đánh giá sẵn sàng thay thế cho các hoạt động, nghiệp vụ triển khai
    trên điện toán đám mây;

    c) Xây dựng các tiêu chí lựa chọn bên thứ ba đáp ứng yêu cầu quy định tại Điều 34 Thông tư này;

    d) Rà soát, bổ sung, áp dụng các biện pháp bảo đảm an toàn thông tin của tổ chức, giới hạn truy cập
    từ điện toán đám mây đến các hệ thống thông tin của tổ chức.'
  summary_en: For cloud services the bank must also classify the workload by impact, build a tested fallback
    for level-3+ components, set selection criteria, and limit access from the cloud to bank systems.
  duties:
  - outsourcing_oversight
  - business_continuity
  applies_to:
    agent_class:
    - any
    model_hosting:
    - domestic_cloud
    - foreign_cloud
  addressee: bank
  control_mapping:
  - kind: process
    id: vendor_management
    coverage: none
    note: cloud selection and fallback tests
  - kind: process
    id: business_continuity_plan
    coverage: none
    note: fallback plan tested
  evidence_needed:
  - Cloud workload classification
  - Fallback test record
  verification: VERIFIED_PRIMARY
  sources:
