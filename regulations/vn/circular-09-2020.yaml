  confidence: high
- id: VN-TT09-2020-A40.2-01
  article_ref: Art. 40(2)
  text_vi: 2. Tổ chức phải lựa chọn, kiểm soát đối với dữ liệu kiểm tra, thử nghiệm. Không sử dụng dữ
    liệu thật của hệ thống thông tin vận hành chính thức cho hoạt động kiểm thử khi chưa thực hiện các
    biện pháp che giấu hoặc thay đổi đối với dữ liệu chứa thông tin khách hàng và thông tin bí mật.
  summary_en: Real production data must not be used for testing until customer and confidential data has
    been masked or changed. This binds the test and launch sandboxes for agents.
  duties:
  - data_minimisation
  - security_testing
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
    - financial
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: pii_masking
    coverage: partial
    note: masks identifiers in recorded events, which helps when replaying events for tests
  - kind: evidence
    id: launch_report
    coverage: partial
    note: launch sandbox results
  evidence_needed:
  - Test-data masking procedure
  - Confirmation that sandbox uses synthetic or masked data
  verification: VERIFIED_PRIMARY
