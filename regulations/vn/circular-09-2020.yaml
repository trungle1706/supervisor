obligations:
- id: VN-TT09-2020-A4-01
  article_ref: Art. 4
  text_vi: 'Thông tin xử lý, lưu trữ thông qua hệ thống thông tin được phân loại theo thuộc tính bí mật
    như sau:

    1. Thông tin công cộng là thông tin được công khai cho tất cả các đối tượng mà không cần xác định
    danh tính, địa chỉ cụ thể của các đối tượng đó;

    2. Thông tin riêng (hoặc thông tin nội bộ) là thông tin được phân quyền quản lý, khai thác cho một
    hoặc một nhóm đối tượng được xác định danh tính;

    3. Thông tin cá nhân là thông tin định danh khách hàng và các thông tin sau đây: thông tin về tài
    khoản, thông tin về tiền gửi, thông tin về tài sản gửi, thông tin về giao dịch và các thông tin có
    liên quan khác;

    4. Thông tin bí mật là: (i) Thông tin Mật, Tối Mật, Tuyệt Mật theo quy định của pháp luật về bảo vệ
    bí mật nhà nước; (ii) Thông tin hạn chế tiếp cận theo quy định của tổ chức.'
  summary_en: Information must be classified as public, internal, personal (customer identity, account,
    deposit, transaction data) or confidential. An agent's inputs and outputs inherit the class of the
    data they carry.
  duties:
  - data_classification
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
    - financial
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: pii_masking
    coverage: partial
    note: masks personal identifiers before storage
  - kind: process
    id: security_assessment
    coverage: none
    note: bank classifies the data the agent uses
  evidence_needed:
  - Data classification of each agent's inputs and outputs
  verification: VERIFIED_PRIMARY
  sources:
