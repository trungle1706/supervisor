- id: VN-TT09-2020-A45-01
  article_ref: Art. 45(1)
  text_vi: '1. Ban hành quy trình xử lý sự cố an toàn thông tin bao gồm những nội dung tối thiểu sau:

    a) Tiếp nhận thông tin về sự cố phát sinh;

    b) Đánh giá cấp độ, phạm vi ảnh hưởng của sự cố đến hoạt động của hệ thống thông tin. Tùy theo cấp
    độ, phạm vi ảnh hưởng của sự cố phải báo cáo đến các cấp quản lý tương ứng để chỉ đạo xử lý;

    c) Thực hiện các biện pháp xử lý, khắc phục sự cố;

    d) Ghi nhận hồ sơ và báo cáo kết quả xử lý sự cố.'
  summary_en: 'The bank must issue an incident process: receive, assess level and impact and escalate,
    fix, and record and report the result.'
