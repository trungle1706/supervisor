- id: VN-TT09-2020-A41-01
  article_ref: Art. 41(1)
  text_vi: 1. Thực hiện ghi chép lại các thay đổi; lập kế hoạch thay đổi; thực hiện kiểm tra, thử nghiệm
    sự thay đổi, báo cáo kết quả; phê duyệt kế hoạch thay đổi trước khi áp dụng chính thức thay đổi phiên
    bản phần mềm, cấu hình phần cứng, tham số phần mềm hệ thống, quy trình vận hành. Có phương án dự phòng
    cho việc phục hồi hệ thống trong trường hợp thực hiện thay đổi không thành công hoặc gặp các sự cố
    không có khả năng dự tính trước.
  summary_en: The bank must record, plan, test, report and approve a change before it goes live (software
    version, configuration, parameters, procedures) and keep a rollback plan. Changing an agent's model,
    prompt or tools is such a change.
  duties:
  - change_control
  - lifecycle_management
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_version
    coverage: partial
    note: agent version history
  - kind: evidence
    id: policy_baseline
    coverage: partial
    note: versioned policy baseline
  - kind: process
    id: model_validation
    coverage: none
    note: second-line review of significant changes
  evidence_needed:
  - Change record with test result, approval and rollback plan
  verification: VERIFIED_PRIMARY
