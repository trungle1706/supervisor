- id: VN-AI-2025-A29.02-01
  article_ref: Art. 29(2)
  text_vi: Trường hợp hệ thống trí tuệ nhân tạo có rủi ro cao được quản lý, vận hành và sử dụng đúng quy
    định nhưng vẫn phát sinh thiệt hại thì bên triển khai phải chịu trách nhiệm bồi thường cho người bị
    thiệt hại.
  summary_en: If a high-risk system run by the rules still causes harm, the deployer must compensate the
    victim first. It may claim back from the provider or developer only if they agreed so.
