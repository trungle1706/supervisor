- id: VN-AI-2025-A35.01-01
  article_ref: Art. 35(1)
  text_vi: 'Đối với các hệ thống trí tuệ nhân tạo đã được đưa vào hoạt động trước ngày Luật này có hiệu
    lực thi hành, nhà cung cấp và bên triển khai có trách nhiệm thực hiện các nghĩa vụ tuân thủ theo quy
    định của Luật này trong thời hạn sau đây: a) 18 tháng kể từ ngày Luật này có hiệu lực thi hành đối
    với hệ thống trí tuệ nhân tạo trong lĩnh vực y tế, giáo dục và tài chính; b) 12 tháng kể từ ngày Luật
    này có hiệu lực thi hành đối với các hệ thống trí tuệ nhân tạo không thuộc trường hợp quy định tại
    điểm a khoản này.'
  summary_en: Systems already running before 2026-03-01 must comply within 18 months (to 2027-09-01) for
    health, education and finance systems, and within 12 months (to 2027-03-01) for all others.
  duties:
  - conformity_assessment
  - risk_classification
  - registration
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: agent inventory with owner, risk tier and model family
  - kind: process
    id: legal_review
    coverage: none
    note: bank counsel confirms scope and reading
  evidence_needed:
  - inventory with start date of each AI system
  - legal view whether banking counts as finance
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/69ba65c0-8a56-11f1-878c-399a87bcb3eb
    title: Luật Trí tuệ nhân tạo số 134/2025/QH15 (vbpl.vn, full text)
