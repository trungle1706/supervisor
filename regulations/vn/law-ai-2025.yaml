  notes: 'Open question: the Law names ''tài chính'' (finance), not ''ngân hàng'' (banking). Decision
    33 lists banking as its own sector but repeats ''tài chính'' in its transition rule (Art. 4(1)(a)).
    Circular 53/2026/TT-NHNN Art. 24 sets 2027-03-01 for bank systems under Chapters II to IV. Use the
    earlier date (2027-03-01) for planning until counsel decides.'
  dates:
