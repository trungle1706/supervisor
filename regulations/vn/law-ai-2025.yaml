    vi dân sự, người có khó khăn trong nhận thức, làm chủ hành vi để gây tổn hại cho chính họ hoặc người
    khác;
  summary_en: 'Prohibited: using the weakness of vulnerable groups (children, elderly, disabled, ethnic
    minorities, people with limited capacity) to harm them or others.'
