  notes: A principle, not a stand-alone penalty rule, but Art. 7(4) bans defeating human control and Art.
    14 turns it into duties for high-risk systems.
- id: VN-AI-2025-A4.03-01
  article_ref: Art. 4(3)
  text_vi: Bảo đảm công bằng, minh bạch, không thiên lệch, không phân biệt đối xử và không gây hại cho
    con người hoặc xã hội; tuân thủ chuẩn mực đạo đức và giá trị văn hóa Việt Nam; thực hiện trách nhiệm
    giải trình về các quyết định và hệ quả của hệ thống trí tuệ nhân tạo.
  summary_en: 'Core principle: fairness, transparency, no bias or discrimination, ethics, and accountability
    for decisions and their effects.'
  duties:
  - fair_treatment
  - bias_monitoring
  - governance_accountability
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: deployer
  control_mapping:
  - kind: catalogue
    id: fairness_slices
    coverage: partial
    note: outcome rates by customer segment
  - kind: monitor
    id: fairness
    coverage: partial
    note: fairness slice monitor
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: hash-chained record of gate decisions and verdicts; the bank still owns retention and access
  evidence_needed:
  - fairness slice results per customer segment
  - accountable owner named
