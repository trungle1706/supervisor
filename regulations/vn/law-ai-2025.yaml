- id: VN-AI-2025-A15.01-01
  article_ref: Art. 15(1)
  text_vi: 'Hệ thống trí tuệ nhân tạo có rủi ro trung bình được quản lý như sau: a) Nhà cung cấp và bên
    triển khai phải bảo đảm minh bạch theo quy định tại Điều 11 của Luật này; b) Nhà cung cấp có trách
    nhiệm giải trình về mục đích sử dụng, nguyên lý hoạt động ở mức mô tả chức năng, dữ liệu đầu vào chủ
    yếu và biện pháp quản lý rủi ro, an toàn của hệ thống khi có yêu cầu của cơ quan nhà nước trong thanh
    tra, kiểm tra hoặc khi có dấu hiệu rủi ro hoặc sự cố; việc giải trình không yêu cầu tiết lộ mã nguồn,
    thuật toán chi tiết, bộ tham số hoặc bí mật kinh doanh, bí mật công nghệ; c) Bên triển khai có trách
    nhiệm giải trình về việc vận hành, kiểm soát rủi ro, xử lý sự cố và bảo vệ quyền, lợi ích hợp pháp
    của tổ chức, cá nhân khi có yêu cầu của cơ quan nhà nước có thẩm quyền trong quá trình thanh tra,
    kiểm tra hoặc xử lý sự cố; d) Người sử dụng có trách nhiệm tuân thủ quy định về thông báo, gắn nhãn
    hệ thống trí tuệ nhân tạo.'
  summary_en: 'Medium-risk systems: transparency (Art. 11) for provider and deployer, and the provider
    and the deployer must explain to the authority on request. Users must follow the notice and labelling
    rules.'
