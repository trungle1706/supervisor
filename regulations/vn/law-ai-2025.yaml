  notes: 'Full Vietnamese text read from the vbpl.vn gateway copy (also a PDF and DOCX stored). Detailed
    rules: Decree 142/2026/ND-CP (VN-DEC142-2026), Decision 33/2026/QD-TTg (VN-QD33-2026), SBV Circular
    53/2026/TT-NHNN (VN-TT53-2026). The Law has no fine amounts: Art. 29(1) only says administrative or
    criminal liability plus civil compensation, and Art. 29(5) leaves administrative fines to a Government
    decree. No AI-specific sanctions decree was found by 2026-10-15 (not verified; a negative search result
    only). Conformity assessment is Art. 13, duties of high-risk providers and deployers are Art. 14,
    the portal is Art. 8, serious incident reporting is Art. 12. The bank is normally the DEPLOYER of
    vendor AI, and the PROVIDER of AI it builds and offers under its own name (Art. 3(4)-(5)). Not legal
    advice; bank counsel must confirm.'
obligations:
- id: VN-AI-2025-A4.02-01
  article_ref: Art. 4(2)
  text_vi: Trí tuệ nhân tạo phục vụ con người, không thay thế thẩm quyền và trách nhiệm của con người.
    Bảo đảm duy trì sự kiểm soát và khả năng can thiệp của con người đối với mọi quyết định và hành vi
    của hệ thống trí tuệ nhân tạo; an toàn hệ thống, an ninh dữ liệu và bảo mật thông tin; khả năng kiểm
    tra và giám sát quá trình phát triển và vận hành hệ thống trí tuệ nhân tạo.
  summary_en: 'Core principle: AI does not replace human authority. People keep control and the ability
    to intervene in every decision and action of an AI system, and the system stays auditable and monitorable.'
  duties:
  - human_oversight
  - governance_accountability
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: deployer
  control_mapping:
  - kind: console
    id: agents
    coverage: partial
    note: agent registry screen with the pause switch
  - kind: console
    id: agent_action
    coverage: partial
    note: pause, resume or retire switch stops an agent after it acts; it is not human approval before
      execution
  - kind: monitor
    id: oversight
    coverage: partial
    note: dwell time, approval rate and chain_ok metrics show whether the human step is real
  - kind: process
    id: board_governance
    coverage: none
    note: board or committee oversight of AI
  evidence_needed:
  - named human owner per agent
  - evidence that a human can stop or override each agent
  verification: VERIFIED_PRIMARY
  sources:
