- id: VN-AI-2025-A7.02B-01
  article_ref: Art. 7(2)(b)
  text_vi: Sử dụng yếu tố giả mạo hoặc mô phỏng người, sự kiện thật để lừa dối hoặc thao túng nhận thức,
    hành vi của con người một cách có chủ đích và có hệ thống, gây tổn hại nghiêm trọng đến quyền, lợi
    ích hợp pháp của con người;
  summary_en: 'Prohibited: AI that uses fake or simulated people or events to deceive or manipulate people
    on purpose and systematically, causing serious harm.'
  duties:
  - prohibited_practice
  applies_to:
    agent_class:
    - customer_facing
    role:
    - deployer
    - provider
  addressee: any
