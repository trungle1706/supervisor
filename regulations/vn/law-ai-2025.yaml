- id: VN-AI-2025-A9.01-01
  article_ref: Art. 9(1)
  text_vi: 'Hệ thống trí tuệ nhân tạo được phân loại theo các mức độ rủi ro sau đây: a) Hệ thống trí tuệ
    nhân tạo có rủi ro cao là hệ thống có thể gây thiệt hại đáng kể đến tính mạng, sức khỏe, quyền và
    lợi ích hợp pháp của tổ chức, cá nhân, lợi ích quốc gia, lợi ích công cộng, an ninh quốc gia; b) Hệ
    thống trí tuệ nhân tạo có rủi ro trung bình là hệ thống có khả năng gây nhầm lẫn, tác động hoặc thao
    túng người sử dụng do không nhận biết được chủ thể tương tác là hệ thống trí tuệ nhân tạo hoặc nội
    dung do hệ thống tạo ra; c) Hệ thống trí tuệ nhân tạo có rủi ro thấp là hệ thống không thuộc trường
    hợp quy định tại điểm a và điểm b khoản này.'
  summary_en: 'Three risk tiers: high (could cause significant harm to life, health, rights, public or
    national interest), medium (people may not know they deal with AI or AI content), low (the rest).'
  duties:
  - risk_classification
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: agent inventory with owner, risk tier and model family
  - kind: evidence
    id: onboard_profile
    coverage: partial
    note: onboarding profile proposes a Decision 33 class and a risk tier; counsel confirms
  - kind: process
    id: legal_review
    coverage: none
    note: bank counsel confirms scope and reading
  evidence_needed:
  - risk class recorded for every AI system
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/69ba65c0-8a56-11f1-878c-399a87bcb3eb
