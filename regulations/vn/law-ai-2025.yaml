- id: VN-AI-2025-A35.02-01
  article_ref: Art. 35(2)
  text_vi: Trong thời hạn quy định tại khoản 1 Điều này, hệ thống trí tuệ nhân tạo được tiếp tục hoạt
    động, trừ trường hợp cơ quan quản lý nhà nước về trí tuệ nhân tạo xác định hệ thống có nguy cơ gây
    thiệt hại nghiêm trọng thì có quyền yêu cầu tạm dừng hoặc chấm dứt hoạt động.
  summary_en: During the transition, existing systems may keep running, unless the authority finds a risk
    of serious harm and orders a pause or stop.
  duties:
  - serious_incident_suspension
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - kind: console
    id: agent_action
    coverage: partial
    note: pause, resume or retire switch stops an agent after it acts; it is not human approval before
      execution
  - kind: console
    id: agents
    coverage: partial
    note: agent registry screen with the pause switch
  evidence_needed:
  - ability to stop an agent on order
  verification: VERIFIED_PRIMARY
