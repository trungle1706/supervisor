    coverage: partial
    note: recorded tool calls with amounts and times
  - kind: process
    id: records_retention
    coverage: none
    note: 3 months online and 1 year backup is set in the bank channel store
  evidence_needed:
  - Retention settings of 3 months online and 1 year backup
  - Sample transaction and confirmation logs
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: high
  notes: Supervisor events are an additional record; they do not replace the channel logs.
