  notes: 'Issue date 2024-10-31, effective 2025-01-01 verified in the text (Art. 22). vbpl.vn status on
    2026-10-15: ''Het hieu luc mot phan''. Verified amendment: Circular 77/2025/TT-NHNN (signed 2025-12-31,
    effective 2026-03-01, with later start dates in its Art. 12(2)-(3)); it adds mobile-money, replaces
    Appendices 01, 02, 04, amends Arts. 1, 2, 3, 7, 8, 10, 11, 21, 23. Quotes below come from the original
    text unless the obligation notes say the text comes from Circular 77. A consolidated text 25/VBHN-NHNN
    (2026-01-20) exists on vbpl; it was not read. Repeals: Circular 35/2016/TT-NHNN and 35/2018/TT-NHNN
    (Art. 22(5)); Art. 25 of Circular 09/2020/TT-NHNN (Art. 22(6)). BIOMETRIC THRESHOLDS: for an individual
    customer, a domestic transfer to another account holder or bank needs biometric match plus OTP (type
    C) when one transfer is above 10 million VND, or when the sum of earlier type A and B transfers on
    the day plus this one is above 20 million VND (and the day total is up to 1.5 billion VND); above
    that, type D. Verified verbatim in Appendices 01 and 02 and unchanged by Circular 77. Signed AI Circular
    53/2026/TT-NHNN (effective 2026-11-15, another worker) requires biometric match plus another factor
    per this Circular when a customer lets an AI system execute payments automatically. Supervisor limits
    do NOT perform biometric authentication; the bank''s channel does. Not legal advice; bank counsel
    must confirm.'
obligations:
- id: VN-TT50-2024-A3.1-01
  article_ref: Art. 3(1)
  text_vi: 1. Hệ thống Online Banking phải tuân thủ quy định về bảo đảm an toàn hệ thống thông tin cấp
    độ 3 trở lên theo quy định của pháp luật về bảo đảm an toàn hệ thống thông tin theo cấp độ, đối với
    hệ thống thông tin cung cấp dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử phải tuân thủ quy
    định về bảo đảm an toàn hệ thống thông tin cấp độ 4 trở lên; tuân thủ tiêu chuẩn TCVN 11930:2017 (tiêu
    chuẩn Công nghệ thông tin - Các kỹ thuật an toàn - Yêu cầu cơ bản về an toàn hệ thống thông tin theo
    cấp độ) và quy định của Ngân hàng Nhà nước về an toàn hệ thống thông tin trong hoạt động ngân hàng.
  summary_en: The Online Banking system must meet security level 3 or above (level 4 for financial switching
    and clearing) and standard TCVN 11930:2017. An AI agent that runs inside or beside the online channel
    inherits this level.
  duties:
  - system_classification
  - robustness_security
  applies_to: &id002
    agent_class:
    - payment
    - customer_facing
    data_classes:
    - financial
    - personal
  addressee: bank
  control_mapping:
  - kind: process
    id: security_assessment
    coverage: none
    note: bank classifies the system and keeps the approval
  evidence_needed:
  - Security-level approval for the online channel and the agent platform
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: high
- id: VN-TT50-2024-A3.3-01
  article_ref: Art. 3(3)
  text_vi: |-
    3. Các giao dịch của khách hàng được phân loại và đánh giá mức độ rủi ro tối thiểu theo: nhóm khách hàng, hành vi sử dụng của khách hàng, loại giao dịch, hạn mức giao dịch (nếu có) và tuân thủ các quy định của pháp luật liên quan. Trên cơ sở đó, đơn vị cung cấp các hình thức xác nhận giao dịch phù hợp cho khách hàng lựa chọn, tuân thủ tối thiểu các quy định sau:
    a) Áp dụng tối thiểu một trong các hình thức xác nhận quy định tại khoản 3, khoản 4, khoản 5, khoản 7, khoản 8, khoản 9 Điều 11 Thông tư này khi thay đổi thông tin định danh khách hàng;
    b) Áp dụng tối thiểu một hoặc kết hợp các hình thức xác nhận giao dịch theo quy định tại Thông tư này; Trường hợp văn bản quy phạm pháp luật hướng dẫn về các dịch vụ quy định tại khoản 1 Điều 1 Thông tư này có quy định về hình thức xác nhận giao dịch thì thực hiện theo văn bản quy phạm pháp luật đó;
    c) Đối với giao dịch gồm nhiều bước, phải thực hiện xác nhận giao dịch tại bước phê duyệt cuối cùng.
  summary_en: The bank must rate each transaction by customer group, behaviour, type and limit, and offer
    confirmation forms to match. A change of customer identity data needs a strong form. A multi-step
    transaction is confirmed at the final approval step.
  duties:
  - transaction_authentication
  - fraud_monitoring
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: rule
    id: PAY-02
    coverage: partial
    note: Supervisor blocks a single transfer above 100,000,000 VND; it does NOT authenticate the customer,
      the bank channel does
  - kind: rule
    id: PAY-03
    coverage: partial
    note: Supervisor flags daily transfers from one account above 150,000,000 VND; not the legal G + Tksth
      rule
  - kind: catalogue
    id: single_limit
    coverage: partial
    note: amount cap per tool call from the agent manifest
  - kind: process
    id: security_assessment
    coverage: none
    note: risk rating scheme is the bank's
  evidence_needed:
  - Transaction risk-rating scheme
  - Mapping of transaction types to confirmation forms
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: high
  notes: Point a of Art. 3(3) was replaced by Circular 77/2025 Art. 3 (see VN-TT50-2024-A3.3A-01).
- id: VN-TT50-2024-A3.4-01
  article_ref: Art. 3(4)
  text_vi: 4. Thực hiện kiểm tra, đánh giá an toàn, bảo mật hệ thống Online Banking định kỳ hàng năm.
  summary_en: The bank must test and assess the security of the Online Banking system every year.
  duties:
  - security_testing
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: process
    id: security_assessment
    coverage: none
    note: annual assessment by the bank
  evidence_needed:
  - Yearly assessment report
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: high
- id: VN-TT50-2024-A9-01
  article_ref: Art. 9(1)-(2)
  text_vi: |-
    1. Khách hàng đăng ký sử dụng phần mềm ứng dụng Online Banking phải được đơn vị nhận biết khách hàng và cấp tài khoản giao dịch điện tử. Tài khoản giao dịch điện tử gồm tên đăng nhập và tối thiểu một trong các hình thức xác nhận quy định tại khoản 1, khoản 2, khoản 3, khoản 4, khoản 5, khoản 6, khoản 7, khoản 8, khoản 9 Điều 11 Thông tư này.
    ...
    2. Khách hàng truy cập phần mềm ứng dụng Online Banking bằng tài khoản giao dịch điện tử do đơn vị cấp hoặc truy cập bằng hình thức đăng nhập một lần (Single Sign On) thông qua tài khoản giao dịch điện tử của hệ thống thông tin khác đã được đơn vị tích hợp và theo đăng ký của khách hàng.
  summary_en: A customer must be identified and given an e-transaction account (user name and at least
    one confirmation form) before using Online Banking. Single sign-on is allowed if the bank has integrated
    it and the customer registered it.
  duties:
  - transaction_authentication
  - access_control
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: process
    id: access_management
    coverage: partial
    note: customer onboarding and credentials are in the bank channel
  evidence_needed:
  - Customer identification record for each e-account
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: medium
- id: VN-TT50-2024-A10.1-01
  article_ref: Art. 10(1)
  text_vi: |-
    1. Đối với giao dịch thanh toán trực tuyến:
    a) Đối với giao dịch thanh toán sử dụng tài khoản thanh toán hoặc ví điện tử hoặc giao dịch chuyển tiền từ thẻ ghi nợ, thẻ trả trước định danh, đơn vị thực hiện phân loại giao dịch theo các nhóm loại hình giao dịch quy định tại Phụ lục 01 ban hành kèm theo Thông tư này và áp dụng hình thức xác nhận quy định tại Phụ lục 02 ban hành kèm theo Thông tư này, trừ quy định tại điểm b, điểm c, điểm d và điểm đ khoản này;
    b) Đối với giao dịch thanh toán thực hiện bằng phương thức xử lý xuyên suốt, đơn vị thực hiện xác nhận giao dịch tối thiểu bằng một trong các hình thức xác nhận quy định tại khoản 7, khoản 8, khoản 9 Điều 11 Thông tư này;
    c) Đối với các giao dịch thanh toán thẻ trực tuyến (không bao gồm giao dịch chuyển tiền), đơn vị thực hiện phân loại giao dịch theo các nhóm loại hình giao dịch quy định tại Phụ lục 03 ban hành kèm theo Thông tư này và áp dụng các hình thức xác nhận quy định tại Phụ lục 04 ban hành kèm theo Thông tư này;
    d) Đối với các giao dịch mà đơn vị chủ động trích Nợ tài khoản thanh toán, chủ động trích Nợ ví điện tử, chủ động thanh toán từ thẻ của khách hàng theo thỏa thuận với khách hàng, không phải áp dụng xác nhận giao dịch quy định tại điểm a, điểm c khoản 1 Điều này;
    đ) Đối với các giao dịch thanh toán trực tuyến trên Cổng Dịch vụ công quốc gia, nộp tiền vào ngân sách nhà nước, không bắt buộc phải áp dụng xác nhận giao dịch quy định tại điểm a, điểm c khoản 1 Điều này.
  summary_en: For online payments from an account, e-wallet or debit card, the bank sorts the transaction
    into types A to D by value (Appendix 01) and applies at least the confirmation form for that type
    (Appendix 02). Bank-initiated debits agreed with the customer are exempt.
  duties:
  - transaction_authentication
  - transaction_limits
  applies_to: &id003
    agent_class:
    - payment
    data_classes:
    - financial
  addressee: bank
  control_mapping:
  - kind: rule
    id: PAY-02
    coverage: partial
    note: Supervisor blocks a single transfer above 100,000,000 VND; it does NOT authenticate the customer,
      the bank channel does
  - kind: rule
    id: PAY-03
    coverage: partial
    note: Supervisor flags daily transfers from one account above 150,000,000 VND; not the legal G + Tksth
      rule
  - kind: catalogue
    id: single_limit
    coverage: partial
    note: amount cap per tool call from the agent manifest
  - kind: catalogue
    id: daily_aggregate
    coverage: partial
    note: daily sum or count per account
  - kind: catalogue
    id: evidence_chain
    coverage: partial
    note: hash-chained record of agent gate decisions
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: recorded tool calls with amounts and times
  evidence_needed:
  - Configuration of type A-D rules in the channel
  - Test cases per type
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: high
  notes: Point a of Art. 10(1) was amended by Circular 77/2025 Art. 6 (mobile-money accounts added). Amended
    Arts. 3 and 10 apply from 2026-07-01 for units serving individuals.
- id: VN-TT50-2024-APP02-01
  article_ref: Appendix 01 group I.3 and Appendix 02 type C (individuals), as replaced by Circular 77/2025
  text_vi: |-
    Giao dịch thỏa mãn một trong các trường hợp sau: 1. Trường hợp 1: Giao dịch thỏa mãn các điều kiện: (i) G ≤ 10 triệu VND. (ii) G + Tksth > 20 triệu VND. (iii) G + T ≤ 1,5 tỷ VND. 2. Trường hợp 2: Giao dịch thỏa mãn các điều kiện: (i) G > 10 triệu VND. (ii) G ≤ 500 triệu VND. (iii) G + T ≤ 1,5 tỷ VND.
    ...
    - OTP gửi qua SMS/Voice hoặc Soft OTP/Token OTP loại cơ bản. - Và kết hợp khớp đúng thông tin sinh trắc học.
  summary_en: 'For an individual customer who sends money to another account holder, bank or e-wallet:
    one transfer above 10 million VND, or a day total of earlier type A and B transfers plus this one
    above 20 million VND (with the day total up to 1.5 billion VND), is type C and needs an OTP (SMS/Voice,
    Soft OTP or Token OTP) PLUS a biometric match. Above 500 million VND per transfer or 1.5 billion VND
    per day is type D (stronger factor plus biometric). Up to 10 million VND and 20 million VND per day
    is type B (an OTP, two-channel, device biometric, FIDO or e-signature is enough).'
  duties:
  - biometric_verification
  - transaction_authentication
  - transaction_limits
  applies_to: *id003
  addressee: bank
  control_mapping:
  - kind: rule
    id: PAY-02
    coverage: partial
    note: Supervisor blocks a single transfer above 100,000,000 VND; it does NOT authenticate the customer,
      the bank channel does
  - kind: rule
    id: PAY-03
    coverage: partial
    note: Supervisor flags daily transfers from one account above 150,000,000 VND; not the legal G + Tksth
      rule
  - kind: catalogue
    id: single_limit
    coverage: partial
    note: amount cap per tool call from the agent manifest
  - kind: catalogue
    id: daily_aggregate
    coverage: partial
    note: daily sum or count per account
  - kind: process
    id: security_assessment
    coverage: none
    note: the bank's channel performs OTP and biometric match; Supervisor gates do not
  - kind: catalogue
    id: evidence_chain
    coverage: partial
    note: hash-chained record of agent gate decisions
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: recorded tool calls with amounts and times
  evidence_needed:
  - Channel configuration showing biometric step for transfers above 10 million VND per transfer or 20
    million VND per day
  - Biometric match logs
  verification: VERIFIED_PRIMARY
  sources:
  - *id004
  - *id005
  confidence: high
  notes: Thresholds verified verbatim from Appendix 01 group I.3 and Appendix 02 row C. Original (2025-01-01)
    Appendix 01 and the Circular 77 replacement (applies from 2026-07-01 to units serving individuals)
    have the same individual thresholds. Daily total Tksth counts type A and B transfers of the same account
    (or card or e-wallet), resets to 0 at the start of day and after a type C or D transaction. Supervisor
    limits (PAY-02 100,000,000 VND single; PAY-03 150,000,000 VND per day) are fraud limits, NOT biometric
    authentication; they sit above the 10 and 20 million VND biometric thresholds.
- id: VN-TT50-2024-A3.3A-01
  article_ref: Art. 3(3)(a) as replaced by Circular 77/2025
  text_vi: a) Áp dụng tối thiểu một trong các hình thức xác nhận quy định tại khoản 3, khoản 4, khoản
    5, khoản 7, khoản 8, khoản 9 Điều 11 Thông tư này khi thay đổi thông tin định danh khách hàng
  summary_en: When a customer changes identity data, the bank needs at least one strong confirmation form.
    For an individual (or a new organisation) who changes an ID document, phone number, email or e-signature,
    the bank needs a biometric match plus another form (OTP, two-channel, FIDO or e-signature).
  duties:
  - biometric_verification
  - transaction_authentication
  - fraud_monitoring
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: process
    id: security_assessment
    coverage: none
    note: bank channel enforces the step
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: records agent-initiated profile changes
  evidence_needed:
  - Channel log showing biometric match on profile changes
  verification: VERIFIED_PRIMARY
  sources:
  - *id005
  confidence: high
  notes: An agent must not change phone, email or ID data without this step.
  dates:
    effective:
      date: '2026-07-01'
      source: https://vbpl.vn/van-ban/chi-tiet/186058
      verification: VERIFIED_PRIMARY
      note: 'Art. 12(2)-(3) of Circular 77/2025: Art. 3 applies from 2026-07-01 (units serving individuals)'
- id: VN-TT50-2024-A8.6-01
  article_ref: Art. 8(6)
  text_vi: |-
    6. Đối với khách hàng cá nhân, phải có chức năng kiểm tra khách hàng khi khách hàng truy cập lần đầu hoặc khi khách hàng truy cập trên thiết bị khác với thiết bị đã truy cập phần mềm ứng dụng Mobile Banking lần gần nhất. Việc kiểm tra khách hàng tối thiểu bao gồm:
    a) Khớp đúng SMS OTP hoặc Voice OTP thông qua số điện thoại đã được khách hàng đăng ký hoặc Soft OTP/Token OTP;
    b) Khớp đúng thông tin sinh trắc học theo quy định tại khoản 5 Điều 11 Thông tư này trong trường hợp văn bản pháp luật chuyên ngành liên quan đến dịch vụ cung cấp trên phần mềm ứng dụng Mobile Banking có quy định thu thập, lưu trữ thông tin sinh trắc học của khách hàng.
    Mục 2
    XÁC NHẬN GIAO DỊCH ĐIỆN TỬ THÔNG
    QUA HỆ THỐNG ONLINE BANKING
  summary_en: 'For individual customers the Mobile Banking app must check the customer at first access
    and whenever the device differs from the last one: SMS or Voice OTP or Soft/Token OTP, and a biometric
    match where sector law requires biometrics to be collected.'
