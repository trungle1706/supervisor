- id: VN-TT50-2024-A11.5-01
  article_ref: Art. 11(5)
  text_vi: |-
    (i) Có độ chính xác được xác định theo tiêu chuẩn quốc tế như sau (hoặc tương đương): Có tỷ lệ từ chối sai < 5% với tỷ lệ chấp nhận sai < 0,01% theo tiêu chuẩn FIDO Biometric Requirement (áp dụng đối với tập mẫu tối thiểu 10.000 mẫu);
    ...
    (ii) Có khả năng phát hiện tấn công giả mạo thông tin sinh trắc học của vật thể sống (Presentation Attack Detection - PAD) dựa trên các tiêu chuẩn quốc tế (như NIST Special Publication 800-63B Digital Identity Guidelines: Authentication and Lifecycle Management hoặc ISO 30107 - Biometric presentation attack detection hoặc FIDO Biometric Requirements) để phòng, chống gian lận, giả mạo khách hàng qua hình ảnh, video, mặt nạ 3D.
    ...
    d) Trường hợp khách hàng xác nhận bằng hình thức khớp đúng thông tin sinh trắc học quá số lần sai liên tiếp do đơn vị quy định (nhưng không quá 10 lần): khóa chức năng thực hiện xác nhận giao dịch bằng hình thức khớp đúng thông tin sinh trắc học, chỉ mở khóa khi khách hàng yêu cầu và phải kiểm tra khách hàng trước khi thực hiện, bảo đảm chống gian lận, giả mạo;
    ...
    đ) Thời gian thực hiện khớp đúng thông tin sinh trắc học tối đa 03 phút.
  summary_en: A face-biometric match must reach a false rejection rate under 5% at a false acceptance
    rate under 0.01% (FIDO biometric requirement, at least 10,000 samples), detect presentation attacks
    (photo, video, 3D mask), lock after a set number of failures (at most 10), and finish within 3 minutes.
  duties:
  - biometric_verification
  - robustness_security
  applies_to:
    agent_class:
    - payment
    - customer_facing
    data_classes:
    - biometric
  addressee: bank
  control_mapping:
  - kind: process
    id: security_assessment
    coverage: none
    note: bank or its biometric vendor proves accuracy and PAD
  evidence_needed:
  - Biometric vendor test report (FRR, FAR, PAD)
  - Lock-out configuration
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: high
- id: VN-TT50-2024-A11.5C-01
  article_ref: Art. 11(5)(c) as replaced by Circular 77/2025
  text_vi: c) Giải pháp phát hiện tấn công giả mạo thông tin sinh trắc học của vật thể sống (Presentation
    Attack Detection - PAD) theo quy định tại điểm a khoản này do đơn vị tự triển khai hoặc sử dụng của
    bên thứ ba cung cấp phải được cấp chứng nhận của tổ chức/phòng thí nghiệm sinh trắc học được Liên
    minh FIDO (FIDO Alliance) công nhận hoặc của Tổ chức chứng nhận (Certification Body) cấp phép xác
    nhận tuân thủ tiêu chuẩn quốc tế (ISO), đáp ứng tiêu chuẩn ISO 30107 cấp độ 2 (Level 2) hoặc tương
    đương. Tổ chức chứng nhận (Certification Body) phải được cấp phép bởi Cơ quan công nhận (Accreditation
    Body) đã tham gia Thỏa thuận công nhận lẫn nhau đa phương của Diễn đàn Công nhận Quốc tế (International
    Accreditation Forum – IAF Multilateral Recognition Arrangement, IAF MLA)
  summary_en: The presentation-attack-detection solution, built in-house or from a third party, must be
    certified by a FIDO-recognised lab or by an accredited ISO certification body to ISO 30107 level 2
    or equal.
