      notice to people.'
  - kind: monitor
    id: sweeps
    coverage: partial
    note: 'Periodic sweeps over recorded events detect unusual access. Missing: authentication strength
      and security testing of the platform.'
  - kind: evidence
    id: assurance_results
    coverage: partial
    note: 'Assurance pack results include security packs. Missing: a periodic cybersecurity test of the
      data platform.'
  - kind: process
    id: security_assessment
    coverage: partial
    note: 'Manual step: the bank applies multi-factor authentication, access rights, monitoring and periodic
      testing to the platform that holds the data.'
  evidence_needed:
  - notice to people about big-data use
  - authentication and access record
  - periodic security test report
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: medium
  notes: 'Penalty provision (administrative fines). It turns a duty of the PDPL (VN-PDPL-2025) or Decree
    356/2025 (VN-DEC356-2025) into a sanctioned conduct; the duty text is in those instruments. Effective
    2026-08-19 (Art. 80). Fines for organisations in the personal data field: up to VND 3 billion, 5 percent
    of prior-year revenue for cross-border transfer, 10 times the proceeds for sale of data (Art. 7(4)).
    Whether the Decree applies to an AI agent of the bank is a reading of this KB; bank counsel must confirm.
    "Big data" is not defined in the Decree; whether an AI agent platform counts is a reading to confirm.'
- id: VN-DEC330-2026-A66.03-01
  article_ref: Art. 66(3)(a)
  text_vi: a) Vận hành hệ thống dữ liệu lớn đưa ra các quyết định tự động gây ảnh hưởng đến an ninh trật
    tự, quyền, lợi ích hợp pháp của tổ chức, cá nhân nhưng không thiết lập cơ chế giám sát hoặc không
