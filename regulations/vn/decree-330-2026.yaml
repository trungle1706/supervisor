  notes: 'Added by WP-W0 on 2026-10-28. Sanction decree. Article 67 is about personal data in AI systems
    and is the first text that attaches a fine to AI-specific personal data duties (notice and explanation
    of the algorithm, opt-out of automated processing, risk classing, human re-assessment). Article 64
    is about finance, banking and credit information. Article 70 is about biometric data. Article 7 sets
    fine caps (cybersecurity: VND 200 million for an organisation; personal data: VND 3 billion, 5 percent
    of revenue for cross-border transfer, 10 times proceeds for sale). The cybersecurity penalties (Chapter
    II, Sections 1-5, Art. 9-38) and Art. 39-53, 57-63, 65, 68-69, 71 were not turned into rows; they
    matter for incident response (Art. 21), security level (Art. 24), data localisation (Art. 33) and
    the other personal data rights. Fines for organisations in the cybersecurity field are twice the individual
    fine (Art. 7(1)). Not legal advice; bank counsel must confirm.'
obligations:
- id: VN-DEC330-2026-A67.01-01
  article_ref: Art. 67(1)
  text_vi: 1. Phạt tiền từ 20.000.000 đồng đến 50.000.000 đồng đối với hành vi xử lý dữ liệu cá nhân trong
    hệ thống trí tuệ nhân tạo, vũ trụ ảo nhưng không thực hiện đánh giá tuân thủ các quy định về bảo vệ
    dữ liệu cá nhân định kỳ 01 năm/lần.
  summary_en: Fine VND 20-50 million for processing personal data in an AI system without the yearly assessment
    of compliance with personal data protection rules.
  duties:
  - pd_compliance_assessment
  - dpia
  applies_to: &id002
    agent_class:
    - any
    data_classes:
    - personal
  addressee: bank
  control_mapping:
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: 'Audit export can collect evidence for the assessment. Missing: the assessment itself and its
      yearly cycle.'
  - kind: monitor
    id: oversight
    coverage: partial
    note: 'Oversight metrics per agent. Missing: a compliance assessment against the data protection law.'
  - kind: process
    id: dpo_signoff
    coverage: partial
    note: 'Manual step: the data protection officer signs a yearly assessment of each AI system that processes
      personal data.'
  evidence_needed:
  - yearly personal data compliance assessment per AI system
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: 'Penalty provision (administrative fines). It turns a duty of the PDPL (VN-PDPL-2025) or Decree
    356/2025 (VN-DEC356-2025) into a sanctioned conduct; the duty text is in those instruments. Effective
    2026-08-19 (Art. 80). Fines for organisations in the personal data field: up to VND 3 billion, 5 percent
    of prior-year revenue for cross-border transfer, 10 times the proceeds for sale of data (Art. 7(4)).
    Whether the Decree applies to an AI agent of the bank is a reading of this KB; bank counsel must confirm.'
- id: VN-DEC330-2026-A67.02-01
  article_ref: Art. 67(2)
  text_vi: '2. Phạt tiền từ 50.000.000 đồng đến 70.000.000 đồng đối với một trong các hành vi sau đây:
    a) Không thông báo hoặc không giải thích nguyên tắc hoạt động của thuật toán tự động và ảnh hưởng
    của nó đối với quyền, lợi ích hợp pháp của chủ thể dữ liệu cá nhân; b) Không cung cấp công cụ, cơ
    chế để chủ thể dữ liệu cá nhân có quyền từ chối tham gia quá trình xử lý dữ liệu tự động; c) Không
    bảo đảm cho chủ thể dữ liệu cá nhân quyền chỉnh sửa, ẩn danh hoặc xóa hồ sơ nhận dạng; d) Không phân
    loại hệ thống trí tuệ nhân tạo theo các mức độ rủi ro để thiết lập các biện pháp bảo vệ dữ liệu cá
    nhân phù hợp; đ) Không áp dụng các biện pháp bảo vệ dữ liệu cá nhân khi sử dụng kết quả suy luận của
    trí tuệ nhân tạo để xác định hoặc giúp xác định một con người cụ thể; e) Phát triển, triển khai hệ
    thống trí tuệ nhân tạo, vũ trụ ảo nhưng không xây dựng hệ thống đáp ứng tiêu chuẩn an ninh mạng và
    bảo vệ dữ liệu toàn diện, hoặc không thiết lập hệ thống giám sát và cảnh báo sớm nguy cơ an ninh mạng;
    g) Không áp dụng phương thức xác thực, định danh phù hợp hoặc không phân quyền truy cập để xử lý dữ
    liệu cá nhân trong hệ thống.'
  summary_en: 'Fine VND 50-70 million for an AI system that: gives no notice or explanation of how its
    automatic algorithm works and affects the person; gives no way to opt out of automated processing;
    blocks correction, anonymisation or deletion of the identification profile; is not classed by risk
    level; lacks safeguards for inference that identifies a person; lacks security standards and early
    warning; lacks authentication and access rights.'
  duties:
  - automated_decision_rights
  - explainability
  - risk_classification
  - security_monitoring
  - access_control
  - data_subject_rights
