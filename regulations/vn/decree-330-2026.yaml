    2026-08-19 (Art. 80). Fines for organisations in the personal data field: up to VND 3 billion, 5 percent
    of prior-year revenue for cross-border transfer, 10 times the proceeds for sale of data (Art. 7(4)).
    Whether the Decree applies to an AI agent of the bank is a reading of this KB; bank counsel must confirm.
    The additional penalty (suspension of operation, Art. 67(4)(b)) is a business risk for an AI product.'
- id: VN-DEC330-2026-A64.01-01
  article_ref: Art. 64(1)
  text_vi: '1. Phạt tiền từ 50.000.000 đồng đến 70.000.000 đồng đối với hành vi sau: a) Không thông báo
    hoặc thông báo chậm quá thời hạn 72 giờ cho cơ quan chuyên trách bảo vệ dữ liệu cá nhân và chủ thể
    dữ liệu cá nhân kể từ thời điểm phát hiện sự cố lộ, mất dữ liệu cá nhân nhạy cảm; b) Nội dung thông
    báo sự cố vi phạm bảo vệ dữ liệu cá nhân không bảo đảm đầy đủ các nội dung tối thiểu theo quy định
    của pháp luật; c) Không tiến hành ghi lại nhật ký toàn bộ hoạt động xử lý dữ liệu cá nhân hoặc không
    thực hiện đánh giá tuân thủ định kỳ hàng năm theo quy định; d) Không thiết lập giải pháp khôi phục
    dữ liệu cá nhân khi xảy ra sự cố mất dữ liệu cá nhân; đ) Không áp dụng tiêu chuẩn, quy chuẩn kỹ thuật
    bảo vệ dữ liệu cá nhân; quy chuẩn kỹ thuật khử nhận dạng dữ liệu cá nhân, ẩn danh dữ liệu cá nhân
    theo quy định; e) Nội dung xin sự đồng ý của chủ thể dữ liệu cá nhân không bảo đảm nêu rõ các thông
    tin theo quy định tại khoản 2, Điều 9 Luật Bảo vệ dữ liệu cá nhân.'
  summary_en: 'Finance and banking: fine VND 50-70 million for failing to notify the authority and the
    person of a leak or loss of sensitive personal data within 72 hours, incomplete notices, no log of
    all personal data processing or no yearly compliance assessment, no recovery solution, not applying
    technical standards for protection and de-identification, and consent requests that lack the required
    content.'
  duties:
  - incident_report_72h
  - breach_notification_subject
  - logging
  - pd_compliance_assessment
  - business_continuity
  - consent
  applies_to: *id002
  addressee: bank
  control_mapping:
