      outside agent flows.'
  - kind: evidence
    id: incident_clock
    coverage: partial
    note: 'Clock for the report times of a case under Decree 142 (72 h or 5 working days). Missing: the
      72-hour personal data breach clock and the notice to the person.'
  - kind: evidence
    id: incident_record
    coverage: partial
    note: 'Incident record with status. Missing: notice content and delivery.'
  - kind: process
    id: regulator_notification
    coverage: partial
    note: 'Manual step: the bank notifies the data protection authority and the persons within 72 hours
      with complete content.'
  - kind: process
    id: dpo_signoff
    coverage: partial
    note: 'Manual step: the data protection officer signs the yearly compliance assessment.'
  evidence_needed:
  - 72-hour notices to authority and persons
  - log of personal data processing
  - yearly compliance assessment
  - recovery solution
  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: 'Penalty provision (administrative fines). It turns a duty of the PDPL (VN-PDPL-2025) or Decree
    356/2025 (VN-DEC356-2025) into a sanctioned conduct; the duty text is in those instruments. Effective
    2026-08-19 (Art. 80). Fines for organisations in the personal data field: up to VND 3 billion, 5 percent
    of prior-year revenue for cross-border transfer, 10 times the proceeds for sale of data (Art. 7(4)).
    Whether the Decree applies to an AI agent of the bank is a reading of this KB; bank counsel must confirm.
    The 72-hour banking rule matches Decree 356/2025 (see VN-DEC356-2025-A8.3-01).'
- id: VN-DEC330-2026-A64.02-01
  article_ref: Art. 64(2)(a)-(c)
  text_vi: '2. Phạt tiền từ 70.000.000 đồng đến 100.000.000 đồng đối với một trong các hành vi sau: a)
    Sử dụng dữ liệu cá nhân của chủ thể dữ liệu cá nhân để tiến hành các hoạt động chấm điểm, xếp hạng
    tín dụng, đánh giá mức độ tín nhiệm về tín dụng khi chưa có sự đồng ý của chủ thể dữ liệu cá nhân
    trừ trường hợp xử lý dữ liệu cá nhân không cần sự đồng ý của chủ thể dữ liệu cá nhân; b) Tổ chức thực
    hiện hoạt động thông tin tín dụng nhưng không triển khai các biện pháp quản lý, kỹ thuật để phòng,
    chống truy cập, sử dụng, tiết lộ, chỉnh sửa trái phép dữ liệu cá nhân của khách hàng; c) Thu thập
    dữ liệu cá nhân không đúng phạm vi cần thiết phục vụ hoạt động thông tin tín dụng hoặc thu thập từ
    nguồn không được pháp luật cho phép.'
  summary_en: 'Finance and banking: fine VND 70-100 million for using personal data for credit scoring,
    ranking or credit rating without the person consent (unless processing without consent is allowed),
    for a credit-information entity that lacks management and technical measures against unauthorised
    access, use, disclosure or change, and for collecting data beyond what credit information needs or
    from sources the law does not allow. Added penalty: suspension of credit scoring service for 3 to
    6 months; remedy: destroy unlawful scoring results.'
  duties:
  - consent
  - lawful_basis
  - purpose_limitation
  - data_minimisation
  - access_control
  - automated_decision_rights
  applies_to:
    agent_class:
    - credit_decision
    data_classes:
    - personal
    - financial
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: pii_masking
    coverage: partial
