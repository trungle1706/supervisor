- id: VN-DEC330-2026-A56.01-01
  article_ref: Art. 56(1)
  text_vi: '1. Phạt tiền từ 30.000.000 đồng đến 50.000.000 đồng đối với một trong các hành vi sau: a)
    Không lập hồ sơ đánh giá tác động chuyển dữ liệu cá nhân xuyên biên giới trước hoặc trong thời gian
    tiến hành chuyển dữ liệu; b) Không nộp 01 bản chính hồ sơ đánh giá tác động chuyển dữ liệu cá nhân
    xuyên biên giới cho cơ quan chuyên trách bảo vệ dữ liệu cá nhân trong thời hạn 60 ngày kể từ ngày
    đầu tiên tiến hành chuyển dữ liệu; c) Không hoàn thiện hồ sơ đánh giá tác động chuyển dữ liệu cá nhân
    xuyên biên giới trong thời hạn 30 ngày kể từ khi nhận được yêu cầu của cơ quan chuyên trách bảo vệ
    dữ liệu cá nhân; d) Không cập nhật định kỳ hoặc không cập nhật hồ sơ đánh giá tác động chuyển dữ liệu
    cá nhân xuyên biên giới khi có thay đổi theo quy định pháp luật; đ) Không duy trì hồ sơ đánh giá tác
    động chuyển dữ liệu cá nhân xuyên biên giới ở trạng thái sẵn sàng phục vụ hoạt động kiểm tra của cơ
    quan chuyên trách bảo vệ dữ liệu cá nhân; e) Không thông báo thông tin và chi tiết liên lạc của tổ
    chức, cá nhân phụ trách bảo vệ dữ liệu cá nhân phía bên nhận dữ liệu sau khi hoàn tất việc chuyển
    dữ liệu cá nhân xuyên biên giới; g) Không có cơ chế kiểm soát hoặc không yêu cầu bên nhận dữ liệu
    xuyên biên giới tuân thủ quy trình khi chuyển tiếp dữ liệu cá nhân cho bên thứ ba khác, dẫn đến việc
    dữ liệu cá nhân của công dân Việt Nam được xử lý ngoài phạm vi đã khai báo trong hồ sơ đánh giá tác
    động.'
