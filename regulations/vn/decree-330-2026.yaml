    Whether the Decree applies to an AI agent of the bank is a reading of this KB; bank counsel must confirm.
    Read for a credit memo or scoring agent.'
- id: VN-DEC330-2026-A66.02-01
  article_ref: Art. 66(2)
  text_vi: '2. Phạt tiền từ 30.000.000 đồng đến 50.000.000 đồng đối với một trong các hành vi sau đây:
    a) Không có cơ chế thông báo hoặc không giải thích phù hợp cho chủ thể dữ liệu cá nhân về việc dữ
    liệu của họ được đưa vào hệ thống phân tích dữ liệu lớn; b) Không sử dụng phương thức xác thực mạnh
    (tối thiểu xác thực đa yếu tố) hoặc không phân quyền truy cập để bảo đảm chỉ những người có quyền
    mới được truy cập dữ liệu; c) Không thực hiện giám sát liên tục hoặc không sử dụng các công cụ giám
    sát để theo dõi hoạt động truy cập và phát hiện các hành vi bất thường; d) Không thực hiện kiểm tra,
    đánh giá định kỳ về an ninh mạng và bảo mật dữ liệu để phát hiện, ngăn chặn và khắc phục lỗ hổng bảo
    mật; đ) Không thực hiện mã hóa, ẩn danh dữ liệu cá nhân trong quá trình chuyển giao, cung cấp dữ liệu,
    trừ trường hợp pháp luật chuyên ngành có quy định khác.'
  summary_en: Fine VND 30-50 million, for big-data processing of personal data, for no notice to people
    that their data enter the analysis system, no strong authentication (at least multi-factor) or access
    rights, no continuous monitoring of access, no periodic security tests, and no encryption or anonymisation
    on transfer.
  duties:
  - explainability
  - access_control
  - security_monitoring
  - security_testing
  - encryption
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: proxy_log
    coverage: partial
