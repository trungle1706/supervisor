  verification: VERIFIED_PRIMARY
  sources: *id001
  confidence: high
  notes: 'Penalty provision (administrative fines). It turns a duty of the PDPL (VN-PDPL-2025) or Decree
    356/2025 (VN-DEC356-2025) into a sanctioned conduct; the duty text is in those instruments. Effective
    2026-08-19 (Art. 80). Fines for organisations in the personal data field: up to VND 3 billion, 5 percent
    of prior-year revenue for cross-border transfer, 10 times the proceeds for sale of data (Art. 7(4)).
    Whether the Decree applies to an AI agent of the bank is a reading of this KB; bank counsel must confirm.
    Remedy in Art. 67(5)(a): the bank must set up the notice, the opt-out and the profile rights.'
- id: VN-DEC330-2026-A67.03-01
  article_ref: Art. 67(3)(a)-(b)
  text_vi: '3. Phạt tiền từ 70.000.000 đồng đến 100.000.000 đồng đối với một trong các hành vi sau đây:
    a) Không thiết lập cơ chế kiểm soát, ngăn chặn việc lợi dụng trí tuệ nhân tạo, vũ trụ ảo vào các hoạt
    động xâm phạm an ninh quốc gia, trật tự an toàn xã hội; b) Phát triển, vận hành hệ thống trí tuệ nhân
    tạo, vũ trụ ảo đưa ra các quyết định tự động gây ảnh hưởng đến an ninh trật tự, quyền, lợi ích hợp
    pháp của tổ chức, cá nhân nhưng không thiết lập cơ chế giám sát hoặc không cho phép yêu cầu sự đánh
    giá lại từ con người;'
  summary_en: 'Fine VND 70-100 million for not setting a control against abuse of AI, and for running
    an AI system that makes automatic decisions affecting rights or interests without a supervision mechanism
    or without allowing the person to ask a human to re-assess. Added penalty: suspension of the AI system
    for 3 to 6 months.'
  duties:
  - human_oversight
  - right_to_human_review
  - automated_decision_rights
