- id: VN-ETX-2023-A28-01
  article_ref: Art. 28(1)-(3)
  text_vi: '1. Dịch vụ tin cậy bao gồm: ... a) Dịch vụ cấp dấu thời gian; ... b) Dịch vụ chứng thực thông điệp dữ liệu; ... c) Dịch vụ chứng thực chữ ký số công cộng. ... 2. Dịch vụ tin cậy là ngành, nghề đầu tư kinh doanh có điều kiện. ... 3. Tổ chức cung cấp dịch vụ tin cậy phải có giấy phép kinh doanh dịch vụ do Bộ Thông tin và Truyền thông cấp, trừ dịch vụ chứng thực hợp đồng điện tử trong thương mại. Tổ chức được quyền đăng ký một hoặc các dịch vụ quy định tại khoản 1 Điều này. Thời hạn của giấy phép kinh doanh dịch vụ tin cậy là 10 năm. Tổ chức cung cấp dịch vụ chứng thực hợp đồng điện tử trong thương mại phải đáp ứng điều kiện hoạt động cung cấp dịch vụ chứng thực hợp đồng điện tử theo quy định của pháp luật về thương mại điện tử và điều kiện kinh doanh dịch vụ tin cậy theo quy định tại Điều 29 của Luật này.'
  summary_en: Trust services (time-stamping, data message authentication, public digital signature certification) are conditional businesses and need a licence. A bank that wants statutory trust-service effect must buy from a licensed provider; it cannot treat its own tooling as one.
  duties:
  - electronic_signature
  - outsourcing_oversight
  applies_to: *id002
  addressee: any
  control_mapping:
  - kind: process
    id: vendor_management
    coverage: none
    note: verify provider licence, contract and exit plan
  - kind: evidence
    id: anchor
    coverage: none
    note: Supervisor's anchor is a write-once store, not a licensed time-stamp service
  evidence_needed:
  - provider licence copy
  - outsourcing contract
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: medium
  notes: Licence issuer named in the law text is the former Ministry of Information and Communications; after the 2025 ministry merger the competent ministry may differ. Not verified.
- id: VN-ETX-2023-A31-01
  article_ref: Art. 31(1)-(4)
  text_vi: 1. Dịch vụ cấp dấu thời gian là dịch vụ để gắn thông tin về thời gian vào thông điệp dữ liệu. ... 2. Dấu thời gian được tạo ra dưới dạng chữ ký số. ... 3. Thời gian được gắn vào thông điệp dữ liệu là thời gian mà tổ chức cung cấp dịch vụ cấp dấu thời gian nhận được thông điệp dữ liệu đó và được chứng thực bởi tổ chức cung cấp dịch vụ cấp dấu thời gian. ... 4. Nguồn thời gian của tổ chức cung cấp dịch vụ cấp dấu thời gian phải theo quy định của pháp luật về nguồn thời gian chuẩn quốc gia.
  summary_en: A statutory time-stamp is a digital signature by a licensed provider that attaches the time it received the data message, using the national standard time source. Only such a stamp gives provable legal time for an agent record.
  duties:
  - electronic_record_integrity
  - electronic_signature
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: evidence
    id: anchor
    coverage: partial
    note: anchor receipts give an external write-once timeline but are not licensed time-stamps
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: entries carry host-clock time
  - kind: process
    id: vendor_management
    coverage: none
    note: bank buys a licensed time-stamp service where legal time must be proved
  evidence_needed:
  - licensed time-stamp tokens for records that need legal time proof
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: medium
  notes: 'Possible future work: send signed roots to a licensed time-stamp provider. Not implemented.'
- id: VN-ETX-2023-A34.1-01
  article_ref: Art. 34(1)
  text_vi: 1. Hợp đồng điện tử được giao kết hoặc thực hiện từ sự tương tác giữa một hệ thống thông tin tự động với người hoặc giữa các hệ thống thông tin tự động với nhau không bị phủ nhận giá trị pháp lý chỉ vì không có sự kiểm tra hay can thiệp của con người vào từng hành động cụ thể do các hệ thống thông tin tự động thực hiện hay vào hợp đồng.
  summary_en: A contract made or performed through interaction between an automated system and a person, or between automated systems, cannot be denied validity only because no human checked each action or the contract. A bank is bound by contracts its AI agents conclude or perform; the law gives no automatic excuse for agent error.
  duties:
  - governance_accountability
  - excessive_agency_limits
  - human_oversight
  applies_to:
    agent_class:
    - payment
    - customer_facing
    - credit_decision
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: approved_tools
    coverage: partial
    note: limits the actions an agent can take
  - kind: catalogue
    id: single_limit
    coverage: partial
    note: limits the money an agent can commit
  - kind: catalogue
    id: split_payment
    coverage: partial
    note: detects splitting around limits
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: evidence of what the agent agreed to
  - kind: process
    id: legal_review
    coverage: none
    note: counsel sets agent authority limits and customer terms
  evidence_needed:
  - agent authority matrix
  - customer terms covering agent-concluded contracts
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: high
  notes: Key provision for AI agents. A Supervisor pause stops later actions; it is not human approval before execution (Decision 33 in docs/onboard.md).
- id: VN-ETX-2023-A38-01
  article_ref: Art. 38
  text_vi: Trong giao kết và thực hiện hợp đồng điện tử, thông báo dưới dạng thông điệp dữ liệu có giá trị pháp lý như thông báo bằng văn bản giấy.
  summary_en: A notice in the form of a data message has the same legal value as a paper notice in making and performing an e-contract. Notices sent by an agent (fees, changes, reminders) are valid notices, and the bank needs proof they were sent.
  duties:
  - consumer_information
  - record_keeping
  applies_to:
    agent_class:
    - customer_facing
    - payment
    - credit_decision
  addressee: bank
  control_mapping:
  - kind: process
    id: customer_disclosure
    coverage: none
    note: bank defines which notices go by electronic message
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: records the notice event
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: tamper-evident proof of sending
  evidence_needed:
  - sample of notice records with time and recipient reference
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: high
- id: VN-ETX-2023-A46.4-01
  article_ref: Art. 46(4)
  text_vi: '4. Lịch sử giao dịch của tài khoản giao dịch điện tử có giá trị pháp lý để chứng minh giao dịch khi đáp ứng đủ các yêu cầu sau đây: ... a) Hệ thống thông tin phục vụ giao dịch điện tử phải bảo đảm an toàn theo quy định của pháp luật về an toàn thông tin mạng; ... b) Gắn duy nhất với một cơ quan, tổ chức hoặc cá nhân là chủ tài khoản giao dịch điện tử; ... c) Bảo đảm chính xác thời gian giao dịch từ nguồn thời gian theo quy định của pháp luật về nguồn thời gian chuẩn quốc gia.'
  summary_en: Transaction history of an electronic transaction account proves the transactions only if the system is secure under information-security law, tied uniquely to the account holder, and time-accurate against the national standard time source. This matters for payment agents acting on customer accounts.
  duties:
  - record_keeping
  - electronic_record_integrity
  - logging
  applies_to:
    agent_class:
    - payment
    - customer_facing
    data_classes:
    - financial
  addressee: bank
  control_mapping:
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: supports a tamper-evident side record of agent actions per account reference
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: events link to the customer reference (masked)
  - kind: process
    id: security_assessment
    coverage: none
    note: security classification of the e-banking system
  - kind: process
    id: legal_review
    coverage: none
    note: confirm the time source meets the national standard
  evidence_needed:
  - security classification record
  - time source configuration
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: medium
  notes: The legal proof of account history is the bank's core system, not Supervisor. Supervisor time comes from the host clock.
- id: VN-ETX-2023-A47.1-01
  article_ref: Art. 47(1)
  text_vi: '1. Chủ quản hệ thống thông tin phục vụ giao dịch điện tử có trách nhiệm sau đây: ... a) Tuân thủ quy định của Luật này và pháp luật về an toàn thông tin mạng, an ninh mạng, bảo vệ thông tin cá nhân, bảo vệ dữ liệu cá nhân và quy định khác của pháp luật có liên quan; ... b) Cung cấp thông tin bằng phương tiện điện tử theo quy định của pháp luật nhằm phục vụ công tác đo lường, thống kê, giám sát, thanh tra, kiểm tra, báo cáo theo yêu cầu của cơ quan quản lý nhà nước về giao dịch điện tử; chia sẻ dữ liệu phục vụ quản lý nhà nước về giao dịch điện tử; ... c) Giám sát an toàn hệ thống thông tin phục vụ giao dịch điện tử của mình theo quy định của pháp luật về an toàn thông tin mạng.'
  summary_en: The owner of an electronic transaction system must follow cyber, information security and personal data laws, provide data to the transaction regulator by electronic means, and monitor the safety of the system. The bank's e-banking and agent platforms are in scope.
  duties:
  - security_monitoring
  - regulatory_reporting
  applies_to: *id002
  addressee: bank
  control_mapping:
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: export pack for the regulator or auditor
  - kind: monitor
    id: sweeps
    coverage: partial
    note: periodic sweeps over recorded events
  - kind: process
    id: security_assessment
    coverage: none
    note: security monitoring operations stay with the bank
  evidence_needed:
  - security monitoring procedure
  - export for authority requests
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  confidence: medium
