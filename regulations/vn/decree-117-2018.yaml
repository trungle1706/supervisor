  confidence: high
- id: VN-DEC117-2018-A11.1-01
  article_ref: Art. 11(1)
  text_vi: '1. Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài chỉ được cung cấp thông tin khách hàng
    cho tổ chức khác, cá nhân thuộc một trong các trường hợp sau đây:

    a) Tổ chức khác, cá nhân có quyền yêu cầu tổ chức tín dụng, chi nhánh ngân hàng nước ngoài cung cấp
    thông tin khách hàng được quy định cụ thể tại bộ luật, luật, nghị quyết của Quốc hội.

    b) Có chấp thuận của khách hàng bằng văn bản hoặc bằng hình thức khác theo thỏa thuận với khách hàng.'
  summary_en: The bank may give customer information to another organisation or person only if a code
    or law gives that party the right to ask, or the customer agrees. Giving data to an AI service outside
    the bank needs one of these two bases.
  duties:
  - customer_confidentiality
  - consent
  - lawful_basis
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
    - financial
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: pii_masking
    coverage: partial
    note: limits what identifiers leave the bank
  - kind: process
    id: consent_management
    coverage: none
    note: records customer consent
  - kind: process
    id: vendor_management
    coverage: none
    note: contract and scope for model vendors
  evidence_needed:
  - Record of the lawful basis for each outward data flow
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/130985
    title: Decree 117/2018/ND-CP full text (vbpl.vn)
    fetched_at: '2026-10-15'
    kind: primary
