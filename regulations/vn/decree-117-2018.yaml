instrument:
  id: VN-DEC117-2018
  jurisdiction: VN
  kind: decree
  issuer: Government
  number: 117/2018/NĐ-CP
  title_vi: Nghị định về việc giữ bí mật, cung cấp thông tin khách hàng của tổ chức tín dụng, chi nhánh
    ngân hàng nước ngoài
  title_en: Decree on keeping confidential and providing customer information of credit institutions and
    foreign bank branches
  status: in_force
  binding: true
  dates:
    issued:
      date: '2018-09-11'
      source: https://vbpl.vn/van-ban/chi-tiet/130985
