  confidence: medium
- id: VN-DEC117-2018-A14.2-01
  article_ref: Art. 14(2)
  text_vi: '2. Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài có trách nhiệm sau đây:

    a) Cung cấp thông tin khách hàng trung thực, đầy đủ, kịp thời, đúng đối tượng và phạm vi thông tin
    được yêu cầu cung cấp;

    b) Đảm bảo an toàn, bí mật thông tin khách hàng trong quá trình cung cấp, quản lý, sử dụng, lưu trữ
    thông tin khách hàng;

    c) Giải quyết khiếu nại của khách hàng trong việc cung cấp thông tin khách hàng theo quy định của
    pháp luật;

    d) Tổ chức giám sát, kiểm tra và xử lý vi phạm quy định nội bộ về giữ bí mật, lưu trữ, cung cấp thông
    tin khách hàng;

    đ) Chịu trách nhiệm theo quy định của pháp luật đối với trường hợp vi phạm quy định của Nghị định
    này, pháp luật có liên quan.'
  summary_en: The bank must give customer information truthfully and in scope, keep it safe and secret
    during provision, management, use and storage, handle customer complaints about it, and monitor, inspect
    and punish breaches of its internal rule.
  duties:
  - customer_confidentiality
  - complaint_handling
  - security_monitoring
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
    - financial
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: pii_masking
    coverage: partial
    note: masks CCCD, phone, account and card numbers before storage or any judge call
  - kind: catalogue
    id: pii_bulk_read
    coverage: partial
    note: blocks bursts of personal-data reads
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: recorded events support inspection
  - kind: process
    id: complaint_handling
    coverage: none
    note: bank handles customer complaints on information use
  evidence_needed:
  - Inspection records
  - Complaint log on information use
