    local_path: regulations/sources/VN-DEC117-2018/nd-117-2018.txt
  confidence: medium
- id: VN-DEC117-2018-A11.2-01
  article_ref: Art. 11(2)
  text_vi: 2. Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài có trách nhiệm cung cấp thông tin khách
    hàng cho chính khách hàng hoặc người đại diện hợp pháp của khách hàng đó.
  summary_en: The bank must give customer information to the customer or the customer's legal representative.
    A customer-service agent may do this only after the bank has checked the identity of the person.
  duties:
  - customer_confidentiality
  - consumer_information
  applies_to:
    agent_class:
    - customer_facing
    data_classes:
    - personal
    - financial
  addressee: bank
  control_mapping:
  - kind: process
    id: access_management
    coverage: partial
    note: identity check is in the bank channel, not in Supervisor
  - kind: catalogue
    id: pii_masking
    coverage: partial
    note: masks stored copies
  evidence_needed:
  - Identity check before release of account data
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/130985
    title: Decree 117/2018/ND-CP full text (vbpl.vn)
