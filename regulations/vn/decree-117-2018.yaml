- id: VN-DEC117-2018-A4.5-01
  article_ref: Art. 4(5)
  text_vi: 5. Cơ quan, tổ chức, cá nhân phải lưu trữ, bảo quản theo quy định của pháp luật về lưu trữ,
    bảo quản hồ sơ, tài liệu đối với thông tin khách hàng, hồ sơ yêu cầu cung cấp thông tin khách hàng,
    việc giao nhận thông tin khách hàng.
  summary_en: Customer information, requests for it and the record of handing it over must be stored under
    the archive law. Agent logs that hold customer data fall under this duty.
  duties:
  - record_keeping
  - retention
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
    - financial
  addressee: bank
