- id: VN-DEC165-2025-A12.8-01
  article_ref: Art. 12(8)
  text_vi: '8. Các trường hợp bên chuyển dữ liệu phải thực hiện sửa đổi, bổ sung hồ sơ đánh giá tác động
    chuyển, xử lý dữ liệu xuyên biên giới gồm:

    a) Khi có sự thay đổi về mục đích, phương pháp, phạm vi, loại dữ liệu chuyển, xử lý, thay đổi mục
    đích hoặc phương pháp xử lý dữ liệu của bên nhận dữ liệu, ảnh hưởng đến an ninh an toàn dữ liệu; kéo
    dài thời gian lưu trữ dữ liệu cốt lõi, dữ liệu quan trọng;

    b) Thay đổi chính sách, quy định bảo vệ dữ liệu và môi trường an ninh mạng ở quốc gia hoặc khu vực
    nơi bên nhận dữ liệu, thay đổi quyền kiểm soát thực tế của bên chuyển dữ liệu hoặc bên nhận dữ liệu
    và các tác động khác đến tính bảo mật của dữ liệu được chuyển.'
  summary_en: The dossier must be amended when purpose, method, scope or data types change, the receiver's
    processing changes, retention is extended, or the receiver's legal environment or control changes.
