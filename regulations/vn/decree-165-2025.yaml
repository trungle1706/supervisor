  confidence: high
  notes: 'Art. 16(2): where core/important data is also personal data, only Art. 12 applies and the PDPL
    transfer impact assessment is not needed.'
- id: VN-DEC165-2025-A12.3-01
  article_ref: Art. 12(3)
  text_vi: '3. Văn bản giao kết giữa bên chuyển dữ liệu và bên nhận dữ liệu, phải xác định rõ:

    a) Mục đích, phương pháp và phạm vi xuất dữ liệu, mục đích và phương pháp xử lý dữ liệu của bên nhận
    dữ liệu;

    b) Địa điểm và thời gian lưu trữ dữ liệu, các biện pháp xử lý dữ liệu sau khi hết thời hạn lưu trữ,
    hoàn thành mục tiêu đã thỏa thuận;

    c) Yêu cầu ràng buộc đối với bên nhận dữ liệu về việc cung cấp dữ liệu đã được chuyển giao cho bên
    thứ ba;

    d) Các biện pháp bảo vệ dữ liệu mà bên nhận dữ liệu sẽ sử dụng;

    đ) Biện pháp khắc phục hậu quả, bồi thường thiệt hại, trách nhiệm xử lý vi phạm hợp đồng, biện pháp
    giải quyết tranh chấp đối với hành vi phạm nghĩa vụ bảo vệ dữ liệu;

    e) Trách nhiệm của các bên trong việc xử lý dữ liệu.'
  summary_en: The agreement between the sender and the foreign receiver must state purpose, method and
    scope; storage place and time and disposal; limits on onward transfer; protection measures; remedies;
    and each side's duties.
  duties:
  - cross_border_notice
  - processor_contract
  - outsourcing_oversight
  applies_to:
