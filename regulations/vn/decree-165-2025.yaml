- id: VN-DEC165-2025-A12.11-01
  article_ref: Art. 12(11)-(12)
  text_vi: '11. Trường hợp chuyển, xử lý dữ liệu cốt lõi xuyên biên giới không cần sự chấp thuận của cơ
    quan có thẩm quyền tại khoản 5 Điều này và trường hợp chuyển, xử lý dữ liệu quan trọng không phải
    thông báo cho cơ quan có thẩm quyền theo quy định tại khoản 6 Điều này gồm:

    a) Trong các tình huống khẩn cấp, thực sự cần thiết phải cung cấp dữ liệu cá nhân ra nước ngoài để
    bảo vệ tính mạng, sức khỏe và an toàn tài sản của cá nhân; để thực hiện nhiệm vụ, nghĩa vụ theo quy
    định của pháp luật;

    b) Thực hiện quản lý nhân sự xuyên biên giới theo quy tắc, quy chế lao động và thỏa ước lao động tập
    thể theo quy định của pháp luật;

    c) Trường hợp thực sự cần thiết phải cung cấp dữ liệu nhằm mục đích ký kết hoặc thực hiện hợp đồng,
    bao gồm trường hợp hợp đồng liên quan đến vận chuyển xuyên biên giới, hậu cần, chuyển tiền, thanh
    toán, mở tài khoản ngân hàng và khách sạn, xin thị thực, dịch vụ kiểm tra.

    ...

    12. Trường hợp chuyển, xử lý dữ liệu cốt lõi, dữ liệu quan trọng theo quy định của khoản 11 Điều này
    phải gửi đánh giá tác động về Bộ Công an (hoặc Bộ Quốc phòng đối với dữ liệu do Bộ Quốc phòng quản
    lý) theo quy định tại khoản 4 Điều này sau 15 ngày kể từ ngày tiến hành thực hiện.'
  summary_en: Approval (core data) or prior notice (important data) is not needed for emergency personal-data
    transfers, cross-border HR management, or transfers truly needed to conclude or perform a contract,
    including remittance, payment and opening bank accounts. The assessment must still be sent to the
    Ministry of Public Security after 15 days from the start (wording as in the text).
  duties:
  - cross_border_notice
  - regulatory_reporting
  applies_to:
