  notes: 'Verified from the official text. Final text: important-data cross-border filing is 15 days before
    processing (Art. 12(6)); the draft figure of 5 days was NOT used. Core data needs an assessment and
    written pass result from the Ministry of Public Security within 10 days (15 if complex) before transfer
    (Art. 12(5)). Log retention for core/important data processing: at least six months (Art. 17(10)).
    Annual risk assessment: Art. 17(11). Incident report to MPS/MND for core/important data: ''as early
    as possible'' (Art. 19(4)). Drills every 6 months: Art. 19(8). The cross-border quantity test counts
    from 1 Jul 2025 (Art. 12(10)). Gap: the Prime Minister''s catalogues of core and important data were
    not found in the checked sources; until published, classification relies on the criteria in Art. 3-4.
    Not checked: the form annexes (Form 02 and the risk report form).'
obligations:
- id: VN-DEC165-2025-A3-01
  article_ref: Art. 3
  text_vi: 'Việc xác định dữ liệu quan trọng căn cứ theo mức độ có thể tác động của dữ liệu đến quốc phòng,
    an ninh, cơ yếu, đối ngoại, kinh tế vĩ mô, ổn định xã hội, sức khỏe và an toàn cộng đồng khi bị thu
    thập, sử dụng trái phép (không bao gồm bí mật nhà nước), bao gồm:

    1. Dữ liệu có thể gây tác động nguy hiểm đến an ninh quốc gia, độc lập, chủ quyền, thống nhất và toàn
    vẹn lãnh thổ của Tổ quốc, bảo vệ Đảng, Nhà nước, khối đại đoàn kết toàn dân tộc; bảo vệ an ninh chính
    trị, an ninh trong các lĩnh vực tư tưởng - văn hóa, kinh tế, quốc phòng, đối ngoại, thông tin, xã
    hội, tài nguyên, môi trường, nông nghiệp, sinh học, y tế, lao động, xây dựng, giáo dục, đào tạo, khoa
    học và công nghệ.

    2. Dữ liệu có thể gây tác động nguy hiểm đến kế hoạch phát triển quan hệ đối ngoại, ảnh hưởng lợi
    ích quốc gia và an ninh hợp tác quốc tế, dự án đầu tư của Việt Nam ở nước ngoài, an ninh năng lượng,
    hàng hải.

    3. Dữ liệu có thể gây tác động nguy hiểm đến phát triển, vận hành kinh tế vĩ mô, ngành kinh tế quan
    trọng của quốc gia, tổng cung, tổng cầu của xã hội, tổng giá trị kinh tế quốc gia, tỷ lệ thất nghiệp,
    lĩnh vực tiền tệ, thương mại, xuất, nhập khẩu, cung ứng hàng hóa, sản phẩm, dịch vụ thiết yếu.

    4. Dữ liệu có thể gây tác động nguy hiểm đến tính mạng, sức khỏe, danh dự, nhân phẩm, tài sản, quyền,
    lợi ích hợp pháp của cơ quan, tổ chức, cá nhân; công tác phòng chống dịch bệnh, phòng ngừa, theo dõi
    và điều trị các bệnh truyền nhiễm, bệnh nghề nghiệp, an toàn vệ sinh thực phẩm; cung ứng lao động,
    cung cấp các dịch vụ công.'
  summary_en: 'Criteria for important data: data whose unauthorised collection or use could endanger national
    defence/security, foreign relations, macro-economy, important sectors (money, trade, essential services),
    or life, health, property and rights of people and organisations.'
  duties:
  - data_classification
  applies_to:
    agent_class:
    - any
  addressee: bank
