- id: VN-DEC165-2025-A17.4-01
  article_ref: Art. 17(4)
  text_vi: '4. Khi xử lý, sử dụng dữ liệu cốt lõi, dữ liệu quan trọng, chủ quản dữ liệu cần thực hiện:

    a) Xây dựng, triển khai quy chế truy cập, truy xuất dữ liệu bảo đảm tuân thủ các nguyên tắc đặc quyền
    tối thiểu trong quá trình xử lý, sử dụng dữ liệu;

    b) Xây dựng hệ thống kiểm soát truy cập dữ liệu, trong đó thiết lập nền tảng quản lý truy cập và nhận
    dạng thống nhất; áp dụng các biện pháp kỹ thuật để bảo vệ dữ liệu, kiểm soát việc truy cập, truy xuất
    dữ liệu trong quá trình xử lý, sử dụng dữ liệu.'
  summary_en: For core or important data, set access rules on the least-privilege principle and an access
    control system with unified identity and access management.
