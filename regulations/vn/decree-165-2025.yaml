- id: VN-DEC165-2025-A19.4-01
  article_ref: Art. 19(4)
  text_vi: '4. Chủ quản dữ liệu có trách nhiệm:

    a) Thông báo kịp thời cho chủ sở hữu dữ liệu về các sự cố an toàn dữ liệu có thể gây tổn hại đến quyền
    và lợi ích hợp pháp của cá nhân, tổ chức và đưa ra các biện pháp giảm thiểu thiệt hại;

    b) Sau khi xảy ra sự cố an toàn dữ liệu, phải kịp thời tiến hành ứng phó khẩn cấp theo kế hoạch ứng
    phó khẩn cấp, báo cáo các sự cố bảo mật liên quan đến dữ liệu quan trọng và dữ liệu cốt lõi cho Bộ
    Công an, Bộ Quốc phòng quản lý trong thời gian sớm nhất có thể.'
  summary_en: The controller must tell the data owner promptly about data safety incidents that may harm
    rights, respond under its emergency plan, and report incidents involving important or core data to
    the Ministry of Public Security or National Defence as early as possible. No fixed hour count is given.
  duties:
  - incident_report
  - incident_response
  applies_to:
    agent_class:
    - any
    data_classes:
    - core_data
    - important_data
  addressee: bank
  control_mapping:
  - kind: evidence
    id: case_file
    coverage: partial
    note: incident evidence
  - kind: process
    id: incident_management
    coverage: none
  - kind: process
    id: regulator_notification
    coverage: none
  - kind: console
    id: agent_action
    coverage: partial
    note: pause or retire an agent to contain an incident
  evidence_needed:
  - incident report to MPS/MND
  - containment record
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/179108
