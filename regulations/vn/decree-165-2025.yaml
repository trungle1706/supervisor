  confidence: high
  notes: Timing is 'thời gian sớm nhất có thể'. Compare Decree 331/2026 for system incidents (24 h initial,
    72 h report).
- id: VN-DEC165-2025-A19.8-01
  article_ref: Art. 19(8)
  text_vi: 8. Chủ quản dữ liệu thực hiện diễn tập kế hoạch dự phòng đối với các sự cố an toàn dữ liệu
    quan trọng, cốt lõi tiến hành diễn tập khẩn cấp định kỳ 06 tháng/lần, lưu hồ sơ diễn tập và báo cáo
    tóm tắt diễn tập, cập nhật kịp thời các kế hoạch dự phòng theo những thay đổi lớn trong chính hệ thống
    xử lý dữ liệu hoặc môi trường bên ngoài.
  summary_en: Controllers of important or core data must run emergency drills every 6 months, keep drill
    records and a summary report, and update contingency plans after major changes.
  duties:
  - business_continuity
  - incident_response
  - staff_competence
  applies_to:
    agent_class:
    - any
    data_classes:
    - core_data
    - important_data
  addressee: bank
  control_mapping:
  - kind: process
    id: business_continuity_plan
    coverage: none
  - kind: process
    id: incident_management
    coverage: none
  evidence_needed:
  - drill records every 6 months
