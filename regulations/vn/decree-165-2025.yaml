- id: VN-DEC165-2025-A11.1-01
  article_ref: Art. 11(1)
  text_vi: '1. Cơ quan, tổ chức, cá nhân được sử dụng một hoặc nhiều giải pháp mã hóa và quy trình mã
    hóa, giải mã phù hợp với hoạt động quản trị, quản lý dữ liệu của mình gồm:

    a) Giải pháp mã hóa dữ liệu khi truyền tải dữ liệu;

    b) Giải pháp mã hóa dữ liệu khi lưu trữ dữ liệu;

    c) Giải pháp mã hóa dữ liệu trên thiết bị số;

    d) Giải pháp bảo mật phần cứng nhằm phòng chống truy cập trái phép và bảo đảm rằng các thao tác mã
    hóa/giải mã chỉ được thực hiện trong môi trường an toàn;

    đ) Quy trình giải mã yêu cầu xác thực định danh người thực hiện giải mã dữ liệu, xác định và cấp quyền
    truy cập dữ liệu đã được mã hóa;

    e) Giải pháp ghi lại các hoạt động mã hóa và giải mã nhằm bảo đảm tính hợp pháp, minh bạch, công bằng
    và phục vụ tra cứu;

    g) Các giải pháp, quy trình khác theo quy định của pháp luật.'
  summary_en: Encryption and key-handling solutions may include encryption in transit, at rest and on
    devices, hardware security, authenticated decryption with access rights, and logging of encrypt/decrypt
    operations.
  duties:
  - encryption
  - logging
  applies_to:
    agent_class:
    - any
