- id: VN-DEC165-2025-A12.1-01
  article_ref: Art. 12(1), 12(2), 12(4); Art. 16(2)
  text_vi: '1. Chủ sở hữu dữ liệu, chủ quản dữ liệu khi cần chuyển, xử lý dữ liệu cốt lõi, dữ liệu quan
    trọng xuyên biên giới thì thực hiện đánh giá tác động theo quy định khoản 2 Điều này. Đánh giá tác
    động chuyển dữ liệu cốt lõi, quan trọng ra nước ngoài, cho tổ chức, cá nhân nước ngoài được thực hiện
    01 lần cho suốt thời gian hoạt động của tổ chức, doanh nghiệp và được cập nhật, bổ sung theo quy định
    tại khoản 8 Điều này.

    ...

    2. Bên chuyển dữ liệu phải đánh giá tác động với các vấn đề sau:

    a) Tính hợp pháp, sự cần thiết, phạm vi, phương thức truyền dữ liệu và cách xử lý dữ liệu của bên
    nhận dữ liệu;

    b) Những rủi ro mà việc chuyển dữ liệu có thể gây ra cho quốc phòng, an ninh, hoạt động kinh tế, đối
    ngoại, ổn định xã hội, lợi ích công cộng hoặc quyền và lợi ích hợp pháp của cá nhân hoặc tổ chức;
    rủi ro dữ liệu sẽ bị giả mạo, phá hủy, rò rỉ, mất hoặc sử dụng bất hợp pháp;

    c) Trách nhiệm và nghĩa vụ, các biện pháp quản lý, kỹ thuật của bên nhận dữ liệu;

    d) Các vấn đề khác có liên quan.

    ...

    4. Hồ sơ đánh giá tác động chuyển, xử lý dữ liệu xuyên biên giới gồm Báo cáo đánh giá tác động chuyển,
    xử lý dữ liệu xuyên biên giới (theo Mẫu số 02 ban hành kèm theo Nghị định này) và các văn bản khác
    có liên quan.'
  summary_en: Before transferring or processing core or important data across the border, the owner or
    controller must assess impact (legality and need, risks, recipient controls). One assessment covers
    the life of the organisation and is updated on change. The dossier uses Report Form 02.
  duties:
  - cross_border_notice
  applies_to:
    agent_class:
    - any
    data_classes:
    - core_data
    - important_data
    cross_border: true
  addressee: bank
  control_mapping:
