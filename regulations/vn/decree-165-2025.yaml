- id: VN-DEC165-2025-A18.1-01
  article_ref: Art. 18(1), 18(5)
  text_vi: '1. Chủ sở hữu dữ liệu, chủ quản dữ liệu cốt lõi, dữ liệu quan trọng phải xác định người chịu
    trách nhiệm về bảo vệ dữ liệu và bộ phận bảo vệ an toàn dữ liệu.

    ...

    5. Xây dựng kế hoạch và thực hiện đào tạo về bảo vệ dữ liệu hàng năm.'
  summary_en: Owners and controllers of core or important data must name a person responsible for data
    protection and a data security unit, and run annual training.
