- id: VN-DEC165-2025-A12.6-01
  article_ref: Art. 12(6)
  text_vi: '6. Trường hợp cần chuyển, xử lý xuyên biên giới là dữ liệu quan trọng: Bên chuyển dữ liệu
    phải lập hồ sơ đánh giá tác động trước khi chuyển, xử lý dữ liệu xuyên biên giới để phục vụ hoạt động
    kiểm tra, đánh giá của Bộ Công an hoặc Bộ Quốc phòng trong trường hợp cần thiết (không cần sự chấp
    thuận của cơ quan có thẩm quyền trước khi thực hiện). Bên chuyển dữ liệu gửi 01 bản chính hồ sơ tới
    Bộ Công an hoặc Bộ Quốc phòng theo mẫu ban hành kèm theo Nghị định này trước 15 ngày khi tiến hành
    xử lý dữ liệu.'
  summary_en: 'Important data: no prior approval, but the sender must prepare the assessment dossier before
    transfer and send one original to the Ministry of Public Security (or National Defence) 15 days before
    processing starts. The final text says 15 days (an earlier draft reportedly said 5).'
