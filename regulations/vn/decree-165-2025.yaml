- id: VN-DEC165-2025-A13.1-01
  article_ref: Art. 13(1)(b)
  text_vi: b) Việc xóa, hủy dữ liệu được thực hiện trong 72 giờ sau khi có yêu cầu của chủ thể dữ liệu
    và phải thông báo kết quả xử lý thu hồi, xóa, hủy dữ liệu cho chủ sở hữu dữ liệu, trừ trường hợp pháp
    luật có quy định khác. Trường hợp không thể xóa, hủy dữ liệu, chủ sở hữu dữ liệu, chủ quản dữ liệu
    phải ngừng xử lý, sử dụng dữ liệu.
