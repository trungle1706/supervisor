- id: VN-DEC165-2025-A15.2-01
  article_ref: Art. 15(2)
  text_vi: '2. Một số biện pháp phòng ngừa rủi ro phát sinh trong xử lý dữ liệu bao gồm:

    a) Thực hiện sao lưu dữ liệu thường xuyên và bảo đảm an toàn;

    b) Định kỳ bảo trì, bảo dưỡng, nâng cấp hệ thống nhằm duy trì và cải thiện hiệu suất, tính năng, tính
    bảo mật và tính nhất quán của hệ thống cơ sở dữ liệu; có biện pháp ứng phó khôi phục hệ thống để bảo
    đảm tính liên tục của hệ thống;

    c) Thực hiện các biện pháp bảo vệ dữ liệu theo quy định;

    d) Phân cấp chặt chẽ quyền truy cập đối với từng loại dữ liệu để phòng ngừa việc truy cập dữ liệu
    trái phép;

    đ) Sử dụng các hệ thống giám sát và phát hiện xâm nhập để theo dõi hoạt động mạng và phát hiện các
    hành vi bất thường hoặc truy cập trái phép;

    e) Cài đặt và duy trì các phần mềm bảo mật;

    g) Thực hiện đánh giá rủi ro định kỳ hàng năm để xác định các lỗ hổng trong hệ thống và áp dụng các
    biện pháp phòng ngừa rủi ro tương ứng;

    h) Xây dựng phương án, kế hoạch xử lý sự cố để chủ động, kịp thời ứng phó, khắc phục sự cố;

    i) Đào tạo, bồi dưỡng, tập huấn kỹ năng bảo vệ dữ liệu, cách nhận biết các mối đe dọa, cách xử lý
    khi phát hiện rủi ro bảo mật; thường xuyên diễn tập phòng ngừa sự cố, giám sát, phát hiện, bảo đảm
    kịp thời ứng phó, khắc phục sự cố;

    k) Các biện pháp khác theo quy định pháp luật.'
  summary_en: Risk prevention measures include regular safe backups, system maintenance and recovery,
    strict access tiers per data type, intrusion monitoring, security software, an annual risk assessment,
    an incident plan, and training and drills.
