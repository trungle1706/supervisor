    id: agent_event_log
    coverage: partial
    note: shows which agent sent which data where
  - kind: process
    id: transfer_impact_assessment
    coverage: none
    note: impact report on Form 02
  - kind: process
    id: data_localisation_setup
    coverage: none
  evidence_needed:
  - impact assessment report (Form 02)
  - recipient controls review
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/179108
