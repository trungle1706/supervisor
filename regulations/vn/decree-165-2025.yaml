- id: VN-DEC165-2025-A17.11-01
  article_ref: Art. 17(11)
  text_vi: '11. Chủ quản dữ liệu cốt lõi, dữ liệu quan trọng hàng năm phải thực hiện đánh giá rủi ro đối
    với hoạt động xử lý dữ liệu cốt lõi, dữ liệu quan trọng trong phạm vi quản lý, lập, lưu trữ Báo cáo
    đánh giá rủi ro theo mẫu ban hành kèm theo Nghị định này và phải luôn có sẵn để phục vụ hoạt động
    kiểm tra, đánh giá của cơ quan có thẩm quyền, trừ trường hợp đã lập Hồ sơ đánh giá tác động chuyển,
    xử lý dữ liệu xuyên biên giới theo quy định tại Điều 12 Nghị định này. Báo cáo đánh giá rủi ro bao
    gồm:

    a) Thông tin cơ bản về chủ quản dữ liệu, thông tin về bộ phận có chức năng bảo vệ an toàn dữ liệu,
    tên và thông tin liên lạc của người chịu trách nhiệm về bảo vệ dữ liệu;

    b) Mục đích, loại, số lượng, phương pháp, phạm vi, thời gian lưu trữ, vị trí lưu trữ dữ liệu, hoạt
    động xử lý dữ liệu và hoàn cảnh thực hiện các hoạt động xử lý dữ liệu;

    c) Hệ thống quản lý bảo vệ dữ liệu, các biện pháp kỹ thuật mã hóa, sao lưu, dán nhãn, kiểm soát truy
    cập và xác thực, các biện pháp cần thiết khác;

    d) Rủi ro an toàn dữ liệu đã phát hiện, sự cố an toàn dữ liệu đã xảy ra và cách giải quyết;

    đ) Các nội dung báo cáo khác theo quy định của các cơ quan có thẩm quyền có liên quan.'
  summary_en: Each year, controllers of core or important data must assess risk of that processing and
    keep a risk report in the set form, ready for authority inspection (not needed if a cross-border dossier
    under Art. 12 already exists). The report lists the controller, data, storage, controls, found risks
    and incidents.
  duties:
  - risk_management_system
  - technical_documentation
  applies_to:
    agent_class:
    - any
    data_classes:
    - core_data
    - important_data
  addressee: bank
  control_mapping:
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: audit export can feed the report
  - kind: process
    id: security_assessment
    coverage: none
  evidence_needed:
  - annual risk assessment report
  verification: VERIFIED_PRIMARY
  sources:
