  last_checked: '2026-10-28'
  notes: 'STATUS IS ASSUMED. Facts verified: the decree guides the 2018 Cybersecurity Law; that law ceased
    on 2026-07-01 (Law 116/2025 Art. 44(2)); Decree 333/2026/NĐ-CP (19 Aug 2026) guides the new law, covers
    the same subjects (storage Art. 19-20, incident response Art. 9, appraisal and assessment) and Art.
    31 says dossiers lodged under Decree 53/2022 before 19 Aug 2026 and not yet resolved continue under
    it. Not verified: no express repeal clause for 53/2022 was found in 333/2026 (the text has none),
    and vbpl.vn still lists 53/2022 as in force. Reasoning: a decree that guides a lapsed law and was
    replaced by a new guiding decree is treated here as superseded. A possible gap 1 Jul to 19 Aug 2026
    (where 53/2022 may still have applied) is not resolved. Set binding=false so the compliance agent
    does not use these items for new products; use VN-CYBER-2025 items A25.3-02 and A25.2B-01 instead.
    Rules that carry over unchanged: domestic firms store the listed data in Vietnam; 24-month minimum
    storage; 12-month log retention. Changes in 333/2026: relationship data (friends, groups) dropped
    from the list; foreign-firm trigger needs up to 3 written notices over at most 6 months; force majeure
    period 25 working days (was 30); online application and trade-like services added. Bank scope: neither
    decree names banks; ''online payment'' and ''payment intermediary'' are listed for FOREIGN firms only.'
obligations:
- id: VN-DEC53-2022-A26.1-01
  article_ref: Art. 26(1)
  text_vi: '1. Dữ liệu phải lưu trữ tại Việt Nam:

    a) Dữ liệu về thông tin cá nhân của người sử dụng dịch vụ tại Việt Nam;

    b) Dữ liệu do người sử dụng dịch vụ tại Việt Nam tạo ra: Tên tài khoản sử dụng dịch vụ, thời gian
    sử dụng dịch vụ, thông tin thẻ tín dụng, địa chỉ thư điện tử, địa chỉ mạng (IP) đăng nhập, đăng xuất
    gần nhất, số điện thoại đăng ký được gắn với tài khoản hoặc dữ liệu;

    c) Dữ liệu về mối quan hệ của người sử dụng dịch vụ tại Việt Nam: bạn bè, nhóm mà người sử dụng kết
    nối hoặc tương tác.'
  summary_en: 'Data to be stored in Vietnam: users'' personal data, data users create (account name, usage
    time, credit card info, email, last login/logout IP, phone), and relationship data (friends, groups).'
