- id: VN-DEC53-2022-A11.1-01
  article_ref: Art. 11(1)(a), 11(2)
  text_vi: 'a) Tách biệt với các môi trường phát triển, kiểm tra và thử nghiệm;

    ...

    2. Dữ liệu của hệ thống thông tin quan trọng về an ninh quốc gia phải có phương án tự động sao lưu
    dự phòng phù hợp ra phương tiện lưu trữ ngoài với tần suất thay đổi của dữ liệu và bảo đảm nguyên
    tắc dữ liệu phát sinh phải được sao lưu trong vòng 24 giờ. Dữ liệu sao lưu dự phòng phải được kiểm
