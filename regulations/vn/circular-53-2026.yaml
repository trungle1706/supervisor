- id: VN-TT53-2026-A6.01-01
  article_ref: Art. 6(1)
  text_vi: 'Hệ thống trí tuệ nhân tạo phải được kiểm tra, đánh giá an ninh mạng trước khi đưa vào vận
    hành chính thức và định kỳ hoặc ngay khi có thay đổi đáng kể của hệ thống trí tuệ nhân tạo, tối thiểu
    bao gồm: a) Kiểm tra, đánh giá việc phòng, chống các kịch bản tấn công, rủi ro đặc thù đối với hệ
    thống trí tuệ nhân tạo, tối thiểu bao gồm: (i) Tấn công vi phạm quyền riêng tư dữ liệu; (ii) Tấn công
    đầu độc dữ liệu, tấn công đầu độc mô hình, tấn công né tránh và tấn công trích xuất mô hình (bắt buộc
    đối với hệ thống trí tuệ nhân tạo có rủi ro cao; khuyến khích áp dụng đối với các hệ thống trí tuệ
    nhân tạo khác); (iii) Tấn công tiêm lệnh, rủi ro tạo sinh nội dung sai lệch hoặc không có căn cứ thực
    tế, rủi ro thiên lệch trong kết quả đầu ra (đối với hệ thống trí tuệ nhân tạo tạo sinh);'
  summary_en: 'Cybersecurity testing before go-live, periodically and after significant change, covering
    AI-specific attacks: privacy leakage; data and model poisoning, evasion and model extraction (mandatory
    for high risk); prompt injection, false or ungrounded output and bias (generative systems).'
  duties:
  - security_testing
  - prompt_injection_defence
  - robustness_security
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: injection_prefilter
    coverage: partial
    note: 'Blocks injection patterns at runtime. Missing: tests for data and model poisoning, evasion and
      model extraction of high-risk models, the periodic cycle by cyber security level, and the filed report.'
  - kind: catalogue
    id: groundedness
    coverage: partial
    note: Flags ungrounded output.
  - kind: catalogue
    id: fairness_slices
    coverage: partial
    note: Bias signal.
  - kind: evidence
    id: assurance_results
    coverage: partial
    note: Packs owasp_llm_top10, owasp_agentic_redteam, indirect_injection_vi, multiturn_redteam_vi, pii_canary
      and prefilter_evasion test the listed attack classes; results are stored.
  - kind: console
    id: assurance
    coverage: partial
    note: Assurance page lists pack runs and results per agent.
  - kind: evidence
    id: predeploy_report
    coverage: partial
    note: Pre-deploy report names the packs required before go-live and whether they passed (flag ONBOARD_PREDEPLOY).
  - kind: process
    id: security_assessment
    coverage: partial
    note: 'Manual step: the bank runs the cyber test before go-live, on a cycle and after a significant
      change, and files the report with the fixes.'
  evidence_needed:
  - test report per attack class
  - results filed for inspectors (Art. 6(1)(d))
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
    title: Thông tư số 53/2026/TT-NHNN (vbpl.vn gateway, full text)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: a0c9c5a93eb76c3cc517721cca67934e6ff63b3b7fb7d94c836e711b501d2dfa
    local_path: regulations/sources/VN-TT53-2026/53-2026-tt-nhnn.txt
  - url: https://thitruongtaichinhtiente.vn/nhnn-ban-hanh-quy-dinh-ve-an-toan-quan-ly-rui-ro-khi-ung-dung-ai-trong-nganh-ngan-hang-86130.html
    title: Tap chi Thi truong Tai chinh Tien te - NHNN ban hanh quy dinh ve an toan, quan ly rui ro khi
      ung dung AI (2026-10-08)
    fetched_at: '2026-10-15'
    kind: secondary
  - url: https://www.bakermckenzie.com/en/insight/publications/2026/04/vietnam-draft-circular-on-ai-deployment-in-banking
    title: 'Baker McKenzie - Vietnam: draft circular on AI deployment in banking (Apr 2026, about the
      consultation draft)'
    fetched_at: '2026-10-15'
    kind: secondary
  confidence: high
  notes: Supervisor defences are runtime controls. They are not a substitute for the pre-go-live security
    tests.
  status: issued
- id: VN-TT53-2026-A6.01B-01
  article_ref: Art. 6(1)(b)
  text_vi: Đối với các hệ thống trí tuệ nhân tạo có rủi ro cao hoặc hệ thống trí tuệ nhân tạo có rủi ro
    trung bình ra quyết định trong hoạt động nghiệp vụ, áp dụng các biện pháp phòng, chống các rủi ro,
    lỗ hổng, tấn công mạng theo các tiêu chuẩn và thông lệ quốc tế như OWASP (OWASP Machine Learning Security
    Top Ten đối với hệ thống học máy, OWASP Top 10 for Large Language Model Applications đối với hệ thống
    sử dụng mô hình ngôn ngữ lớn; Phiên bản OWASP áp dụng là phiên bản mới nhất hoặc phiên bản gần nhất
    với phiên bản được ban hành trong vòng 06 tháng) hoặc tương đương;
  summary_en: From 2027-09-01, high-risk and medium-risk decision-making systems must apply defences per
    international practice such as OWASP ML Security Top Ten and OWASP Top 10 for LLM Applications, or
    equivalent.
  duties:
  - security_testing
  - prompt_injection_defence
  - robustness_security
  applies_to:
    agent_class:
    - payment
    - credit_decision
    - customer_facing
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: injection_prefilter
    coverage: partial
    note: 'Covers part of the OWASP LLM list (prompt injection). Missing: the OWASP Machine Learning Top
      Ten for classical models, the choice of list version, and the full mapping record; the duty starts
      on 2027-09-01 (Art. 23(3)).'
  - kind: catalogue
    id: approved_tools
    coverage: partial
    note: Limits excessive agency.
  - kind: catalogue
    id: pii_masking
    coverage: partial
    note: Limits sensitive information disclosure.
  - kind: evidence
    id: assurance_results
    coverage: partial
    note: Packs owasp_llm_top10 and owasp_agentic_redteam map their results to the OWASP LLM and agentic
      lists.
  - kind: process
    id: security_assessment
    coverage: partial
    note: 'Manual step: map the system to the OWASP list and version in use (and the ML Top Ten for classical
      models).'
  evidence_needed:
  - OWASP mapping with the version used
  verification: VERIFIED_PRIMARY
  sources:
