- id: VN-TT53-2026-A12.03-01
  article_ref: Art. 12(3)
  text_vi: Đối với hệ thống trí tuệ nhân tạo có rủi ro cao, Hội đồng quản lý cấp cao phải phê duyệt chủ
    trương triển khai và quyết định đưa hệ thống vào vận hành chính thức.
  summary_en: For a high-risk system the senior management board must approve the plan to deploy and decide
    on official go-live.
  duties:
  - governance_accountability
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: launch_report
    coverage: partial
    note: 'Launch report gives GO or NO-GO evidence to the board. Missing: the board resolution; the approver
      in Supervisor is a console role, not the senior management board.'
  - kind: evidence
    id: handover
    coverage: partial
    note: Operate handover.
  - kind: evidence
    id: predeploy_report
    coverage: partial
    note: Pre-deploy report gives a verdict with pointers (flag ONBOARD_PREDEPLOY).
  - kind: evidence
    id: lifecycle_approval
    coverage: partial
    note: The move into deployment needs an approver or admin who is not the requester.
  - kind: process
    id: go_live_decision
    coverage: partial
    note: 'Manual step: the senior management board approves the plan to deploy and decides the official
      go-live; keep the resolution.'
  evidence_needed:
  - board resolution for each high-risk system and for go-live
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
