- id: VN-TT53-2026-A4.05-01
  article_ref: Art. 4(5)
  text_vi: 'Đơn vị phải lập danh mục hệ thống trí tuệ nhân tạo và rà soát, cập nhật danh mục tối thiểu
    hằng năm. Danh mục tối thiểu bao gồm các trường thông tin: tên hệ thống trí tuệ nhân tạo, mức độ rủi
    ro, mục đích sử dụng, nhà cung cấp, phiên bản, văn bản phê duyệt mức độ rủi ro.'
  summary_en: 'The bank keeps an AI system inventory, reviewed at least yearly, with: system name, risk
    level, purpose, provider, version and the approval document for the risk level.'
  duties:
  - model_inventory
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: 'Agent inventory with owner, risk tier and model family. Missing: AI systems outside Supervisor;
      the ''provider'' and ''approval document'' fields; no yearly review reminder for the inventory.'
  - kind: evidence
    id: agent_version
    coverage: partial
    note: Version history per agent.
  - kind: evidence
    id: ai_system_record
    coverage: partial
    note: 'AI system record: name, owner, team, risk level, purpose and components.'
  - kind: console
    id: systems
    coverage: partial
    note: AI system page and the inventory graph list the systems and what they use.
  - kind: process
    id: ai_inventory_review
    coverage: partial
    note: 'Manual step: review the inventory at least once a year, list systems outside Supervisor, and
      keep the approval document of each risk level.'
  evidence_needed:
  - inventory with the six required fields
  - yearly review record
  verification: VERIFIED_PRIMARY
  sources:
