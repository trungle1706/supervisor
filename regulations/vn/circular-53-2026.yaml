- id: VN-TT53-2026-A5.01G1-01
  article_ref: Art. 5(1)(g)(i)
  text_vi: 'Khách hàng và đơn vị phải xác lập thỏa thuận về việc cho phép hệ thống trí tuệ nhân tạo tự
    động thực hiện giao dịch thanh toán. Khi xác lập thỏa thuận đơn vị có trách nhiệm kiểm tra, đối chiếu,
    xác minh thông tin nhận biết khách hàng, bảo đảm thực hiện bởi chính chủ tài khoản thanh toán, thẻ,
    ví điện tử, tài khoản Tiền di động hoặc người đại diện của khách hàng cá nhân hoặc người đại diện
    theo pháp luật hoặc người đại diện theo ủy quyền của khách hàng tổ chức; trong trường hợp thực hiện
    bằng phương tiện điện tử phải kiểm tra tối thiểu bằng khớp đúng thông tin sinh trắc học kết hợp với
    một hình thức xác nhận khác quy định tại Thông tư số 50/2024/TT-NHNN của Thống đốc Ngân hàng Nhà nước
    Việt Nam quy định về an toàn, bảo mật cho việc cung cấp dịch vụ trực tuyến trong ngành Ngân hàng được
    sửa đổi, bổ sung bởi Thông tư số 77/2025/TT-NHNN (sau đây gọi tắt là Thông tư số 50/2024/TT-NHNN).
    Thỏa thuận phải xác định rõ: phạm vi giao dịch được tự động thực hiện; hạn mức theo từng giao dịch
    và theo ngày; thời hạn hiệu lực; điều kiện tạm dừng; quyền của khách hàng chấm dứt thỏa thuận bất
    kỳ thời điểm nào và trách nhiệm của đơn vị thực hiện ngay yêu cầu chấm dứt;'
  summary_en: 'Autonomous AI payments need a prior agreement with the customer. The bank must verify the
    customer is the account holder or a lawful representative (electronic route: biometric match plus
    another confirmation under Circular 50/2024/TT-NHNN). The agreement states the scope, per-transaction
    and daily limits, validity period, pause conditions, and the customer''s right to end it at any time
    with immediate effect.'
  duties:
  - consent
  - biometric_verification
  - transaction_authentication
  - transaction_limits
  - customer_confidentiality
  applies_to:
    agent_class:
    - payment
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: single_limit
    coverage: partial
    note: 'Per-transaction limit enforcement at the gate. Missing: the agreement, the identity check (biometric
      plus one more factor under Circular 50/2024) and the exemption from transaction confirmation are channel
      and core banking work; the gate does not read the limits of each customer''s agreement.'
  - kind: catalogue
    id: daily_aggregate
    coverage: partial
    note: Daily limit enforcement at the gate.
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: Recorded tool calls give a log of each autonomous payment.
  - kind: process
    id: consent_management
    coverage: partial
    note: 'Manual step: capture the written agreement (scope, limits per transaction and per day, validity,
      pause conditions, right to terminate) and verify the account holder.'
  - kind: process
    id: customer_disclosure
    coverage: partial
    note: 'Manual step: agreement terms shown to the customer.'
  evidence_needed:
  - signed agreement with the required fields
  - biometric plus second-factor check record at signing
  - limits in the agreement enforced at the gate
  verification: VERIFIED_PRIMARY
  sources:
