- id: VN-TT53-2026-A18.03-01
  article_ref: Art. 18(3)
  text_vi: 'Yêu cầu về hợp đồng thuê ngoài hệ thống trí tuệ nhân tạo tối thiểu bao gồm: a) Tuân thủ yêu
    cầu về hợp đồng sử dụng dịch vụ công nghệ thông tin với bên thứ ba theo quy định của Thống đốc Ngân
    hàng Nhà nước; b) Bên thứ ba phải cung cấp báo cáo kiểm toán tuân thủ công nghệ thông tin do tổ chức
    kiểm toán độc lập thực hiện hằng năm trong thời gian thực hiện hợp đồng hoặc các chứng chỉ bảo mật,
    quản lý rủi ro quốc tế tương đương (như SOC 2, ISO/IEC 27001, ISO/IEC 42001) còn hiệu lực. Trường
    hợp bên thứ ba không cung cấp được tài liệu này, đơn vị thực hiện đánh giá hoặc thuê tổ chức độc lập
    đánh giá tuân thủ công nghệ thông tin đối với bên thứ ba; c) Bên thứ ba phải cung cấp thông tin hoặc
    báo cáo kết quả kiểm tra, đánh giá chất lượng mô hình hằng năm hoặc theo từng phiên bản được phát
    hành; d) Bên thứ ba phải cung cấp công cụ hoặc giao diện lập trình ứng dụng (API) hoặc dữ liệu nhật
    ký (logs) hoặc các phương tiện kỹ thuật cần thiết khác để đơn vị giám sát hiệu năng của mô hình; đ)
    Bên thứ ba có trách nhiệm cung cấp thông tin về đặc tính kỹ thuật, giới hạn mô hình, cơ chế cập nhật
    và các biện pháp bảo mật liên quan để đơn vị thực hiện đánh giá rủi ro và quản trị vận hành; e) Bên
    thứ ba cam kết bảo đảm tính liên tục trong hoạt động cung cấp dịch vụ, có phương án dự phòng và giai
    đoạn chuyển tiếp phù hợp khi ngừng hỗ trợ hoặc có thay đổi đáng kể về mô hình; g) Bên thứ ba phải
    phối hợp, cung cấp thông tin cho cơ quan nhà nước có thẩm quyền trong kiểm tra, đánh giá, hậu kiểm
    và khắc phục sự cố liên quan đến hệ thống theo quy định của pháp luật về trí tuệ nhân tạo; h) Bên
    thứ ba cam kết không sử dụng dữ liệu của đơn vị để huấn luyện, tinh chỉnh hoặc cải thiện mô hình của
    bên thứ ba mà không có sự đồng ý bằng văn bản của đơn vị.'
  summary_en: 'Minimum AI outsourcing contract terms: compliance with SBV IT-service contract rules; yearly
    independent IT audit or valid SOC 2, ISO/IEC 27001 or ISO/IEC 42001; yearly or per-version model quality
    reports; tools, API or logs for the bank to monitor model performance; technical information and model
    limits; continuity and exit plan; cooperation with authorities; no use of bank data to train or tune
    vendor models without written consent.'
  duties:
  - outsourcing_oversight
  - processor_contract
  - supply_chain_security
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: proxy_log
    coverage: partial
    note: 'Proxy log gives the bank its own record of vendor model calls. Missing: the eight contract clauses
      and the vendor audit evidence.'
  - kind: catalogue
    id: otlp_ingest
    coverage: partial
    note: Trace ingest supports the monitoring-data clause.
  - kind: evidence
    id: assurance_results
    coverage: partial
    note: Pack model_dependency_inventory records model pinning, region and vendor concentration.
  - kind: process
    id: vendor_management
    coverage: partial
    note: 'Manual step: contract checklist against the eight clauses; yearly independent audit report or
      valid SOC 2 / ISO/IEC 27001 / 42001 certificate; model test reports; no use of bank data for vendor
      training without written consent.'
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: counsel checks the contract against Art. 18(3).'
  evidence_needed:
  - contract checklist against the eight clauses
  - vendor audit report or certificate on file
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
