- id: VN-TT53-2026-A4.02A-01
  article_ref: Art. 4(2)(a)
  text_vi: 'Đối với hệ thống trí tuệ nhân tạo tự động thực hiện giao dịch điện tử trong hoạt động ngân
    hàng, được xác định là hệ thống trí tuệ nhân tạo có rủi ro cao nếu có thực hiện tối thiểu một trong
    các loại giao dịch sau: (i) Giao dịch thanh toán của khách hàng cá nhân có giá trị lớn hơn 10 triệu
    đồng hoặc có tổng giá trị giao dịch trong một ngày đối với một khách hàng do hệ thống trí tuệ nhân
    tạo tự động thực hiện lớn hơn 20 triệu đồng; (ii) Giao dịch thanh toán của khách hàng tổ chức có giá
    trị lớn hơn 50 triệu đồng hoặc có tổng giá trị giao dịch trong một ngày đối với một khách hàng do
    hệ thống trí tuệ nhân tạo tự động thực hiện lớn hơn 100 triệu đồng;'
  summary_en: 'An AI system that auto-executes e-transactions is high risk if it executes at least one
    of: a personal customer payment over 10 million VND (or over 20 million VND a day per customer), or
    an organisation payment over 50 million VND (or over 100 million VND a day per customer).'
  duties:
  - risk_classification
  - transaction_limits
  applies_to:
    agent_class:
    - payment
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: single_limit
    coverage: partial
    note: 'Per-transfer limit enforced at the gate. Missing: the lines of Art. 4(2)(a) (10 / 20 million
      personal, 50 / 100 million organisation) are not enforced; demo limits are above them; the bank sets
      limits and the class.'
  - kind: catalogue
    id: daily_aggregate
    coverage: partial
    note: Daily total limit enforced at the gate.
  - kind: rule
    id: PAY-02
    coverage: partial
    note: Demo limit of 100 million VND per transfer is above the 10 million personal line.
  - kind: rule
    id: PAY-03
    coverage: partial
    note: Demo daily rule of 150 million VND is above the 20 million personal line.
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: Registry keeps the risk tier of each agent.
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: Recorded payment tool calls with amounts give the value distribution per agent.
  - kind: evidence
    id: classification_record
    coverage: partial
    note: Decision 33 classification rows record the class the bank decided.
  evidence_needed:
  - transfer value distribution per agent
  - classification record
  verification: VERIFIED_PRIMARY
