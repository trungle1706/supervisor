- id: VN-TT53-2026-A14.02-01
  article_ref: Art. 14(2)
  text_vi: 'Đơn vị tổ chức quản lý rủi ro đối với việc ứng dụng hệ thống trí tuệ nhân tạo theo 03 tuyến bảo vệ độc lập, trong đó: a) Tuyến bảo vệ thứ nhất là bộ phận hoặc cá nhân thực hiện chức năng phát triển, triển khai, vận hành, sử dụng hệ thống trí tuệ nhân tạo; nhận dạng, thực hiện các biện pháp kiểm soát, theo dõi, giảm thiểu rủi ro; b) Tuyến bảo vệ thứ hai là bộ phận hoặc cá nhân thực hiện chức năng kiểm tra, đánh giá hệ thống trí tuệ nhân tạo; xây dựng chính sách quản lý rủi ro, quy định nội bộ về quản lý rủi ro; theo dõi, kiểm soát rủi ro và tuân thủ quy định của pháp luật; c) Tuyến bảo vệ thứ ba là bộ phận hoặc cá nhân thực hiện chức năng kiểm toán nội bộ; d) Đơn vị được phép thuê ngoài để thực hiện một số chức năng của các tuyến bảo vệ, nhưng phải bảo đảm tính độc lập giữa các tuyến.'
  summary_en: 'AI risk management follows three independent lines of defence: first line develops, deploys and operates; second line tests, sets risk policy and monitors compliance; third line is internal audit. Outsourcing of some functions is allowed if independence between lines is kept.'
  duties:
  - governance_accountability
  - independent_validation
  - risk_management_system
  applies_to: *id004
  addressee: bank
  control_mapping:
  - *id008
  - *id024
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: audit export for second and third line
  evidence_needed:
  - RACI of the three lines for AI
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: 'Date override: Art. 14 takes effect 2027-01-01 (Art. 23(2)). Art. 14(1), (3) and (4) require a risk framework covering model, data governance, cyber, compliance, ethics, third-party, supply-chain and (for banks) reputation risk.'
  status: issued
  dates:
    effective:
      date: '2027-01-01'
      source: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
      verification: VERIFIED_PRIMARY
      note: 'Art. 23(2): Art. 14 takes effect on 2027-01-01.'
