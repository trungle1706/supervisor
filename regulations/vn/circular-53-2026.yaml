- id: VN-TT53-2026-A11.01-01
  article_ref: Art. 11(1)
  text_vi: 'Đơn vị cung cấp đầy đủ, rõ ràng thông tin cho người quản lý, người điều hành và nhân viên
    sử dụng hệ thống trí tuệ nhân tạo (sau đây gọi chung là người sử dụng nội bộ), bao gồm: a) Mục đích
    sử dụng, phạm vi áp dụng, vai trò của hệ thống trong việc hỗ trợ hoặc đưa ra quyết định, khả năng
    và các giới hạn của hệ thống trí tuệ nhân tạo; b) Hướng dẫn sử dụng hệ thống và các khuyến nghị về
    việc diễn giải, sử dụng kết quả đầu ra của hệ thống, bao gồm cảnh báo về nguy cơ sai lệch hoặc sử
    dụng ngoài mục đích thiết kế; c) Quy trình và cách thức yêu cầu sự can thiệp của con người khi phát
    hiện bất thường hoặc rủi ro hoặc sự cố trong quá trình vận hành.'
  summary_en: 'The bank gives internal users clear information: purpose, scope, role, abilities and limits
    of the system; usage guidance with warnings about error or out-of-design use; and how to ask for human
    intervention on anomaly, risk or incident.'
  duties:
  - staff_competence
  - consumer_information
  - human_oversight
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: onboard_plan
    coverage: partial
    note: 'Plan and playbook document the agent''s capabilities and limits. Missing: the user guide with
      warnings and the escalation route are the bank''s text.'
  - kind: evidence
    id: handover
    coverage: partial
    note: Operate handover.
  - kind: evidence
    id: transparency_report
    coverage: partial
    note: Transparency report (internal variant) states purpose, class, controls and limits for staff.
  - kind: evidence
    id: facts_card
    coverage: partial
    note: Facts card lists what the agent does, with file and line (flag ONBOARD_FACTS).
  - kind: process
    id: user_guidance
    coverage: partial
    note: 'Manual step: write the user guide, the warnings about error and out-of-purpose use, and the way
      to ask for human help.'
  - kind: process
    id: staff_training
    coverage: partial
    note: 'Manual step: train staff on the guide.'
  evidence_needed:
  - user guide per AI system
  - escalation route
  verification: VERIFIED_PRIMARY
  sources:
