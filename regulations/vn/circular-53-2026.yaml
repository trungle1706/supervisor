- id: VN-TT53-2026-A10.02-01
  article_ref: Art. 10(2)
  text_vi: Thời gian lưu trữ nhật ký hoạt động của hệ thống trí tuệ nhân tạo và nhật ký xử lý dữ liệu
    quy định tại điểm c khoản 2 Điều 7 Thông tư này phải phù hợp với mức độ rủi ro, mục đích sử dụng của
    hệ thống, tối thiểu đáp ứng quy định về lưu trữ nhật ký của hệ thống thông tin theo cấp độ an ninh
    mạng.
  summary_en: Log retention must fit the risk and purpose and meet at least the log retention rules for
    the information-system security level.
  duties:
  - retention
  - record_keeping
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: 'Hash-chained record; on Delta the log retention default is 1825 days (EVIDENCE_RETENTION_DAYS).
      Missing: the minimum retention for the cyber security level of each system is the bank''s choice;
      logs outside the chain are not covered.'
  - kind: process
    id: records_retention
    coverage: partial
    note: 'Manual step: set the retention period per system security level and apply it to the logs outside
      the chain.'
  evidence_needed:
  - retention period set per system security level
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
