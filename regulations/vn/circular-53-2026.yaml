- id: VN-TT53-2026-A4.03-01
  article_ref: Art. 4(3)
  text_vi: Kết quả phân loại hệ thống trí tuệ nhân tạo phải được phê duyệt bởi cấp có thẩm quyền của đơn
    vị.
  summary_en: The classification result must be approved by the bank's competent level (board, legal representative,
    or a person they authorise in writing). A foreign bank branch follows its parent bank.
  duties:
  - risk_classification
  - governance_accountability
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: 'Registry keeps the risk tier of each agent. Missing: the approver in Supervisor is a console
      role; the ''competent level'' and its written delegation are the bank''s.'
  - kind: console
    id: case_signoff
    coverage: partial
    note: Records a named human decision on a case; counts as pre-execution approval only if the agent code
      waits for it.
  - kind: evidence
    id: classification_record
    coverage: partial
    note: Decision 33 class is applied by a person; the system owner cannot apply it on the own system and
      each answer needs a justification of 20 characters (flag CONSOLE_STATE_ACTIONS).
  - kind: evidence
    id: lifecycle_approval
    coverage: partial
    note: A stage move at high level needs an approver or admin who is not the requester.
  - kind: process
    id: risk_classification_approval
    coverage: partial
    note: 'Manual step: the board, the legal representative or a person with a written delegation approves
      the result; a foreign bank branch follows the parent bank.'
  - kind: process
    id: board_governance
    coverage: partial
    note: 'Manual step: the board or committee is informed of the classification of high-risk systems.'
  evidence_needed:
  - signed approval of each classification
