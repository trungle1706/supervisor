- id: VN-TT53-2026-A21.03-01
  article_ref: Art. 21(3)
  text_vi: 'Đơn vị phải xây dựng và triển khai chương trình đào tạo, nâng cao năng lực cho cán bộ, nhân
    viên liên quan về: a) Kiến thức cơ bản và ứng dụng của trí tuệ nhân tạo trong hoạt động ngân hàng;
    b) Quản lý rủi ro đối với việc ứng dụng hệ thống trí tuệ nhân tạo và các phương pháp đánh giá, kiểm
    soát rủi ro; c) Đạo đức trí tuệ nhân tạo, bảo vệ dữ liệu cá nhân và quyền riêng tư; d) An ninh mạng
    và các quy định của pháp luật liên quan.'
  summary_en: 'The bank runs a training programme on: AI basics in banking; AI risk management; AI ethics,
    personal data and privacy; cybersecurity and related laws.'
  duties:
  - staff_competence
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: process
    id: staff_training
    coverage: partial
    note: 'Manual step: run the training programme on AI basics, AI risk management, ethics and personal
      data, and cyber security, and keep the attendance. No Supervisor control: training content and records
      belong to the bank''s training function; Supervisor holds none.'
  evidence_needed:
  - training programme and records
  verification: VERIFIED_PRIMARY
  sources:
