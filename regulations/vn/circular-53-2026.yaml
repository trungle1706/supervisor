- id: VN-TT53-2026-A11.02-01
  article_ref: Art. 11(2)
  text_vi: Đơn vị phải thiết lập kênh tiếp nhận và xử lý phản hồi từ người sử dụng nội bộ và các bộ phận
    liên quan về các sự cố, hành vi bất thường, tác động bất lợi hoặc kết quả sai lệch phát sinh trong
    quá trình vận hành hệ thống trí tuệ nhân tạo, làm cơ sở cho việc điều chỉnh mô hình, quy trình hoặc
    biện pháp kiểm soát rủi ro.
  summary_en: The bank sets up a channel to receive and handle feedback from internal users on incidents,
    odd behaviour, adverse effects or wrong results, to tune the model, process or controls.
  duties:
  - incident_response
  - complaint_handling
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: console
    id: inbox
    coverage: partial
    note: 'Notices to reviewers. Missing: a channel where staff send feedback; Supervisor opens cases from
      its own signals.'
  - kind: console
    id: cases
    coverage: partial
    note: Case queue; cases open from monitors, judges and people.
  - kind: console
    id: incidents
    coverage: partial
    note: Incident list with transitions and a closer.
  - kind: process
    id: incident_management
    coverage: partial
    note: 'Manual step: the channel where staff send feedback on odd behaviour or wrong results, and the
      log of how each was handled.'
  evidence_needed:
  - feedback channel and handling log
  verification: VERIFIED_PRIMARY
  sources:
