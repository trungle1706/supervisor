- id: VN-TT53-2026-A14.02-01
  article_ref: Art. 14(2)
  text_vi: 'Đơn vị tổ chức quản lý rủi ro đối với việc ứng dụng hệ thống trí tuệ nhân tạo theo 03 tuyến
    bảo vệ độc lập, trong đó: a) Tuyến bảo vệ thứ nhất là bộ phận hoặc cá nhân thực hiện chức năng phát
    triển, triển khai, vận hành, sử dụng hệ thống trí tuệ nhân tạo; nhận dạng, thực hiện các biện pháp
    kiểm soát, theo dõi, giảm thiểu rủi ro; b) Tuyến bảo vệ thứ hai là bộ phận hoặc cá nhân thực hiện
    chức năng kiểm tra, đánh giá hệ thống trí tuệ nhân tạo; xây dựng chính sách quản lý rủi ro, quy định
    nội bộ về quản lý rủi ro; theo dõi, kiểm soát rủi ro và tuân thủ quy định của pháp luật; c) Tuyến
    bảo vệ thứ ba là bộ phận hoặc cá nhân thực hiện chức năng kiểm toán nội bộ; d) Đơn vị được phép thuê
    ngoài để thực hiện một số chức năng của các tuyến bảo vệ, nhưng phải bảo đảm tính độc lập giữa các
    tuyến.'
  summary_en: 'AI risk management follows three independent lines of defence: first line develops, deploys
    and operates; second line tests, sets risk policy and monitors compliance; third line is internal
    audit. Outsourcing of some functions is allowed if independence between lines is kept.'
  duties:
  - governance_accountability
  - independent_validation
  - risk_management_system
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: 'Audit export for second and third line. Missing: who sits in which line, the independence of
      an outsourced function and the internal audit plan; Supervisor roles are not the organisation chart.
      Date override: Art. 14 starts 2027-01-01.'
  - kind: evidence
    id: task_record
    coverage: partial
    note: Task VAL-SECOND (second-line review, high level) is closed only by an approver or admin, not by
      the owner.
  - kind: console
    id: workflow_actions
    coverage: partial
    note: A waiver needs a second person, and the person who answers a waiver must not have done tasks of
      the same stage (flag CONSOLE_WORKFLOW_ACTIONS).
  - kind: process
    id: three_lines_model
    coverage: partial
    note: 'Manual step: write the RACI of the three lines for AI and keep the independence of outsourced
      functions.'
  - kind: process
    id: model_validation
    coverage: partial
    note: 'Manual step: independent second-line model validation.'
  - kind: process
    id: board_governance
    coverage: partial
    note: 'Manual step: the board gets the three-line report.'
  evidence_needed:
  - RACI of the three lines for AI
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
    title: Thông tư số 53/2026/TT-NHNN (vbpl.vn gateway, full text)
