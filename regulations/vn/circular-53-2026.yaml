- id: VN-TT53-2026-A9.04-01
  article_ref: Art. 9(4)
  text_vi: Sau khi xử lý sự cố nghiêm trọng, đơn vị phải tổ chức đánh giá lại mức độ rủi ro của hệ thống
    trí tuệ nhân tạo
  summary_en: After a serious incident the bank re-assesses the system's risk level and, where needed,
    re-classifies, adjusts controls, or suspends use to stop a repeat.
  duties:
  - risk_classification
  - incident_response
  - lifecycle_management
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: 'Registry keeps the risk tier of each agent. Missing: the re-assessment and the decision to re-classify,
      change controls or suspend are a person''s; nothing opens a re-assessment task when an incident closes.'
  - kind: console
    id: agent_action
    coverage: partial
    note: Pause or quarantine stops the system while the review runs.
  - kind: evidence
    id: incident_record
    coverage: partial
    note: Incident rows record the event that starts the review.
  - kind: console
    id: duties_actions
    coverage: partial
    note: Re-evaluate runs the duties matrix again (flag RISK_DUTIES).
  - kind: evidence
    id: lifecycle_approval
    coverage: partial
    note: The lifecycle has a re-evaluation stage; the move needs an approver at high level.
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: a person re-assesses the risk level and decides to re-classify, adjust controls
      or suspend use.'
  evidence_needed:
  - post-incident risk review record
  verification: VERIFIED_PRIMARY
