- id: VN-TT53-2026-A5.01-01
  article_ref: Art. 5(1)
  text_vi: 'Việc tự động hóa thực hiện quyết định do hệ thống trí tuệ nhân tạo đề xuất chỉ được thực hiện
    khi đáp ứng các điều kiện sau: a) Hoạt động nghiệp vụ được ứng dụng hệ thống trí tuệ nhân tạo không
    thuộc trường hợp pháp luật quy định phải có sự xem xét, quyết định hoặc phê duyệt của con người; b)
    Mô hình đã được kiểm tra, đánh giá đạt ngưỡng chất lượng theo quy định nội bộ của đơn vị; c) Đơn vị
    đã xác định rõ ngưỡng rủi ro, tiêu chí cảnh báo và quy trình giám sát hoạt động của hệ thống trí tuệ
    nhân tạo. Đối với hệ thống trí tuệ nhân tạo có rủi ro cao, đơn vị phải thiết lập công cụ giám sát
    liên tục hoạt động của hệ thống trí tuệ nhân tạo; d) Bảo đảm khả năng can thiệp của con người theo
    quy định tại khoản 2 Điều này; đ) Kết quả vận hành của hệ thống phải được rà soát và báo cáo theo
    quy định tại khoản 6 Điều 12 Thông tư này;'
  summary_en: 'Automatic execution of an AI-proposed decision is allowed only if: the activity does not
    legally need a human decision; the model passed internal quality thresholds; risk thresholds, alert
    criteria and a monitoring process exist (high risk: continuous monitoring tool); human intervention
    is possible; results are reviewed and reported (Art. 12(6)).'
  duties:
  - pre_execution_approval
  - human_oversight
  - performance_monitoring
  - risk_management_system
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
    autonomy:
    - acts_autonomously
  addressee: bank
  control_mapping:
  - kind: monitor
    id: drift
    coverage: partial
    note: 'Continuous behaviour monitoring. Missing: the internal quality threshold (b), the written risk
      thresholds and alert criteria (c), and the check that no law demands a human decision (a) are the
      bank''s documents.'
  - kind: monitor
    id: oversight
    coverage: partial
    note: Oversight metrics.
  - kind: monitor
    id: quality
    coverage: partial
    note: Quality sampling.
  - kind: catalogue
    id: tier1_monitor
    coverage: partial
    note: Always-on rule monitor.
  - kind: console
    id: agent_action
    coverage: partial
    note: Pause, resume or retire switch stops an agent after it acts; it is not human approval before execution.
  - kind: console
    id: state_actions
    coverage: partial
    note: RUNNING (enforcement on real traffic) needs a request and a second person; the 7-day SHADOW would-block
      count shows next to the button (flag CONSOLE_STATE_ACTIONS).
  - kind: evidence
    id: predeploy_report
    coverage: partial
    note: Pre-deploy report gives GO, NO-GO or QUESTIONS from facts, readiness, required packs and duties
      (flag ONBOARD_PREDEPLOY).
  - kind: evidence
    id: launch_report
    coverage: partial
    note: 'Launch report: catch rate, false alarms, GO or NO-GO.'
  - kind: process
    id: model_validation
    coverage: partial
    note: 'Manual step: independent second-line validation that the model passes the bank''s own quality
      threshold.'
  evidence_needed:
  - written risk thresholds and alert criteria
  - continuous monitoring tool for high-risk systems
  - model test result vs internal threshold
  verification: VERIFIED_PRIMARY
  sources:
