- id: VN-TT53-2026-A5.01E-01
  article_ref: Art. 5(1)(e)
  text_vi: Bảo đảm khả năng xác định được giao dịch do hệ thống trí tuệ nhân tạo tự động thực hiện hay
    do con người thực hiện;
  summary_en: The bank must be able to tell which transactions were executed automatically by the AI system
    and which by a person.
  duties:
