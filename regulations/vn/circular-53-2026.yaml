- id: VN-TT53-2026-A20.04-01
  article_ref: Art. 20(4)
  text_vi: Đơn vị phải thiết lập bộ phận và quy trình tiếp nhận, xử lý khiếu nại liên quan đến việc sử
    dụng hệ thống trí tuệ nhân tạo; trong đó bảo đảm việc rà soát, đánh giá lại bởi con người đối với
    các quyết định tự động bị khiếu nại và sử dụng kết quả rà soát của con người làm căn cứ cuối cùng
    để giải quyết khiếu nại.
  summary_en: The bank must have a unit and process for complaints about AI use. A human must re-review
    each complained-about automated decision, and the human review is the final basis for resolving the
    complaint.
  duties:
  - right_to_human_review
  - complaint_handling
  applies_to:
    agent_class:
    - customer_facing
    - payment
    - credit_decision
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: console
    id: cases
    coverage: partial
    note: 'Case queue for human review. Missing: complaint intake and the unit; Supervisor records the human
      decision on a case but does not link a complaint to the contested decision.'
  - kind: console
    id: case_signoff
    coverage: partial
    note: Records a named human decision on a case; counts as pre-execution approval only if the agent code
      waits for it. A sign-off is a human decision that can be the final basis.
  - kind: evidence
    id: case_file
    coverage: partial
    note: Case file export can hold the facts for a report; Supervisor does not file the report.
  - kind: process
    id: complaint_handling
    coverage: partial
    note: 'Manual step: a unit and a process receive complaints about AI use; a human re-reviews each complained-about
      automated decision and the human result is final.'
  evidence_needed:
  - complaint route
  - human review record that decides the complaint
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
    title: Thông tư số 53/2026/TT-NHNN (vbpl.vn gateway, full text)
