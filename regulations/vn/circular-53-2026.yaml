- id: VN-TT53-2026-A12.06-01
  article_ref: Art. 12(6)
  text_vi: Đơn vị phải báo cáo Hội đồng quản lý cấp cao, ngân hàng mẹ về tình hình vận hành, rủi ro, sự
    cố nghiêm trọng, khiếu nại và xu hướng sai lệch của hệ thống định kỳ tối thiểu 6 tháng đối với hệ
    thống trí tuệ nhân tạo có rủi ro cao và rủi ro trung bình hoặc khi có thay đổi đáng kể của hệ thống
    trí tuệ nhân tạo có rủi ro cao.
  summary_en: At least every 6 months (and after a significant change to a high-risk system) the bank
    reports to the senior board and parent bank on operation, risk, serious incidents, complaints and
    deviation trends of high-risk and medium-risk systems.
  duties:
  - regulatory_reporting
  - governance_accountability
  - performance_monitoring
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: monitor
    id: oversight
    coverage: partial
    note: 'Oversight metrics feed the report. Missing: no six-monthly report document or schedule; complaints
      and the parent bank report are the bank''s.'
  - kind: evidence
    id: oversight_metric
    coverage: partial
    note: Daily oversight metrics.
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: Export for the report.
  - kind: evidence
    id: transparency_report
    coverage: partial
    note: Transparency report (internal variant) gives a per-agent summary.
  - kind: evidence
    id: risk_register
    coverage: partial
    note: Risk register holds the risks and their bands.
  - kind: process
    id: board_reporting
    coverage: partial
    note: 'Manual step: send the report to the senior board and the parent bank at least every 6 months
      and after a significant change of a high-risk system, covering operation, risk, serious incidents,
      complaints and deviation trends.'
  evidence_needed:
  - six-monthly board report
  verification: VERIFIED_PRIMARY
  sources:
