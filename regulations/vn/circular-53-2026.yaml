- id: VN-TT53-2026-A19.02-01
  article_ref: Art. 19(2)
  text_vi: 'Đơn vị phải xây dựng và duy trì danh mục chi tiết các thành phần phần mềm của hệ thống trí
    tuệ nhân tạo, tối thiểu bao gồm: Tên thành phần (thư viện, mô hình, tập dữ liệu huấn luyện và các
    thành phần phụ thuộc); tên nhà cung cấp hoặc nhà phát triển thành phần; phiên bản đang sử dụng; giấy
    phép sử dụng; mã kiểm tra tính toàn vẹn và xác thực nguồn gốc; thời điểm tạo lập danh mục để phục
    vụ việc truy vết và ứng phó kịp thời đối với các rủi ro, sự cố an ninh mạng.'
  summary_en: 'The bank keeps a detailed bill of materials of the AI system: libraries, models, training
    datasets and dependencies, with supplier, version, licence, integrity check value and creation date.'
  duties:
  - supply_chain_security
  - model_inventory
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: 'Agent inventory with owner, risk tier and model family. Missing: supplier names, models and training
      datasets in the list, and the creation time as a kept document; the pack covers software libraries
      from lock files.'
  - kind: evidence
    id: ai_system_record
    coverage: partial
    note: System record links the agent to the models and services it is built on.
  - kind: evidence
    id: assurance_results
    coverage: partial
    note: 'Pack sbom_cyclonedx writes a CycloneDX 1.5 list from the lock files: name, version, purl and
      SHA-256 hash; licence_allowlist and pin_hash_check add licence and pin checks.'
  - kind: process
    id: ai_bom_management
    coverage: partial
    note: 'Manual step: keep the list for models and training datasets too, with supplier, licence, integrity
      code and creation time.'
  - kind: process
    id: security_assessment
    coverage: partial
    note: 'Manual step: SBOM and AI-BOM tooling of the bank.'
  evidence_needed:
  - AI bill of materials per system
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
