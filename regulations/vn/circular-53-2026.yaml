- id: VN-TT53-2026-A9.02-01
  article_ref: Art. 9(2)
  text_vi: 'Khi xảy ra sự cố nghiêm trọng đối với hệ thống trí tuệ nhân tạo, đơn vị phải: a) Kích hoạt
    ngay cơ chế ngắt khẩn cấp, chuyển sang vận hành thủ công trong trường hợp cần thiết; b) Triển khai
    ngay biện pháp khắc phục, hạn chế thiệt hại; c) Báo cáo sự cố cho cơ quan quản lý nhà nước có thẩm
    quyền và Ngân hàng Nhà nước Việt Nam (Cục Công nghệ thông tin) theo quy định của pháp luật về trí
    tuệ nhân tạo; d) Thông báo cho khách hàng bị ảnh hưởng theo quy định của pháp luật về bảo vệ dữ liệu
    cá nhân (nếu có); đ) Lập báo cáo hoàn thành khắc phục sự cố tối thiểu bao gồm nguyên nhân, thiệt hại
    và biện pháp khắc phục.'
  summary_en: 'On a serious incident the bank must: trigger the emergency stop (go manual if needed);
    contain the damage; report to the competent authority and to SBV (IT Department) as the AI law requires;
    notify affected customers under personal data law where it applies; and write a remediation report
    with cause, damage and fix.'
  duties:
  - incident_response
  - incident_report
  - serious_incident_suspension
  - breach_notification_subject
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: console
    id: agent_action
    coverage: partial
    note: 'Pause and quarantine are the emergency stop for an agent. Missing: the reports to the authority
      and SBV, the notice to customers and the completion report; the final text sets no deadline of its
      own.'
  - kind: evidence
    id: case_file
    coverage: partial
    note: Case file export can hold the facts for a report; Supervisor does not file the report.
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: Hash-chained record of gate decisions and verdicts; the bank still owns retention and access.
  - kind: evidence
    id: incident_record
    coverage: partial
    note: Incident rows record the event, status and who closed it.
  - kind: evidence
    id: incident_clock
    coverage: partial
    note: Case clock computes the report due times of Decree 142 Art. 19 (72 h or 5 working days, then 15
      days).
  - kind: process
    id: regulator_notification
    coverage: partial
    note: 'Manual step: report to the authority and to SBV (Cục Công nghệ thông tin).'
  - kind: process
    id: incident_management
    coverage: partial
    note: 'Manual step: switch to manual operation, contain the damage, notify affected customers where
      the data law requires, and write the completion report (cause, damage, fix).'
  evidence_needed:
  - incident runbook with emergency stop
  - report to MST portal and SBV IT Department
  - remediation report
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
    title: Thông tư số 53/2026/TT-NHNN (vbpl.vn gateway, full text)
