- id: VN-TT53-2026-A13.02-01
  article_ref: Art. 13(2)
  text_vi: Kết quả đánh giá tác động phải được lập thành hồ sơ, phê duyệt bởi cấp có thẩm quyền của đơn
    vị; được rà soát, cập nhật khi có sự thay đổi về chức năng, phạm vi xử lý dữ liệu hoặc điều kiện vận
    hành của hệ thống trí tuệ nhân tạo; và lưu trữ hồ sơ trong suốt thời gian hoạt động của hệ thống.
  summary_en: The impact assessment is filed, approved by the competent level, updated when function,
    data scope or operating conditions change, and kept for the life of the system.
  duties:
  - record_keeping
  - governance_accountability
  - change_control
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_version
    coverage: partial
    note: 'Version history shows when function or operating conditions changed. Missing: the file itself
      and its approval by the competent level; no trigger from a data-scope change.'
  - kind: evidence
    id: task_record
    coverage: partial
    note: Task evidence can point to the impact assessment file (for example DES-DPIA, REV-APPROVE).
  - kind: evidence
    id: lifecycle_approval
    coverage: partial
    note: Re-evaluation stage needs an approver at high level.
  - kind: process
    id: impact_assessment_file
    coverage: partial
    note: 'Manual step: file the assessment, get the approval of the competent level, update it when function,
      data scope or conditions change, and keep it for the life of the system.'
  - kind: process
    id: board_governance
    coverage: partial
    note: 'Manual step: the competent level approves.'
  evidence_needed:
  - approved impact assessment kept and refreshed
  verification: VERIFIED_PRIMARY
  sources:
