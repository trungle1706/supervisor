- id: VN-TT53-2026-A18.04E-01
  article_ref: Art. 18(4)(e)
  text_vi: 'Trường hợp hệ thống trí tuệ nhân tạo do thuê ngoài gây thiệt hại cho khách hàng hoặc bên liên
    quan, đơn vị phải: (i) Kịp thời thực hiện các biện pháp khắc phục, bảo vệ quyền lợi của khách hàng;
    (ii) Tổ chức tiếp nhận, xử lý khiếu nại và bồi thường thiệt hại theo quy định của pháp luật và thỏa
    thuận hợp đồng.'
  summary_en: If an outsourced AI system harms a customer or a related party, the bank must remedy it
    quickly, handle complaints and pay compensation per law and contract.
  duties:
  - outsourcing_oversight
  - complaint_handling
  - incident_response
