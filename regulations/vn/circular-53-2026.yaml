- id: VN-TT53-2026-A16.03-01
  article_ref: Art. 16(3)
  text_vi: 'Việc kiểm tra, đánh giá mô hình phải tối thiểu bao gồm các nội dung sau: a) Đối với mô hình
    do đơn vị trực tiếp quản lý: (i) Sự phù hợp của dữ liệu huấn luyện và dữ liệu kiểm thử; (ii) Tính
    hợp lý của thuật toán và kiến trúc mô hình; (iii) Hiệu năng và độ chính xác của mô hình; (iv) Khả
    năng giải thích về cơ chế ra quyết định và mức độ ảnh hưởng của các yếu tố đầu vào chính đối với kết
    quả của mô hình; (v) Tính công bằng và kiểm soát nguy cơ thiên lệch; (vi) Độ ổn định và khả năng chống
    chịu của mô hình trong các điều kiện vận hành; b) Đối với mô hình do bên thứ ba cung cấp dưới dạng
    dịch vụ thông qua nền tảng hoặc giao diện lập trình ứng dụng: (i) Mục đích sử dụng, phạm vi triển
    khai và mức độ rủi ro của hệ thống; (ii) Kết quả kiểm thử hộp đen thực tế trên tập dữ liệu của đơn
    vị; (iii) Kết quả đầu ra của mô hình trong điều kiện vận hành thực tế, trừ trường hợp quy định tại
    điểm a khoản 2 Điều này; (iv) Tài liệu, thông tin, báo cáo hoặc cam kết do nhà cung cấp công bố; (v)
    Các biện pháp kiểm soát, giám sát và can thiệp của con người trong quá trình sử dụng.'
  summary_en: 'Model tests cover, for own models: data fit, algorithm and architecture, accuracy, explainability,
    fairness and bias, stability. For third-party API models: use and risk level, black-box tests on the
    bank''s data, real operating outputs, vendor documents and commitments, and human control measures.'
  duties:
  - independent_validation
  - explainability
  - bias_monitoring
  - performance_monitoring
  applies_to:
    agent_class:
    - payment
    - credit_decision
    - customer_facing
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: fairness_slices
    coverage: partial
    note: 'Outcome rates by customer segment. Missing: the explainability test, the fit of training and
      test data for own models, and the vendor documents for third-party models.'
  - kind: catalogue
    id: groundedness
    coverage: partial
    note: Grounding signal for LLM output.
  - kind: evidence
    id: launch_report
    coverage: partial
    note: Sandbox catch rate and false alarms.
  - kind: evidence
    id: assurance_results
    coverage: partial
    note: Fairness packs (bbq_vi, bold_vi, four_fifths_rule), stability packs (paraphrase_consistency, perturbation_vi)
      and black-box packs run on the bank's data when supplied.
  - kind: process
    id: model_validation
    coverage: partial
    note: 'Manual step: independent test report with each listed content item: data fit, algorithm, accuracy,
      explainability, fairness, stability; for a third-party model the black-box test on the bank''s data
      and the vendor documents.'
  evidence_needed:
  - test report covering each listed content item
