- id: VN-TT53-2026-A3.05-01
  article_ref: Art. 3(5)
  text_vi: Hệ thống trí tuệ nhân tạo phải được thiết kế bảo đảm khả năng giám sát và can thiệp của con
    người đối với hệ thống trong quá trình sử dụng
  summary_en: AI systems must be designed so that people can monitor and intervene during use, in line
    with the risk level.
  duties:
  - human_oversight
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: console
    id: agents
    coverage: partial
    note: 'Agent registry screen with the pause switch. Missing: a design record of the oversight path;
      a human step before execution exists only if the agent code waits for it.'
  - kind: console
    id: agent_action
    coverage: partial
    note: Pause, resume or retire switch stops an agent after it acts; it is not human approval before execution.
  - kind: monitor
    id: oversight
    coverage: partial
    note: Dwell time, approval rate and chain_ok metrics show whether the human step is real.
  - kind: console
    id: case_signoff
    coverage: partial
    note: Records a named human decision on a case; counts as pre-execution approval only if the agent code
      waits for it.
  - kind: console
    id: attach_view
    coverage: partial
    note: Attach view shows the plug point and the guardians that gave evidence in the last 7 days (flag
      ONBOARD_ATTACH_VIEW).
  - kind: console
    id: state_actions
    coverage: partial
    note: An agent starts in SHADOW unless its policy says otherwise; RUNNING needs a request and a second
      person (flag CONSOLE_STATE_ACTIONS).
  evidence_needed:
  - design record of the human oversight path
  verification: VERIFIED_PRIMARY
  sources:
