- id: VN-TT53-2026-A22.01-01
  article_ref: Art. 22(1)-(2)
  text_vi: 'Đơn vị lập hồ sơ liên quan đến hệ thống trí tuệ nhân tạo theo khoản 2 Điều này và báo cáo cấp có thẩm quyền của đơn vị quyết định việc đưa hệ thống trí tuệ nhân tạo vào vận hành chính thức. 2. Hồ sơ bao gồm: a) Hồ sơ phân loại rủi ro theo quy định của pháp luật về trí tuệ nhân tạo; b) Kết quả kiểm tra, đánh giá an ninh mạng; c) Kết quả kiểm tra, đánh giá mô hình; d) Kết quả đánh giá tác động của hệ thống trí tuệ nhân tạo có rủi ro cao theo quy định tại Điều 13 Thông tư này; đ) Kết quả đánh giá sự phù hợp của hệ thống trí tuệ nhân tạo có rủi ro cao theo quy định của pháp luật về trí tuệ nhân tạo; e) Kế hoạch vận hành an toàn, bao gồm giám sát, bảo đảm hoạt động liên tục và ứng phó sự cố; g) Kết quả đánh giá đáp ứng điều kiện triển khai đối với hệ thống trí tuệ nhân tạo ra quyết định trong các hoạt động nghiệp vụ theo quy định tại Điều 20 Thông tư này; h) Báo cáo về nguồn nhân lực triển khai và quản lý hệ thống trí tuệ nhân tạo theo quy định tại Điều 21 Thông tư này; i) Điều kiện dừng và khôi phục hệ thống.'
  summary_en: 'Before go-live the bank prepares a dossier and the competent level decides. The dossier holds: risk classification file; cyber test result; model test result; impact assessment (high risk); conformity result (high risk); safe-operation plan (monitoring, continuity, incident response); Art. 20 readiness; staffing report; stop and recovery conditions.'
  duties:
  - risk_management_system
  - conformity_assessment
  - independent_validation
  - governance_accountability
  applies_to: *id004
  addressee: bank
  control_mapping:
  - kind: evidence
    id: launch_report
    coverage: partial
    note: 'launch report: catch rate, false alarms, GO or NO-GO'
  - kind: evidence
    id: onboard_plan
    coverage: partial
    note: plan and playbook
  - kind: evidence
    id: handover
    coverage: partial
    note: operate handover
  - *id008
  - kind: process
    id: conformity_assessment_file
    coverage: none
    note: conformity result
  evidence_needed:
  - go-live dossier with the nine parts
  - decision record of the competent level
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: The onboarding launch report can feed parts of the dossier. It does not replace the cyber test, the model validation or the conformity result.
  status: issued
- id: VN-TT53-2026-A24-01
  article_ref: Art. 24
  text_vi: Các hệ thống trí tuệ nhân tạo được triển khai đưa vào vận hành chính thức trước ngày Thông tư này có hiệu lực thi hành thì phải tuân thủ các quy định về bảo đảm an toàn, quản lý rủi ro và điều kiện triển khai quy định tại Chương II, Chương III, Chương IV Thông tư này kể từ ngày 01 tháng 03 năm 2027.
  summary_en: AI systems officially in operation before 2026-11-15 must meet Chapters II (safety), III (risk management) and IV (deployment conditions) from 2027-03-01.
  duties:
  - risk_management_system
  - lifecycle_management
  applies_to: *id004
  addressee: bank
  control_mapping:
  - *id007
  - *id006
  - kind: evidence
    id: coverage_rows
    coverage: partial
    note: capability coverage per agent shows gaps
  evidence_needed:
  - gap list per running AI system against Chapters II-IV
  - plan to close gaps by 2027-03-01
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: Art. 14 (2027-01-01), Art. 6(1)(b) (2027-09-01) and Art. 21 (2027-09-01) keep their own start dates (Art. 23).
  status: issued
  dates:
    compliance_deadline:
      date: '2027-03-01'
      source: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
      verification: VERIFIED_PRIMARY
      note: Art. 24.
