- id: VN-TT53-2026-A15.05B-01
  article_ref: Art. 15(5)(b)
  text_vi: Khi hệ thống trí tuệ nhân tạo không còn sử dụng, đơn vị phải thực hiện quy trình ngừng hoạt
    động an toàn, bao gồm việc xóa (sau khi thực hiện việc lưu trữ dữ liệu theo quy định của pháp luật)
    hoặc vô hiệu hóa an toàn hoặc cô lập dữ liệu, mô hình, cấu hình và các thành phần liên quan thuộc
    phạm vi quản lý, kiểm soát của đơn vị nhằm ngăn chặn rò rỉ dữ liệu hoặc khôi phục trái phép;
  summary_en: 'When a system is retired the bank follows a safe shutdown: delete (after legal archiving),
    disable or isolate data, model, configuration and related parts to stop leaks or unlawful restore.'
  duties:
  - lifecycle_management
  - retention
  - data_minimisation
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: console
    id: agent_action
    coverage: partial
    note: 'Retire action in the console marks an agent retired. Missing: deleting data, models and configuration,
      and the vendor-side deletion (c), are the bank''s job; Supervisor stops the agent and records the
      tasks.'
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: Agent inventory with owner, risk tier and model family.
  - kind: evidence
    id: task_record
    coverage: partial
    note: Tasks RET-ARCHIVE (archive case files and evidence export) and RET-ACCESS (remove the agent identity
      and tool access).
  - kind: process
    id: retirement_procedure
    coverage: partial
    note: 'Manual step: after legal archiving, delete or isolate data, model, configuration and related
      parts; ask the vendor to do the same for data it holds.'
  - kind: process
    id: records_retention
    coverage: partial
    note: 'Manual step: archive before deletion.'
  evidence_needed:
  - retirement checklist with data and credential cleanup
  verification: VERIFIED_PRIMARY
  sources:
