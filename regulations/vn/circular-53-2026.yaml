  - kind: catalogue
    id: proxy_log
    coverage: partial
    note: proxy log gives the bank its own record of vendor model calls
  - kind: catalogue
    id: otlp_ingest
    coverage: partial
    note: trace ingest supports the monitoring-data clause
  - *id006
  evidence_needed:
  - contract checklist against the eight clauses
  - vendor audit report or certificate on file
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  status: issued
