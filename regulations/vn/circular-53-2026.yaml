  - kind: evidence
    id: agent_registry
    coverage: partial
    note: 'Agent inventory with owner, risk tier and model family. Missing: the written lifecycle procedure,
      the design-phase hazard analysis (Art. 15(2)(a)) and the training data governance (b) are the bank''s.'
  - kind: evidence
    id: agent_version
    coverage: partial
    note: Version history.
  - kind: evidence
    id: handover
    coverage: partial
    note: Operate handover.
  - kind: console
    id: agent_action
    coverage: partial
    note: Retire action ends the use of an agent in Supervisor.
  - kind: evidence
    id: lifecycle_approval
    coverage: partial
    note: Seven stages from initiation to retirement; each move is a request, a second person and a move.
  - kind: evidence
    id: task_record
    coverage: partial
    note: Tasks per stage (for example INI-RISKS, DES-CONTROLS, VAL-SECOND, OPS-REVIEW, RET-ARCHIVE).
  - kind: console
    id: workflow_actions
    coverage: partial
