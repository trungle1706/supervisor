- id: VN-TT53-2026-A20.05-01
  article_ref: Art. 20(5)
  text_vi: Đối với các hệ thống trí tuệ nhân tạo tự động ra quyết định có ảnh hưởng trực tiếp đến trách
    nhiệm pháp lý, nghĩa vụ tài chính hoặc việc tiếp cận, sử dụng sản phẩm, dịch vụ của khách hàng, đơn
    vị phải có biện pháp lưu trữ thông tin về cơ sở và các yếu tố chính dẫn đến quyết định đó
  summary_en: For automated decisions that directly affect a customer's legal liability, financial duties
    or access to products or services, the bank must keep the basis and main factors of the decision,
    to give an explanation when the customer asks. No source code, detailed algorithm or trade secret
    need be shown. For fraud, AML or cyber decisions only a reason suited to risk review is needed.
  duties:
  - explainability
  - record_keeping
  - automated_decision_rights
  applies_to:
    agent_class:
    - payment
    - credit_decision
    - customer_facing
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: case_file
    coverage: partial
    note: 'Case file export can hold the facts for a report; Supervisor does not file the report. Missing:
      the main factors of a decision as a stored field: the chain keeps hashes and masked excerpts, so the
      bank''s decision system must keep them.'
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: Hash-chained record of gate decisions and verdicts; the bank still owns retention and access.
  - kind: evidence
    id: verdict_log
    coverage: partial
    note: Verdicts keep model and reason.
  - kind: process
    id: customer_explanation
    coverage: partial
    note: 'Manual step: answer the customer on request with the main factors, without source code, parameters
      or trade secrets; for fraud and AML decisions give only the reason that fits.'
  - kind: process
    id: customer_disclosure
    coverage: partial
    note: 'Manual step: wording of the explanation.'
  evidence_needed:
  - decision record with main factors
  - explanation procedure for customer requests
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
    title: Thông tư số 53/2026/TT-NHNN (vbpl.vn gateway, full text)
