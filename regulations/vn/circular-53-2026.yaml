- id: VN-TT53-2026-A13.01-01
  article_ref: Art. 13(1)
  text_vi: 'Đối với hệ thống trí tuệ nhân tạo có rủi ro cao, đơn vị phải thực hiện đánh giá tác động của
    hệ thống trí tuệ nhân tạo trước khi triển khai, tối thiểu bao gồm các nội dung sau: a) Mô tả mục đích,
    phạm vi và nguyên lý hoạt động của hệ thống; mô tả cơ chế bảo đảm khả năng giám sát, can thiệp của
    con người; b) Phân tích rủi ro tiềm ẩn đối với hoạt động nghiệp vụ; rủi ro an ninh mạng đối với hệ
    thống thông tin; quyền lợi của khách hàng và các bên liên quan (trong đó đánh giá cụ thể tác động
    về tính công bằng, sự minh bạch, khả năng giải thích và nguy cơ phân biệt đối xử đối với khách hàng);
    c) Đánh giá tác động xử lý dữ liệu cá nhân theo quy định của pháp luật (nếu có); d) Xác định các biện
    pháp kiểm soát và giảm thiểu rủi ro; đ) Xây dựng kế hoạch giám sát và phương án ứng phó sự cố trong
    quá trình vận hành.'
  summary_en: 'Before deploying a high-risk system the bank does an impact assessment: purpose, scope,
    how it works and how human oversight works; risks to operations, cybersecurity and customer rights,
    with explicit analysis of fairness, transparency, explainability and discrimination; a personal-data
    impact assessment where relevant; controls; monitoring and incident plans.'
  duties:
  - risk_management_system
  - dpia
  - bias_monitoring
  - explainability
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: onboard_profile
    coverage: partial
    note: 'Profile covers purpose, capabilities and weak spots. Missing: the assessment document itself,
      in particular the analysis of fairness, transparency, explainability and discrimination risk and the
      personal data part.'
  - kind: evidence
    id: onboard_plan
    coverage: partial
    note: Plan covers controls and thresholds.
  - kind: evidence
    id: launch_report
    coverage: partial
    note: Launch sandbox results.
  - kind: catalogue
    id: fairness_slices
    coverage: partial
    note: Outcome rates by customer segment.
  - kind: evidence
    id: assurance_results
    coverage: partial
    note: Fairness and red-team packs give measured results for the risk analysis.
  - kind: evidence
    id: predeploy_report
    coverage: partial
    note: Pre-deploy report collects facts and open questions (flag ONBOARD_PREDEPLOY).
  - kind: process
    id: impact_assessment_file
    coverage: partial
    note: 'Manual step: write the impact assessment with its five parts and keep it as a file.'
  - kind: process
    id: dpia_document
    coverage: partial
    note: 'Manual step: personal data impact assessment where personal data is processed.'
  evidence_needed:
  - impact assessment document with the five required parts
  verification: VERIFIED_PRIMARY
  sources:
