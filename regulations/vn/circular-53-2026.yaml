- id: VN-TT53-2026-A6.02-01
  article_ref: Art. 6(2)
  text_vi: 'Đơn vị phải thiết lập cơ chế giám sát hiệu năng và hành vi của hệ thống trí tuệ nhân tạo,
    tối thiểu bao gồm: việc phát hiện các dấu hiệu bất thường như sai lệch đầu ra, suy giảm chất lượng,
