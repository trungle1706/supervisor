- id: VN-TT53-2026-A20.02-01
  article_ref: Art. 20(2)
  text_vi: Đơn vị có trách nhiệm cung cấp thông tin hướng dẫn sử dụng và nêu rõ các giới hạn của hệ thống
    trí tuệ nhân tạo để khách hàng biết trước khi thoả thuận sử dụng dịch vụ của đơn vị.
  summary_en: Before the customer agrees to the service, the bank gives usage guidance and states the
    limits of the AI system.
  duties:
  - consumer_information
  - ai_disclosure
  applies_to:
    agent_class:
    - customer_facing
    - payment
    - credit_decision
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: transparency_report
    coverage: partial
    note: 'Transparency report (customer variant) is a plain-language statement of what the assistant does
      and its limits. Missing: showing the text to the customer in the channel before agreement; the wording
      is approved by the bank.'
  - kind: console
    id: transparency
    coverage: partial
    note: Console page that builds the report per agent.
  - kind: process
    id: customer_disclosure
    coverage: partial
    note: 'Manual step: show usage guidance and limits to the customer before the customer agrees to the
      service.'
  evidence_needed:
  - customer-facing description of AI use and limits
  verification: VERIFIED_PRIMARY
  sources:
