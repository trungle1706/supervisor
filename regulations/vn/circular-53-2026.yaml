    id: case_file
    coverage: partial
    note: 'Case file export can hold the facts for a report; Supervisor does not file the report. Missing:
      the remedy and compensation procedure and the vendor claim; Supervisor holds the facts, not the payment.'
  - kind: evidence
    id: incident_record
    coverage: partial
    note: Incident rows record the harm event and who closed it.
  - kind: process
    id: vendor_management
    coverage: partial
    note: 'Manual step: claim the fix and the cost from the vendor under the contract.'
  - kind: process
    id: complaint_handling
    coverage: partial
    note: 'Manual step: receive and handle complaints and pay compensation.'
  evidence_needed:
  - remedy and compensation procedure
  - case file for the affected customer
  verification: VERIFIED_PRIMARY
