  primary_text_fetched: true
  last_checked: '2026-10-15'
  notes: 'SIGNED, NOT YET EFFECTIVE on 2026-10-15 (status issued). This replaces the SBV consultation
    draft reported by Baker McKenzie (Apr 2026) and the press in Aug 2026; the planned draft file was
    not written. Full text of Art. 1-25 read from the vbpl.vn gateway copy. Scope: credit institutions,
    foreign bank branches, payment intermediaries, mobile money providers, credit information companies,
    VAMC, the State Printing Mill, Deposit Insurance of Vietnam (Art. 1(2)), for AI that decides or supports
    decisions in services to customers (Art. 1(1)(a)). Differences between the reported draft duties and
    the signed text: the 24-hour incident report and 5-working-day remediation report are NOT in the signed
    text (Art. 9 refers to the AI law; Decree 142 Art. 19 gives 72 hours or 5 working days, then 15 days).
    ''Human review of disputed decisions'' is Art. 20(4); ''AI disclosure'' is Art. 20(3); ''explanation''
    is Art. 20(5); ''annual staff capability review'' is Art. 21(4); ''bias monitoring'' is Art. 6(2),
    16(3)(a)(v) and 17. Risk thresholds that complete Decision 33: Art. 4(2). The Circular gives no fine
    amounts. Not legal advice; bank counsel must confirm.'
obligations:
- id: VN-TT53-2026-A3.03-01
  article_ref: Art. 3(3)
  text_vi: Trí tuệ nhân tạo không thay thế thẩm quyền và trách nhiệm của con người. Đơn vị chịu trách
    nhiệm trước pháp luật và khách hàng đối với mọi quyết định, hoặc hỗ trợ ra quyết định do hệ thống
    trí tuệ nhân tạo đưa ra mà đơn vị dựa vào đó để cung cấp dịch vụ cho khách hàng. Đơn vị không được
    viện dẫn các lý do liên quan đến đặc tính kỹ thuật, tính tự chủ của hệ thống trí tuệ nhân tạo hoặc
    kết quả do bên thứ ba cung cấp để từ chối, miễn trừ hoặc giảm nhẹ trách nhiệm pháp lý, trách nhiệm
    quản lý và trách nhiệm bồi thường thiệt hại, ngoại trừ trường hợp được miễn trừ theo quy định của
    pháp luật.
  summary_en: AI does not replace human authority. The bank is answerable to the law and to customers
    for every AI decision it relies on. It may not use the tech nature, autonomy or a third party's output
    to avoid or reduce its liability.
  duties:
  - governance_accountability
  - outsourcing_oversight
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: console
    id: agents
    coverage: partial
    note: 'Agent registry screen with the pause switch; every agent has an owner. Missing: the bank''s liability
      stance in contracts and the accountability decision; Supervisor shows owners, not liability.'
  - kind: evidence
    id: ai_system_record
    coverage: partial
    note: AI system record names the owner, the team and what the system is built on.
  - kind: process
    id: board_governance
    coverage: partial
    note: 'Manual step: the board or committee names the accountable owner of each AI system.'
  - kind: process
    id: vendor_management
    coverage: partial
    note: 'Manual step: contracts with AI vendors must not shift the bank''s liability to the vendor.'
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: counsel confirms scope (Art. 1(1)(a)) and reviews contract wording.'
  evidence_needed:
  - named accountable owner per AI system
  - vendor contracts that do not shift liability away from the bank
  verification: VERIFIED_PRIMARY
