  notes: 'SIGNED, NOT YET EFFECTIVE on 2026-10-15 (status issued). This replaces the SBV consultation draft reported by Baker McKenzie (Apr 2026) and the press in Aug 2026; the planned draft file was not written. Full text of Art. 1-25 read from the vbpl.vn gateway copy. Scope: credit institutions, foreign bank branches, payment intermediaries, mobile money providers, credit information companies, VAMC, the State Printing Mill, Deposit Insurance of Vietnam (Art. 1(2)), for AI that decides or supports decisions in services to customers (Art. 1(1)(a)). Differences between the reported draft duties and the signed text: the 24-hour incident report and 5-working-day remediation report are NOT in the signed text (Art. 9 refers to the AI law; Decree 142 Art. 19 gives 72 hours or 5 working days, then 15 days). ''Human review of disputed decisions'' is Art. 20(4); ''AI disclosure'' is Art. 20(3); ''explanation'' is Art. 20(5); ''annual staff capability review'' is Art. 21(4); ''bias monitoring'' is Art. 6(2), 16(3)(a)(v) and 17. Risk thresholds that complete Decision 33: Art. 4(2). The Circular gives no fine amounts. Not legal advice; bank counsel must confirm.'
obligations:
- id: VN-TT53-2026-A3.03-01
  article_ref: Art. 3(3)
  text_vi: Trí tuệ nhân tạo không thay thế thẩm quyền và trách nhiệm của con người. Đơn vị chịu trách nhiệm trước pháp luật và khách hàng đối với mọi quyết định, hoặc hỗ trợ ra quyết định do hệ thống trí tuệ nhân tạo đưa ra mà đơn vị dựa vào đó để cung cấp dịch vụ cho khách hàng. Đơn vị không được viện dẫn các lý do liên quan đến đặc tính kỹ thuật, tính tự chủ của hệ thống trí tuệ nhân tạo hoặc kết quả do bên thứ ba cung cấp để từ chối, miễn trừ hoặc giảm nhẹ trách nhiệm pháp lý, trách nhiệm quản lý và trách nhiệm bồi thường thiệt hại, ngoại trừ trường hợp được miễn trừ theo quy định của pháp luật.
  summary_en: AI does not replace human authority. The bank is answerable to the law and to customers for every AI decision it relies on. It may not use the tech nature, autonomy or a third party's output to avoid or reduce its liability.
  duties:
  - governance_accountability
  - outsourcing_oversight
  applies_to: &id004
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - &id005
    kind: console
    id: agents
    coverage: partial
    note: agent registry screen with the pause switch
  - &id008
    kind: process
    id: board_governance
    coverage: none
    note: board or committee oversight of AI
  - &id018
    kind: process
    id: vendor_management
    coverage: none
    note: contract, audit and exit plan with the AI vendor
  - &id006
    kind: process
    id: legal_review
    coverage: none
    note: bank counsel confirms scope and reading
  evidence_needed:
  - named accountable owner per AI system
  - vendor contracts that do not shift liability away from the bank
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: Applies to AI that decides or supports decisions in the bank's services to customers (Art. 1(1)(a)).
  status: issued
- id: VN-TT53-2026-A3.05-01
  article_ref: Art. 3(5)
  text_vi: Hệ thống trí tuệ nhân tạo phải được thiết kế bảo đảm khả năng giám sát và can thiệp của con người đối với hệ thống trong quá trình sử dụng
  summary_en: AI systems must be designed so that people can monitor and intervene during use, in line with the risk level.
  duties:
  - human_oversight
  applies_to: *id004
  addressee: bank
  control_mapping:
  - *id005
  - &id010
    kind: console
    id: agent_action
    coverage: partial
    note: pause, resume or retire switch stops an agent after it acts; it is not human approval before execution
  - &id014
    kind: monitor
    id: oversight
    coverage: partial
    note: dwell time, approval rate and chain_ok metrics show whether the human step is real
  - &id009
    kind: console
    id: case_signoff
    coverage: partial
    note: records a named human decision on a case; counts as pre-execution approval only if the agent code waits for it
  evidence_needed:
  - design record of the human oversight path
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  status: issued
- id: VN-TT53-2026-A4.01-01
  article_ref: Art. 4(1)
  text_vi: Trước khi triển khai hệ thống trí tuệ nhân tạo, đơn vị phải thực hiện phân loại hệ thống trí tuệ nhân tạo theo mức độ rủi ro cao, trung bình, thấp
  summary_en: Before deployment the bank classifies each AI system as high, medium or low risk under the AI law and Art. 4(2).
  duties:
  - risk_classification
  applies_to: *id004
  addressee: bank
  control_mapping:
  - &id007
    kind: evidence
    id: agent_registry
    coverage: partial
    note: agent inventory with owner, risk tier and model family
  - kind: evidence
    id: onboard_profile
    coverage: partial
    note: onboarding profile proposes a Decision 33 class and a risk tier; the bank approves
  - *id006
  evidence_needed:
  - classification record before go-live
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  status: issued
- id: VN-TT53-2026-A4.02A-01
  article_ref: Art. 4(2)(a)
  text_vi: 'Đối với hệ thống trí tuệ nhân tạo tự động thực hiện giao dịch điện tử trong hoạt động ngân hàng, được xác định là hệ thống trí tuệ nhân tạo có rủi ro cao nếu có thực hiện tối thiểu một trong các loại giao dịch sau: (i) Giao dịch thanh toán của khách hàng cá nhân có giá trị lớn hơn 10 triệu đồng hoặc có tổng giá trị giao dịch trong một ngày đối với một khách hàng do hệ thống trí tuệ nhân tạo tự động thực hiện lớn hơn 20 triệu đồng; (ii) Giao dịch thanh toán của khách hàng tổ chức có giá trị lớn hơn 50 triệu đồng hoặc có tổng giá trị giao dịch trong một ngày đối với một khách hàng do hệ thống trí tuệ nhân tạo tự động thực hiện lớn hơn 100 triệu đồng;'
  summary_en: 'An AI system that auto-executes e-transactions is high risk if it executes at least one of: a personal customer payment over 10 million VND (or over 20 million VND a day per customer), or an organisation payment over 50 million VND (or over 100 million VND a day per customer).'
  duties:
  - risk_classification
  - transaction_limits
  applies_to: &id011
    agent_class:
    - payment
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: single_limit
    coverage: partial
    note: single transfer limit
  - kind: catalogue
    id: daily_aggregate
    coverage: partial
    note: daily aggregate
  - kind: rule
    id: PAY-02
    coverage: partial
    note: demo limit 100 million VND is above the 10 million personal line
  - kind: rule
    id: PAY-03
    coverage: partial
    note: demo daily rule 150 million VND is above the 20 million personal line
  - *id007
  evidence_needed:
  - transfer value distribution per agent
  - classification record
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: This is the SBV 'high value' that Decision 33 Appendix IV entry 1 leaves open. The thresholds are for the AI-executed transaction types; the Decision's other two conditions (can approve by itself, no human check before execution) still apply.
  status: issued
- id: VN-TT53-2026-A4.02B-01
  article_ref: Art. 4(2)(b)
  text_vi: Đối với hệ thống trí tuệ nhân tạo tự động quyết định cấp tín dụng, được xác định là hệ thống trí tuệ nhân tạo có rủi ro cao nếu có xử lý khoản cấp tín dụng có giá trị từ 50 triệu đồng trở lên.
  summary_en: An AI system that auto-decides credit is high risk if it processes credit of 50 million VND or more.
  duties:
  - risk_classification
  applies_to: &id013
    agent_class:
    - credit_decision
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: rule
    id: CRD-03
    coverage: partial
    note: pre-qualification amount limit
  - *id007
  - *id006
  evidence_needed:
  - loan size distribution per agent
  - classification record
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: Note the Circular says 'processes' credit of 50 million or more, a wide trigger. Decision 33 entry 2 still needs the final-decision and no-independent-approval conditions.
  status: issued
- id: VN-TT53-2026-A4.03-01
  article_ref: Art. 4(3)
  text_vi: Kết quả phân loại hệ thống trí tuệ nhân tạo phải được phê duyệt bởi cấp có thẩm quyền của đơn vị.
  summary_en: The classification result must be approved by the bank's competent level (board, legal representative, or a person they authorise in writing). A foreign bank branch follows its parent bank.
  duties:
  - risk_classification
  - governance_accountability
  applies_to: *id004
  addressee: bank
  control_mapping:
  - *id007
  - *id008
  - *id009
  evidence_needed:
  - signed approval of each classification
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  status: issued
- id: VN-TT53-2026-A4.05-01
  article_ref: Art. 4(5)
  text_vi: 'Đơn vị phải lập danh mục hệ thống trí tuệ nhân tạo và rà soát, cập nhật danh mục tối thiểu hằng năm. Danh mục tối thiểu bao gồm các trường thông tin: tên hệ thống trí tuệ nhân tạo, mức độ rủi ro, mục đích sử dụng, nhà cung cấp, phiên bản, văn bản phê duyệt mức độ rủi ro.'
  summary_en: 'The bank keeps an AI system inventory, reviewed at least yearly, with: system name, risk level, purpose, provider, version and the approval document for the risk level.'
  duties:
  - model_inventory
  applies_to: *id004
  addressee: bank
  control_mapping:
  - *id007
  - kind: evidence
    id: agent_version
    coverage: partial
    note: version history per agent
  evidence_needed:
  - inventory with the six required fields
  - yearly review record
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: The registry covers agents known to Supervisor only. The bank must also list AI systems outside Supervisor. The registry has owner, risk tier and model family; the provider name and the approval document reference may need extra fields.
  status: issued
- id: VN-TT53-2026-A5.01-01
  article_ref: Art. 5(1)
  text_vi: 'Việc tự động hóa thực hiện quyết định do hệ thống trí tuệ nhân tạo đề xuất chỉ được thực hiện khi đáp ứng các điều kiện sau: a) Hoạt động nghiệp vụ được ứng dụng hệ thống trí tuệ nhân tạo không thuộc trường hợp pháp luật quy định phải có sự xem xét, quyết định hoặc phê duyệt của con người; b) Mô hình đã được kiểm tra, đánh giá đạt ngưỡng chất lượng theo quy định nội bộ của đơn vị; c) Đơn vị đã xác định rõ ngưỡng rủi ro, tiêu chí cảnh báo và quy trình giám sát hoạt động của hệ thống trí tuệ nhân tạo. Đối với hệ thống trí tuệ nhân tạo có rủi ro cao, đơn vị phải thiết lập công cụ giám sát liên tục hoạt động của hệ thống trí tuệ nhân tạo; d) Bảo đảm khả năng can thiệp của con người theo quy định tại khoản 2 Điều này; đ) Kết quả vận hành của hệ thống phải được rà soát và báo cáo theo quy định tại khoản 6 Điều 12 Thông tư này;'
  summary_en: 'Automatic execution of an AI-proposed decision is allowed only if: the activity does not legally need a human decision; the model passed internal quality thresholds; risk thresholds, alert criteria and a monitoring process exist (high risk: continuous monitoring tool); human intervention is possible; results are reviewed and reported (Art. 12(6)).'
  duties:
  - pre_execution_approval
  - human_oversight
  - performance_monitoring
  - risk_management_system
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
    autonomy:
    - acts_autonomously
  addressee: bank
  control_mapping:
  - kind: monitor
    id: drift
    coverage: partial
    note: continuous behaviour monitoring
  - kind: monitor
    id: oversight
    coverage: partial
    note: oversight metrics
  - kind: monitor
    id: quality
    coverage: partial
    note: quality sampling
  - kind: catalogue
    id: tier1_monitor
    coverage: partial
    note: always-on rule monitor
  - *id010
  - &id024
    kind: process
    id: model_validation
    coverage: none
    note: independent second-line model validation
  evidence_needed:
  - written risk thresholds and alert criteria
  - continuous monitoring tool for high-risk systems
  - model test result vs internal threshold
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  notes: 'High-risk status: Decision 33 Appendix IV (VN-QD33-2026) plus the thresholds in Art. 4(2) of this Circular. The continuous-monitoring duty is mandatory for high-risk systems. Supervisor provides the monitor and alert side; the bank defines the thresholds.'
  status: issued
- id: VN-TT53-2026-A5.01E-01
  article_ref: Art. 5(1)(e)
  text_vi: Bảo đảm khả năng xác định được giao dịch do hệ thống trí tuệ nhân tạo tự động thực hiện hay do con người thực hiện;
  summary_en: The bank must be able to tell which transactions were executed automatically by the AI system and which by a person.
  duties:
  - logging
  - record_keeping
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
  addressee: bank
  control_mapping:
  - &id012
    kind: evidence
    id: agent_event_log
    coverage: partial
    note: recorded tool calls and gate decisions per agent
  - &id015
    kind: evidence
    id: evidence_chain
    coverage: partial
    note: hash-chained record of gate decisions and verdicts; the bank still owns retention and access
  - kind: evidence
    id: signoff_record
    coverage: partial
    note: human decisions are recorded as sign-offs
  evidence_needed:
  - flag or lane that separates AI-executed from human-executed transactions
  verification: VERIFIED_PRIMARY
  sources:
  - *id001
  - *id002
  - *id003
  confidence: high
  status: issued
- id: VN-TT53-2026-A5.01G1-01
  article_ref: Art. 5(1)(g)(i)
  text_vi: 'Khách hàng và đơn vị phải xác lập thỏa thuận về việc cho phép hệ thống trí tuệ nhân tạo tự động thực hiện giao dịch thanh toán. Khi xác lập thỏa thuận đơn vị có trách nhiệm kiểm tra, đối chiếu, xác minh thông tin nhận biết khách hàng, bảo đảm thực hiện bởi chính chủ tài khoản thanh toán, thẻ, ví điện tử, tài khoản Tiền di động hoặc người đại diện của khách hàng cá nhân hoặc người đại diện theo pháp luật hoặc người đại diện theo ủy quyền của khách hàng tổ chức; trong trường hợp thực hiện bằng phương tiện điện tử phải kiểm tra tối thiểu bằng khớp đúng thông tin sinh trắc học kết hợp với một hình thức xác nhận khác quy định tại Thông tư số 50/2024/TT-NHNN của Thống đốc Ngân hàng Nhà nước Việt Nam quy định về an toàn, bảo mật cho việc cung cấp dịch vụ trực tuyến trong ngành Ngân hàng được sửa đổi, bổ sung bởi Thông tư số 77/2025/TT-NHNN (sau đây gọi tắt là Thông tư số 50/2024/TT-NHNN). Thỏa thuận phải xác định rõ: phạm vi giao dịch được tự động thực hiện; hạn mức theo từng giao dịch và theo ngày; thời hạn hiệu lực; điều kiện tạm dừng; quyền của khách hàng chấm dứt thỏa thuận bất kỳ thời điểm nào và trách nhiệm của đơn vị thực hiện ngay yêu cầu chấm dứt;'
  summary_en: 'Autonomous AI payments need a prior agreement with the customer. The bank must verify the customer is the account holder or a lawful representative (electronic route: biometric match plus another confirmation under Circular 50/2024/TT-NHNN). The agreement states the scope, per-transaction and daily limits, validity period, pause conditions, and the customer''s right to end it at any time with immediate effect.'
  duties:
  - consent
  - biometric_verification
  - transaction_authentication
  - transaction_limits
  - customer_confidentiality
  applies_to: *id011
  addressee: bank
  control_mapping:
  - kind: process
    id: consent_management
    coverage: none
    note: customer agreement capture and records
  - kind: process
    id: customer_disclosure
    coverage: none
    note: agreement terms
  - kind: catalogue
    id: single_limit
    coverage: partial
    note: per-transaction limit enforcement
  - kind: catalogue
    id: daily_aggregate
    coverage: partial
    note: daily limit enforcement
  - *id012
  evidence_needed:
  - signed agreement with the required fields
  - biometric plus second-factor check record at signing
  - limits in the agreement enforced at the gate
