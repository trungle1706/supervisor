  text_vi: 'Việc kiểm tra, đánh giá mô hình phải tối thiểu bao gồm các nội dung sau: a) Đối với mô hình do đơn vị trực tiếp quản lý: (i) Sự phù hợp của dữ liệu huấn luyện và dữ liệu kiểm thử; (ii) Tính hợp lý của thuật toán và kiến trúc mô hình; (iii) Hiệu năng và độ chính xác của mô hình; (iv) Khả năng giải thích về cơ chế ra quyết định và mức độ ảnh hưởng của các yếu tố đầu vào chính đối với kết quả của mô hình; (v) Tính công bằng và kiểm soát nguy cơ thiên lệch; (vi) Độ ổn định và khả năng chống chịu của mô hình trong các điều kiện vận hành; b) Đối với mô hình do bên thứ ba cung cấp dưới dạng dịch vụ thông qua nền tảng hoặc giao diện lập trình ứng dụng: (i) Mục đích sử dụng, phạm vi triển khai và mức độ rủi ro của hệ thống; (ii) Kết quả kiểm thử hộp đen thực tế trên tập dữ liệu của đơn vị; (iii) Kết quả đầu ra của mô hình trong điều kiện vận hành thực tế, trừ trường hợp quy định tại điểm a khoản 2 Điều này; (iv) Tài liệu, thông tin, báo cáo hoặc cam kết do nhà cung cấp công bố; (v) Các biện pháp kiểm soát, giám sát và can thiệp của con người trong quá trình sử dụng.'
  summary_en: 'Model tests cover, for own models: data fit, algorithm and architecture, accuracy, explainability, fairness and bias, stability. For third-party API models: use and risk level, black-box tests on the bank''s data, real operating outputs, vendor documents and commitments, and human control measures.'
  duties:
  - independent_validation
  - explainability
  - bias_monitoring
  - performance_monitoring
  applies_to:
    agent_class:
    - payment
    - credit_decision
    - customer_facing
