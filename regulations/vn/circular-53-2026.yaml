- id: VN-TT53-2026-A7.04-01
  article_ref: Art. 7(4)
  text_vi: 'Đơn vị phải thiết lập cơ chế bảo vệ dữ liệu khỏi nguy cơ rò rỉ từ hệ thống trí tuệ nhân tạo,
    tối thiểu bao gồm: a) Hạn chế và kiểm soát quyền truy cập của hệ thống trí tuệ nhân tạo vào dữ liệu
    của đơn vị theo nguyên tắc chỉ cấp quyền tối thiểu, khi cần thiết, phù hợp với đối tượng, mục đích
    sử dụng và phạm vi xử lý dữ liệu đã được phê duyệt; b) Kiểm soát quyền truy cập đối với dữ liệu huấn
    luyện, kiểm thử, vận hành của hệ thống trí tuệ nhân tạo và thông tin về cấu trúc mô hình nhằm phòng
    ngừa nguy cơ rò rỉ, lộ lọt dữ liệu.'
  summary_en: 'The bank protects data against leaks from AI systems: least-privilege access of the AI
    system to bank data, and access control over training, test and operation data and model structure
    information.'
  duties:
  - access_control
  - data_minimisation
  - sensitive_data_protection
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: approved_tools
    coverage: partial
    note: 'Tool allow-list limits what data the agent can reach. Missing: the access matrix of the agent
      and the access control over training, test and operation data and model structure (b).'
  - kind: catalogue
    id: pii_masking
    coverage: partial
    note: Masking of personal data.
  - kind: catalogue
    id: pii_bulk_read
    coverage: partial
    note: Bulk read limit.
  - kind: rule
    id: PII-02
    coverage: partial
    note: Cap of 200 applications read per hour.
  - kind: evidence
    id: facts_card
    coverage: partial
    note: Facts card lists the tables and tools an agent reads and writes with file and line, as input to
      an access matrix (flag ONBOARD_FACTS).
  - kind: evidence
    id: intake_scrub
    coverage: partial
    note: Source intake removes secrets from candidate code before any model reads it (flag ONBOARD_INTAKE).
  - kind: process
    id: access_management
    coverage: partial
    note: 'Manual step: named accounts, least-privilege grants and access reviews for the agent, training
      and test data, and model structure.'
  evidence_needed:
  - access matrix for the agent
  - bulk read alerts
  verification: VERIFIED_PRIMARY
