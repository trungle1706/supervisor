      verification: VERIFIED_PRIMARY
      note: 'Art. 23(4): Art. 21 takes effect on 2027-09-01, except for a unit that has a high-risk AI
        system (then the general date 2026-11-15 applies).'
- id: VN-TT53-2026-A22.01-01
  article_ref: Art. 22(1)-(2)
  text_vi: 'Đơn vị lập hồ sơ liên quan đến hệ thống trí tuệ nhân tạo theo khoản 2 Điều này và báo cáo
    cấp có thẩm quyền của đơn vị quyết định việc đưa hệ thống trí tuệ nhân tạo vào vận hành chính thức.
    2. Hồ sơ bao gồm: a) Hồ sơ phân loại rủi ro theo quy định của pháp luật về trí tuệ nhân tạo; b) Kết
    quả kiểm tra, đánh giá an ninh mạng; c) Kết quả kiểm tra, đánh giá mô hình; d) Kết quả đánh giá tác
    động của hệ thống trí tuệ nhân tạo có rủi ro cao theo quy định tại Điều 13 Thông tư này; đ) Kết quả
    đánh giá sự phù hợp của hệ thống trí tuệ nhân tạo có rủi ro cao theo quy định của pháp luật về trí
    tuệ nhân tạo; e) Kế hoạch vận hành an toàn, bao gồm giám sát, bảo đảm hoạt động liên tục và ứng phó
    sự cố; g) Kết quả đánh giá đáp ứng điều kiện triển khai đối với hệ thống trí tuệ nhân tạo ra quyết
    định trong các hoạt động nghiệp vụ theo quy định tại Điều 20 Thông tư này; h) Báo cáo về nguồn nhân
    lực triển khai và quản lý hệ thống trí tuệ nhân tạo theo quy định tại Điều 21 Thông tư này; i) Điều
    kiện dừng và khôi phục hệ thống.'
  summary_en: 'Before go-live the bank prepares a dossier and the competent level decides. The dossier
    holds: risk classification file; cyber test result; model test result; impact assessment (high risk);
    conformity result (high risk); safe-operation plan (monitoring, continuity, incident response); Art.
    20 readiness; staffing report; stop and recovery conditions.'
  duties:
  - risk_management_system
  - conformity_assessment
  - independent_validation
  - governance_accountability
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: launch_report
    coverage: partial
    note: 'Launch report: catch rate, false alarms, GO or NO-GO (model and cyber test results, item b and
      c in part). Missing: the dossier as one document, the impact assessment (d), the conformity result
      (đ), the staff report (h), stop and restore conditions (i) and the decision record.'
  - kind: evidence
    id: onboard_plan
    coverage: partial
    note: Plan and playbook (operation plan, item e in part).
  - kind: evidence
    id: handover
    coverage: partial
    note: Operate handover.
  - kind: evidence
    id: predeploy_report
    coverage: partial
    note: Pre-deploy report collects facts, readiness, packs and duties with pointers (flag ONBOARD_PREDEPLOY).
  - kind: evidence
    id: classification_record
    coverage: partial
    note: Decision 33 class (item a in part).
  - kind: evidence
    id: lifecycle_approval
    coverage: partial
    note: The move into deployment needs an approver.
  - kind: evidence
    id: task_record
    coverage: partial
    note: Deployment tasks (DEP-SHADOW, DEP-LAUNCH, DEP-OVERSIGHT, DEP-D33) record the steps.
  - kind: process
    id: go_live_decision
    coverage: partial
    note: 'Manual step: assemble the dossier (items a to i) and record the decision of the competent level.'
  - kind: process
    id: conformity_assessment_file
    coverage: partial
    note: 'Manual step: conformity result for a high-risk system.'
  evidence_needed:
  - go-live dossier with the nine parts
  - decision record of the competent level
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
    title: Thông tư số 53/2026/TT-NHNN (vbpl.vn gateway, full text)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: a0c9c5a93eb76c3cc517721cca67934e6ff63b3b7fb7d94c836e711b501d2dfa
    local_path: regulations/sources/VN-TT53-2026/53-2026-tt-nhnn.txt
  - url: https://thitruongtaichinhtiente.vn/nhnn-ban-hanh-quy-dinh-ve-an-toan-quan-ly-rui-ro-khi-ung-dung-ai-trong-nganh-ngan-hang-86130.html
    title: Tap chi Thi truong Tai chinh Tien te - NHNN ban hanh quy dinh ve an toan, quan ly rui ro khi
      ung dung AI (2026-10-08)
    fetched_at: '2026-10-15'
    kind: secondary
  - url: https://www.bakermckenzie.com/en/insight/publications/2026/04/vietnam-draft-circular-on-ai-deployment-in-banking
    title: 'Baker McKenzie - Vietnam: draft circular on AI deployment in banking (Apr 2026, about the
      consultation draft)'
    fetched_at: '2026-10-15'
    kind: secondary
  confidence: high
  notes: The onboarding launch report can feed parts of the dossier. It does not replace the cyber test,
    the model validation or the conformity result.
  status: issued
- id: VN-TT53-2026-A24-01
  article_ref: Art. 24
  text_vi: Các hệ thống trí tuệ nhân tạo được triển khai đưa vào vận hành chính thức trước ngày Thông
    tư này có hiệu lực thi hành thì phải tuân thủ các quy định về bảo đảm an toàn, quản lý rủi ro và điều
    kiện triển khai quy định tại Chương II, Chương III, Chương IV Thông tư này kể từ ngày 01 tháng 03
    năm 2027.
  summary_en: AI systems officially in operation before 2026-11-15 must meet Chapters II (safety), III
    (risk management) and IV (deployment conditions) from 2027-03-01.
  duties:
  - risk_management_system
  - lifecycle_management
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: 'Agent inventory with owner, risk tier and model family. Missing: the decision on which systems
      were in operation before 2026-11-15 and the closure plan itself; coverage of a duty is a Supervisor
      control, not proof the duty is met.'
  - kind: evidence
    id: coverage_rows
    coverage: partial
    note: Capability coverage per agent shows gaps.
  - kind: evidence
    id: duties_step
    coverage: partial
    note: Duties step lists each duty of a running system with applies and coverage, and the due date (flag
      CONSOLE_REGISTER_DUTIES).
  - kind: evidence
    id: duties_gap
    coverage: partial
    note: Gap closure score, risk line and weekly reminder for duties due within 30 days (flag RISK_DUTIES).
  - kind: console
    id: duties_actions
    coverage: partial
    note: Close, waive with a second person, and re-evaluate (flag RISK_DUTIES).
  - kind: evidence
    id: risk_register
    coverage: partial
    note: Risk line 'duties gap' per system.
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: counsel decides which systems were in official operation before 2026-11-15 and approves
      the plan to close gaps by 2027-03-01.'
  evidence_needed:
  - gap list per running AI system against Chapters II-IV
  - plan to close gaps by 2027-03-01
  verification: VERIFIED_PRIMARY
  sources:
