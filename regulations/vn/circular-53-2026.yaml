- id: VN-TT53-2026-A5.02-01
  article_ref: Art. 5(2)
  text_vi: 'Đơn vị phải thiết lập cơ chế giám sát và bảo đảm khả năng can thiệp của con người phù hợp
    với mức độ rủi ro của hệ thống trí tuệ nhân tạo, trong đó: a) Bộ phận thực hiện giám sát hệ thống
    trí tuệ nhân tạo phải có đầy đủ quyền hạn và năng lực để: (i) Ghi đè hoặc điều chỉnh, tạm dừng quyết
    định của hệ thống trí tuệ nhân tạo hoặc kích hoạt cơ chế ngắt khẩn cấp để dừng hoặc cô lập hệ thống
    trong trường hợp cần thiết; (ii) Can thiệp trong các tình huống cần thiết nhằm bảo đảm an toàn hoạt
    động nghiệp vụ, quyền lợi của khách hàng và hoạt động của các hệ thống thông tin; b) Mọi hoạt động
    can thiệp, điều chỉnh hoặc ghi đè quyết định của hệ thống trí tuệ nhân tạo phải được ghi nhận đầy
    đủ, tối thiểu bao gồm: nội dung thực hiện, thời gian thực hiện, người thực hiện, lý do can thiệp.'
  summary_en: 'The bank sets up supervision and human intervention suited to the risk level. The supervising
    unit must be able to override, adjust or pause AI decisions, or trigger an emergency stop to halt
    or isolate the system. Every intervention is recorded: what, when, who, why.'
  duties:
  - human_oversight
  - logging
  - serious_incident_suspension
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: console
    id: agents
    coverage: partial
    note: 'Agent registry screen with the pause switch. Missing: a reason is required for quarantine and
      release but optional for pause; overriding an AI decision before it runs depends on agent code; the
      stop test is not recorded.'
  - kind: console
    id: agent_action
    coverage: partial
    note: Pause, resume, quarantine and release are the emergency stop and isolation; each writes a chain
      record with person, time and state.
  - kind: console
    id: case_signoff
    coverage: partial
    note: Records a named human decision on a case; counts as pre-execution approval only if the agent code
      waits for it.
  - kind: evidence
    id: signoff_record
    coverage: partial
    note: Records what was decided, by whom, when.
  - kind: monitor
    id: oversight
    coverage: partial
    note: Dwell time, approval rate and chain_ok metrics show whether the human step is real.
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: Hash-chained record of gate decisions and verdicts; the bank still owns retention and access.
  - kind: evidence
    id: guardian_off_approval
    coverage: partial
    note: Switching a guardian off needs a reason and, on production or high-risk systems, a second person
      (flag CONSOLE_STATE_ACTIONS).
  - kind: process
    id: emergency_stop_drill
    coverage: partial
    note: 'Manual step: test the emergency stop and the manual fallback on a schedule and keep the result.'
  evidence_needed:
  - tested emergency stop
  - intervention log with action, time, person, reason
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
    title: Thông tư số 53/2026/TT-NHNN (vbpl.vn gateway, full text)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: a0c9c5a93eb76c3cc517721cca67934e6ff63b3b7fb7d94c836e711b501d2dfa
    local_path: regulations/sources/VN-TT53-2026/53-2026-tt-nhnn.txt
  - url: https://thitruongtaichinhtiente.vn/nhnn-ban-hanh-quy-dinh-ve-an-toan-quan-ly-rui-ro-khi-ung-dung-ai-trong-nganh-ngan-hang-86130.html
    title: Tap chi Thi truong Tai chinh Tien te - NHNN ban hanh quy dinh ve an toan, quan ly rui ro khi
      ung dung AI (2026-10-08)
    fetched_at: '2026-10-15'
    kind: secondary
  - url: https://www.bakermckenzie.com/en/insight/publications/2026/04/vietnam-draft-circular-on-ai-deployment-in-banking
    title: 'Baker McKenzie - Vietnam: draft circular on AI deployment in banking (Apr 2026, about the
      consultation draft)'
    fetched_at: '2026-10-15'
    kind: secondary
  confidence: high
  notes: The pause, resume and retire switch is the emergency stop. The chain and sign-off records give
    the intervention log. The pause switch does not by itself give 'override or adjust' of a single decision;
    that needs a per-decision review path.
  status: issued
- id: VN-TT53-2026-A5.03-01
  article_ref: Art. 5(3)
  text_vi: Nhân sự tham gia giám sát, kiểm soát và can thiệp đối với hệ thống trí tuệ nhân tạo phải được
    đào tạo và có năng lực phù hợp
  summary_en: Staff who supervise, control and intervene must be trained and competent to spot deviation
