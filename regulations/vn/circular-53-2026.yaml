  notes: This is the SBV 'high value' that Decision 33 Appendix IV entry 1 leaves open. The thresholds
    are for the AI-executed transaction types; the Decision's other two conditions (can approve by itself,
    no human check before execution) still apply.
  status: issued
- id: VN-TT53-2026-A4.02B-01
  article_ref: Art. 4(2)(b)
  text_vi: Đối với hệ thống trí tuệ nhân tạo tự động quyết định cấp tín dụng, được xác định là hệ thống
    trí tuệ nhân tạo có rủi ro cao nếu có xử lý khoản cấp tín dụng có giá trị từ 50 triệu đồng trở lên.
  summary_en: An AI system that auto-decides credit is high risk if it processes credit of 50 million
    VND or more.
  duties:
  - risk_classification
  applies_to:
    agent_class:
    - credit_decision
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: rule
    id: CRD-03
    coverage: partial
    note: 'Pre-qualification amount limit. Missing: Supervisor sees only the amounts that pass its gate;
      ''processes credit'' of 50 million or more is wider than the pre-qualification rule.'
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: Registry keeps the risk tier of each agent.
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: Recorded tool calls with amounts give the loan size distribution per agent.
  - kind: evidence
    id: classification_record
    coverage: partial
    note: Decision 33 classification rows record the class the bank decided.
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: counsel reads ''processes credit of 50 million or more'' (a wide trigger) against
      Decision 33 entry 2.'
  evidence_needed:
  - loan size distribution per agent
  - classification record
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
