  text_vi: 'Đối với hệ thống trí tuệ nhân tạo có rủi ro cao, đơn vị phải thực hiện đánh giá tác động của hệ thống trí tuệ nhân tạo trước khi triển khai, tối thiểu bao gồm các nội dung sau: a) Mô tả mục đích, phạm vi và nguyên lý hoạt động của hệ thống; mô tả cơ chế bảo đảm khả năng giám sát, can thiệp của con người; b) Phân tích rủi ro tiềm ẩn đối với hoạt động nghiệp vụ; rủi ro an ninh mạng đối với hệ thống thông tin; quyền lợi của khách hàng và các bên liên quan (trong đó đánh giá cụ thể tác động về tính công bằng, sự minh bạch, khả năng giải thích và nguy cơ phân biệt đối xử đối với khách hàng); c) Đánh giá tác động xử lý dữ liệu cá nhân theo quy định của pháp luật (nếu có); d) Xác định các biện pháp kiểm soát và giảm thiểu rủi ro; đ) Xây dựng kế hoạch giám sát và phương án ứng phó sự cố trong quá trình vận hành.'
  summary_en: 'Before deploying a high-risk system the bank does an impact assessment: purpose, scope, how it works and how human oversight works; risks to operations, cybersecurity and customer rights, with explicit analysis of fairness, transparency, explainability and discrimination; a personal-data impact assessment where relevant; controls; monitoring and incident plans.'
