  - url: https://www.bakermckenzie.com/en/insight/publications/2026/04/vietnam-draft-circular-on-ai-deployment-in-banking
    title: 'Baker McKenzie - Vietnam: draft circular on AI deployment in banking (Apr 2026, about the
      consultation draft)'
    fetched_at: '2026-10-15'
    kind: secondary
