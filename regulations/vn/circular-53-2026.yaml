- id: VN-TT53-2026-A10.01-01
  article_ref: Art. 10(1)
  text_vi: 'Hệ thống trí tuệ nhân tạo phải được cấu hình để ghi nhật ký các sự kiện trong quá trình vận hành, tối thiểu bao gồm: a) Thời gian, hệ thống, người dùng thực hiện các giao dịch hoặc tác vụ; b) Thông tin về dữ liệu đầu vào và kết quả đầu ra của hệ thống, kèm theo thông tin về phiên bản mô hình, cấu hình hoặc câu lệnh (nếu có) bảo đảm đủ để truy xuất, kiểm tra và tái lập quá trình xử lý khi cần thiết; c) Các trường hợp kết quả nằm ngoài phạm vi hoạt động dự định hoặc có độ tin cậy thấp; d) Các sự kiện liên quan đến lỗi của hệ thống hoặc cảnh báo sự cố an ninh mạng.'
  summary_en: 'AI systems must be set up to log: time, system and user for each transaction or task; inputs and outputs with model version, configuration or prompt (enough to trace and reproduce); out-of-scope or low-confidence results; system errors and cyber alerts.'
