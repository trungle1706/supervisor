- id: VN-TT53-2026-A15.01-01
  article_ref: Art. 15(1)
  text_vi: Đơn vị phải thiết lập, thực hiện và duy trì quản lý rủi ro đối với hệ thống trí tuệ nhân tạo
    trong suốt vòng đời của hệ thống trong phạm vi trách nhiệm và khả năng kiểm soát của đơn vị
  summary_en: 'Risk management over the whole life of the system: design, development, test, deployment,
    operation, retirement.'
