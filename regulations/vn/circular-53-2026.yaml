- id: VN-TT53-2026-A4.01-01
  article_ref: Art. 4(1)
  text_vi: Trước khi triển khai hệ thống trí tuệ nhân tạo, đơn vị phải thực hiện phân loại hệ thống trí
    tuệ nhân tạo theo mức độ rủi ro cao, trung bình, thấp
  summary_en: Before deployment the bank classifies each AI system as high, medium or low risk under the
    AI law and Art. 4(2).
  duties:
  - risk_classification
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: 'Registry keeps the risk tier of each agent. Missing: the full test of the AI law and of the money
      lines of Art. 4(2) is a person''s decision; Decision 33 class is a proposal until counsel confirms.'
  - kind: evidence
    id: onboard_profile
    coverage: partial
    note: Onboarding profile proposes a Decision 33 class and a risk tier; the bank approves.
  - kind: evidence
    id: classification_record
    coverage: partial
    note: 'Decision 33 classification rows: proposal, answers, class (the last step changes the system).'
  - kind: console
    id: systems
    coverage: partial
    note: Register workflow v2 with the Decision 33 step and, with its flag, the Duties step.
  - kind: evidence
    id: predeploy_report
    coverage: partial
    note: Pre-deploy report lists the open classification and duty questions before go-live (flag ONBOARD_PREDEPLOY).
  - kind: process
    id: legal_review
    coverage: partial
    note: 'Manual step: counsel confirms the risk level under the AI law and the lines of Art. 4(2).'
  evidence_needed:
  - classification record before go-live
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
