- id: VN-TT53-2026-A5.01G2-01
  article_ref: Art. 5(1)(g)(ii)
  text_vi: Tổng giá trị giao dịch do hệ thống trí tuệ nhân tạo tự động thực hiện trong một ngày của một
    khách hàng không vượt quá hạn mức theo quy định nội bộ của đơn vị, nhưng không vượt quá 100 triệu
    đồng đối với khách hàng cá nhân, không vượt quá 500 triệu đồng đối với khách hàng tổ chức;
  summary_en: 'Hard cap on AI-executed payments: per customer per day not above the internal limit, and
    never above 100 million VND (personal) or 500 million VND (organisation).'
  duties:
  - transaction_limits
  - excessive_agency_limits
  applies_to:
    agent_class:
    - payment
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: daily_aggregate
    coverage: partial
    note: 'Daily aggregate limit per customer. Missing: demo policy limits (PAY-02, PAY-03) are above the
      legal caps; the bank sets the internal limit and chooses the customer type.'
  - kind: evidence
    id: threshold_check
    coverage: partial
    note: Compares each daily limit of the product with the cap (100 million VND individual, 500 million
      organisation) and reports within, at the cap or above.
  - kind: rule
    id: PAY-03
    coverage: partial
    note: Demo rule trips above 150 million VND a day (structuring); this is ABOVE the 100 million legal
      cap for individuals, so the threshold needs lowering for AI-autonomous payments.
  - kind: catalogue
    id: single_limit
    coverage: partial
    note: Per-transfer limit.
  - kind: rule
    id: PAY-02
    coverage: partial
    note: Demo single limit 100 million VND.
  evidence_needed:
  - daily cap configured at or below the legal cap per customer type
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
    title: Thông tư số 53/2026/TT-NHNN (vbpl.vn gateway, full text)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: a0c9c5a93eb76c3cc517721cca67934e6ff63b3b7fb7d94c836e711b501d2dfa
    local_path: regulations/sources/VN-TT53-2026/53-2026-tt-nhnn.txt
  - url: https://thitruongtaichinhtiente.vn/nhnn-ban-hanh-quy-dinh-ve-an-toan-quan-ly-rui-ro-khi-ung-dung-ai-trong-nganh-ngan-hang-86130.html
    title: Tap chi Thi truong Tai chinh Tien te - NHNN ban hanh quy dinh ve an toan, quan ly rui ro khi
      ung dung AI (2026-10-08)
    fetched_at: '2026-10-15'
    kind: secondary
  - url: https://www.bakermckenzie.com/en/insight/publications/2026/04/vietnam-draft-circular-on-ai-deployment-in-banking
    title: 'Baker McKenzie - Vietnam: draft circular on AI deployment in banking (Apr 2026, about the
      consultation draft)'
    fetched_at: '2026-10-15'
    kind: secondary
  confidence: high
  notes: Supervisor's demo policy PAY-03 (150 million VND a day) and PAY-02 (100 million per transfer)
    do not match this cap for personal customers. Counsel and the policy owner must set a lower autonomous-payment
    cap.
  status: issued
- id: VN-TT53-2026-A5.01G3-01
  article_ref: Art. 5(1)(g)(iii)
  text_vi: Có công cụ cho phép khách hàng chủ động tạm dừng hoặc hủy quyền cho phép hệ thống trí tuệ nhân
    tạo tự động thực hiện giao dịch thanh toán;
  summary_en: The bank must give the customer a tool to pause or revoke the permission for autonomous
    AI payments.
  duties:
  - consent
  - right_to_human_review
  - human_oversight
  applies_to:
    agent_class:
    - payment
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: console
    id: agent_action
    coverage: partial
    note: 'Operator-side pause of the agent; it is not a per-customer revoke tool. Missing: a per-customer
      revoke tool and its link to the gate.'
  - kind: process
    id: customer_control_tool
    coverage: partial
    note: 'Manual step: build a customer tool in the app to pause or revoke the permission, and make the
      revoke reach the gate at once.'
