- id: VN-TT53-2026-A16.02-01
  article_ref: Art. 16(2)
  text_vi: 'Đơn vị thực hiện kiểm tra, đánh giá mô hình trong các trường hợp sau: a) Trước khi đưa vào
    vận hành lần đầu; b) Định kỳ tối thiểu hằng năm trong quá trình vận hành; c) Khi xảy ra sự cố nghiêm
    trọng; khi có thay đổi đáng kể của hệ thống trí tuệ nhân tạo; khi phát hiện bất thường, sai lệch nghiêm
    trọng trong quá trình vận hành; hoặc khi mức độ rủi ro của hệ thống thay đổi.'
  summary_en: Models are tested and evaluated before first use, at least yearly, and after a serious incident,
    a significant change, serious deviation or a change in risk level.
  duties:
  - independent_validation
  - performance_monitoring
  applies_to:
    agent_class:
    - payment
    - credit_decision
    - customer_facing
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: launch_report
    coverage: partial
    note: 'Launch sandbox report is pre-go-live test evidence. Missing: the yearly calendar and the trigger
      rules for the agent''s model; the re-validation trigger list of Supervisor covers its judge model
      only.'
  - kind: monitor
    id: quality
    coverage: partial
    note: Quality and groundedness sampling.
  - kind: evidence
    id: assurance_results
    coverage: partial
    note: Pack results with dates give a log of tests per run.
  - kind: evidence
    id: task_record
    coverage: partial
    note: Task VAL-SECOND records the independent review of the validation report.
  - kind: process
    id: model_validation
    coverage: partial
    note: 'Manual step: keep a validation calendar (first use, at least yearly, after a serious incident,
      significant change, deviation or risk change) and the report for each trigger.'
  evidence_needed:
  - validation calendar
  - reports per trigger
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
    title: Thông tư số 53/2026/TT-NHNN (vbpl.vn gateway, full text)
