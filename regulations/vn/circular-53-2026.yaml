- id: VN-TT53-2026-A8.03B-01
  article_ref: Art. 8(3)(b)
  text_vi: Đối với các hệ thống trí tuệ nhân tạo có rủi ro cao hoặc hệ thống trí tuệ nhân tạo có rủi ro
    trung bình ra quyết định trong hoạt động nghiệp vụ sử dụng mô hình do bên thứ ba cung cấp thông qua
    dịch vụ nền tảng hoặc giao diện lập trình ứng dụng (API), đơn vị phải thực hiện đánh giá tác động
    và có phương án dự phòng khi nhà cung cấp cập nhật, thay đổi mô hình.
  summary_en: When a high-risk or medium-risk decision system uses a third-party model through a platform
    or API, the bank must assess impact and keep a fallback plan whenever the vendor updates or changes
    the model.
  duties:
  - change_control
  - outsourcing_oversight
  - business_continuity
  applies_to:
    agent_class:
    - payment
    - credit_decision
    - customer_facing
    role:
    - deployer
    model_hosting:
    - foreign_cloud
    - domestic_cloud
  addressee: bank
  control_mapping:
  - kind: monitor
    id: drift
    coverage: partial
    note: 'Behaviour drift band per agent. Missing: the impact assessment per vendor update and the fallback
      plan; a drift band or incident flags a change after the fact, it does not stop the update.'
  - kind: catalogue
    id: drift_band
    coverage: partial
    note: Behaviour drift band.
  - kind: evidence
    id: verdict_log
    coverage: partial
    note: Model version recorded on each verdict.
  - kind: evidence
    id: incident_record
    coverage: partial
    note: Governance incident kind model_version_change opens when the version of a model changes (flag
      GOVERNANCE_ACTIONS_ENABLED).
  - kind: evidence
    id: assurance_results
    coverage: partial
    note: Pack model_dependency_inventory records model pinning, region and vendor concentration.
  - kind: process
    id: vendor_management
    coverage: partial
    note: 'Manual step: assess the impact of each vendor update and agree the fallback with the vendor.'
  - kind: process
    id: business_continuity_plan
    coverage: partial
    note: 'Manual step: keep the fallback plan for when the vendor changes or retires a model.'
  evidence_needed:
  - alert on vendor model change
  - impact assessment per vendor update
  - fallback plan
  verification: VERIFIED_PRIMARY
  sources:
