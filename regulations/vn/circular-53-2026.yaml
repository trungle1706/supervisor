- id: VN-TT53-2026-A20.03-01
  article_ref: Art. 20(3)
  text_vi: Đối với các hệ thống trí tuệ nhân tạo đóng vai trò thay thế con người trong việc giao tiếp
    trực tiếp với khách hàng, đơn vị phải có biện pháp thông báo cho khách hàng biết việc đang tương tác
    với hệ thống trí tuệ nhân tạo ngay từ khi bắt đầu phiên làm việc hoặc hội thoại.
  summary_en: If an AI system replaces a person in direct talk with customers, the bank must tell the
    customer from the start of the session that it is an AI.
  duties:
  - ai_disclosure
  applies_to:
    agent_class:
    - customer_facing
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: case_files
    coverage: partial
    note: 'Case file can show that the notice was shown if the channel logs it. Missing: the notice itself
      and the log that it was shown; Supervisor does not render the chat or call.'
  - kind: process
    id: customer_disclosure
    coverage: partial
    note: 'Manual step: show the AI notice at session start in the channel.'
  evidence_needed:
  - AI notice at the start of every chat or call
  - log that the notice was shown
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
