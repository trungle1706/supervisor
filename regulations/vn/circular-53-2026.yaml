- id: VN-TT53-2026-A10.01-01
  article_ref: Art. 10(1)
  text_vi: 'Hệ thống trí tuệ nhân tạo phải được cấu hình để ghi nhật ký các sự kiện trong quá trình vận
    hành, tối thiểu bao gồm: a) Thời gian, hệ thống, người dùng thực hiện các giao dịch hoặc tác vụ; b)
    Thông tin về dữ liệu đầu vào và kết quả đầu ra của hệ thống, kèm theo thông tin về phiên bản mô hình,
    cấu hình hoặc câu lệnh (nếu có) bảo đảm đủ để truy xuất, kiểm tra và tái lập quá trình xử lý khi cần
    thiết; c) Các trường hợp kết quả nằm ngoài phạm vi hoạt động dự định hoặc có độ tin cậy thấp; d) Các
    sự kiện liên quan đến lỗi của hệ thống hoặc cảnh báo sự cố an ninh mạng.'
  summary_en: 'AI systems must be set up to log: time, system and user for each transaction or task; inputs
    and outputs with model version, configuration or prompt (enough to trace and reproduce); out-of-scope
    or low-confidence results; system errors and cyber alerts.'
  duties:
  - logging
  - record_keeping
  applies_to:
    agent_class:
    - any
    role:
    - deployer
  addressee: bank
  control_mapping:
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: 'Hash-chained record of gate decisions and verdicts; the bank still owns retention and access.
      Missing: whether full model inputs and outputs are kept depends on the collector and masking; the
      chain keeps hashes and masked excerpts, not raw personal data.'
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: Recorded tool calls and gate decisions per agent.
  - kind: evidence
    id: verdict_log
    coverage: partial
    note: Judge verdicts with model and prompt version.
  - kind: catalogue
    id: proxy_log
    coverage: partial
    note: Proxy log.
  - kind: catalogue
    id: otlp_ingest
    coverage: partial
    note: Trace ingest.
  - kind: console
    id: schema_selfcheck
    coverage: partial
    note: At start the app compares the tables and columns with the warehouse, so a missing evidence table
      shows as an error and not as lost logs (flag SCHEMA_SELFCHECK).
  evidence_needed:
  - log schema check against the four required groups
  - ability to reproduce a decision from the log
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl-bientap-gateway.moj.gov.vn/api/qtdc/public/doc/99fa0140-c2ba-11f1-b8ec-99379998c900
