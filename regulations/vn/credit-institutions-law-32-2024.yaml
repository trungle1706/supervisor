  confidence: high
  notes: Whether masked tokens still count as customer information is a legal question for the bank.
- id: VN-LCI-2024-A14-01
  article_ref: Art. 14
  text_vi: Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài phải bảo đảm an toàn hệ thống thông tin, bảo
    mật dữ liệu và hoạt động liên tục theo quy định của Thống đốc Ngân hàng Nhà nước và quy định khác
    của pháp luật có liên quan.
  summary_en: The bank must keep its information systems safe, data confidential and operations continuous,
    as the SBV Governor prescribes (Circular 09/2020/TT-NHNN, Circular 50/2024/TT-NHNN).
  duties:
  - security_monitoring
  - business_continuity
  - robustness_security
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: evidence_chain
    coverage: partial
    note: tamper-evident record of agent actions and gate decisions
  - kind: process
    id: security_assessment
    coverage: none
    note: bank classifies and tests its systems
  - kind: process
    id: business_continuity_plan
    coverage: none
    note: recovery plan for the agent platform
  evidence_needed:
  - Information-system security regulation
  - Continuity plan and test records
  verification: VERIFIED_PRIMARY
  sources:
