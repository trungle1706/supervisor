- id: VN-LCI-2024-A104-01
  article_ref: Art. 104(1)-(2)
  text_vi: '1. Tổ chức tín dụng phải lưu trữ hồ sơ tín dụng, bao gồm:

    a) Tài liệu, dữ liệu đề nghị cấp tín dụng;

    b) Tài liệu, dữ liệu thẩm định, quyết định cấp tín dụng;

    c) Hợp đồng, thỏa thuận cấp tín dụng; hồ sơ về biện pháp bảo đảm trong trường hợp có áp dụng biện
    pháp bảo đảm;

    d) Tài liệu, dữ liệu phát sinh trong quá trình sử dụng khoản cấp tín dụng liên quan đến hợp đồng,
    thỏa thuận cấp tín dụng.

    ...

    2. Thời hạn lưu trữ hồ sơ tín dụng thực hiện theo quy định của pháp luật về lưu trữ.'
  summary_en: 'The bank must keep credit files: application data, appraisal and decision records, contracts,
    and data created during use. The period follows the archive law. Agent-made appraisal data is part
    of the file.'
  duties:
  - record_keeping
  - retention
  applies_to:
    agent_class:
    - credit_decision
  addressee: bank
  control_mapping:
  - kind: evidence
    id: case_file
    coverage: partial
    note: case file (json, html, pdf) of each reviewed case
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: hash-chained record of agent steps
  - kind: process
    id: records_retention
    coverage: none
    note: retention schedule per archive law
  evidence_needed:
  - Credit file with agent output attached
  - Retention schedule
  verification: VERIFIED_PRIMARY
