- id: VN-LCI-2024-A13.3-01
  article_ref: Art. 13(3)
  text_vi: 3. Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài không được cung cấp thông tin khách hàng
    của tổ chức tín dụng, chi nhánh ngân hàng nước ngoài cho tổ chức, cá nhân khác, trừ trường hợp có
    yêu cầu của cơ quan nhà nước có thẩm quyền theo quy định của luật hoặc được sự chấp thuận của khách
    hàng.
  summary_en: 'The bank must not give customer information to another organisation or person, except on
    a lawful request from a state authority or with the customer''s consent. An AI vendor or external
    model is ''another organisation'': sending unmasked data to it needs a legal basis.'
  duties:
  - customer_confidentiality
  - consent
  - purpose_limitation
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
    - financial
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: pii_masking
    coverage: partial
    note: tokens replace identifiers before any call to an external judge or vendor model
  - kind: process
    id: consent_management
    coverage: none
    note: bank records the customer's consent or the legal request
  - kind: process
    id: vendor_management
    coverage: none
    note: contract and data-flow review for model vendors
  evidence_needed:
  - Data-flow map showing which fields leave the bank
  - Consent or legal-basis record
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/166170
