obligations:
- id: VN-LCI-2024-A13.1-01
  article_ref: Art. 13(1)
  text_vi: 1. Người quản lý, người điều hành, nhân viên của tổ chức tín dụng, chi nhánh ngân hàng nước
    ngoài không được tiết lộ thông tin khách hàng, bí mật kinh doanh của tổ chức tín dụng, chi nhánh ngân
    hàng nước ngoài.
  summary_en: Managers, executives and staff of a credit institution must not disclose customer information
    or business secrets. An AI agent acts for staff, so the bank must keep its output and logs from exposing
    customer data to anyone without need.
  duties:
  - customer_confidentiality
  - access_control
  applies_to:
    agent_class:
    - any
    data_classes:
    - personal
    - financial
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: pii_masking
    coverage: partial
    note: masks CCCD, phone, account and card numbers before storage or any judge call
  - kind: catalogue
    id: pii_bulk_read
    coverage: partial
    note: blocks bursts of personal-data reads
  - kind: rule
    id: PII-02
    coverage: partial
    note: caps loan application reads per agent per hour (credit_prequal only)
  - kind: console
    id: case_detail
    coverage: partial
    note: case file shows masked data to the reviewer, need-to-know
  - kind: process
    id: access_management
    coverage: partial
    note: bank IAM decides who may open cases and customer data
  evidence_needed:
  - Access-control policy for staff and agents
  - Masked case files for reviewers
  - Record of who opened which case
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/166170
