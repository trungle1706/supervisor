  confidence: high
- id: VN-LCI-2024-A12.1-01
  article_ref: Art. 12(1)
  text_vi: 1. Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài cung cấp cho chủ tài khoản thông tin về
    giao dịch và số dư trên tài khoản của chủ tài khoản theo thỏa thuận với chủ tài khoản.
  summary_en: The bank gives an account holder information on the transactions and balance of that account
    as agreed with the holder. A customer-service agent may only give balance or transaction data to the
    verified owner.
  duties:
  - customer_confidentiality
  - consumer_information
  applies_to:
    agent_class:
    - customer_facing
    data_classes:
    - financial
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: pii_masking
    coverage: partial
    note: masks account numbers in stored events
  - kind: process
    id: access_management
    coverage: partial
    note: owner verification is done in the bank channel
  evidence_needed:
  - Customer identity check before account information is given
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/166170
    title: Luat Cac to chuc tin dung 32/2024/QH15 - full text (vbpl.vn)
