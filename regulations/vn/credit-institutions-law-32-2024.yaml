  confidence: medium
- id: VN-LCI-2024-A10.4-01
  article_ref: Art. 10(4)
  text_vi: 4. Công bố công khai lãi suất tiền gửi, phí dịch vụ, quyền, nghĩa vụ của khách hàng đối với
    từng loại sản phẩm, dịch vụ đang cung ứng.
  summary_en: The bank must publish deposit rates, service fees, and customer rights and duties for each
    product. A chat agent that quotes fees or terms must use the published values.
  duties:
  - consumer_information
  - fair_treatment
  applies_to:
    agent_class:
    - customer_facing
  addressee: bank
  control_mapping:
  - kind: process
    id: customer_disclosure
    coverage: none
    note: bank publishes tariffs and terms
  - kind: monitor
    id: quality
    coverage: partial
    note: groundedness sampling can flag fee quotes that differ from the source
  evidence_needed:
  - Published tariff
  - Sample of agent answers checked against the tariff
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/166170
    title: Luat Cac to chuc tin dung 32/2024/QH15 - full text (vbpl.vn)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 6f4ac1905fb54253c4577d470fcd02b101400eb5127be666fd54649e2c146cc5
    local_path: regulations/sources/VN-LCI-2024/law-32-2024-qh15.txt
  confidence: medium
- id: VN-LCI-2024-A10.5-01
  article_ref: Art. 10(5)
  text_vi: 5. Công bố công khai thời gian giao dịch chính thức. Trường hợp ngừng giao dịch tại một hoặc
    một số địa điểm thực hiện giao dịch trong thời gian giao dịch chính thức hoặc ngừng giao dịch bằng
    phương tiện điện tử, chậm nhất là 24 giờ trước thời điểm ngừng giao dịch, tổ chức tín dụng, chi nhánh
    ngân hàng nước ngoài phải niêm yết thông tin về ngừng giao dịch tại địa điểm giao dịch hoặc trên trang
    thông tin điện tử của tổ chức tín dụng, chi nhánh ngân hàng nước ngoài. Trường hợp ngừng giao dịch
    do sự kiện bất khả kháng, chậm nhất là 24 giờ sau thời điểm ngừng giao dịch, tổ chức tín dụng, chi
    nhánh ngân hàng nước ngoài phải niêm yết thông tin về ngừng giao dịch tại địa điểm giao dịch hoặc
    trên trang thông tin điện tử của tổ chức tín dụng, chi nhánh ngân hàng nước ngoài.
  summary_en: 'The bank must announce when it stops service at a location or by electronic means: at least
    24 hours before, or within 24 hours after in a force majeure case. Pausing or retiring an agent that
    serves customers can count as a stop of an electronic service.'
  duties:
  - consumer_information
  - business_continuity
  applies_to:
    agent_class:
    - customer_facing
    - payment
  addressee: bank
  control_mapping:
  - kind: console
    id: agent_action
    coverage: partial
    note: pause and resume switch gives the time of each stop
  - kind: process
    id: customer_disclosure
    coverage: none
    note: bank posts the stop notice
  evidence_needed:
  - Stop notice posted on the site or at the branch
  - Pause log with times
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/166170
    title: Luat Cac to chuc tin dung 32/2024/QH15 - full text (vbpl.vn)
