- id: VN-LCI-2024-A105-01
  article_ref: Art. 105
  text_vi: Hoạt động của tổ chức tín dụng được thực hiện bằng phương tiện điện tử theo quy định của Thống
    đốc Ngân hàng Nhà nước, quy định của pháp luật về giao dịch điện tử.
  summary_en: Electronic activity of the bank follows the Governor's rules and the e-transaction law (Circular
    50/2024/TT-NHNN, Circular 09/2020/TT-NHNN).
  duties:
  - transaction_authentication
  - robustness_security
  applies_to:
