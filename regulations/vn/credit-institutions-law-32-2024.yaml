- id: VN-LCI-2024-A102.1-01
  article_ref: Art. 102(1)
  text_vi: 1. Tổ chức tín dụng phải yêu cầu khách hàng cung cấp tài liệu, dữ liệu chứng minh khả năng
    tài chính của khách hàng, phương án sử dụng vốn khả thi, mục đích sử dụng vốn hợp pháp trước khi quyết
    định cấp tín dụng, trừ trường hợp quy định tại khoản 2 Điều này.
  summary_en: Before a credit decision the bank must require the customer to supply data showing financial
    capacity, a viable capital plan and a lawful purpose. Pre-qualification output must rest on such data.
  duties:
  - data_quality
  - risk_management_system
  applies_to:
    agent_class:
    - credit_decision
    data_classes:
    - financial
  addressee: bank
  control_mapping:
  - kind: catalogue
    id: case_files
    coverage: partial
    note: case file shows which source records the agent read
  - kind: catalogue
    id: system_of_record
    coverage: partial
    note: figures must come from the system of record
  - kind: process
    id: internal_policy_issuance
    coverage: none
    note: credit policy
  evidence_needed:
  - Application file with the required documents
  verification: VERIFIED_PRIMARY
