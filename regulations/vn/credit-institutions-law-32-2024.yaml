    kind: primary
    sha256: 6f4ac1905fb54253c4577d470fcd02b101400eb5127be666fd54649e2c146cc5
    local_path: regulations/sources/VN-LCI-2024/law-32-2024-qh15.txt
  confidence: medium
  notes: Applies to a stop of the whole electronic channel; a Supervisor pause of one agent may not reach
    that level. Bank counsel to decide.
- id: VN-LCI-2024-A57.2-01
  article_ref: Art. 57(2), (4)
  text_vi: '2. Tổ chức tín dụng phải xây dựng hệ thống kiểm soát nội bộ để bảo đảm các yêu cầu sau đây:

    a) Hiệu quả và an toàn trong hoạt động; bảo vệ, quản lý, sử dụng an toàn, hiệu quả tài sản và các
    nguồn lực;

    b) Hệ thống thông tin tài chính và thông tin quản lý trung thực, hợp lý, đầy đủ và kịp thời;

    c) Tuân thủ pháp luật và các cơ chế, chính sách, quy trình, quy định nội bộ.

    ...

    4. Tổ chức tín dụng xây dựng hệ thống kiểm soát nội bộ và triển khai ứng dụng công nghệ trong hoạt
    động kiểm soát nội bộ theo quy định của Thống đốc Ngân hàng Nhà nước.'
  summary_en: The bank must build an internal control system for safe operations, true and complete information,
    and compliance with law and internal rules. It must apply technology in internal control as the Governor
    prescribes. An AI agent is part of the process under control.
  duties:
  - risk_management_system
  - governance_accountability
  - human_oversight
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: monitor
    id: oversight
    coverage: partial
    note: 'oversight metrics: dwell time, approval rate, chain_ok'
  - kind: evidence
    id: evidence_chain
    coverage: partial
    note: evidence for internal control and audit
  - kind: process
    id: board_governance
    coverage: none
    note: bank governance of AI use
  evidence_needed:
  - Internal control framework covering AI agents
  - Oversight metrics reports
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/166170
    title: Luat Cac to chuc tin dung 32/2024/QH15 - full text (vbpl.vn)
    fetched_at: '2026-10-15'
    kind: primary
