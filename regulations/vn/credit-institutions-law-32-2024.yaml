- id: VN-LCI-2024-A102.4-01
  article_ref: Art. 102(4)
  text_vi: 4. Tổ chức tín dụng phải tổ chức xét duyệt cấp tín dụng theo nguyên tắc phân định trách nhiệm
    giữa khâu thẩm định và quyết định cấp tín dụng.
  summary_en: Credit approval must separate the appraisal step from the credit decision. An AI pre-qualification
    agent that both scores and decides would break this separation unless a person or separate function
    decides.
  duties:
  - human_oversight
  - governance_accountability
  - risk_management_system
  applies_to:
    agent_class:
    - credit_decision
  addressee: bank
  control_mapping:
  - kind: console
    id: case_signoff
    coverage: partial
    note: human sign-off on a case after the agent step; not pre-execution approval
  - kind: monitor
    id: oversight
    coverage: partial
    note: approval rate and dwell time of reviewers
  - kind: process
    id: internal_policy_issuance
    coverage: none
    note: credit approval authority matrix
  evidence_needed:
  - Approval authority matrix
  - Sign-off records separate from the appraisal output
  verification: VERIFIED_PRIMARY
  sources:
