    id: single_limit
    coverage: partial
    note: caps the amount of a money or credit call per the agent manifest
  - kind: process
    id: internal_policy_issuance
    coverage: none
    note: bank sets waiver authority and limits
  evidence_needed:
  - Waiver policy with authority limits
  - Log of waivers granted by the agent
