  confidence: high
- id: VN-LCI-2024-A101.1-01
  article_ref: Art. 101(1)
  text_vi: 1. Căn cứ vào quy định của Luật này, quy định của Thống đốc Ngân hàng Nhà nước và quy định
    khác của pháp luật có liên quan, tổ chức tín dụng phải xây dựng và ban hành quy định nội bộ đối với
    hoạt động nghiệp vụ của tổ chức tín dụng, bao gồm cả việc thực hiện hoạt động nghiệp vụ bằng phương
    tiện điện tử, bảo đảm có cơ chế kiểm soát, kiểm toán nội bộ, quản lý rủi ro gắn với từng quy trình
    nghiệp vụ kinh doanh, phương án xử lý trường hợp khẩn cấp.
  summary_en: The bank must issue internal rules for its operations, also those run by electronic means,
    with controls, internal audit, risk management for each business process and an emergency plan. Agents
    that run a bank process need such rules.
  duties:
  - internal_policy
  - risk_management_system
  - business_continuity
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: evidence
    id: policy_baseline
    coverage: partial
    note: versioned policy baseline records the agent rules
  - kind: process
    id: internal_policy_issuance
    coverage: none
    note: bank issues the rule
  - kind: process
    id: business_continuity_plan
    coverage: none
    note: emergency plan
  evidence_needed:
  - Internal rule that covers each agent process
  - Emergency procedure
  verification: VERIFIED_PRIMARY
