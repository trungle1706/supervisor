    local_path: regulations/sources/VN-LCI-2024/law-32-2024-qh15.txt
  confidence: high
- id: VN-LCI-2024-A58-01
  article_ref: Art. 58(1)-(2)
  text_vi: '1. Tổ chức tín dụng phải thành lập kiểm toán nội bộ thuộc Ban kiểm soát thực hiện kiểm toán
    nội bộ tổ chức tín dụng.

    ...

    2. Kiểm toán nội bộ thực hiện rà soát, đánh giá độc lập, khách quan về tính thích hợp và sự tuân thủ
    cơ chế, chính sách, quy trình, quy định nội bộ của tổ chức tín dụng; đưa ra kiến nghị nhằm nâng cao
    hiệu quả của các hệ thống, quy trình, quy định, góp phần bảo đảm tổ chức tín dụng hoạt động an toàn,
    hiệu quả, đúng pháp luật.'
  summary_en: The bank must set up internal audit under the Supervisory Board. It reviews independently
    whether internal rules and processes are suitable and followed. Audit of an AI agent needs durable,
    verifiable records.
  duties:
  - independent_validation
  - record_keeping
  - logging
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: audit export pack
  - kind: evidence
    id: chain_verify_report
    coverage: partial
    note: offline verification of the evidence chain
  - kind: console
    id: export
    coverage: partial
    note: audit export screen
  - kind: process
    id: model_validation
    coverage: none
    note: second-line validation of the AI use case
  evidence_needed:
  - Audit export for the period
  - Chain verification report
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://vbpl.vn/van-ban/chi-tiet/166170
    title: Luat Cac to chuc tin dung 32/2024/QH15 - full text (vbpl.vn)
