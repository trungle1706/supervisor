- id: VN-LCI-2024-A101.2-01
  article_ref: Art. 101(2)
  text_vi: '2. Tổ chức tín dụng phải ban hành quy định nội bộ về các nội dung sau đây:

    a) Cấp tín dụng, quản lý khoản cấp tín dụng;

    b) Phân loại tài sản có, trích lập và sử dụng dự phòng rủi ro;

    c) Đánh giá chất lượng tài sản có và tuân thủ tỷ lệ an toàn vốn tối thiểu;

    d) Quản lý thanh khoản, trong đó có thủ tục và giới hạn quản lý thanh khoản;

    đ) Kiểm soát nội bộ và kiểm toán nội bộ phù hợp với tính chất và quy mô hoạt động của tổ chức tín
    dụng;

    e) Hệ thống xếp hạng tín dụng nội bộ đối với tổ chức tín dụng phải xây dựng hệ thống xếp hạng tín
    dụng nội bộ theo quy định của pháp luật về các tổ chức tín dụng;

    g) Quản trị rủi ro trong hoạt động của tổ chức tín dụng;

    h) Phòng, chống rửa tiền;

    i) Phương án xử lý trường hợp khẩn cấp.'
  summary_en: The bank must issue internal rules on, among others, credit granting, internal control and
    audit, risk governance, AML and emergency plans, and send them to the SBV within 10 days of issue
    (Art. 101(3)).
  duties:
  - internal_policy
  - regulatory_reporting
  - risk_management_system
  applies_to:
    agent_class:
    - any
  addressee: bank
  control_mapping:
  - kind: evidence
    id: policy_baseline
    coverage: partial
    note: versioned rules the gateway enforces
  - kind: process
    id: regulator_notification
    coverage: none
    note: send the rules to SBV in 10 days
  evidence_needed:
  - Rule list with issue dates
  - Proof of submission to SBV
  verification: VERIFIED_PRIMARY
