    của tổ chức tín dụng, chi nhánh ngân hàng nước ngoài theo quy định của Chính phủ.
  summary_en: The bank must keep customer information secret under the Government's detailed rules (Decree
    117/2018/ND-CP).
  duties:
  - customer_confidentiality
  - internal_policy
  applies_to:
    agent_class:
    - any
    data_classes:
