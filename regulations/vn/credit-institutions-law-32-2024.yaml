- id: VN-LCI-2024-A103.4-01
  article_ref: Art. 103(4)
  text_vi: 4. Tổ chức tín dụng có quyền quyết định miễn, giảm lãi, phí cho khách hàng theo quy định nội
    bộ của tổ chức tín dụng.
  summary_en: The bank may waive or reduce interest and fees for a customer under its internal rules.
    A fee-waiver agent must stay inside those rules.
  duties:
  - internal_policy
  - fair_treatment
  applies_to:
    agent_class:
    - customer_facing
  addressee: bank
  control_mapping:
