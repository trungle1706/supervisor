      - {kind: evidence, id: audit_pack, coverage: partial, note: "audit export supports internal and external review"}
    evidence_needed: ["vendor due-diligence file", "periodic review of technical measures"]
    verification: VERIFIED_PRIMARY
    sources: *lawsrc
    confidence: high

  - id: VN-PDPL-2025-A37.2-01
    article_ref: "Art. 37(2)(a), 37(2)(b)"
    text_vi: "Chỉ được tiếp nhận dữ liệu cá nhân sau khi có thỏa thuận, hợp đồng về xử lý dữ liệu cá nhân với bên kiểm soát dữ liệu cá nhân, bên kiểm soát và xử lý dữ liệu cá nhân;"
    summary_en: "A processor may receive personal data only after an agreement or contract with the controller and must process only as the contract says. It must apply protection measures and answers to the controller for damage (Art. 37(2)(c), (d)). This applies to an AI vendor or to Supervisor when they handle customer data for the bank."
    duties: [processor_contract]
    applies_to:
      data_classes: [personal]
    addressee: processor
    control_mapping:
      - {kind: process, id: vendor_management, coverage: none, note: "contract signed before the first data flow"}
    evidence_needed: ["signed processing contract dated before first data flow"]
    verification: VERIFIED_PRIMARY
    sources: *lawsrc
    confidence: high

  - id: VN-PDPL-2025-A39.1-01
    article_ref: "Art. 39(1), 39(2)"
    text_vi: "Hoạt động xử lý dữ liệu cá nhân đang thực hiện mà đã được chủ thể dữ liệu cá nhân đồng ý hoặc theo thỏa thuận theo quy định của Nghị định số 13/2023/NĐ-CP ngày 17 tháng 4 năm 2023 của Chính phủ trước ngày Luật này có hiệu lực thi hành thì tiếp tục thực hiện, không phải xin đồng ý lại hoặc thỏa thuận lại."
    summary_en: "Processing already consented under Decree 13/2023 before 2026-01-01 continues without new consent. Dossiers already received by the agency under Decree 13 stay valid, and later updates follow the new law (Art. 39(2)). A new AI use of old data still needs its own lawful basis."
    duties: [consent, lawful_basis, dpia]
    applies_to:
      data_classes: [personal]
    addressee: controller
    control_mapping:
      - {kind: process, id: consent_management, coverage: none, note: "map old consents to the new purposes"}
      - {kind: process, id: dpia_document, coverage: none, note: "check whether a Decree 13 dossier exists and covers the AI agent"}
    evidence_needed: ["list of Decree 13 consents and dossiers with receipt dates"]
    verification: VERIFIED_PRIMARY
    sources: *lawsrc
    confidence: high
    status: in_force
    notes: "Transition rule only. Whether an old consent covers a new AI purpose is a legal question (Art. 3(2), 9(4)(a))."
