  - id: VN-PDPL-2025-A31.4-01
    article_ref: "Art. 31(4)"
    text_vi: "Cơ quan, tổ chức, cá nhân thu thập và xử lý dữ liệu sinh trắc học phải có biện pháp bảo mật vật lý đối với thiết bị lưu trữ và truyền tải dữ liệu sinh trắc học của mình; hạn chế quyền truy cập vào dữ liệu sinh trắc học; có hệ thống theo dõi để phòng ngừa, phát hiện hành vi xâm phạm dữ liệu sinh trắc học; tuân thủ quy định của pháp luật và tiêu chuẩn quốc tế có liên quan;"
    summary_en: "Biometric data needs physical security for storage and transfer devices, restricted access, a monitoring system to detect abuse, and compliance with relevant standards. If processing harms the subject, the subject must be told (Art. 31(4)(b))."
    duties: [sensitive_data_protection, access_control, security_monitoring]
    applies_to:
      data_classes: [biometric]
    addressee: any
    control_mapping:
      - {kind: catalogue, id: pii_masking, coverage: partial, note: "keeps biometric templates and images out of traces if masking is configured for them"}
      - {kind: process, id: access_management, coverage: none, note: "restricted access"}
      - {kind: process, id: security_assessment, coverage: none, note: "physical security"}
    evidence_needed: ["biometric data access list", "monitoring alerts for biometric stores"]
    verification: VERIFIED_PRIMARY
    sources: *lawsrc
    confidence: high

  - id: VN-PDPL-2025-A33.2-01
    article_ref: "Art. 33(2)"
    text_vi: "Cơ quan, tổ chức có trách nhiệm chỉ định bộ phận, nhân sự đủ điều kiện năng lực bảo vệ dữ liệu cá nhân hoặc thuê tổ chức, cá nhân cung cấp dịch vụ bảo vệ dữ liệu cá nhân."
    summary_en: "Appoint a qualified personal-data protection unit or person, or hire a service provider. Conditions and tasks are in Decree 356/2025 Art. 13 and 14. Small enterprises and micro businesses may be exempt (Art. 38); a bank is not."
    duties: [dpo_appointment, governance_accountability]
    applies_to:
      data_classes: [personal]
    addressee: controller
    control_mapping:
      - {kind: process, id: dpo_signoff, coverage: none, note: "bank names the DPO or unit and routes AI changes to them"}
      - {kind: console, id: case_signoff, coverage: partial, note: "sign-off screen can record a DPO or compliance reviewer for a case; it does not make the appointment"}
    evidence_needed: ["written appointment of the unit or person"]
    verification: VERIFIED_PRIMARY
    sources: *lawsrc
    confidence: high

  - id: VN-PDPL-2025-A37.1-01
    article_ref: "Art. 37(1)(c), 37(1)(e), 37(1)(g)"
    text_vi: "Thực hiện biện pháp quản lý, kỹ thuật phù hợp để bảo vệ dữ liệu cá nhân theo quy định của pháp luật, rà soát và cập nhật các biện pháp này khi cần thiết;"
    summary_en: "The controller applies suitable management and technical measures and reviews them, picks a suitable processor (Art. 37(1)(đ)), guarantees data subject rights, and is liable to the subject for damage from its processing (Art. 37(1)(g)). The bank stays answerable for what its AI vendors do with data."
    duties: [governance_accountability, outsourcing_oversight, robustness_security]
    applies_to:
      data_classes: [personal]
    addressee: controller
    control_mapping:
