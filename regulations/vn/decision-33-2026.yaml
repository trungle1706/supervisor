- id: VN-QD33-2026-A4.01-01
  article_ref: Art. 4(1)
  text_vi: 'Đối với các hệ thống trí tuệ nhân tạo thuộc Danh mục ban hành kèm theo Quyết định này đã được
    đưa vào hoạt động trước ngày Quyết định này có hiệu lực, nhà cung cấp và bên triển khai có trách nhiệm
    hoàn thành các nghĩa vụ tuân thủ theo quy định của pháp luật về trí tuệ nhân tạo theo lộ trình sau:
    a) Trước ngày 01 tháng 9 năm 2027 đối với các hệ thống trí tuệ nhân tạo trong lĩnh vực y tế, giáo
    dục và tài chính; b) Trước ngày 01 tháng 3 năm 2027 đối với các hệ thống trí tuệ nhân tạo thuộc các
    lĩnh vực còn lại trong Danh mục.'
  summary_en: Listed systems running before 2026-08-15 must complete their AI-law duties before 2027-09-01
    if in health, education or finance, and before 2027-03-01 in the other listed sectors.
  duties:
  - conformity_assessment
  - risk_classification
  - registration
  applies_to:
    agent_class:
    - payment
    - credit_decision
    role:
    - deployer
    - provider
