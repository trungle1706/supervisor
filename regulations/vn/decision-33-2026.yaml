    coverage: none
    note: bank counsel confirms scope and reading
  - kind: evidence
    id: launch_report
    coverage: partial
    note: launch report shows readiness; it is not a conformity assessment
  evidence_needed:
  - start date of each listed system
  - legal view on which date applies to banking
