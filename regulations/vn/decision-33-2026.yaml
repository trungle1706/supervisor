- id: VN-QD33-2026-PL4.1-01
  article_ref: Appendix IV, entry 1 (condition 1)
  text_vi: 'Chỉ áp dụng đối với hệ thống trí tuệ nhân tạo tự động thực hiện giao dịch điện tử trong hoạt
    động ngân hàng khi đáp ứng các điều kiện sau: - Hệ thống có khả năng tự tạo, sửa đổi, xác nhận và
    phê duyệt giao dịch;'
  summary_en: 'High-risk entry for banking, e-transactions: the AI system can itself create, change, confirm
    and approve a transaction. All three conditions of the entry must hold (this one, high value, no human
    check).'
  duties:
  - risk_classification
  - excessive_agency_limits
  applies_to:
    agent_class:
    - payment
    role:
    - deployer
    - provider
  addressee: any
