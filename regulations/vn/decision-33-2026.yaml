  last_checked: '2026-10-15'
  notes: 'Number and year confirmed from the gazette: 33/2026/QĐ-TTg. Full text (4 articles and the Appendix)
    read from the gazette PDF. The Appendix has six sectors: I education, II ethnic and religious affairs,
    III health, IV banking, V proceedings (tố tụng), VI transport (31 systems). Only sector IV is turned
    into obligations. IV has two entries: (1) AI that automatically performs e-transactions, (2) AI that
    automatically decides credit. Each entry applies only when ALL its listed conditions hold. The wording
    reported earlier differs from the real text: the real text says ''Không có sự kiểm tra, phê duyệt
    hoặc kiểm soát của con người trước khi giao dịch được thực hiện'' and ''mà không có sự phê duyệt độc
    lập của cán bộ tín dụng''. ''High value'' and loan value are left to SBV; Circular 53/2026/TT-NHNN
    fixes them. The Appendix is a table; the quotes come from a text layer in which some cells are garbled,
    so only clean fragments are quoted. Not legal advice; bank counsel must confirm.'
obligations:
- id: VN-QD33-2026-A1.02-01
  article_ref: Art. 1(2)
  text_vi: Hệ thống trí tuệ nhân tạo phải đáp ứng các nguyên tắc hoạt động cơ bản theo quy định của pháp
    luật về trí tuệ nhân tạo; việc sử dụng hệ thống trí tuệ nhân tạo không làm thay đổi, chuyển giao hoặc
    loại trừ thẩm quyền, trách nhiệm của cơ quan, tổ chức, cá nhân có thẩm quyền theo quy định của pháp
    luật; bảo đảm sự giám sát, kiểm soát và khả năng can thiệp của con người trong quá trình vận hành
    hệ thống; không thực hiện các hành vi bị nghiêm cấm theo quy định của pháp luật.
  summary_en: Listed systems must follow the basic AI principles. Use of AI does not move or remove the
    legal authority and responsibility of the competent person or body. Human supervision, control and
    ability to intervene must be kept during operation. Prohibited acts stay prohibited.
  duties:
  - human_oversight
  - governance_accountability
  - prohibited_practice
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - kind: console
    id: agents
    coverage: partial
    note: agent registry screen with the pause switch
  - kind: console
    id: agent_action
    coverage: partial
    note: pause, resume or retire switch stops an agent after it acts; it is not human approval before
      execution
  - kind: monitor
    id: oversight
    coverage: partial
    note: dwell time, approval rate and chain_ok metrics show whether the human step is real
  - kind: process
    id: board_governance
    coverage: none
    note: board or committee oversight of AI
  evidence_needed:
  - named accountable human for each listed system
  - tested intervention path
  verification: VERIFIED_PRIMARY
