- id: VN-QD33-2026-A2-01
  article_ref: Art. 2
  text_vi: 'Các hệ thống trí tuệ nhân tạo được xác định là có rủi ro cao căn cứ trên các tiêu chí sau
    đây: 1. Hệ thống có thể gây thiệt hại đáng kể đến tính mạng, sức khỏe, quyền và lợi ích hợp pháp của
    tổ chức, cá nhân, lợi ích quốc gia, lợi ích công cộng, an ninh quốc gia theo quy định tại Điều 9 Luật
    Trí tuệ nhân tạo; khoản 1 Điều 8 của Nghị định số 142/2026/NĐ-CP quy định chi tiết một số điều và
    biện pháp thi hành Luật Trí tuệ nhân tạo. 2. Hệ thống không được loại trừ theo quy định tại khoản
    2 Điều 8 của Nghị định số 142/2026/NĐ-CP quy định chi tiết một số điều và biện pháp thi hành Luật
    Trí tuệ nhân tạo.'
  summary_en: A system is high risk if it could cause significant harm (Art. 9 of the Law, Art. 8(1) of
    Decree 142) and is not excluded under Art. 8(2) of Decree 142.
  duties:
  - risk_classification
  applies_to:
    agent_class:
    - any
    role:
    - deployer
    - provider
  addressee: any
  control_mapping:
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: agent inventory with owner, risk tier and model family
  - kind: evidence
    id: onboard_profile
    coverage: partial
    note: onboarding profile proposes a Decision 33 class; counsel confirms
  - kind: process
    id: legal_review
    coverage: none
    note: bank counsel confirms scope and reading
  evidence_needed:
  - classification decision per AI system with reasons
  verification: VERIFIED_PRIMARY
