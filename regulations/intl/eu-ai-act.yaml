- id: INTL-EUAIA-2024-A27-01
  article_ref: Art. 27
  text_en: Prior to deploying a high-risk AI system ... deployers of high-risk AI systems referred to
    in points 5 (b) and (c) of Annex III, shall perform an assessment
  summary_en: 'Before first use, deployers of Annex III 5(b)/(c) systems (credit scoring, life and health
    insurance pricing) and public bodies must run a fundamental rights impact assessment: process, period
    of use, affected groups, specific risks, human oversight, and measures if risks materialise. They
    notify the market surveillance authority of the result. A DPIA can cover part of it.'
  duties:
  - fundamental_rights_assessment
  - risk_management_system
  - bias_monitoring
  - dpia
