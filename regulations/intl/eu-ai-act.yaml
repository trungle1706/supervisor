- id: INTL-EUAIA-2024-A73-01
  article_ref: Art. 73
  text_en: not later than 15 days after the provider or, where applicable, the deployer, becomes aware
    of the serious incident
  summary_en: 'Providers of high-risk AI report serious incidents to the market surveillance authority:
    immediately after a causal link is established and in any case within 15 days; 2 days for widespread
    infringement or critical infrastructure; 10 days after a death. A deployer that learns of a serious
    incident informs the provider (Art 26(5)).'
