  primary_text_fetched: true
  last_checked: '2026-10-15'
  notes: 'Foreign law, kept as a reference framework only: binding false, status reference for Vietnam.
    In force in the EU since 2024-08-01. The ''digital omnibus'' delay is no longer a proposal: Regulation
    (EU) 2026/1744 of 2026-07-08 was published in OJ 2026-07-24 (entry into force on the third day after
    publication, so 2026-07-27, derived from its final article) and moved the Annex III high-risk date
    to 2027-12-02 and Annex I to 2028-08-02. The Gibson Dunn page (written in May 2026) still calls it
    not adopted; the OJ text supersedes it. Art 4 (AI literacy) was rewritten by the omnibus to ''support
    the development of AI literacy''. The bank is usually a DEPLOYER (Art 3); provider duties (Arts 9-15,
    50(1)-(2), 73) are listed because a deployer relies on vendor evidence and a deployer that modifies
    a system or puts its name on it can become a provider (Art 25, not mapped here). High-risk duties
    are tagged agent_class credit_decision (Annex III 5(b) creditworthiness evaluation of natural persons).
    Whether the demo credit pre-qualification agent counts as ''evaluating creditworthiness'' and escapes
    via Art 6(3) is a legal question for bank counsel. Annex III 5(b) excludes AI used to detect financial
    fraud. Full OJ texts stored under regulations/sources/INTL-EUAIA-2024/ (EU legal text, reuse allowed).'
obligations:
- id: INTL-EUAIA-2024-A5-01
  article_ref: Art. 5(1)(a)-(c)
  text_en: The following AI practices shall be prohibited
  summary_en: Do not place on the market or use AI that manipulates people with subliminal or deceptive
    techniques, exploits vulnerabilities (age, disability, social or economic situation), or scores people
    by social behaviour with unjustified detrimental treatment. A bank agent that pressures vulnerable
    customers or builds social scores would fall here.
  duties:
  - prohibited_practice
  applies_to:
    agent_class:
    - any
  control_mapping:
  - kind: catalogue
    id: groundedness
    coverage: partial
    note: samples customer replies for invented claims; does not detect manipulation of vulnerable customers
  - kind: monitor
    id: fairness
    coverage: partial
    note: segment gaps can show unjustified differential treatment
  - kind: process
    id: legal_review
    coverage: none
    note: bank counsel screens each use case against Art 5 before launch
  evidence_needed:
  - use-case screening record against Art 5
  - fairness slice results
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://publications.europa.eu/resource/celex/32024R1689
    title: Regulation (EU) 2024/1689, OJ L 2024/1689, 12.7.2024 (EU Publications Office)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 8f0b656302f9864cc87e040c371f209a9d65ae1a6cecc25ca5eb737e872d721a
    local_path: regulations/sources/INTL-EUAIA-2024/regulation-2024-1689.xhtml
  confidence: high
  notes: Applies from 2025-02-02 in the EU. Points (ba)/(bb) and paras (1a)/(1b) added by Reg. 2026/1744
    apply from 2026-12-02 (non-consensual intimate imagery and CSAM; not finance specific).
- id: INTL-EUAIA-2024-A4-01
  article_ref: Art. 4 (as replaced by Reg. 2026/1744)
  text_en: take measures to support the development of AI literacy of their staff
  summary_en: Providers and deployers must take measures to support AI literacy of staff and others who
    operate or use AI on their behalf, matched to their knowledge and the context. For a bank this means
    training for reviewers and agent owners.
  duties:
  - staff_competence
  applies_to:
    agent_class:
    - any
  control_mapping:
  - kind: process
    id: staff_training
    coverage: none
    note: bank keeps training records for reviewers and agent owners
  - kind: monitor
    id: oversight
    coverage: partial
    note: oversight metrics show whether reviewers act on stops; they do not prove competence
  evidence_needed:
  - training records for reviewers and agent owners
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://publications.europa.eu/resource/celex/32026R1744
    title: Regulation (EU) 2026/1744 Digital Omnibus on AI, OJ L 2026/1744, 24.7.2026
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 9d754652b867722807e4219c85912ce354233e58a1b4eb8c7752b4d1922993db
    local_path: regulations/sources/INTL-EUAIA-2024/regulation-2026-1744-digital-omnibus-on-ai.xhtml
  confidence: high
  notes: Original Art 4 required measures 'to ensure, to their best extent, a sufficient level of AI literacy'.
    The omnibus softened this to 'support'.
- id: INTL-EUAIA-2024-A6-01
  article_ref: Art. 6(2), 6(3) and Annex III point 5(b)
  text_en: AI systems intended to be used to evaluate the creditworthiness of natural persons or establish
    their credit score, with the exception of AI systems used for the purpose of detecting financial fraud
  summary_en: AI systems that evaluate the creditworthiness of natural persons or establish their credit
    score are high-risk (Annex III 5(b)), except AI used to detect financial fraud. A provider can claim
    a derogation under Art 6(3) if the system poses no significant risk, but that claim is documented
    and registered.
  duties:
  - risk_classification
  applies_to:
    agent_class:
    - credit_decision
  control_mapping:
  - kind: evidence
    id: onboard_profile
    coverage: partial
    note: onboarding profile records agent class and data classes used for classification
  - kind: evidence
    id: agent_registry
    coverage: partial
    note: risk tier stored per agent
  - kind: process
    id: legal_review
    coverage: none
    note: bank counsel decides whether a use case is Annex III 5(b) or fits the Art 6(3) derogation
  evidence_needed:
  - classification memo per AI use case
  - Art 6(3) derogation assessment if relied on
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://publications.europa.eu/resource/celex/32024R1689
    title: Regulation (EU) 2024/1689, OJ L 2024/1689, 12.7.2024 (EU Publications Office)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 8f0b656302f9864cc87e040c371f209a9d65ae1a6cecc25ca5eb737e872d721a
    local_path: regulations/sources/INTL-EUAIA-2024/regulation-2024-1689.xhtml
  confidence: high
  notes: Annex III applies from 2027-12-02 after Reg. 2026/1744. Payment and customer-service agents are
    not Annex III use cases on this text.
- id: INTL-EUAIA-2024-A9-01
  article_ref: Art. 9
  text_en: A risk management system shall be established, implemented, documented and maintained in relation
    to high-risk AI systems.
  summary_en: 'Providers of high-risk AI must run a documented, continuous risk management system across
    the lifecycle: identify and evaluate known and foreseeable risks (including misuse), adopt measures,
    test against defined metrics before release. A deployer asks the vendor for this evidence and runs
    its own risk process.'
  duties:
  - risk_management_system
  - performance_monitoring
  applies_to:
    agent_class:
    - credit_decision
  addressee: provider
  control_mapping:
  - kind: evidence
    id: launch_report
    coverage: partial
    note: 'launch sandbox report: catch rate, false alarms, GO or NO-GO against a red-team pack'
  - kind: evidence
    id: onboard_plan
    coverage: partial
    note: onboarding control plan per agent
  - kind: catalogue
    id: drift_band
    coverage: partial
    note: post-deployment behaviour drift against the launch baseline
  - kind: process
    id: model_validation
    coverage: none
    note: second line validates the model and its use; Supervisor does not
  evidence_needed:
  - risk management file from the provider
  - bank's own risk assessment for the use case
  - launch report
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://publications.europa.eu/resource/celex/32024R1689
    title: Regulation (EU) 2024/1689, OJ L 2024/1689, 12.7.2024 (EU Publications Office)
    fetched_at: '2026-10-15'
