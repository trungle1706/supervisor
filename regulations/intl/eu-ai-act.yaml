    local_path: regulations/sources/INTL-EUAIA-2024/regulation-2024-1689.xhtml
  confidence: high
- id: INTL-EUAIA-2024-A10-01
  article_ref: Art. 10
  summary_en: Training, validation and testing data for high-risk AI must follow data governance practices
    (origin, collection, bias examination, representativeness). Providers carry this duty; a deployer
    who controls input data must keep it relevant and representative (Art 26(4)).
  duties:
  - data_quality
  - bias_monitoring
  applies_to:
    agent_class:
    - credit_decision
  addressee: provider
  control_mapping:
  - kind: monitor
    id: fairness
    coverage: partial
    note: tests outcomes by segment after deployment; says nothing about training data
  - kind: catalogue
    id: fairness_slices
    coverage: partial
    note: approval-rate gap per segment, province, language
  - kind: process
    id: model_validation
    coverage: none
    note: data lineage and bias review of training data sit with the model owner and second line
  evidence_needed:
  - training data documentation from the vendor
  - bias examination record
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://publications.europa.eu/resource/celex/32024R1689
    title: Regulation (EU) 2024/1689, OJ L 2024/1689, 12.7.2024 (EU Publications Office)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 8f0b656302f9864cc87e040c371f209a9d65ae1a6cecc25ca5eb737e872d721a
    local_path: regulations/sources/INTL-EUAIA-2024/regulation-2024-1689.xhtml
  confidence: medium
  notes: Supervisor sees outputs and tool calls, not training data.
- id: INTL-EUAIA-2024-A11-01
  article_ref: Art. 11 with Annex IV
  text_en: The technical documentation of a high-risk AI system shall be drawn up before that system is
    placed on the market or put into service and shall be kept up-to date.
  summary_en: Technical documentation of a high-risk AI system must be drawn up before it is put into
    service and kept up to date, enough for authorities to assess compliance. A deployer needs it from
    the provider to run its own checks.
  duties:
  - technical_documentation
  applies_to:
    agent_class:
    - credit_decision
  addressee: provider
  control_mapping:
  - kind: evidence
    id: onboard_profile
    coverage: partial
    note: profile of the agent and its tools written at onboarding
  - kind: evidence
    id: agent_version
    coverage: partial
    note: version history
  - kind: process
    id: conformity_assessment_file
    coverage: none
    note: provider holds the dossier; bank files the copy it receives
  evidence_needed:
  - Annex IV documentation from the provider
  - bank copy of the instructions for use
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://publications.europa.eu/resource/celex/32024R1689
    title: Regulation (EU) 2024/1689, OJ L 2024/1689, 12.7.2024 (EU Publications Office)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 8f0b656302f9864cc87e040c371f209a9d65ae1a6cecc25ca5eb737e872d721a
    local_path: regulations/sources/INTL-EUAIA-2024/regulation-2024-1689.xhtml
  confidence: high
- id: INTL-EUAIA-2024-A12-01
  article_ref: Art. 12
  text_en: High-risk AI systems shall technically allow for the automatic recording of events (logs) over
    the lifetime of the system.
  summary_en: High-risk AI systems must technically allow automatic recording of events (logs) over their
    lifetime, enough to trace risk situations and support post-market monitoring and deployer monitoring.
  duties:
  - logging
  - record_keeping
  applies_to:
    agent_class:
    - credit_decision
  addressee: provider
  control_mapping:
  - kind: catalogue
    id: evidence_chain
    coverage: partial
    note: gate decisions, verdicts and state changes are hash-chained per agent and verifiable offline
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: tool calls and gate outcomes are recorded as agent events (masked at capture)
  - kind: process
    id: records_retention
    coverage: none
    note: bank sets and enforces the retention period; Supervisor does not purge or retain by schedule
  - kind: evidence
    id: audit_pack
    coverage: partial
    note: audit export pack of recorded events
  evidence_needed:
  - event log specification from the provider
  - sample log export
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://publications.europa.eu/resource/celex/32024R1689
    title: Regulation (EU) 2024/1689, OJ L 2024/1689, 12.7.2024 (EU Publications Office)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 8f0b656302f9864cc87e040c371f209a9d65ae1a6cecc25ca5eb737e872d721a
    local_path: regulations/sources/INTL-EUAIA-2024/regulation-2024-1689.xhtml
  confidence: high
  notes: Supervisor records what the gateway and traces see around the agent; it does not replace the
    logging built into the vendor system.
- id: INTL-EUAIA-2024-A13-01
  article_ref: Art. 13
  text_en: High-risk AI systems shall be accompanied by instructions for use
  summary_en: A high-risk AI system must be transparent enough for deployers to interpret its output and
    use it appropriately, and ship with instructions for use (provider identity, capabilities, limits,
    accuracy metrics, oversight measures).
  duties:
  - technical_documentation
  - explainability
  applies_to:
    agent_class:
    - credit_decision
  addressee: provider
  control_mapping:
  - kind: evidence
    id: case_file
    coverage: partial
    note: case file shows what the agent did and why it was stopped; not the model's reasoning
  - kind: process
    id: vendor_management
    coverage: none
    note: bank collects and files instructions for use; contract requires updates
  evidence_needed:
  - instructions for use from the provider
  - accuracy metrics declared by the provider
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://publications.europa.eu/resource/celex/32024R1689
    title: Regulation (EU) 2024/1689, OJ L 2024/1689, 12.7.2024 (EU Publications Office)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 8f0b656302f9864cc87e040c371f209a9d65ae1a6cecc25ca5eb737e872d721a
    local_path: regulations/sources/INTL-EUAIA-2024/regulation-2024-1689.xhtml
  confidence: high
- id: INTL-EUAIA-2024-A14-01
  article_ref: Art. 14
  text_en: High-risk AI systems shall be designed and developed in such a way, including with appropriate
    human-machine interface tools, that they can be effectively overseen by natural persons
  summary_en: 'High-risk AI must be designed so that people can effectively oversee it while in use: understand
    its limits, spot anomalies, avoid automation bias, override or stop it. The measures must fit the
    risk and autonomy level.'
  duties:
  - human_oversight
  applies_to:
    agent_class:
    - credit_decision
  addressee: provider
  control_mapping:
  - kind: console
    id: agents
    coverage: partial
    note: reviewer can pause or resume an agent
  - kind: console
    id: case_signoff
    coverage: partial
    note: human sign-off on a case after a stop; a Supervisor pause is not pre-execution human approval
      (Decision 33)
  - kind: monitor
    id: oversight
    coverage: partial
    note: 'oversight metrics: dwell time, approval rate, chain_ok'
  - kind: process
    id: board_governance
    coverage: none
    note: bank names accountable roles and committee oversight
  - kind: console
    id: agent_action
    coverage: partial
    note: pause, resume or retire an agent (the 'stop button')
  evidence_needed:
  - oversight design in the provider documentation
  - reviewer authority and training record
  - oversight metrics
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://publications.europa.eu/resource/celex/32024R1689
    title: Regulation (EU) 2024/1689, OJ L 2024/1689, 12.7.2024 (EU Publications Office)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 8f0b656302f9864cc87e040c371f209a9d65ae1a6cecc25ca5eb737e872d721a
    local_path: regulations/sources/INTL-EUAIA-2024/regulation-2024-1689.xhtml
  confidence: high
  notes: A Supervisor pause stops later calls; it is not human approval before the action (docs/onboard.md
    Decision 33). Art 14(4)(e) 'stop' button is the closest match.
- id: INTL-EUAIA-2024-A15-01
  article_ref: Art. 15
  text_en: High-risk AI systems shall be resilient against attempts by unauthorised third parties to alter
    their use, outputs or performance by exploiting system vulnerabilities.
  summary_en: High-risk AI must reach an appropriate level of accuracy, robustness and cybersecurity throughout
    its lifecycle, declare accuracy metrics, resist errors and unauthorised alteration, and defend against
    data poisoning, model poisoning and adversarial inputs.
  duties:
  - robustness_security
  - performance_monitoring
  - prompt_injection_defence
  applies_to:
    agent_class:
    - credit_decision
  addressee: provider
  control_mapping:
  - kind: catalogue
    id: injection_prefilter
    coverage: partial
    note: regex screen for injection phrases in tool arguments; alerts, does not block
  - kind: catalogue
    id: drift_band
    coverage: partial
    note: behaviour drift against launch baseline
  - kind: catalogue
    id: tier1_monitor
    coverage: partial
    note: advisory judge on every trace
  - kind: process
    id: security_assessment
    coverage: none
    note: pen test and security classification stay with the bank
  evidence_needed:
  - accuracy and robustness test results
  - security test report
  - drift reports
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://publications.europa.eu/resource/celex/32024R1689
    title: Regulation (EU) 2024/1689, OJ L 2024/1689, 12.7.2024 (EU Publications Office)
    fetched_at: '2026-10-15'
    kind: primary
