    id: fairness
    coverage: partial
    note: gives segment-level outcome data for the assessment
  - kind: process
    id: dpia_document
    coverage: partial
    note: a DPIA can satisfy overlapping items under Art 27(4)
  - kind: process
    id: legal_review
    coverage: none
    note: bank owns and files the FRIA; Supervisor does not produce it
  - kind: process
    id: regulator_notification
    coverage: none
    note: result goes to the market surveillance authority
  evidence_needed:
  - FRIA document per use case
  - notification to the authority
  - fairness slice results
