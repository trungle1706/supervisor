    local_path: regulations/sources/INTL-EUAIA-2024/regulation-2024-1689.xhtml
  confidence: high
- id: INTL-EUAIA-2024-A26.1-01
  article_ref: Art. 26(1)-(2)
  text_en: Deployers shall assign human oversight to natural persons who have the necessary competence,
    training and authority, as well as the necessary support.
  summary_en: Deployers of high-risk AI must use it as the instructions say, with technical and organisational
    measures, and assign human oversight to people with the competence, training, authority and support
    to do it.
  duties:
  - human_oversight
  - governance_accountability
  - staff_competence
  applies_to:
    agent_class:
    - credit_decision
  addressee: deployer
  control_mapping:
  - kind: console
    id: agents
    coverage: partial
    note: reviewer can pause or resume an agent
  - kind: console
    id: case_signoff
    coverage: partial
    note: human sign-off on a case after a stop; a Supervisor pause is not pre-execution human approval
      (Decision 33)
  - kind: monitor
    id: oversight
    coverage: partial
    note: 'oversight metrics: dwell time, approval rate, chain_ok'
  - kind: process
    id: board_governance
    coverage: none
    note: bank names accountable roles and committee oversight
  - kind: process
    id: staff_training
    coverage: none
    note: training records for assigned reviewers
  evidence_needed:
  - named oversight roles
  - training records
  - instructions for use on file
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://publications.europa.eu/resource/celex/32024R1689
    title: Regulation (EU) 2024/1689, OJ L 2024/1689, 12.7.2024 (EU Publications Office)
    fetched_at: '2026-10-15'
    kind: primary
    sha256: 8f0b656302f9864cc87e040c371f209a9d65ae1a6cecc25ca5eb737e872d721a
    local_path: regulations/sources/INTL-EUAIA-2024/regulation-2024-1689.xhtml
  confidence: high
- id: INTL-EUAIA-2024-A26.4-01
  article_ref: Art. 26(4)-(5)
  text_en: Deployers shall monitor the operation of the high-risk AI system on the basis of the instructions
    for use
  summary_en: Deployers who control input data must keep it relevant and representative. They must monitor
    operation against the instructions for use and, if they see a risk, inform the provider and the market
    surveillance authority without undue delay and suspend use. Financial institutions meet the monitoring
    duty through their financial-law governance rules.
  duties:
  - performance_monitoring
  - data_quality
  - incident_report
  - serious_incident_suspension
  applies_to:
    agent_class:
    - credit_decision
  addressee: deployer
  control_mapping:
  - kind: catalogue
    id: drift_band
    coverage: partial
    note: monitors behaviour against launch baseline
  - kind: catalogue
    id: tier1_monitor
    coverage: partial
    note: advisory suspicion score per trace
  - kind: console
    id: agent_action
    coverage: partial
    note: reviewer can pause an agent to suspend use
  - kind: evidence
    id: case_file
    coverage: partial
    note: case file supports the notice to the provider
  - kind: process
    id: incident_management
    coverage: none
    note: bank decides when a risk triggers notice and suspension
  - kind: process
    id: regulator_notification
    coverage: none
    note: notice to provider and authority is sent by the bank
  evidence_needed:
  - monitoring plan and results
  - notice to provider and authority
  - suspension record
