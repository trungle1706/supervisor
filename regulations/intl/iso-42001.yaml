- id: INTL-ISO42001-2023-AA6-01
  article_ref: Annex A area A.6 AI system life cycle
  summary_en: 'Reference controls for the whole life cycle: objectives, design, verification and validation,
    deployment, operation monitoring, technical documentation, event logs.'
  duties:
  - lifecycle_management
  - logging
  - technical_documentation
  applies_to:
    agent_class:
    - any
  control_mapping:
  - kind: catalogue
    id: evidence_chain
    coverage: partial
    note: gate decisions, verdicts and state changes are hash-chained per agent and verifiable offline
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: tool calls and gate outcomes are recorded as agent events (masked at capture)
  - kind: process
    id: records_retention
    coverage: none
    note: bank sets and enforces the retention period; Supervisor does not purge or retain by schedule
  - kind: evidence
    id: launch_report
    coverage: partial
    note: verification before go-live
  evidence_needed:
  - life cycle procedure
  - event log evidence
