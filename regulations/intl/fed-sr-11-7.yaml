  last_checked: '2026-10-15'
  notes: 'RESCINDED: SR 11-7 was superseded and replaced on 2026-04-17 by SR 26-2 ''Revised Guidance on
    Model Risk Management'' (read on federalreserve.gov: ''supersedes and replaces SR letter 11-7 ...
    and SR letter 21-8''). Status is therefore superseded, not reference (binding false either way: US
    supervisory guidance, never binding in Vietnam). Key SR 26-2 differences: expected most relevant to
    banks over USD 30 billion in assets; states it ''does not set forth enforceable standards''; narrower
    ''model'' definition (excludes deterministic rule-based processes); footnote 3: generative AI and
    agentic AI models are ''not within the scope of this guidance'' (principles apply to traditional statistical
    and non-generative, non-agentic AI models). Obligations below keep the SR 11-7 structure (kept as
    the historic frame the rest of the industry still cites) and point to the same section in SR 26-2,
    which was read. The original SR 11-7 PDF was not re-read (the Fed page is now an archive page), so
    SR 11-7 section numbers are ASSUMED. Recommend the lead adds a new instrument INTL-SR262-2026 for
    the current guidance (not in this assignment).'
