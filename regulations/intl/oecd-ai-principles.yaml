obligations:
- id: INTL-OECD-2019-P1.1-01
  article_ref: 'Principle 1.1: Inclusive growth, sustainable development and well-being'
  summary_en: AI should serve people and planet. For a bank this is context for product choices; no specific
    control.
  duties:
  - governance_accountability
  applies_to:
    agent_class:
    - any
  control_mapping:
  - kind: process
    id: board_governance
    coverage: none
    note: strategy-level choice by the board
  evidence_needed:
  - board statement on AI use
  verification: VERIFIED_PRIMARY
  sources:
  - url: https://oecd.ai/en/ai-principles
    title: 'OECD.AI: OECD AI Principles (titles of five values-based principles; adopted May 2019, updated
      May 2024)'
    fetched_at: '2026-10-15'
    kind: primary
  confidence: low
  notes: Principle title read on oecd.ai (primary). Low direct relevance to an agent supervisor.
- id: INTL-OECD-2019-P1.2-01
  article_ref: 'Principle 1.2: Human rights and democratic values, including fairness and privacy'
  summary_en: AI actors should respect human rights, non-discrimination, fairness and privacy through
    the lifecycle, with safeguards such as human agency and oversight.
  duties:
  - fair_treatment
  - bias_monitoring
  - customer_confidentiality
  applies_to:
    agent_class:
    - any
  control_mapping:
  - kind: catalogue
    id: fairness_slices
    coverage: partial
    note: segment gaps
  - kind: catalogue
    id: pii_masking
    coverage: partial
    note: masks personal data
  - kind: monitor
    id: oversight
    coverage: partial
    note: oversight metrics
  evidence_needed:
  - fairness results
  - privacy review
  verification: VERIFIED_SECONDARY
  sources:
  - url: https://oecd.ai/en/ai-principles
    title: 'OECD.AI: OECD AI Principles (titles of five values-based principles; adopted May 2019, updated
      May 2024)'
    fetched_at: '2026-10-15'
    kind: primary
  - url: https://www.cuatrecasas.com/en/global/intellectual-property/art/oecd-updates-ai-principles
    title: 'Cuatrecasas: OECD updates AI principles (May 2024)'
    fetched_at: '2026-10-15'
    kind: secondary
  confidence: medium
- id: INTL-OECD-2019-P1.3-01
  article_ref: 'Principle 1.3: Transparency and explainability'
  summary_en: Provide meaningful information so people know when they deal with AI and can understand
    and challenge outcomes.
  duties:
  - ai_disclosure
  - explainability
  applies_to:
    agent_class:
    - any
  control_mapping:
  - kind: evidence
    id: case_file
    coverage: partial
    note: case file explains Supervisor stops
  - kind: process
    id: customer_disclosure
    coverage: none
    note: customer notices
  evidence_needed:
  - customer notice
  - explanation process
  verification: VERIFIED_SECONDARY
  sources:
  - url: https://oecd.ai/en/ai-principles
    title: 'OECD.AI: OECD AI Principles (titles of five values-based principles; adopted May 2019, updated
      May 2024)'
    fetched_at: '2026-10-15'
    kind: primary
  - url: https://www.cuatrecasas.com/en/global/intellectual-property/art/oecd-updates-ai-principles
    title: 'Cuatrecasas: OECD updates AI principles (May 2024)'
    fetched_at: '2026-10-15'
    kind: secondary
  confidence: medium
- id: INTL-OECD-2019-P1.4-01
  article_ref: 'Principle 1.4: Robustness, security and safety'
  summary_en: AI should work robustly and safely through its life, with traceability and a way to override,
    repair or decommission it if it causes harm or behaves wrongly; apply risk management to security
    and privacy.
  duties:
  - robustness_security
  - serious_incident_suspension
  - performance_monitoring
  applies_to:
    agent_class:
    - any
  control_mapping:
  - kind: console
    id: agent_action
    coverage: partial
    note: pause, resume, retire
  - kind: catalogue
    id: drift_band
    coverage: partial
    note: drift
  - kind: catalogue
    id: evidence_chain
    coverage: partial
    note: traceability of decisions
  evidence_needed:
  - override test record
  - drift reports
  verification: VERIFIED_SECONDARY
  sources:
  - url: https://oecd.ai/en/ai-principles
    title: 'OECD.AI: OECD AI Principles (titles of five values-based principles; adopted May 2019, updated
      May 2024)'
    fetched_at: '2026-10-15'
    kind: primary
  - url: https://www.cuatrecasas.com/en/global/intellectual-property/art/oecd-updates-ai-principles
    title: 'Cuatrecasas: OECD updates AI principles (May 2024)'
    fetched_at: '2026-10-15'
    kind: secondary
  confidence: medium
  notes: Override, repair, decommission wording is from the 2024 update summary (secondary).
- id: INTL-OECD-2019-P1.5-01
  article_ref: 'Principle 1.5: Accountability'
  summary_en: AI actors are accountable for proper functioning, with traceability of datasets, processes
    and decisions and systematic risk management across the lifecycle.
  duties:
  - governance_accountability
  - logging
  - risk_management_system
  applies_to:
    agent_class:
    - any
  control_mapping:
  - kind: catalogue
    id: evidence_chain
    coverage: partial
    note: gate decisions, verdicts and state changes are hash-chained per agent and verifiable offline
  - kind: evidence
    id: agent_event_log
    coverage: partial
    note: tool calls and gate outcomes are recorded as agent events (masked at capture)
  - kind: process
    id: records_retention
    coverage: none
    note: bank sets and enforces the retention period; Supervisor does not purge or retain by schedule
  - kind: process
    id: board_governance
    coverage: none
    note: named accountable roles
  evidence_needed:
  - decision traceability evidence
  - risk management records
  verification: VERIFIED_SECONDARY
  sources:
  - url: https://oecd.ai/en/ai-principles
    title: 'OECD.AI: OECD AI Principles (titles of five values-based principles; adopted May 2019, updated
