obligations:
- id: INTL-ATLAS-T0051-01
  article_ref: AML.T0051 LLM Prompt Injection (sub-techniques .000 Direct, .001 Indirect)
  summary_en: Crafted prompts, direct or arriving through data the agent reads (documents, emails, web),
    make the LLM act in unintended ways.
  duties:
  - prompt_injection_defence
  applies_to:
    agent_class:
    - any
  control_mapping:
  - kind: catalogue
    id: injection_prefilter
    coverage: partial
    note: alerts on injection phrases in tool arguments; never blocks
  - kind: catalogue
    id: approved_tools
    coverage: partial
    note: limits what an injected instruction can call
  - kind: catalogue
    id: tier1_monitor
    coverage: partial
    note: advisory judge
  evidence_needed:
  - injection test results
  verification: VERIFIED_PRIMARY
  sources:
