# Supervisor data model: the ONE source for all tables.
# Generator: uv run python -m schema.generate  ->  schema/ddl/sqlite.sql + schema/ddl/databricks.sql
#
# Portable type vocabulary (column "type"; a trailing "?" means NULL allowed):
#   string    short text (ids, enums, hashes)      sqlite TEXT     databricks STRING
#   text      long text (masked excerpts)          sqlite TEXT     databricks STRING
#   int       64-bit integer                       sqlite INTEGER  databricks BIGINT
#   money     integer minor units (VND has 0 dp)   sqlite INTEGER  databricks BIGINT
#   float     scores and rates, never money        sqlite REAL     databricks DOUBLE
#   bool      true/false                           sqlite INTEGER  databricks BOOLEAN
#   timestamp UTC instant                          sqlite TEXT (RFC 3339, 6 fraction digits, Z)
#                                                  databricks TIMESTAMP
#   date      calendar date                        sqlite TEXT     databricks DATE
#   json      canonical JSON document              sqlite TEXT     databricks STRING
#
# kind: append_only -> SQLite BEFORE UPDATE/DELETE triggers RAISE(ABORT);
#                      Delta TBLPROPERTIES delta.appendOnly = true.
# evidence: true    -> evidence table (WP6). Delta TBLPROPERTIES delta.logRetentionDuration and
#                      delta.deletedFileRetentionDuration = interval <EVIDENCE_RETENTION_DAYS> days
#                      (committed DDL shows the default, 1825 days).
# kind: state       -> mutable rows. The generator adds two columns:
#                      row_version int (optimistic concurrency) and updated_at timestamp.
# One catalog.schema holds every table (configured by DATABRICKS_CATALOG / DATABRICKS_SCHEMA).
# Money columns end in _minor (canonical JSON enforces int there).

version: 1

tables:
  schema_version:
    kind: state
    description: Applied versions of this model.
    primary_key: [version]
    columns:
      version: int
      applied_at: timestamp
      model_hash: string

  agent:
    kind: state
    description: Registry of supervised agents (one row per agent).
    primary_key: [agent_id]
    columns:
      agent_id: string
      name: string
      owner_team: string
      owner_user: string
      business_owner: string?
      risk_tier: string
      decision33_class: string?
      host_type: string
      plug_point: string
      model_family: string
      status: string
      gate_state: string
      created_at: timestamp

  agent_version:
    kind: append_only
    description: Deployed versions of an agent. Drift bands tie to a version.
    primary_key: [agent_id, version]
    columns:
      agent_id: string
      version: string
      code_ref: string?
      prompt_hash: string?
      tool_manifest_hash: string?
      model_endpoint: string?
      model_family: string
      deployed_at: timestamp
      baseline_id: string?

  identity_binding:
    kind: state
    description: How a black-box agent is recognised (header, SP, key hash).
    primary_key: [agent_id, binding_type, binding_hash]
    columns:
      agent_id: string
      binding_type: string
      binding_hash: string
      valid_from: timestamp
      valid_to: timestamp?

  coverage:
    kind: state
    description: Which monitoring capabilities are on for each agent, and why not.
    primary_key: [agent_id, capability_id]
    columns:
      agent_id: string
      capability_id: string
      status: string
      reason: text?

  agent_event:
    kind: append_only
    evidence: true
    description: Normalised OTel-shaped events. Single read model for Watch. Masked only.
    primary_key: [event_id]
    indexes:
      - [agent_id, ts]
      - [trace_id]
    columns:
      event_id: string
      ts: timestamp
      trace_id: string
      span_id: string
      parent_span_id: string?
      agent_id: string
      agent_version: string?
      caller_agent_id: string?
      event_type: string
      tool_name: string?
      args_hash: string?  # HMAC-SHA256 of the tool args (key ARGS_HASH_KEY), never plain SHA-256
      args_masked: text?
      result_masked: text?
      amount_minor: money?
      currency: string?
      status: string?
      latency_ms: int?
      env: string
      classification: string?
      source: string
      capture_level: string
      mask_version: string?

  agent_event_raw:
    kind: append_only
    description: >
      RESTRICTED. Unmasked args/result text for agents whose manifest allows capture level
      raw (capture.raw_allowed). Restricted group only, short TTL (raw 90 d). Never read by
      judges or the chain. Rows link to agent_event by event_id.
    primary_key: [event_id]
    indexes:
      - [agent_id, ts]
    columns:
      event_id: string
      ts: timestamp
      trace_id: string
      agent_id: string
      args_raw: text?
      result_raw: text?
      access_class: string

  trace_coverage:
    kind: append_only
    description: >
      What each trace input path can see per agent (WP4). A proxy-log agent gets capability
      reduced with the list of missing fields. One row per agent, source and capability.
    primary_key: [coverage_id]
    columns:
      coverage_id: string
      ts: timestamp
      agent_id: string
      source: string
      capability: string
      missing: json
      note: text?

  rule:
    kind: state
    description: Deployed copy of policy rules (git is the source).
    primary_key: [rule_id, version]
    columns:
      rule_id: string
      version: int
      agent_scope: string
      expression: json
      action: string
      fail_mode: string
      severity: string
      regulation_ref: string?
      owner: string
      approved_by_1: string?
      approved_by_2: string?
      git_sha: string?
      policy_hash: string
      effective_from: timestamp
      effective_to: timestamp?

  verdict:
    kind: append_only
    evidence: true
    description: One row per check outcome (rule, Tier 1 or Tier 2 judge). Judges are advisory.
    primary_key: [verdict_id]
    indexes:
      - [agent_id, ts]
      - [trace_id]
    columns:
      verdict_id: string
      ts: timestamp
      trace_id: string?
      event_id: string?
      agent_id: string
      tier: int
      checker_id: string
      model_id: string?
      model_family: string?
      is_mock: bool
      advisory: bool
      score: float?
      label: string
      action: string
      latency_ms: int?
      rule_id: string?
      policy_hash: string?
      rationale_masked: text?

  cases:
    kind: state
    description: Case header (mutable workflow state). Every change also writes case_event.
    primary_key: [case_id]
    indexes:
      - [agent_id, status]
    columns:
      case_id: string
      agent_id: string
      severity: string
      status: string
      opened_at: timestamp
      assignee: string?
      itsm_ref: string?
      regulation_refs: json
      summary: text
      report_due_at: timestamp?
      closed_at: timestamp?

  case_event:
    kind: append_only
    evidence: true
    description: Who did what on a case. Feeds the evidence chain.
    primary_key: [case_id, seq]
    columns:
      case_id: string
      seq: int
      ts: timestamp
      actor: string
      actor_kind: string
      action: string
      comment_masked: text?

  signoff:
    kind: append_only
    evidence: true
    description: Human sign-off. Reviewer id from SSO, never the app service principal.
    primary_key: [signoff_id]
    indexes:
      - [case_id]
    columns:
      signoff_id: string
      case_id: string
      reviewer_id: string
      decision: string
      reason: text
      ts: timestamp
      auth_method: string

  chain_entry:
    kind: append_only
    evidence: true
    description: Hash chain. One lane per agent plus the root lane. PII never enters.
    primary_key: [lane, seq]
    columns:
      lane: string
      seq: int
      ts: timestamp
      record_type: string
      record_ref: string
      payload_hash: string
      prev_hash: string
      entry_hash: string
      writer: string
      env: string

  chain_payload:
    kind: append_only
    evidence: true
    description: Masked canonical JSON payload of a chain entry (no floats, no raw PII).
    primary_key: [lane, seq, payload_hash]
    columns:
      lane: string
      seq: int
      payload_hash: string
      payload: text

  chain_signature:
    kind: append_only
    evidence: true
    description: Signature over the entry_hash of a root-lane entry (signed head).
    primary_key: [lane, seq, entry_hash]
    columns:
      lane: string
      seq: int
      entry_hash: string
      signature: string
      key_id: string
      algorithm: string
      key_kind: string
      public_key: text

  anchor:
    kind: append_only
    evidence: true
    description: Signed chain heads anchored to an immutable target.
    primary_key: [anchor_id]
    columns:
      anchor_id: string
      lane: string
      seq_from: int
      seq_to: int
      root_hash: string
      head_signature: string
      key_id: string
      anchored_at: timestamp
      anchor_target: string
      receipt: text?

  oversight_metric:
    kind: state
    description: Daily oversight metrics per agent. Feeds the console panel.
    primary_key: [metric_date, agent_id]
    columns:
      metric_date: date
      agent_id: string
      coverage: float?
      ttd_ms: int?
      tth_s: int?
      catch_rate: float?
      false_alarm_rate: float?
      chain_ok: bool?
      groundedness: float?
      fairness_gap: float?
      computed_at: timestamp

  gate_control:
    kind: state
    description: Gateway control records (WP3). Active pause (with the state to resume to) and pending two-person resume approvals.
    primary_key: [control_id]
    indexes:
      - [agent_id, status]
    columns:
      control_id: string
      agent_id: string
      action: string
      principal: string
      role: string?
      reason: text?
      resume_to: string?
      status: string
      created_at: timestamp
      expires_at: timestamp?
