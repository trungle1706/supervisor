# Supervisor data model: the ONE source for all tables.
# Generator: uv run python -m schema.generate  ->  schema/ddl/sqlite.sql + schema/ddl/databricks.sql
#
# Portable type vocabulary (column "type"; a trailing "?" means NULL allowed):
#   string    short text (ids, enums, hashes)      sqlite TEXT     databricks STRING
#   text      long text (masked excerpts)          sqlite TEXT     databricks STRING
#   int       64-bit integer                       sqlite INTEGER  databricks BIGINT
#   money     integer minor units (VND has 0 dp)   sqlite INTEGER  databricks BIGINT
#   float     scores and rates, never money        sqlite REAL     databricks DOUBLE
#   bool      true/false                           sqlite INTEGER  databricks BOOLEAN
#   timestamp UTC instant                          sqlite TEXT (RFC 3339, 6 fraction digits, Z)
#                                                  databricks TIMESTAMP
#   date      calendar date                        sqlite TEXT     databricks DATE
#   json      canonical JSON document              sqlite TEXT     databricks STRING
#
# kind: append_only -> SQLite BEFORE UPDATE/DELETE triggers RAISE(ABORT);
#                      Delta TBLPROPERTIES delta.appendOnly = true.
# evidence: true    -> evidence table (WP6). Delta TBLPROPERTIES delta.logRetentionDuration and
#                      delta.deletedFileRetentionDuration = interval <EVIDENCE_RETENTION_DAYS> days
#                      (committed DDL shows the default, 1825 days).
# kind: state       -> mutable rows. The generator adds two columns:
#                      row_version int (optimistic concurrency) and updated_at timestamp.
# One catalog.schema holds every table (configured by DATABRICKS_CATALOG / DATABRICKS_SCHEMA).
# retention:        -> personal-data classes (ADR D13): {raw|masked|notice: [columns]}. The retention job
#                      sets these columns to NULL ('' when NOT NULL) once ts is older than the class
#                      days; rows and digests stay. SQLite triggers then allow ONLY that UPDATE.
# Money columns end in _minor (canonical JSON enforces int there).

version: 1

tables:
  schema_version:
    kind: state
    description: Applied versions of this model.
    primary_key: [version]
    columns:
      version: int
      applied_at: timestamp
      model_hash: string

  agent:
    kind: state
    description: Registry of supervised agents (one row per agent).
    primary_key: [agent_id]
    columns:
      agent_id: string
      name: string
      owner_team: string
      owner_user: string
      business_owner: string?
      risk_tier: string
      decision33_class: string?
      host_type: string
      plug_point: string
      model_family: string
      status: string
      gate_state: string
      created_at: timestamp

  agent_version:
    kind: append_only
    description: Deployed versions of an agent. Drift bands tie to a version.
    primary_key: [agent_id, version]
    columns:
      agent_id: string
      version: string
      code_ref: string?
      prompt_hash: string?
      tool_manifest_hash: string?
      model_endpoint: string?
      model_family: string
      deployed_at: timestamp
      baseline_id: string?

  identity_binding:
    kind: state
    description: How a black-box agent is recognised (header, SP, key hash).
    primary_key: [agent_id, binding_type, binding_hash]
    columns:
      agent_id: string
      binding_type: string
      binding_hash: string
      valid_from: timestamp
      valid_to: timestamp?

  coverage:
    kind: state
    description: Which monitoring capabilities are on for each agent, and why not.
    primary_key: [agent_id, capability_id]
    columns:
      agent_id: string
      capability_id: string
      status: string
      reason: text?

  agent_event:
    kind: append_only
    evidence: true
    description: Normalised OTel-shaped events. Single read model for Watch. Masked only.
    primary_key: [event_id]
    retention:
      masked: [args_masked, result_masked]
    indexes:
      - [agent_id, ts]
      - [trace_id]
    columns:
      event_id: string
      ts: timestamp
      trace_id: string
      span_id: string
      parent_span_id: string?
      agent_id: string
      agent_version: string?
      caller_agent_id: string?
      event_type: string
      tool_name: string?
      args_hash: string?  # HMAC-SHA256 of the tool args (key ARGS_HASH_KEY), never plain SHA-256
      args_masked: text?
      result_masked: text?
      amount_minor: money?
      currency: string?
      status: string?
      latency_ms: int?
      env: string
      classification: string?
      source: string
      capture_level: string
      mask_version: string?
      # WP22 (additive): gate decision latency in integer microseconds (latency_ms keeps the
      # old millisecond value; a sub-millisecond gate call is 0 ms). Null on older rows.
      latency_us: int?
      # WP37 (additive, null unless DETECTORS_ENABLED): verdict contract v2 on gate decisions.
      # verdict_status is allow|report|transform|pause|block|skip (the old ``status`` column keeps
      # allowed|denied). coverage_json lists the payload parts inspected and not inspected.
      verdict_status: string?
      correlation_id: string?
      coverage_json: json?
      # WP27 (additive, null unless the caller sent a session id or SESSION_MONITOR_ENABLED=1):
      # the conversation the call belongs to. session_source is client | derived | span.
      # session_json holds the per-turn features of the session monitor: flags, a keyed
      # shingle sketch, a keyed consumer hash and detector finding codes. No text, no raw ids.
      session_id: string?
      session_source: string?
      session_json: json?

  agent_event_raw:
    kind: append_only
    description: >
      RESTRICTED. Unmasked args/result text for agents whose manifest allows capture level
      raw (capture.raw_allowed). Restricted group only, short TTL (raw 90 d). Never read by
      judges or the chain. Rows link to agent_event by event_id.
    primary_key: [event_id]
    retention:
      raw: [args_raw, result_raw]
    indexes:
      - [agent_id, ts]
    columns:
      event_id: string
      ts: timestamp
      trace_id: string
      agent_id: string
      args_raw: text?
      result_raw: text?
      access_class: string

  trace_coverage:
    kind: append_only
    description: >
      What each trace input path can see per agent (WP4). A proxy-log agent gets capability
      reduced with the list of missing fields. One row per agent, source and capability.
    primary_key: [coverage_id]
    columns:
      coverage_id: string
      ts: timestamp
      agent_id: string
      source: string
      capability: string
      missing: json
      note: text?

  rule:
    kind: state
    description: Deployed copy of policy rules (git is the source).
    primary_key: [rule_id, version]
    columns:
      rule_id: string
      version: int
      agent_scope: string
      expression: json
      action: string
      fail_mode: string
      severity: string
      regulation_ref: string?
      owner: string
      approved_by_1: string?
      approved_by_2: string?
      git_sha: string?
      policy_hash: string
      effective_from: timestamp
      effective_to: timestamp?

  verdict:
    kind: append_only
    evidence: true
    description: One row per check outcome (rule, Tier 1 or Tier 2 judge). Judges are advisory.
    primary_key: [verdict_id]
    retention:
      masked: [rationale_masked]
    indexes:
      - [agent_id, ts]
      - [trace_id]
    columns:
      verdict_id: string
      ts: timestamp
      trace_id: string?
      event_id: string?
      agent_id: string
      tier: int
      checker_id: string
      model_id: string?
      model_family: string?
      is_mock: bool
      advisory: bool
      score: float?
      label: string
      action: string
      latency_ms: int?
      rule_id: string?
      policy_hash: string?
      rationale_masked: text?
      # WP7 (additive): judge fields that were only in the evidence payload before.
      score_bp: int?            # integer basis points 0-10000 (the float score stays for old readers)
      role: string?             # judge role: primary | challenger | protocol (null for rules)
      region: string?           # where the judge model ran (residency, analysis 07 3.1)
      model_version: string?
      mask_version: string?
      # WP19 (additive): change control. prompt_hash = SHA-256 of the judge prompt templates
      # (same value as policy_hash for judge rows); rubric_version = judge rubric id.
      prompt_hash: string?
      rubric_version: string?
      # D05 (additive): derived | declared-test-only | mock (how model_family was obtained).
      family_source: string?

  cases:
    kind: state
    description: Case header (mutable workflow state). Every change also writes case_event.
    primary_key: [case_id]
    indexes:
      - [agent_id, status]
    columns:
      case_id: string
      agent_id: string
      severity: string
      status: string
      opened_at: timestamp
      assignee: string?
      itsm_ref: string?
      regulation_refs: json
      summary: text
      report_due_at: timestamp?
      closed_at: timestamp?
      case_type: string?  # WP7 (additive): rule | judge | drift | fairness | multiagent | manual
      # WP19 (additive): incident clock (Decree 142/2026 Art. 19). report_due_at above is the
      # deprecated 24-hour field (kept for old readers). See docs/judge-mrm.md.
      incident_detected_at: timestamp?
      urgency_class: string?          # urgent | standard
      prelim_report_due_at: timestamp?  # urgent: detected + 72 h; else + 5 VN working days
      formal_report_due_at: timestamp?  # preliminary due + 15 days
      prelim_report_sent_at: timestamp?
      formal_report_sent_at: timestamp?

  case_event:
    kind: append_only
    evidence: true
    description: Who did what on a case. Feeds the evidence chain.
    primary_key: [case_id, seq]
    retention:
      masked: [comment_masked]
    columns:
      case_id: string
      seq: int
      ts: timestamp
      actor: string
      actor_kind: string
      action: string
      comment_masked: text?
      auth_method: string?  # WP8: dev_header | databricks_sso | databricks_app_sp | local_system

  case_link:
    kind: append_only
    description: >
      WP8. Which source opened or joined a case: a gate decision (block/pause), a judge
      verdict (CaseRequest) or a monitor finding. One row per source; makes intake idempotent.
    primary_key: [source_kind, source_ref]
    indexes:
      - [case_id]
    columns:
      source_kind: string
      source_ref: string
      case_id: string
      agent_id: string
      ts: timestamp

  signoff:
    kind: append_only
    evidence: true
    description: Human sign-off. Reviewer id from SSO, never the app service principal.
    primary_key: [signoff_id]
    indexes:
      - [case_id]
    columns:
      signoff_id: string
      case_id: string
      reviewer_id: string
      decision: string
      reason: text
      ts: timestamp
      auth_method: string

  chain_entry:
    kind: append_only
    evidence: true
    description: Hash chain. One lane per agent plus the root lane. PII never enters.
    primary_key: [lane, seq]
    columns:
      lane: string
      seq: int
      ts: timestamp
      record_type: string
      record_ref: string
      payload_hash: string
      prev_hash: string
      entry_hash: string
      writer: string
      env: string

  chain_payload:
    kind: append_only
    evidence: true
    description: Masked canonical JSON payload of a chain entry (no floats, no raw PII).
    primary_key: [lane, seq, payload_hash]
    columns:
      lane: string
      seq: int
      payload_hash: string
      payload: text

  chain_signature:
    kind: append_only
    evidence: true
    description: Signature over the entry_hash of a root-lane entry (signed head).
    primary_key: [lane, seq, entry_hash]
    columns:
      lane: string
      seq: int
      entry_hash: string
      signature: string
      key_id: string
      algorithm: string
      key_kind: string
      public_key: text

  anchor:
    kind: append_only
    evidence: true
    description: Signed chain heads anchored to an immutable target.
    primary_key: [anchor_id]
    columns:
      anchor_id: string
      lane: string
      seq_from: int
      seq_to: int
      root_hash: string
      head_signature: string
      key_id: string
      anchored_at: timestamp
      anchor_target: string
      receipt: text?

  oversight_metric:
    kind: state
    description: Daily oversight metrics per agent. Feeds the console panel.
    primary_key: [metric_date, agent_id]
    columns:
      metric_date: date
      agent_id: string
      coverage: float?
      ttd_ms: int?             # median time to detect that day (see docs/metrics.md)
      tth_s: int?              # median time to human that day (see docs/metrics.md)
      catch_rate: float?
      false_alarm_rate: float?
      chain_ok: bool?
      groundedness: float?
      fairness_gap: float?
      computed_at: timestamp
      # WP7 (additive): integer columns; see docs/metrics.md. The float columns above are
      # kept for older readers and hold the same value / 10000.
      events_seen: int?        # tool calls seen that day (recorder tool_call, else gate)
      events_gated: int?       # gate decisions that day
      coverage_bp: int?        # events_gated * 10000 / events_seen, capped at 10000
      catch_rate_bp: int?      # from the judge eval report (placeholder until bank golden set)
      false_alarm_bp: int?     # from the judge eval report
      judge_verdicts: int?     # tier 1/2 verdicts written that day (all roles)
      judge_disagree_bp: int?  # tier-2 primary verdicts labelled tiers_disagree, bp of tier-2
      groundedness_bp: int?    # median quality groundedness score that day
      fairness_gap_bp: int?    # largest approval-rate gap of the last fairness run
      cases_opened: int?
      blocks: int?             # gate decisions not allowed
      llm_calls: int?          # agent llm_call events (cost proxy)
      judge_latency_ms: int?   # sum of judge latency (cost proxy)
      # WP19 (additive): judge-vs-human agreement from sign-offs (docs/metrics.md).
      judge_human_pairs: int?     # signed-off cases with a judge label that day
      judge_human_agree_bp: int?  # pairs where the reviewer agreed with the judge, bp
      # WP1b-B (additive): status of the quality / fairness / drift / multiagent monitors for
      # this agent and day: {monitor: {status: ok|not_applicable|no_data, code, reason, n}}.
      monitor_status: json?

  model_validation:
    kind: append_only
    evidence: true
    description: >
      WP19. One row per judge validation run (python -m supervisor.judge.mrm validate).
      The judge service checks it when JUDGE_REQUIRE_VALIDATION is on. Integers only.
    primary_key: [validation_id]
    indexes:
      - [model_version, prompt_hash]
    columns:
      validation_id: string
      ts: timestamp
      judge_id: string           # inventory id of the tiered judge (judge.tiered)
      model_version: string      # composite judge identity key, see judge/mrm/identity.py
      prompt_hash: string        # composite prompt hash (Tier 1 + Tier 2)
      rubric_version: string
      mask_version: string
      golden_set_hash: string
      is_mock: bool
      decision: string           # GO | NO_GO
      passed: bool
      runs: int
      metrics: json              # integer basis points and counts only
      thresholds: json
      failed_checks: json
      validator: string
      report_hash: string        # SHA-256 of the canonical report JSON

  policy_baseline:
    kind: state
    description: >
      Drift baseline band per agent version and metric (WP7, ADR D09). Integers only:
      band = center +- k * scaled MAD. Also holds the breach streak of the drift monitor.
    primary_key: [agent_id, agent_version, metric]
    columns:
      agent_id: string
      agent_version: string
      metric: string
      baseline_id: string
      center: int
      mad: int              # scaled MAD (x 1.4826), floored, integer
      band_low: int
      band_high: int
      k: int
      windows: int          # sub-windows that formed the baseline
      window_s: int
      window_from: timestamp
      window_to: timestamp
      breach_streak: int
      last_value: int?
      last_checked_to: timestamp?
      open_case_id: string?
      computed_at: timestamp

  policy_threshold:
    kind: state
    description: >
      Monitor thresholds per agent and metric (WP7). agent_id '*' is the default for every
      agent. Example metrics: drift.k, drift.consecutive, fairness.approval_gap_bp.
    primary_key: [agent_id, metric]
    columns:
      agent_id: string
      metric: string
      threshold: int
      unit: string
      owner: string?
      note: text?
      effective_from: timestamp

  fairness_slice:
    kind: append_only
    description: >
      One row per fairness cell per run (WP7). Cells under the minimum n are suppressed:
      counts and rates are null. Built on hashed subject ids, never raw ids.
    primary_key: [run_id, attribute, cell]
    indexes:
      - [agent_id, ts]
    columns:
      run_id: string
      ts: timestamp
      agent_id: string
      window_from: timestamp
      window_to: timestamp
      attribute: string
      cell: string
      n: int?
      approvals: int?
      blocks: int?
      approval_rate_bp: int?
      block_rate_bp: int?
      suppressed: bool
      method: string        # fairlearn | python

  monitor_state:
    kind: state
    description: Cursors and dedupe marks of the monitors and the scheduler (WP7).
    primary_key: [monitor, state_key]
    columns:
      monitor: string
      state_key: string
      value: json

  scheduler_lease:
    kind: state
    description: >
      Single-instance lock of the in-process scheduler on Databricks (WP7). One row per
      lease; the holder renews it; another replica takes it only after expires_at.
    primary_key: [lease_name]
    columns:
      lease_name: string
      holder: string
      acquired_at: timestamp
      expires_at: timestamp

  gate_control:
    kind: state
    description: Gateway control records (WP3). Active pause (with the state to resume to) and pending two-person resume approvals.
    primary_key: [control_id]
    indexes:
      - [agent_id, status]
    columns:
      control_id: string
      agent_id: string
      action: string
      principal: string
      role: string?
      reason: text?
      resume_to: string?
      status: string
      created_at: timestamp
      expires_at: timestamp?

  notice:
    kind: state
    description: >
      WP8. Notifier inbox (console Inbox page). Masked text only. The webhook stub queues
      rows with status queued and never sends them (off by default).
    primary_key: [notice_id]
    retention:
      notice: [body]
    indexes:
      - [channel, status]
    columns:
      notice_id: string
      ts: timestamp
      channel: string
      subject: string
      body: text
      status: string
      read_by: string?

  console_action:
    kind: append_only
    evidence: true
    description: >
      WP18. One row per mutating console or API action (and per denied attempt): who, when,
      what, target, row hash before and after, request id. Append-only; in the audit pack.
    primary_key: [action_id]
    indexes:
      - [ts]
      - [actor, ts]
    columns:
      action_id: string
      ts: timestamp
      request_id: string
      actor: string
      actor_kind: string
      auth_method: string
      roles: json             # sorted role list of the actor at the time
      permission: string      # role-matrix permission id, e.g. case.transition
      method: string
      path: string
      target_kind: string?    # case | agent | notice | export | job | session
      target_id: string?
      outcome: string         # attempted | ok | denied | error
      before_hash: string?    # sha256 of the canonical target row before the action
      after_hash: string?     # sha256 of the canonical target row after the action
      detail: text?           # short masked note (error class, denial reason); never PII

  eval_run:
    kind: append_only
    description: >
      WP17 assurance eval packs. One row per run of `python -m supervisor.assurance run`
      (counts per status). Integers and strings only.
    primary_key: [run_id]
    columns:
      run_id: string
      started_at: timestamp
      finished_at: timestamp
      target_spec: string
      selector: string
      packs_total: int
      ok: int
      warn: int
      fail: int
      skip: int
      error: int
      is_mock: bool
      settings_digest: string?
      out_dir: string?

  eval_result:
    kind: append_only
    evidence: true
    description: >
      WP17 assurance eval packs. One row per pack x target x run: integer metrics, the
      per-metric status against the manifest thresholds, the dataset digest and the hash of
      the assurance_result chain record. Mock runs are labelled is_mock.
    primary_key: [run_id, pack_id, target_kind, target_id]
    indexes:
      - [target_kind, target_id, ts]
      - [pack_id]
    columns:
      run_id: string
      ts: timestamp
      pack_id: string
      pack_version: int
      manifest_sha256: string
      dimension: string
      target_kind: string
      target_id: string
      status: string
      metrics: json
      metric_status: json
      thresholds: json
      reasons: text
      n_items: int
      data_mode: string
      dataset_id: string
      dataset_sha256: string
      is_mock: bool
      launch_gate: string
      judge_gate: bool
      details: json
      evidence_hash: string?

  # --- WP22 ---
  tool_usage_daily:
    kind: state
    description: >
      WP22. Per agent, tool and UTC day: gate decision counts, latency percentiles, distinct
      callers and end users (counts only; hashed ids are never stored), first and last call.
      Recomputed from agent_event by python -m supervisor.analytics.tools rollup (idempotent:
      a day is overwritten). Feeds the console Tools page, /v1/analytics/tools and the
      least-privilege suggestion. Integers only.
    primary_key: [usage_date, agent_id, tool_name]
    indexes:
      - [agent_id, usage_date]
    columns:
      usage_date: date
      agent_id: string
      tool_name: string
      risk_class: string?        # money | credit | pii_export | read_only | unknown
      calls: int
      allows: int                # status allowed (includes alert and log outcomes)
      blocks: int                # denied and not a pause
      pauses: int                # outcome pause
      errors: int                # decisions with a rule_error verdict
      p50_us: int?               # nearest-rank percentile of gate latency, microseconds
      p95_us: int?
      distinct_callers: int      # distinct caller_agent_id that day
      distinct_users: int        # distinct hashed customer_id that day
      first_seen: timestamp?
      last_seen: timestamp?
      computed_at: timestamp

  # --- WP21 (SIEM and alerts) ---
  alert:
    kind: state
    description: >
      WP21. One row per fired alert (rule engine, ADR D15). Ids, counts and hashes only, never
      free text. dedupe_key = rule_id + group value; repeats inside the rule's dedupe window
      raise suppressed_count on the open row instead of making a new row. status: open,
      acknowledged (by an operator, audited), closed.
    primary_key: [alert_id]
    indexes:
      - [status, ts]
      - [dedupe_key, ts]
    columns:
      alert_id: string
      ts: timestamp
      dedupe_key: string
      rule_id: string
      rule_hash: string
      severity: string
      status: string
      title: string
      agent_id: string?
      group_value: string?
      window_s: int
      window_count: int
      threshold: int
      first_ts: timestamp
      last_ts: timestamp
      suppressed_count: int
      case_id: string?
      chain_lane: string?
      chain_seq: int?
      entry_hash: string?
      refs: json
      routes: json
      route_status: json
      acknowledged_by: string?
      acknowledged_at: timestamp?

  siem_event:
    kind: append_only
    description: >
      WP21. Delta sink of the SIEM export (SIEM_SINK=delta): one row per event, with the OCSF
      document, so a Databricks-hosted SIEM connector or Lakehouse Monitoring can read it.
      Ids, hashes and enums only. event_id is the idempotency key.
    primary_key: [event_id]
    indexes:
      - [ts]
    columns:
      event_id: string
      ts: timestamp
      event_type: string
      severity: int
      outcome: string
      agent_id: string?
      rule_id: string?
      case_id: string?
      actor: string?
      chain_lane: string?
      chain_seq: int?
      entry_hash: string?
      env: string
      event_schema: string
      ocsf_class_uid: int
      ocsf_json: text

  # --- WP24 inventory graph (ADR D16) -------------------------------------------------
  inventory_node:
    kind: state
    description: >
      WP24 inventory graph node (system, model, model_endpoint, tool, mcp_server, dataset,
      prompt, supplier). node_id is a hash of kind + canonical name, so a refill never
      duplicates. own_risk is low|medium|high|critical or NULL; the effective level is
      computed on read, never stored. decision33_class is human-set (copied from the agent
      row), never inferred. evidence lists {source, ref} pairs (manifest | onboarding |
      workspace_scan | manual, plus file:line or a workspace reference).
    primary_key: [node_id]
    indexes:
      - [kind, status]
    columns:
      node_id: string
      kind: string
      name: string
      display_name: string
      status: string          # active | unmanaged | allowlisted | gone
      own_risk: string?
      risk_source: string     # none | manifest | onboarding | manual
      decision33_class: string?
      attrs: json
      evidence: json
      first_seen: timestamp
      last_seen: timestamp

  inventory_edge:
    kind: state
    description: >
      WP24 inventory graph edge (uses, serves, reads, writes, hosted_on, owned_by). One row per
      (src, kind, dst, source) so every claim keeps its own evidence. active is false when the
      source no longer reports the edge.
    primary_key: [edge_id]
    indexes:
      - [src_id]
      - [dst_id]
    columns:
      edge_id: string
      src_id: string
      dst_id: string
      kind: string
      source: string          # manifest | onboarding | workspace_scan | manual
      evidence_ref: string
      active: bool
      first_seen: timestamp
      last_seen: timestamp

  # --- WP27 session monitor (ADR D29) ---------------------------------------------------
  session_control:
    kind: state
    description: >
      WP27 session-scoped pause of money / credit tools. One row per pause: active until a
      two-person resume (owner + reviewer, same rule as an agent resume) or until expires_at
      (cool-down). Written only by a deterministic rule of the session monitor. The gate reads
      active rows (GATE-SESSION-PAUSE). Free text never lands here.
    primary_key: [control_id]
    indexes:
      - [agent_id, status]
      - [session_id]
    columns:
      control_id: string
      session_id: string
      agent_id: string
      scope: string            # comma separated tool classes: money, credit
      status: string           # active | lifted | expired
      score_bp: int
      case_id: string?
      created_at: timestamp
      expires_at: timestamp
      approver_1: string?      # first approval of a resume (principal id)
      approver_1_role: string?
      approver_1_at: timestamp?
      lifted_by: string?       # second approver, or "cooldown"
      lifted_at: timestamp?

  # --- WP37 detector findings (ADR D23) ------------------------------------------------
  finding:
    kind: append_only
    evidence: true
    description: >
      WP37 one row per detector result of a gate decision: a fired finding, or a detector that
      did not run (not_executed_reason set, score 0). Entities and fragments are MASKED text only
      (pseudonym tokens and masked excerpts); raw values never reach this table. event_id is the
      gate decision (agent_event.event_id); correlation_id ties decision, trace span and finding.
    primary_key: [finding_id]
    retention:
      masked: [entities_masked, fragments_masked]
    indexes:
      - [agent_id, ts]
      - [event_id]
      - [correlation_id]
    columns:
      finding_id: string
      ts: timestamp
      event_id: string
      request_id: string
      correlation_id: string
      trace_id: string?
      agent_id: string
      tool_name: string
      direction: string       # input | output
      detector_slug: string
      detector_id: string     # slug@version
      code: string
      score_bp: int
      threshold_bp: int
      masked_count: int
      action_hint: string     # report | transform | pause | block
      not_executed_reason: string?
      preset: string?
      is_mock: bool
      verdict_status: string  # status of the whole decision
      entities_masked: json?
      fragments_masked: json?

  # --- WP26 MCP tool locking (ADR D24) --------------------------------------------------
  mcp_tool_manifest:
    kind: state
    description: >
      WP26 locked tool manifest per upstream MCP server. One row per (server, tool) plus one
      server row (tool_name '*') that holds the whole-list hash. locked_hash is what two
      different reviewers approved; observed_hash is what the server shows now. A tool whose
      status is new or changed is hidden from the agent and its tools/call is blocked
      (MCP-TOOL-UNREVIEWED). approvals lists {by, role, at, hash}; they count only for the
      observed hash. scan is the report-only poisoning scan (kinds and counts, no text).
    primary_key: [manifest_id]
    indexes:
      - [server_id]
    columns:
      manifest_id: string     # hash of server_id + tool_name
      server_id: string
      tool_name: string       # '*' for the server row
      row_kind: string        # server | tool
      agent_id: string        # the application that first observed the server
      status: string          # tool: approved | new | changed | removed; server: locked | open
      locked_hash: string?
      observed_hash: string?
      locked_def: json?
      observed_def: json?
      suspicious: bool
      scan: json?
      approvals: json
      case_id: string?
      seeded_by: string?      # who ran trust-on-first-use, when it was used
      first_seen: timestamp
      last_seen: timestamp

  # --- WP29 risk register (ADR D26) -----------------------------------------------------
  risk:
    kind: state
    description: >
      WP29 risk register entry. Anchored on an agent or on an inventory node (a shared model,
      tool, MCP server or dataset, which every agent that reaches it inherits). Likelihood and
      impact are whole numbers 1 to 5; the score is their product and is computed on read,
      never stored. residual_* is what the person declares for the treated risk; the value
      the product uses is decided by the evidence rule (risk_evidence), see docs/risk-register.md.
    primary_key: [risk_id]
    indexes:
      - [agent_id]
      - [status]
    columns:
      risk_id: string
      title: string
      description: text
      category: string         # money_movement | credit_decision | pii | injection | model_behaviour | availability | third_party
      agent_id: string?
      node_id: string?         # inventory node id (inv_...); null = the agent's own system node
      inherent_likelihood: int
      inherent_impact: int
      marginal_risk: int?      # 1 to 5: change caused by using AI (1 much smaller, 5 much higher)
      marginal_note: text?
      treatment: string        # avoid | mitigate | accept | transfer
      treatment_note: text?    # justification (required for accept)
      residual_likelihood: int
      residual_impact: int
      owner: string
      review_date: date?
      status: string           # draft | active | retired
      source: string           # manual | import | starter
      created_at: timestamp
      created_by: string

  risk_link:
    kind: state
    description: >
      WP29 link of a risk to a compliance matrix row (obligation id), a gate rule id, an
      assurance pack id, a monitor name or a case id. rule, pack and monitor links are the
      controls the evidence rule looks at; matrix and case links are references.
    primary_key: [link_id]
    indexes:
      - [risk_id]
      - [kind, target]
    columns:
      link_id: string          # hash of (risk_id, kind, target): a repeat is a no-op
      risk_id: string
      kind: string             # matrix | rule | pack | monitor | case
      target: string
      active: bool             # false after an unlink (the row stays as history)
      created_at: timestamp
      created_by: string

  risk_evidence:
    kind: append_only
    evidence: true
    description: >
      WP29. One row per risk and window: what the linked controls did (counts), the state
      (working | failing | no_evidence), the reason code and the residual score the evidence rule
      allows. Integers, codes and hashes only; no text. The matching chain record is
      risk_evidence. A repeat for the same window is a no-op (evidence_id is a hash).
    primary_key: [evidence_id]
    indexes:
      - [risk_id, ts]
    columns:
      evidence_id: string
      risk_id: string
      ts: timestamp
      window_start: timestamp
      window_end: timestamp
      state: string            # working | failing | no_evidence
      reason: string           # fixed code, see supervisor.risk.evidence.REASONS
      agents_n: int            # supervised agents the risk applies to
      agents_excluded: int     # SHADOW, RETIRED or unknown agents (their rows are not evidence)
      rule_links: int
      rule_hits: int
      rule_stops: int
      rules_missing: int
      pack_links: int
      pack_ok: int
      pack_warn: int
      pack_fail: int
      pack_nodata: int
      monitor_links: int
      monitor_ok: int
      monitor_other: int
      controls_working: int
      controls_failing: int
      controls_idle: int
      declared_residual_likelihood: int
      declared_residual_impact: int
      residual_likelihood: int  # after the evidence rule
      residual_impact: int
      digest: string            # sha256 of the facts above
      chain_hash: string?       # entry hash of the chain record
