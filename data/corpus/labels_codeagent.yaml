# Gold labels for the NEW fields of the source analysis agent (docs/onboarding/code-agent.md).
# The old fields (framework, tools, llm_calls, data_access, pii_fields, tracing, decision33,
# autonomy, secrets, injections) stay in labels.yaml.
#
# Written by the lead agent by reading the code of each repo BEFORE the agent ran on it
# (labels for the 21 existing repos and for the 6 new repos of data/corpus/repos_agent: 2026-10-30). Definitions: docs/onboarding/code-agent.md,
# section "Labels for the new fields".
#
# Per repo:
#   tools:      {tool name as the model sees it: {effect, irreversible, approval}}
#   amount_args: ["tool.arg"]            the argument that holds the money amount
#   tool_sinks:  ["tool direction sink"] data source / sink reached from the tool, also through
#                                        helper functions it calls (sink: db|http|bank_api|file)
#   egress_hosts: [host]                 every host of a URL in executable code or config
#   secret_sources: [env|hardcoded|secret_store]  how credentials are obtained
#   guardrails:  [amount_limit|allowlist|input_validation|output_filter|rate_limit|content_filter]
#   logging_sinks: [log|trace_otel|trace_mlflow|audit_table]
#   pii_logged:  true when a log or print call writes personal data
#   pii_by_tool: ["tool:field"]          vocabulary identifiers in the tool function or its params
#   entrypoints: ["kind:file"]           http|cli|mcp|notebook|mlflow
#   pinned_models: [model id]            ids that hold a date or version
